# knowledge/configs/physiological_ranges.yaml
# Абсолютные физиологические пределы для валидации входных данных.
# Значения выходят за эти границы → система выдаст ошибку.

physiological_ranges:
  # Гематология
  hemoglobin: [30, 250]           # г/Л
  rbc: [1.0, 8.0]                 # 10^12/L
  hematocrit: [10, 70]            # %
  wbc: [0.5, 50.0]                # 10^9/L
  platelets: [10, 1000]           # 10^9/L
  mcv: [50, 130]                  # fL
  mch: [15, 45]                   # pg
  mchc: [20, 40]                  # g/dL
  neutrophils_percent: [10, 95]   # %
  lymphocytes_percent: [5, 90]    # %
  monocytes_percent: [0, 30]      # %
  eosinophils_percent: [0, 20]    # %
  basophils_percent: [0, 5]       # %

  # Биохимия
  glucose: [1.0, 50.0]            # ммоль/л
  hba1c: [3.0, 20.0]              # %
  insulin: [0, 500]               # µIU/mL
  c_peptide: [0.1, 10.0]          # ng/mL
  fructosamine: [100, 500]        # µmol/L
  homa_ir: [0, 15]                # индекс

  # Электролиты
  sodium: [100, 180]              # ммоль/л
  potassium: [1.0, 10.0]          # ммоль/л
  chloride: [70, 130]             # ммоль/л
  calcium_total: [1.0, 4.0]       # ммоль/л
  calcium_ionized: [0.5, 2.5]     # ммоль/л
  magnesium: [0.2, 2.5]           # ммоль/л
  phosphate: [0.2, 3.0]           # ммоль/л

  # Липиды
  cholesterol_total: [1.0, 15.0]  # ммоль/л
  ldl_cholesterol: [0.5, 12.0]    # ммоль/л
  hdl_cholesterol: [0.2, 4.0]     # ммоль/л
  triglycerides: [0.2, 20.0]      # ммоль/л
  non_hdl_cholesterol: [1.0, 15.0] # ммоль/л
  atherogenic_index: [0.5, 10.0]  # отношение
  free_fatty_acids: [0.01, 3.0]   # ммоль/л
  apolipoprotein_a1: [0.2, 4.0]   # г/Л
  apolipoprotein_b: [0.1, 3.0]    # г/Л
  lipoprotein_a: [0, 200]         # mg/dL

  # Маркеры воспаления
  crp: [0, 200]                   # мг/Л
  hs_crp: [0, 50]                 # мг/Л
  esr: [0, 120]                   # мм/ч
  procalcitonin: [0, 100]         # нг/мл
  il6: [0, 500]                   # pg/mL
  tnfa: [0, 200]                  # pg/mL
  saa: [0, 500]                   # мг/Л

  # Железо
  ferritin: [0, 5000]             # мкг/Л
  serum_iron: [1, 80]             # мкмоль/Л
  transferrin: [0.5, 6.0]         # г/Л
  tibc: [20, 120]                 # мкмоль/Л
  uibc: [5, 80]                   # мкмоль/Л
  transferrin_saturation: [5, 100] # %
  soluble_transferrin_receptor: [0.5, 10.0] # мг/Л
