# ===== ОСТАЛЬНЫЕ СЕКЦИИ (без изменений) =====
groups:
  kidney_disease:
    - ckd_stage3
    - ckd_stage4
    - ckd_stage5
    - acute_kidney_injury
    - chronic_kidney_disease
  diabetes:
    - prediabetes
    - hyperglycemia
    - diabetes_mellitus_type_2
  liver_disease:
    - acute_hepatitis
    - nonalcoholic_fatty_liver
    - cholestasis
  inflammation:
    - systemic_inflammation
    - sepsis
  anemia:
    - iron_deficiency
    - b12_deficiency
    - folate_deficiency
    - macrocytic_anemia
    - hemolytic_anemia
    - anemia_chronic_disease
  thyroid:
    - hypothyroidism
    - hyperthyroidism
    - thyroid

priority:
  kidney_disease:
    - ckd_stage5
    - ckd_stage4
    - ckd_stage3
    - acute_kidney_injury
    - chronic_kidney_disease
  diabetes:
    - diabetes_mellitus_type_2
    - hyperglycemia
    - prediabetes
  liver_disease:
    - acute_hepatitis
    - nonalcoholic_fatty_liver
    - cholestasis
  inflammation:
    - sepsis
    - systemic_inflammation
  anemia:
    - iron_deficiency
    - anemia_chronic_disease
    - hemolytic_anemia
    - macrocytic_anemia
    - b12_deficiency
    - folate_deficiency
  thyroid:
    - hyperthyroidism
    - hypothyroidism
    - thyroid

exclusions:
  - if: ckd_stage5
    then:
      - ckd_stage4
      - ckd_stage3
      - chronic_kidney_disease
  - if: diabetes_mellitus_type_2
    then:
      - prediabetes
      - hyperglycemia
  - if: iron_deficiency
    then:
      - anemia_chronic_disease
      - b12_deficiency
      - folate_deficiency
      - macrocytic_anemia
      - hemolytic_anemia
  - if: sepsis
    then:
      - systemic_inflammation
  - if: hypothyroidism
    then:
      - thyroid
  - if: hyperthyroidism
    then:
      - thyroid
  - if: gout
    then:
      - hyperuricemia

combinations:
  - id: primary_hyperparathyroidism
    label: "Первичный гиперпаратиреоз (предположительно)"
    conditions:
      - hypercalcemia
      - vitamin_d_deficiency
    probability_factor: 0.8
    recommendation: "Консультация эндокринолога, определение PTH, кальций суточной мочи, УЗИ паращитовидных желёз"
    urgency: high
    doctor_specialty: Endocrinologist
    additional_tests:
      - PTH
      - Calcium 24h urine
      - Parathyroid ultrasound

  - id: septic_syndrome
    label: "Септический синдром"
    conditions:
      - sepsis
      - systemic_inflammation
    probability_factor: 1.0
    recommendation: "Госпитализация в ОРИТ, контроль гемодинамики, антибиотикотерапия, посев крови"
    urgency: critical
    doctor_specialty: Intensive Care Specialist
    additional_tests:
      - Blood culture
      - Lactate
      - Blood gas analysis

  - id: hepatorenal_syndrome
    label: "Гепаторенальный синдром (предположительно)"
    conditions:
      - acute_kidney_injury
      - acute_hepatitis
    probability_factor: 0.6
    recommendation: "Оценка функции почек и печени, УЗИ органов брюшной полости, консультация гепатолога и нефролога"
    urgency: high
    doctor_specialty: Hepatologist
    additional_tests:
      - Renal ultrasound
      - Liver ultrasound
      - Urine sodium

  - id: metabolic_bone_disease
    label: "Метаболическое заболевание костей (дефицит витамина D + гиперкальциемия)"
    conditions:
      - vitamin_d_deficiency
      - hypercalcemia
    probability_factor: 0.7
    recommendation: "Исследование костного метаболизма, DEXA-сканирование, консультация эндокринолога"
    urgency: moderate
    doctor_specialty: Rheumatologist
    additional_tests:
      - DEXA scan
      - Bone turnover markers