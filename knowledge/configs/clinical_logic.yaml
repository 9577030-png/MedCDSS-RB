  - lower_respiratory_infection_crp
  - lower_respiratory_infection_wbc
  - lower_respiratory_infection_procalcitonin
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Нижняя респираторная инфекция (подозрение).'
  urgency: moderate
  doctor_specialty: Infectious Disease Specialist
  additional_tests:
  - Антибиотикотерапия
- id: postoperative_inflammation
  label: Послеоперационное воспаление
  conditions:
  - postoperative_inflammation_crp
  - postoperative_inflammation_esr
  - postoperative_inflammation_wbc
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Послеоперационное воспаление.'
  urgency: high
  doctor_specialty: Infectious Disease Specialist
  additional_tests:
  - Оценивать в динамике, не по одному значению
  - Осмотр операционной раны
- id: sepsis
  label: Сепсис
  conditions:
  - sepsis_procalcitonin
  - sepsis_crp
  - sepsis_wbc
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Сепсис.'
  urgency: high
  doctor_specialty: Infectious Disease Specialist
  additional_tests:
  - Посев крови до начала антибиотикотерапии
  - Лактат
