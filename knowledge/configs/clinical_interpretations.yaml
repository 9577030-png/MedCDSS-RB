  # ============================================================
  # Сниженный/повышенный ферритин (мужчины/женщины)
  # ============================================================
  ferritin_low_male:
    id: ferritin_low_male
    label: "Сниженный ферритин (мужчины)"
    category: "Гематология"
    description: "Ферритин < 30 мкг/Л у мужчин – истощение запасов железа."
    criteria:
      - parameter: ferritin
        threshold: 30
        unit: "мкг/Л"
        condition: "<"
        comment_template: "Ферритин {value} мкг/Л ниже нормы для мужчин (< 30)."
    differentials:
      - condition: "hemoglobin < 130"
        text: "Железодефицитная анемия – наиболее вероятна. Требуется поиск источника кровопотери."
      - condition: "serum_iron < 11"
        text: "Снижение сывороточного железа подтверждает дефицит."
    red_flags:
      - condition: "ferritin < 15 AND hemoglobin < 110"
        text: "Критический дефицит железа – требуется немедленная коррекция, возможно парентерально."
    treatment_hints:
      - step: "Назначить препараты железа"
        note: "Доза элементарного железа 100–200 мг/сут."
      - step: "Поиск причины"
        note: "Обследовать ЖКТ (колоноскопия, ФГДС), исключить кровопотерю."
      - step: "Контроль"
        note: "Повтор ферритина через 3 месяца терапии."
    references:
      - "WHO guideline on iron deficiency (2023)"

  ferritin_low_female:
    id: ferritin_low_female
    label: "Сниженный ферритин (женщины)"
    category: "Гематология"
    description: "Ферритин < 15 мкг/Л у женщин – истощение запасов железа."
    criteria:
      - parameter: ferritin
        threshold: 15
        unit: "мкг/Л"
        condition: "<"
        comment_template: "Ферритин {value} мкг/Л ниже нормы для женщин (< 15)."
    differentials:
      - condition: "hemoglobin < 120 AND menstruation_heavy == true"
        text: "Железодефицитная анемия на фоне меноррагий."
      - condition: "serum_iron < 9"
        text: "Снижение сывороточного железа подтверждает дефицит."
    red_flags:
      - condition: "ferritin < 10 AND hemoglobin < 100"
        text: "Критический дефицит железа – требуется немедленная коррекция, возможно парентерально."
    treatment_hints:
      - step: "Назначить препараты железа"
        note: "Доза элементарного железа 100–200 мг/сут."
      - step: "Поиск причины"
        note: "Гинекологический осмотр, обследование ЖКТ при отсутствии менструальных кровопотерь."
      - step: "Контроль"
        note: "Повтор ферритина через 3 месяца терапии."
    references:
      - "WHO guideline on iron deficiency (2023)"

  ferritin_high_male:
    id: ferritin_high_male
    label: "Повышенный ферритин (мужчины)"
    category: "Гематология"
    description: "Ферритин ≥ 400 мкг/Л у мужчин – маркер перегрузки железом или воспаления."
    criteria:
      - parameter: ferritin
        threshold: 400
        unit: "мкг/Л"
        condition: ">="
        comment_template: "Ферритин {value} мкг/Л превышает норму для мужчин (≥ 400)."
    differentials:
      - condition: "transferrin_saturation > 45%"
        text: "Гемохроматоз – генетическое заболевание с перегрузкой железом. Проверить HFE-мутации."
      - condition: "crp > 5 OR esr > 15"
        text: "Воспаление (инфекция, аутоиммунное заболевание, злокачественное новообразование)."
      - condition: "alt > 45 OR ast > 40"
        text: "Повреждение печени (гепатит, НАЖБП, алкогольная болезнь)."
    red_flags:
      - condition: "ferritin > 1000 AND transferrin_saturation > 50%"
        text: "Выраженная перегрузка железом – риск цирроза, диабета, кардиомиопатии. Срочная консультация гематолога."
    treatment_hints:
      - step: "Диагностика причины"
        note: "Насыщение трансферрина, CRP, печеночные пробы, HFE-генотипирование."
      - step: "При гемохроматозе"
        note: "Флеботомия (кровопускание) для снижения ферритина."
      - step: "При воспалении"
        note: "Лечение основного заболевания."
    references:
      - "EASL Clinical Practice Guidelines on haemochromatosis (2022)"

  ferritin_high_female:
    id: ferritin_high_female
    label: "Повышенный ферритин (женщины)"
    category: "Гематология"
    description: "Ферритин ≥ 150 мкг/Л у женщин – маркер перегрузки железом или воспаления."
    criteria:
      - parameter: ferritin
        threshold: 150
        unit: "мкг/Л"
        condition: ">="
        comment_template: "Ферритин {value} мкг/Л превышает норму для женщин (≥ 150)."
    differentials:
      - condition: "transferrin_saturation > 45%"
        text: "Гемохроматоз – генетическое заболевание с перегрузкой железом. Проверить HFE-мутации."
      - condition: "crp > 5 OR esr > 20"
        text: "Воспаление (инфекция, аутоиммунное заболевание, злокачественное новообразование)."
      - condition: "alt > 35 OR ast > 32"
        text: "Повреждение печени (гепатит, НАЖБП, алкогольная болезнь)."
    red_flags:
      - condition: "ferritin > 800 AND transferrin_saturation > 50%"
        text: "Выраженная перегрузка железом – риск цирроза, диабета, кардиомиопатии. Срочная консультация гематолога."
    treatment_hints:
      - step: "Диагностика причины"
        note: "Насыщение трансферрина, CRP, печеночные пробы, HFE-генотипирование."
      - step: "При гемохроматозе"
        note: "Флеботомия (кровопускание) для снижения ферритина."
      - step: "При воспалении"
        note: "Лечение основного заболевания."
    references:
      - "EASL Clinical Practice Guidelines on haemochromatosis (2022)"

