interpretations:
  diabetes_mellitus_type_2:
    id: diabetes_mellitus_type_2
    label: Сахарный диабет 2 типа
    category: Эндокринология
    description: Хроническое метаболическое заболевание, характеризующееся гипергликемией вследствие инсулинорезистентности
      и относительной инсулиновой недостаточности.
    criteria:
    - parameter: glucose
      threshold: 7.0
      unit: ммоль/л
      condition: '>='
      comment_template: 'Критерий выполнен. Уровень {value} ммоль/л превышает порог (≥ 7.0).

        {additional}

        '
      additional_rules:
      - condition: value < 11.1
        text: Риск кетоацидоза минимален.
      - condition: value >= 11.1
        text: ВЫСОКИЙ РИСК КЕТОАЦИДОЗА! Требуется срочное обследование (кетоны мочи/крови).
    - parameter: hba1c
      threshold: 6.5
      unit: '%'
      condition: '>='
      comment_template: 'Критерий выполнен. Уровень {value}% отражает среднюю гликемию за 2–3 месяца.

        Целевой уровень для пациентов < 65 лет: < 7.0%.

        {additional}

        '
      additional_rules:
      - condition: value >= 9.0
        text: ЗНАЧИТЕЛЬНОЕ ПОВЫШЕНИЕ. Требуется инсулинотерапия, монотерапия метформином неэффективна.
    - parameter: glucose_random
      threshold: 11.1
      unit: ммоль/л
      condition: '>='
      comment_template: 'Случайный уровень глюкозы {value} ммоль/л превышает порог (≥ 11.1). Является
        самостоятельным критерием диабета при наличии симптомов.

        '
      optional: true
    - parameter: c_peptide
      threshold_low: 0.8
      unit: нг/мл
      condition: '>= 0.8'
      comment_template: 'Уровень С-пептида {value} нг/мл {interpretation}

        '
      additional_rules:
      - condition: value < 0.8
        text: Снижение указывает на абсолютную инсулиновую недостаточность, характерно для СД1 или LADA.
      - condition: value >= 0.8
        text: Сохранная секреция инсулина – характерно для СД2.
    differentials:
    - condition: age < 45 AND c_peptide < 0.8
      text: Заподозрить LADA (латентный аутоиммунный диабет взрослых) или СД1 типа. Проверить антитела
        к GAD, IA-2, ZnT8.
    - condition: glucocorticoids_use == true
      text: Вторичный стероидный диабет. Отмена или снижение дозы ГКС может привести к нормализации гликемии.
    red_flags:
    - condition: hba1c > 9.0
      text: '**Высокий риск декомпенсации и осложнений.** Требуется немедленная коррекция терапии, рассмотреть
        старт инсулина.'
    - condition: glucose_fasting > 15.0
      text: '**Угроза гиперосмолярного состояния.** Срочно проверить осмолярность, кетоны, электролиты.'
    - condition: age > 65 AND hba1c < 6.5
      text: Пожилой возраст + низкий HbA1c – возможны частые гипогликемии. Пересмотреть целевые уровни
        (индивидуализация).
    treatment_hints:
    - step: Метформин 500 мг × 2 раза в день
      note: Титровать до 2000 мг/сут при нормальной СКФ (> 30 мл/мин). Препарат выбора при СД2 и ожирении.
    - step: Скрининг осложнений
      note: 'Обязательно: микроальбуминурия, липидный профиль (ЛПНП), осмотр офтальмолога, консультация
        невролога.'
    - step: Обучение самоконтролю
      note: 'Измерение глюкозы натощак и через 2 часа после еды. Цели: натощак 4.0–7.0, через 2 часа <
        10.0.'
    - step: Контроль HbA1c
      note: Через 3 месяца после старта терапии, далее 1 раз в 3–6 месяцев.
    references:
    - ADA Standards of Medical Care in Diabetes 2025
    - Алгоритмы специализированной медицинской помощи больным сахарным диабетом (2024)
  iron_deficiency:
    id: iron_deficiency
    label: Железодефицитная анемия
    category: Гематология
    description: Анемия, обусловленная недостатком железа в организме, ведущая к нарушению синтеза гемоглобина.
    criteria:
    - parameter: hemoglobin
      unit: г/Л
      comment_template: 'Уровень {value} г/Л. Степень анемии: {severity}.

        {additional}

        '
      severity_mapping:
      - range: '>= 120'
        label: норма (для женщин)
      - range: 110-119
        label: легкая
      - range: 80-109
        label: умеренная
      - range: < 80
        label: тяжелая
      additional_rules:
      - condition: gender == 'female' AND value < 120
        text: 'Критерий анемии для женщин (ВОЗ: < 120 г/Л).'
      - condition: gender == 'male' AND value < 130
        text: 'Критерий анемии для мужчин (ВОЗ: < 130 г/Л).'
    - parameter: ferritin
      threshold: 15
      unit: мкг/Л
      condition: <
      comment_template: 'Уровень ферритина {value} мкг/Л.

        {interpretation}

        '
      additional_rules:
      - condition: value < 15
        text: Абсолютный дефицит железа в депо. Подтверждает этиологию ЖДА.
      - condition: 15 <= value < 30
        text: Снижение запасов железа (латентный дефицит). Возможна ЖДА при наличии снижения гемоглобина.
      - condition: value >= 100
        text: Ферритин повышен – исключает дефицит железа. Вероятна анемия хронического воспаления или
          болезни накопления.
    - parameter: mcv
      threshold: 80
      unit: фл
      condition: <
      comment_template: 'MCV {value} фл.

        {interpretation}

        '
      additional_rules:
      - condition: value < 80
        text: Микроцитоз – характерен для ЖДА (и талассемии).
      - condition: value >= 80
        text: Нормоцитоз или макроцитоз – не характерен для ЖДА. Требуется пересмотр гипотезы (B12, фолаты,
          ХЗП).
      optional: true
    differentials:
    - condition: ferritin > 100 AND crp > 5
      text: Анемия хронического воспаления (АХВ). Ферритин высокий, CRP повышен. Проверить трансферрин,
        железо сыворотки.
    - condition: mcv < 75 AND erythrocytes > 5.0
      text: Талассемия (особенно малая). Исследовать гемоглобин A2 и F.
    - condition: hemoglobin < 100 AND reticulocytes < 1%
      text: Апластическая анемия или гипоплазия костного мозга. Провести стернальную пункцию.
    red_flags:
    - condition: gender == 'male' AND hemoglobin < 110
      text: У мужчин анемия любой степени требует исключения скрытого кровотечения (ЖКТ). Провести колоноскопию,
        ФГДС.
    - condition: age > 50 AND hemoglobin < 100
      text: У пациентов старше 50 лет – риск онкозаболеваний. Обязательно исключить колоректальный рак,
        рак желудка.
    - condition: ferritin < 15 AND hb < 80
      text: Критическая анемия на фоне истощения запасов. Рассмотреть парентеральное введение железа (в/в),
        а не пероральное.
    treatment_hints:
    - step: Пероральные препараты железа
      note: Доза элементарного железа 100–200 мг/сут (например, железа сульфат 325 мг × 2–3 р/д). Добавить
        витамин С 500 мг для улучшения всасывания.
    - step: Контроль эффективности
      note: Ретикулоциты через 7 дней – их подъём (>1%) подтверждает ответ на терапию. Hb контроль через
        4 недели.
    - step: Если нет ответа через 2 недели
      note: 'Пересмотреть диагноз: возможна мальабсорбция (целиакия, атрофический гастрит), продолжающаяся
        кровопотеря, или нарушение комплаенса.'
    - step: Парентеральное железо
      note: При непереносимости пероральных препаратов, тяжелой анемии (Hb < 70), ХБП – назначают в/в
        железо (например, карбоксимальтозат).
    references:
    - WHO guideline on haemoglobin cutoffs to define anaemia (2024)
    - Клинические рекомендации по железодефицитной анемии (Россия, 2023)
  anemia_male:
    id: anemia_male
    label: Анемия (мужчины)
    category: Гематология
    description: Снижение уровня гемоглобина ниже 130 г/Л у мужчин (критерий ВОЗ).
    criteria:
    - parameter: hemoglobin
      threshold: 130
      unit: г/Л
      condition: <
      comment_template: Гемоглобин {value} г/Л ниже нормы для мужчин (< 130).
    differentials:
    - condition: ferritin < 30
      text: Железодефицитная анемия – наиболее частая причина у мужчин. Требуется поиск источника кровопотери
        (ЖКТ).
    - condition: mcv > 100 AND vitamin_b12 < 200
      text: Макроцитарная анемия – дефицит B12 или фолатов.
    - condition: ferritin > 100 AND crp > 5
      text: Анемия хронического воспаления.
    red_flags:
    - condition: hemoglobin < 110 AND age > 50
      text: У мужчин старше 50 лет с анемией любой степени – обязательно исключить колоректальный рак.
    treatment_hints:
    - step: Уточнить этиологию
      note: 'Обязательно: ферритин, B12, фолаты, CRP, анализ кала на скрытую кровь.'
    - step: При дефиците железа
      note: Препараты железа внутрь, при выраженной анемии – в/в.
    - step: При дефиците B12/фолатов
      note: Заместительная терапия в соответствии с уровнем.
    references:
    - WHO guideline on haemoglobin cutoffs (2024)
  anemia_female:
    id: anemia_female
    label: Анемия (женщины)
    category: Гематология
    description: Снижение уровня гемоглобина ниже 120 г/Л у женщин (критерий ВОЗ).
    criteria:
    - parameter: hemoglobin
      threshold: 120
      unit: г/Л
      condition: <
      comment_template: Гемоглобин {value} г/Л ниже нормы для женщин (< 120).
    differentials:
    - condition: ferritin < 15 AND menstruation_heavy == true
      text: Железодефицитная анемия на фоне меноррагий.
    - condition: mcv > 100 AND vitamin_b12 < 200
      text: Макроцитарная анемия – дефицит B12 или фолатов.
    - condition: ferritin > 100 AND crp > 5
      text: Анемия хронического воспаления.
    red_flags:
    - condition: hemoglobin < 100 AND age > 50
      text: У женщин старше 50 лет с анемией – исключить гинекологическую патологию и опухоли ЖКТ.
    treatment_hints:
    - step: Уточнить этиологию
      note: Ферритин, B12, фолаты, CRP, гинекологический осмотр.
    - step: При дефиците железа
      note: Препараты железа внутрь, при неэффективности – парентерально.
    - step: При дефиците B12/фолатов
      note: Заместительная терапия.
    references:
    - WHO guideline on haemoglobin cutoffs (2024)
  hypothyroidism:
    id: hypothyroidism
    label: Гипотиреоз
    category: Эндокринология
    description: Синдром, обусловленный стойким дефицитом гормонов щитовидной железы.
    criteria:
    - parameter: tsh
      threshold: 4.0
      unit: мМЕ/л
      condition: '>='
      comment_template: Уровень ТТГ {value} мМЕ/л превышает норму (≥ 4.0).
    - parameter: free_t4
      threshold: 12
      unit: пмоль/л
      condition: <=
      comment_template: Уровень свободного Т4 {value} пмоль/л ниже нормы (≤ 12).
    treatment_hints:
    - step: Левотироксин
      note: Начальная доза 25–50 мкг/сут, титровать под контролем ТТГ каждые 6–8 недель.
    references:
    - Клинические рекомендации по гипотиреозу (2023)
  hyperthyroidism:
    id: hyperthyroidism
    label: Гипертиреоз
    category: Эндокринология
    description: Синдром, обусловленный избытком гормонов щитовидной железы.
    criteria:
    - parameter: tsh
      threshold: 0.4
      unit: мМЕ/л
      condition: <=
      comment_template: Уровень ТТГ {value} мМЕ/л ниже нормы (≤ 0.4).
    - parameter: free_t4
      threshold: 22
      unit: пмоль/л
      condition: '>='
      comment_template: Уровень свободного Т4 {value} пмоль/л превышает норму (≥ 22).
    treatment_hints:
    - step: Тиреостатики (тиамазол)
      note: Начальная доза 30 мг/сут, затем коррекция под контролем ТТГ и свободного Т4.
    references:
    - Клинические рекомендации по гипертиреозу (2023)
  vitamin_d_deficiency:
    id: vitamin_d_deficiency
    label: Дефицит витамина D
    category: Эндокринология
    description: Уровень 25(OH)D < 30 нг/мл.
    criteria:
    - parameter: vitamin_d_25oh
      threshold: 30
      unit: нг/мл
      condition: <
      comment_template: Уровень витамина D {value} нг/мл ниже нормы (≥ 30).
    - parameter: vitamin_d_25oh
      threshold: 20
      unit: нг/мл
      condition: <
      comment_template: Выраженный дефицит ({value} нг/мл). Требуется интенсивная терапия.
      optional: true
    treatment_hints:
    - step: Пероральный колекальциферол
      note: При уровне < 30 нг/мл – 2000–5000 МЕ/сут в течение 2–3 месяцев, затем поддерживающая доза
        800–2000 МЕ/сут.
    references:
    - Endocrine Society Clinical Practice Guideline on Vitamin D (2023)
  hypertension:
    id: hypertension
    label: Артериальная гипертензия
    category: Кардиология
    description: Стойкое повышение артериального давления ≥ 140/90 мм рт. ст.
    criteria:
    - parameter: blood_pressure_systolic
      threshold: 140
      unit: мм рт. ст.
      condition: '>='
      comment_template: Систолическое АД {value} мм рт. ст. превышает порог (≥ 140).
    - parameter: blood_pressure_diastolic
      threshold: 90
      unit: мм рт. ст.
      condition: '>='
      comment_template: Диастолическое АД {value} мм рт. ст. превышает порог (≥ 90).
    treatment_hints:
    - step: Немедикаментозная коррекция
      note: Ограничение соли, снижение веса, физическая активность.
    - step: Антигипертензивная терапия
      note: Препараты выбора – ингибиторы АПФ, БРА, антагонисты кальция, диуретики.
    references:
    - ESC/ESH Guidelines for the management of arterial hypertension (2023)
  hypercholesterolemia:
    id: hypercholesterolemia
    label: Гиперхолестеринемия (повышенный ЛПНП)
    category: Липидный обмен
    description: Уровень ЛПНП > 3.0 ммоль/л.
    criteria:
    - parameter: ldl_cholesterol
      threshold: 3.0
      unit: ммоль/л
      condition: '>='
      comment_template: Уровень ЛПНП {value} ммоль/л превышает целевой уровень (≥ 3.0).
    - parameter: cholesterol_total
      threshold: 5.0
      unit: ммоль/л
      condition: '>='
      comment_template: Общий холестерин {value} ммоль/л превышает норму (≥ 5.0).
      optional: true
    treatment_hints:
    - step: Статины
      note: Назначить статин (аторвастатин 10–40 мг/сут, розувастатин 5–20 мг/сут) в зависимости от сердечно-сосудистого
        риска.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias (2023)
  hypertriglyceridemia:
    id: hypertriglyceridemia
    label: Гипертриглицеридемия
    category: Липидный обмен
    description: Триглицериды > 1.7 ммоль/л.
    criteria:
    - parameter: triglycerides
      threshold: 1.7
      unit: ммоль/л
      condition: '>='
      comment_template: Уровень триглицеридов {value} ммоль/л превышает норму (≥ 1.7).
    treatment_hints:
    - step: Диета с ограничением простых углеводов
      note: Снижение веса, отказ от алкоголя.
    - step: Фибриты
      note: При уровне > 2.3 ммоль/л – фенофибрат 145 мг/сут.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias (2023)
  low_hdl_male:
    id: low_hdl_male
    label: Низкий ХС ЛПВП (мужчины)
    category: Липидный обмен
    description: HDL < 1.0 ммоль/л у мужчин.
    criteria:
    - parameter: hdl_cholesterol
      threshold: 1.0
      unit: ммоль/л
      condition: <
      comment_template: Уровень ЛПВП {value} ммоль/л ниже нормы для мужчин (< 1.0).
    treatment_hints:
    - step: Модификация образа жизни
      note: Физическая активность, отказ от курения, снижение веса.
    - step: Медикаментозная терапия
      note: При низком HDL и высоком риске – статины, ниацин (но эффект на HDL не является самоцелью).
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias (2023)
  low_hdl_female:
    id: low_hdl_female
    label: Низкий ХС ЛПВП (женщины)
    category: Липидный обмен
    description: HDL < 1.2 ммоль/л у женщин.
    criteria:
    - parameter: hdl_cholesterol
      threshold: 1.2
      unit: ммоль/л
      condition: <
      comment_template: Уровень ЛПВП {value} ммоль/л ниже нормы для женщин (< 1.2).
    treatment_hints:
    - step: Модификация образа жизни
      note: Физическая активность, отказ от курения, снижение веса.
    - step: Медикаментозная терапия
      note: При низком HDL и высоком риске – статины, ниацин (но эффект на HDL не является самоцелью).
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias (2023)
  obesity:
    id: obesity
    label: Ожирение
    category: Обмен веществ
    description: ИМТ ≥ 30 кг/м².
    criteria:
    - parameter: bmi
      threshold: 30
      unit: кг/м²
      condition: '>='
      comment_template: ИМТ {value} кг/м² превышает порог (≥ 30).
    treatment_hints:
    - step: Модификация образа жизни
      note: Диета с дефицитом калорий, физическая активность 150–300 мин/нед.
    - step: Медикаментозная терапия
      note: При ИМТ ≥ 30 или ≥ 27 с осложнениями – орлистат, агонисты GLP-1 (лираглутид, семаглутид).
    references:
    - Рекомендации по лечению ожирения (2023)
  chronic_kidney_disease:
    id: chronic_kidney_disease
    label: Хроническая болезнь почек
    category: Нефрология
    description: СКФ < 60 мл/мин/1.73 м² или признаки повреждения почек ≥ 3 месяцев.
    criteria:
    - parameter: egfr
      threshold: 60
      unit: мл/мин/1.73 м²
      condition: <
      comment_template: СКФ {value} мл/мин/1.73 м² ниже нормы (≥ 60).
    - parameter: creatinine
      threshold: 115
      unit: мкмоль/л
      condition: '>'
      comment_template: Креатинин {value} мкмоль/л повышен.
      optional: true
    treatment_hints:
    - step: Ингибиторы АПФ/БРА
      note: При протеинурии или гипертензии – препараты выбора.
    - step: Контроль АД
      note: Целевой уровень АД < 130/80 мм рт. ст.
    references:
    - KDIGO Clinical Practice Guideline for CKD (2024)
  creatinine_high_male:
    id: creatinine_high_male
    label: Повышенный креатинин (мужчины)
    category: Нефрология
    description: Креатинин ≥ 115 мкмоль/л у мужчин – маркер снижения функции почек.
    criteria:
    - parameter: creatinine
      threshold: 115
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л превышает норму для мужчин (≥ 115).
    differentials:
    - condition: egfr < 60
      text: Снижение СКФ подтверждает хроническую болезнь почек.
    - condition: urea > 8.3
      text: Повышение мочевины вместе с креатинином указывает на преренальную азотемию или почечную недостаточность.
    - condition: potassium > 5.1 OR sodium < 136
      text: Электролитные нарушения часто сопутствуют почечной дисфункции.
    red_flags:
    - condition: creatinine > 200
      text: Значительное повышение – риск острой почечной недостаточности. Срочно оценить диурез, электролиты,
        провести УЗИ почек.
    treatment_hints:
    - step: Оценить функцию почек
      note: Рассчитать СКФ, проверить диурез, исключить обструкцию.
    - step: Коррекция факторов риска
      note: Контроль АД, сахара, отказ от нефротоксичных препаратов (НПВП).
    - step: При прогрессировании
      note: Консультация нефролога для решения вопроса о заместительной терапии.
    references:
    - KDIGO 2024 Clinical Practice Guideline for CKD
  creatinine_high_female:
    id: creatinine_high_female
    label: Повышенный креатинин (женщины)
    category: Нефрология
    description: Креатинин ≥ 97 мкмоль/л у женщин – маркер снижения функции почек.
    criteria:
    - parameter: creatinine
      threshold: 97
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л превышает норму для женщин (≥ 97).
    differentials:
    - condition: egfr < 60
      text: Снижение СКФ подтверждает хроническую болезнь почек.
    - condition: urea > 8.3
      text: Повышение мочевины вместе с креатинином указывает на преренальную азотемию или почечную недостаточность.
    - condition: potassium > 5.1 OR sodium < 136
      text: Электролитные нарушения часто сопутствуют почечной дисфункции.
    red_flags:
    - condition: creatinine > 180
      text: Значительное повышение – риск острой почечной недостаточности. Срочно оценить диурез, электролиты,
        провести УЗИ почек.
    treatment_hints:
    - step: Оценить функцию почек
