      unit: мкмоль/л
      condition: '>='
      comment_template: Железо сыворотки {value} мкмоль/л превышает норму для женщин (≥ 27).
    differentials:
    - condition: ferritin > 150 AND transferrin_saturation > 45%
      text: Гемохроматоз – подтвердить HFE-мутациями.
    - condition: hemoglobin > 150 OR hematocrit > 46%
      text: Эритремия (полицитемия) может приводить к повышению железа.
    red_flags:
    - condition: serum_iron > 35 AND ferritin > 800
      text: Тяжёлая перегрузка железом – риск органных осложнений.
    treatment_hints:
    - step: Диагностика причины
      note: Насыщение трансферрина, ферритин, HFE-генотипирование.
    - step: При гемохроматозе
      note: Флеботомия для снижения железа.
    references:
    - EASL Clinical Practice Guidelines on haemochromatosis (2022)
  rbc_low_male:
    id: rbc_low_male
    label: Сниженные эритроциты (мужчины)
    category: Гематология
    description: Эритроциты < 4.3 × 10¹²/Л у мужчин.
    criteria:
    - parameter: rbc
      threshold: 4.3
      unit: 10^12/L
      condition: <
      comment_template: Эритроциты {value} × 10¹²/Л ниже нормы для мужчин (< 4.3).
    differentials:
    - condition: hemoglobin < 130 AND mcv < 80
      text: Микроцитарная анемия (дефицит железа, талассемия).
    - condition: hemoglobin < 130 AND mcv > 100
      text: Макроцитарная анемия (дефицит B12, фолатов).
    treatment_hints:
    - step: Уточнить этиологию
      note: Оценить гемоглобин, MCV, ферритин, B12, фолаты.
    - step: Коррекция согласно причине
      note: Назначить препараты железа, B12 или фолатов при дефиците.
    references:
    - WHO guideline on anaemia (2024)
  rbc_low_female:
    id: rbc_low_female
    label: Сниженные эритроциты (женщины)
    category: Гематология
    description: Эритроциты < 3.8 × 10¹²/Л у женщин.
    criteria:
    - parameter: rbc
      threshold: 3.8
      unit: 10^12/L
      condition: <
      comment_template: Эритроциты {value} × 10¹²/Л ниже нормы для женщин (< 3.8).
    differentials:
    - condition: hemoglobin < 120 AND mcv < 80
      text: Микроцитарная анемия (дефицит железа, талассемия).
    - condition: hemoglobin < 120 AND mcv > 100
      text: Макроцитарная анемия (дефицит B12, фолатов).
    treatment_hints:
    - step: Уточнить этиологию
      note: Оценить гемоглобин, MCV, ферритин, B12, фолаты.
    - step: Коррекция согласно причине
      note: Назначить препараты железа, B12 или фолатов при дефиците.
    references:
    - WHO guideline on anaemia (2024)
  rbc_high_male:
    id: rbc_high_male
    label: Повышенные эритроциты (мужчины)
    category: Гематология
    description: Эритроциты ≥ 5.7 × 10¹²/Л у мужчин.
    criteria:
    - parameter: rbc
      threshold: 5.7
      unit: 10^12/L
      condition: '>='
      comment_template: Эритроциты {value} × 10¹²/Л превышают норму для мужчин (≥ 5.7).
    differentials:
    - condition: hematocrit > 52%
      text: Полицитемия – исключить эритремию (истинная полицитемия) или вторичную (гипоксия, курение,
        опухоли).
    - condition: erythropoietin > 20
      text: Вторичная полицитемия (гипоксия, почечная опухоль).
    red_flags:
    - condition: rbc > 6.0 AND platelets > 400 AND thrombocytosis
      text: Миелопролиферативное заболевание – требуется консультация гематолога.
    treatment_hints:
    - step: Диагностика причины
      note: Гематокрит, эритропоэтин, пульсоксиметрия, УЗИ почек.
    - step: При эритремии
      note: Кровопускания, гидроксимочевина для снижения риска тромбозов.
    references:
    - WHO classification of myeloproliferative neoplasms
  rbc_high_female:
    id: rbc_high_female
    label: Повышенные эритроциты (женщины)
    category: Гематология
    description: Эритроциты ≥ 5.2 × 10¹²/Л у женщин.
    criteria:
    - parameter: rbc
      threshold: 5.2
      unit: 10^12/L
      condition: '>='
      comment_template: Эритроциты {value} × 10¹²/Л превышают норму для женщин (≥ 5.2).
    differentials:
    - condition: hematocrit > 46%
      text: Полицитемия – исключить эритремию или вторичную полицитемию.
    - condition: erythropoietin > 20
      text: Вторичная полицитемия (гипоксия, почечная опухоль).
    red_flags:
    - condition: rbc > 5.5 AND platelets > 400
      text: Миелопролиферативное заболевание – требуется консультация гематолога.
    treatment_hints:
    - step: Диагностика причины
      note: Гематокрит, эритропоэтин, пульсоксиметрия, УЗИ почек.
    - step: При эритремии
      note: Кровопускания, гидроксимочевина для снижения риска тромбозов.
    references:
    - WHO classification of myeloproliferative neoplasms
  hematocrit_low_male:
    id: hematocrit_low_male
    label: Сниженный гематокрит (мужчины)
    category: Гематология
    description: Гематокрит < 40% у мужчин.
    criteria:
    - parameter: hematocrit
      threshold: 40
      unit: '%'
      condition: <
      comment_template: Гематокрит {value}% ниже нормы для мужчин (< 40%).
    differentials:
    - condition: rbc < 4.3
      text: Анемия – причина снижения гематокрита.
    treatment_hints:
    - step: Диагностика анемии
      note: Оценить гемоглобин, эритроциты, MCV.
    references:
    - WHO guideline on anaemia (2024)
  hematocrit_low_female:
    id: hematocrit_low_female
    label: Сниженный гематокрит (женщины)
    category: Гематология
    description: Гематокрит < 36% у женщин.
    criteria:
    - parameter: hematocrit
      threshold: 36
      unit: '%'
      condition: <
      comment_template: Гематокрит {value}% ниже нормы для женщин (< 36%).
    differentials:
    - condition: rbc < 3.8
      text: Анемия – причина снижения гематокрита.
    treatment_hints:
    - step: Диагностика анемии
      note: Оценить гемоглобин, эритроциты, MCV.
    references:
    - WHO guideline on anaemia (2024)
  hematocrit_high_male:
    id: hematocrit_high_male
    label: Повышенный гематокрит (мужчины)
    category: Гематология
    description: Гематокрит ≥ 52% у мужчин.
    criteria:
    - parameter: hematocrit
      threshold: 52
      unit: '%'
      condition: '>='
      comment_template: Гематокрит {value}% превышает норму для мужчин (≥ 52%).
    differentials:
    - condition: rbc > 5.7
      text: Полицитемия – риск тромбозов.
    treatment_hints:
    - step: Исключить эритремию
      note: Проверить эритропоэтин, JAK2-мутацию.
    references:
    - WHO classification of myeloproliferative neoplasms
  hematocrit_high_female:
    id: hematocrit_high_female
    label: Повышенный гематокрит (женщины)
    category: Гематология
    description: Гематокрит ≥ 46% у женщин.
    criteria:
    - parameter: hematocrit
      threshold: 46
      unit: '%'
      condition: '>='
      comment_template: Гематокрит {value}% превышает норму для женщин (≥ 46%).
    differentials:
    - condition: rbc > 5.2
      text: Полицитемия – риск тромбозов.
    treatment_hints:
    - step: Исключить эритремию
      note: Проверить эритропоэтин, JAK2-мутацию.
    references:
    - WHO classification of myeloproliferative neoplasms
  esr_high_male:
    id: esr_high_male
    label: Повышенная СОЭ (мужчины)
    category: Системное воспаление
    description: СОЭ ≥ 15 мм/ч у мужчин – неспецифический маркер воспаления.
    criteria:
    - parameter: esr
      threshold: 15
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч превышает норму для мужчин (≥ 15).
    differentials:
    - condition: crp > 5
      text: Системное воспаление (инфекция, аутоиммунное заболевание, онкология).
    - condition: age > 60 AND esr < 30
      text: Небольшое повышение у пожилых может быть вариантом нормы.
    red_flags:
    - condition: esr > 100 AND age > 50
      text: Высокая СОЭ – риск гигантоклеточного артериита, множественной миеломы, инфекционного эндокардита.
    treatment_hints:
    - step: Поиск причины
      note: Оценить клиническую картину, CRP, общий анализ крови, протеинограмму.
    - step: При инфекции
      note: Антибиотики по чувствительности.
    - step: При аутоиммунном процессе
      note: Консультация ревматолога, назначение иммуносупрессивной терапии.
    references:
    - Рекомендации по интерпретации СОЭ (2023)
  esr_high_female:
    id: esr_high_female
    label: Повышенная СОЭ (женщины)
    category: Системное воспаление
    description: СОЭ ≥ 20 мм/ч у женщин – неспецифический маркер воспаления.
    criteria:
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч превышает норму для женщин (≥ 20).
    differentials:
    - condition: crp > 5
      text: Системное воспаление (инфекция, аутоиммунное заболевание, онкология).
    - condition: age > 60 AND esr < 30
      text: Небольшое повышение у пожилых может быть вариантом нормы.
    red_flags:
    - condition: esr > 100 AND age > 50
      text: Высокая СОЭ – риск гигантоклеточного артериита, множественной миеломы, инфекционного эндокардита.
    treatment_hints:
    - step: Поиск причины
      note: Оценить клиническую картину, CRP, общий анализ крови, протеинограмму.
    - step: При инфекции
      note: Антибиотики по чувствительности.
    - step: При аутоиммунном процессе
      note: Консультация ревматолога, назначение иммуносупрессивной терапии.
    references:
    - Рекомендации по интерпретации СОЭ (2023)
  nonalcoholic_fatty_liver:
    id: nonalcoholic_fatty_liver
    label: Неалкогольная жировая болезнь печени
    category: Гепатология
    description: Повышение АЛТ/АСТ/ГГТ на фоне метаболического синдрома.
    criteria:
    - parameter: alt
      threshold: 45
      unit: Ед/л
      condition: '>'
      comment_template: АЛТ {value} Ед/л превышает норму (> 45 для мужчин, > 35 для женщин).
    - parameter: ast
      threshold: 40
      unit: Ед/л
      condition: '>'
      comment_template: АСТ {value} Ед/л превышает норму (> 40).
      optional: true
    - parameter: ggt
      threshold: 71
      unit: Ед/л
      condition: '>'
      comment_template: ГГТ {value} Ед/л превышает норму (> 71).
      optional: true
    treatment_hints:
    - step: Модификация образа жизни
      note: Потеря веса (7–10%), диета с ограничением простых углеводов и насыщенных жиров.
    - step: Витамин Е
      note: При отсутствии диабета – 800 МЕ/сут может улучшить гистологию.
    references:
    - Рекомендации по неалкогольной жировой болезни печени (2023)
  celiac_disease:
    id: celiac_disease
    label: Целиакия (подозрение)
    category: Гастроэнтерология
    description: Повышение антител к тканевой трансглютаминазе (anti‑tTG).
    criteria:
    - parameter: tga_iga
      threshold: 10
      unit: Ед/мл
      condition: '>'
      comment_template: Уровень антител к тканевой трансглютаминазе IgA {value} Ед/мл превышает норму
        (> 10).
    treatment_hints:
    - step: Строгая аглютеновая диета
      note: Пожизненное исключение глютенсодержащих продуктов.
    - step: Обследование у гастроэнтеролога
      note: Для подтверждения – биопсия двенадцатиперстной кишки.
    references:
    - Клинические рекомендации по целиакии (2023)
  anemia_chronic_disease:
    id: anemia_chronic_disease
    label: Анемия хронического воспаления (подозрение)
    category: Гематология
    description: Низкий гемоглобин, ферритин > 100, повышенный CRP.
    criteria:
    - parameter: hemoglobin
      threshold: 120
      unit: г/Л
      condition: <
      comment_template: Гемоглобин {value} г/Л снижен.
    - parameter: ferritin
      threshold: 100
      unit: мкг/Л
      condition: '>'
      comment_template: Ферритин {value} мкг/Л повышен (> 100), что характерно для воспаления.
    - parameter: crp
      threshold: 5
      unit: мг/Л
      condition: '>'
      comment_template: CRP {value} мг/Л повышен (> 5).
      optional: true
    treatment_hints:
    - step: Лечение основного заболевания
      note: При инфекции – антибиотики, при аутоиммунном процессе – иммуносупрессия.
    - step: Железо в/в (при дефиците)
      note: Если ферритин < 100, но нет абсолютного дефицита, в/в железо может быть неэффективным.
    references:
    - Рекомендации по анемии хронического воспаления (2023)
  b12_deficiency:
    id: b12_deficiency
    label: Дефицит витамина B12
    category: Гематология
    description: Уровень B12 < 200 пг/мл.
    criteria:
    - parameter: vitamin_b12
      threshold: 200
      unit: пг/мл
      condition: <
      comment_template: Уровень B12 {value} пг/мл ниже нормы (< 200).
    treatment_hints:
    - step: Пероральный цианокобаламин
      note: 1000–2000 мкг/сут, при нарушении всасывания – в/м 1000 мкг/мес.
    references:
    - Рекомендации по дефициту B12 (2023)
  folate_deficiency:
    id: folate_deficiency
    label: Дефицит фолиевой кислоты
    category: Гематология
    description: Фолат < 4 нг/мл.
    criteria:
    - parameter: folate
      threshold: 4
      unit: нг/мл
      condition: <
      comment_template: Уровень фолата {value} нг/мл ниже нормы (< 4).
    treatment_hints:
    - step: Фолиевая кислота
      note: 1–5 мг/сут перорально.
    references:
    - Рекомендации по дефициту фолата (2023)
  urinary_tract_infection:
    id: urinary_tract_infection
    label: Инфекция мочевыводящих путей (подозрение)
    category: Инфекционные заболевания
    description: Наличие лейкоцитурии, нитритов в моче, бактерий.
    criteria:
    - parameter: urine_leukocytes
      threshold: 5
      unit: кл/мкл
      condition: '>'
      comment_template: Лейкоциты в моче {value} кл/мкл повышены (> 5).
    - parameter: urine_nitrites
      threshold: 0
      unit: качественно
      condition: '>'
      comment_template: Нитриты в моче положительны, что говорит о бактериурии.
      optional: true
    treatment_hints:
    - step: Антибиотики
      note: Препараты выбора – фосфомицин, нитрофурантоин, цефалоспорины (в зависимости от резистентности).
    references:
    - Клинические рекомендации по ИМВП (2023)
  lower_respiratory_infection:
    id: lower_respiratory_infection
    label: Нижняя респираторная инфекция (подозрение)
    category: Инфекционные заболевания
    description: Повышение CRP, лейкоцитов, прокальцитонина на фоне симптомов.
    criteria:
    - parameter: crp
      threshold: 10
      unit: мг/Л
      condition: '>'
      comment_template: CRP {value} мг/Л повышен (> 10).
    - parameter: procalcitonin
      threshold: 0.5
      unit: нг/мл
      condition: '>'
      comment_template: Прокальцитонин {value} нг/мл повышен, что говорит о бактериальной природе.
      optional: true
    treatment_hints:
    - step: Антибиотикотерапия
      note: При бактериальной инфекции – амоксициллин, макролиды, респираторные фторхинолоны.
    references:
    - Клинические рекомендации по пневмонии (2023)
  systemic_inflammation:
    id: systemic_inflammation
    label: Системное воспаление
    category: Инфекционные заболевания
    description: Повышение CRP, СОЭ, лейкоцитов.
    criteria:
    - parameter: crp
      threshold: 10
      unit: мг/Л
      condition: '>'
      comment_template: CRP {value} мг/Л повышен (> 10).
    - parameter: esr
      threshold: 25
      unit: мм/ч
      condition: '>'
      comment_template: СОЭ {value} мм/ч повышена (> 25).
      optional: true
    treatment_hints:
    - step: Поиск причины
      note: Исключить инфекцию, аутоиммунные процессы, злокачественные новообразования.
    references:
    - Рекомендации по интерпретации маркеров воспаления (2023)
  gout:
    id: gout
    label: Подагра
    category: Ревматология
    description: Повышение мочевой кислоты > 420 мкмоль/л с клиническими проявлениями.
    criteria:
    - parameter: uric_acid
      threshold: 420
      unit: мкмоль/л
      condition: '>='
      comment_template: Уровень мочевой кислоты {value} мкмоль/л превышает норму (≥ 420).
    treatment_hints:
    - step: Нестероидные противовоспалительные
      note: При остром приступе – НПВП или колхицин.
    - step: Уратснижающая терапия
      note: Аллопуринол 100–300 мг/сут под контролем мочевой кислоты.
    references:
    - EULAR recommendations for gout management (2022)
  hypoglycemia:
    id: hypoglycemia
    label: Гипогликемия
    category: Эндокринология
    description: Уровень глюкозы ниже 3.9 ммоль/л.
    criteria:
    - parameter: glucose
      threshold: 3.9
      unit: ммоль/л
      condition: <
      comment_template: Уровень глюкозы {value} ммоль/л ниже нормы (< 3.9). Требуется срочная коррекция.
    red_flags:
    - condition: glucose < 3.0
      text: Тяжёлая гипогликемия! Требуется немедленное введение глюкозы (в/в 40% раствор) или глюкагон.
    - condition: glucose < 2.2 AND patient_age > 65
      text: Пожилой возраст + тяжёлая гипогликемия – высокий риск неврологических осложнений.
    treatment_hints:
    - step: Приём быстрых углеводов (15–20 г глюкозы)
      note: При лёгкой гипогликемии – сок, сладкий чай, глюкоза в таблетках.
    - step: В/в введение 40% раствора глюкозы
      note: При уровне глюкозы < 2.2 ммоль/л или при невозможности перорального приёма.
    - step: Поиск причины
      note: Исключить передозировку инсулина/препаратов сульфонилмочевины, инсулиному, надпочечниковую
        недостаточность.
    references:
    - Рекомендации по гипогликемии (2023)
  hyperkalemia:
    id: hyperkalemia
    label: Гиперкалиемия
    category: Электролиты
    description: Калий сыворотки ≥ 5.1 ммоль/л.
    criteria:
    - parameter: potassium
      threshold: 5.1
      unit: ммоль/л
      condition: '>='
      comment_template: Калий {value} ммоль/л превышает норму (≥ 5.1).
    red_flags:
    - condition: potassium > 6.0
      text: 'Критическая гиперкалиемия! Риск остановки сердца. Требуется экстренное лечение: кальция глюконат,
        инсулин + глюкоза, диуретики, гемодиализ.'
    treatment_hints:
    - step: Исключить гемолиз (ложное повышение)
      note: Повторить анализ.
    - step: При подтверждении
      note: Отменить калийсберегающие диуретики, ингибиторы АПФ; назначить кальция глюконат (при изменениях
        на ЭКГ), инсулин с глюкозой, петлевые диуретики.
    references:
    - KDIGO 2024 guidelines for electrolyte disorders
  hypokalemia:
    id: hypokalemia
    label: Гипокалиемия
    category: Электролиты
    description: Калий сыворотки ≤ 3.5 ммоль/л.
    criteria:
    - parameter: potassium
      threshold: 3.5
      unit: ммоль/л
      condition: <=
      comment_template: Калий {value} ммоль/л ниже нормы (≤ 3.5).
    red_flags:
    - condition: potassium < 2.5
      text: Тяжёлая гипокалиемия – риск паралича, аритмий. Требуется внутривенное восполнение.
    treatment_hints:
    - step: Коррекция диеты
      note: Продукты, богатые калием (бананы, картофель, бобовые).
    - step: Пероральные препараты калия
      note: Калия хлорид 1–2 г/сут, при уровне < 3.0 – 3–4 г/сут.
    - step: Поиск причины
      note: Исключить приём диуретиков, гиперфункцию коры надпочечников, потерю через ЖКТ.
    references:
    - KDIGO 2024 guidelines for electrolyte disorders
  hyponatremia:
    id: hyponatremia
    label: Гипонатриемия
    category: Электролиты
    description: Натрий ≤ 136 ммоль/л.
    criteria:
    - parameter: sodium
      threshold: 136
      unit: ммоль/л
      condition: <=
      comment_template: Натрий {value} ммоль/л ниже нормы (≤ 136).
    red_flags:
    - condition: sodium < 120
      text: Тяжёлая гипонатриемия – риск отёка мозга. Требуется медленная коррекция гипертоническим раствором.
    treatment_hints:
    - step: Уточнить причину
      note: СИАДГ, гиповолемия, сердечная недостаточность, приём диуретиков.
    - step: При СИАДГ
      note: Ограничение жидкости до 800–1000 мл/сут.
    - step: При гиповолемии
      note: Восполнение физиологическим раствором.
    references:
    - European guidelines on hyponatremia (2023)
  hypernatremia:
    id: hypernatremia
    label: Гипернатриемия
    category: Электролиты
    description: Натрий ≥ 145 ммоль/л.
    criteria:
    - parameter: sodium
      threshold: 145
      unit: ммоль/л
      condition: '>='
      comment_template: Натрий {value} ммоль/л превышает норму (≥ 145).
    red_flags:
    - condition: sodium > 155
      text: Тяжёлая гипернатриемия – риск нарушения сознания. Требуется медленное восполнение жидкости.
    treatment_hints:
    - step: Восполнение жидкости
      note: Перорально или в/в (5% глюкоза или 0.45% NaCl).
    - step: Поиск причины
      note: Дегидратация, несахарный диабет, приём диуретиков.
    references:
    - European guidelines on hypernatremia (2023)
  hypercalcemia:
    id: hypercalcemia
    label: Гиперкальциемия
    category: Эндокринология
    description: Кальций ≥ 2.55 ммоль/л.
    criteria:
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л превышает норму (≥ 2.55).
    red_flags:
    - condition: calcium_total > 3.0
      text: Гиперкальциемический криз – требуется гидратация, диуретики, кальцитонин, бисфосфонаты.
    treatment_hints:
    - step: Исключить гиперпаратиреоз и злокачественные новообразования
      note: Проверить ПТГ, кальций суточной мочи, онкомаркеры.
    - step: При уровне 2.55–3.0
      note: Гидратация, диета с ограничением кальция.
    references:
    - Клинические рекомендации по гиперкальциемии (2023)
  hypocalcemia:
    id: hypocalcemia
    label: Гипокальциемия
    category: Эндокринология
    description: Кальций ≤ 2.15 ммоль/л.
    criteria:
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций {value} ммоль/л ниже нормы (≤ 2.15).
    red_flags:
    - condition: calcium_total < 1.8
      text: Тяжёлая гипокальциемия – риск тетании, судорог. Требуется внутривенное введение кальция глюконата.
    treatment_hints:
    - step: Проверить альбумин, витамин D, ПТГ
      note: Для дифференцировки причины (гипопаратиреоз, дефицит витамина D, почечная недостаточность).
    - step: Коррекция
      note: Препараты кальция внутрь или в/в, витамин D при дефиците.
    references:
    - Клинические рекомендации по гипокальциемии (2023)
  severe_hyperglycemia:
    id: severe_hyperglycemia
    label: Тяжёлая гипергликемия
    category: Эндокринология
    description: Глюкоза крови ≥ 11.1 ммоль/л – высокий риск кетоацидоза и гиперосмолярного состояния.
    criteria:
    - parameter: glucose
      threshold: 11.1
      unit: ммоль/л
      condition: '>='
      comment_template: Уровень глюкозы {value} ммоль/л превышает порог тяжёлой гипергликемии (≥ 11.1).
    - parameter: hba1c
      threshold: 9.0
      unit: '%'
      condition: '>='
      comment_template: HbA1c {value}% превышает 9%, что указывает на хроническую декомпенсацию.
      optional: true
    red_flags:
    - condition: glucose >= 16.7
      text: '**Угроза гиперосмолярной комы.** Срочно проверить осмолярность, кетоны, электролиты, газовый
        состав крови.'
    - condition: glucose >= 13.9 AND ketone_bodies > 0
      text: '**Риск диабетического кетоацидоза.** Требуется экстренная госпитализация, инфузионная терапия,
        инсулин.'
    treatment_hints:
    - step: Инсулинотерапия
      note: Короткий инсулин в/в или п/к, титрация под контролем гликемии каждые 1–2 часа.
    - step: Восполнение жидкости
      note: Физиологический раствор 0.9% NaCl в/в, контроль электролитов (особенно калия).
    - step: Мониторинг
      note: Ежечасный контроль глюкозы, кетонов, электролитов, осмолярности.
    references:
    - ADA Standards of Medical Care in Diabetes 2025
  prediabetes:
    id: prediabetes
    label: Предиабет
    category: Эндокринология
    description: Глюкоза натощак 5.6–6.9 ммоль/л или HbA1c 5.7–6.4% – высокий риск развития СД2.
    criteria:
    - parameter: glucose
      threshold: 5.6
      unit: ммоль/л
      condition: '>='
      comment_template: Глюкоза натощак {value} ммоль/л в диапазоне предиабета (5.6–6.9).
    - parameter: hba1c
      threshold: 5.7
      unit: '%'
      condition: '>='
      comment_template: HbA1c {value}% в диапазоне предиабета (5.7–6.4%).
      optional: true
    treatment_hints:
    - step: Модификация образа жизни
      note: Снижение массы тела на 5–7%, увеличение физической активности (150 мин/нед).
    - step: Диета
      note: Ограничение простых углеводов, насыщенных жиров, увеличение клетчатки.
    - step: Медикаментозная профилактика
      note: При высоком риске – метформин 850 мг × 2 р/д.
    references:
    - ADA Standards of Medical Care in Diabetes 2025
  acute_kidney_injury:
    id: acute_kidney_injury
    label: Острое повреждение почек
    category: Нефрология
    description: Внезапное снижение функции почек – повышение креатинина, снижение диуреза, электролитные
      нарушения.
    criteria:
    - parameter: creatinine
      threshold: 1.5
      unit: мкмоль/л
      condition: '>= baseline * 1.5'
      comment_template: Креатинин повысился в {value} раз от исходного (критерий ОПП).
    - parameter: egfr
      threshold: 60
      unit: мл/мин/1.73м²
      condition: <
      comment_template: СКФ {value} мл/мин/1.73м² снижена (< 60).
    red_flags:
    - condition: creatinine > baseline * 3
      text: Тяжёлое ОПП (стадия 3) – требуется заместительная почечная терапия.
    - condition: potassium > 6.0
      text: Гиперкалиемия – риск аритмий. Срочная коррекция.
    treatment_hints:
    - step: Оценка гемодинамики и волемического статуса
      note: Исключить гиповолемию, обструкцию мочевых путей, вазоконстрикцию (НПВП, иАПФ).
    - step: Коррекция электролитов
      note: Гиперкалиемия – кальция глюконат, инсулин+глюкоза, диуретики, при необходимости диализ.
    - step: Мониторинг диуреза
      note: Ежечасно, катетеризация мочевого пузыря при олигурии.
    - step: Нефропротекция
      note: Отмена нефротоксичных препаратов, поддержание перфузии почек.
    references:
    - KDIGO Clinical Practice Guideline for Acute Kidney Injury (2024)
  metabolic_syndrome:
    id: metabolic_syndrome
    label: Метаболический синдром
    category: Липидный обмен
    description: Сочетание ожирения, гипергликемии, дислипидемии и артериальной гипертензии.
    criteria:
    - parameter: waist_circumference
      threshold: 94
      unit: см
      condition: '>='
      comment_template: Окружность талии {value} см превышает порог (≥ 94 у мужчин, ≥ 80 у женщин).
    - parameter: triglycerides
      threshold: 1.7
      unit: ммоль/л
      condition: '>='
      comment_template: Триглицериды {value} ммоль/л повышены (≥ 1.7).
    - parameter: hdl_cholesterol
      threshold: 1.0
      unit: ммоль/л
      condition: <
      comment_template: ЛПВП {value} ммоль/л снижен (< 1.0 у мужчин, < 1.3 у женщин).
    - parameter: blood_pressure_systolic
      threshold: 130
      unit: мм рт. ст.
      condition: '>='
      comment_template: САД {value} мм рт. ст. ≥ 130.
    - parameter: glucose
      threshold: 5.6
      unit: ммоль/л
      condition: '>='
      comment_template: Глюкоза натощак {value} ммоль/л ≥ 5.6.
    treatment_hints:
    - step: Комплексный подход
      note: Снижение веса (7–10%), диета, физическая активность 150–300 мин/нед.
    - step: Медикаментозная коррекция
      note: Статины при дислипидемии, антигипертензивная терапия, метформин при предиабете.
    references:
    - IDF Consensus on Metabolic Syndrome (2023)
  primary_hyperparathyroidism:
    id: primary_hyperparathyroidism
    label: Первичный гиперпаратиреоз (предположительно)
    category: Эндокринология
    description: Сочетание гиперкальциемии и дефицита витамина D может указывать на первичный гиперпаратиреоз.
    criteria:
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л повышен (≥ 2.55).
    - parameter: vitamin_d_25oh
      threshold: 30
      unit: нг/мл
      condition: <
      comment_template: Витамин D {value} нг/мл снижен (< 30).
    differentials:
    - condition: pth > 6.9 AND calcium_ionized > 1.33
      text: Подтверждает первичный гиперпаратиреоз. Необходимо провести УЗИ паращитовидных желёз.
    - condition: creatinine_high_male OR creatinine_high_female
      text: Исключить вторичный гиперпаратиреоз на фоне ХБП.
    red_flags:
    - condition: calcium_total > 3.0 AND pth > 10
      text: Гиперкальциемический криз – требует экстренного лечения, возможно хирургического вмешательства.
    treatment_hints:
    - step: Консультация эндокринолога
      note: Определение PTH, кальций суточной мочи, УЗИ паращитовидных желёз.
    - step: При подтверждении
      note: Показано хирургическое удаление аденомы паращитовидной железы.
    - step: Медикаментозная терапия
      note: При невозможности операции – цинакальцет, бисфосфонаты.
    references:
    - Endocrine Society Guidelines on Primary Hyperparathyroidism (2022)
  septic_syndrome:
    id: septic_syndrome
    label: Септический синдром
    category: Инфекционные заболевания
    description: Сочетание системного воспаления и подозрения на сепсис.
    criteria:
    - parameter: crp
      threshold: 50
      unit: мг/Л
      condition: '>'
      comment_template: CRP {value} мг/Л значительно повышен (> 50).
    - parameter: procalcitonin
      threshold: 0.5
      unit: нг/мл
      condition: '>'
      comment_template: Прокальцитонин {value} нг/мл повышен (> 0.5).
      optional: true
    red_flags:
    - condition: lactate > 2.0
      text: Гиперлактатемия указывает на септический шок. Срочная госпитализация в ОРИТ.
    - condition: systolic_bp < 90 OR diastolic_bp < 60
      text: Гипотензия – признак шока. Немедленная инфузионная терапия и вазопрессоры.
    treatment_hints:
    - step: Госпитализация в ОРИТ
      note: Контроль гемодинамики, антибиотикотерапия, посев крови.
    - step: Антибиотики
      note: Эмпирическая терапия широкого спектра после взятия посевов.
    - step: Инфузионная терапия
      note: Кристаллоиды 30 мл/кг, при нестабильности – вазопрессоры (норадреналин).
    references:
    - Surviving Sepsis Campaign Guidelines (2024)
  hepatorenal_syndrome:
    id: hepatorenal_syndrome
    label: Гепаторенальный синдром (предположительно)
    category: Нефрология
    description: Сочетание острого повреждения почек и острого гепатита.
    criteria:
    - parameter: creatinine
      threshold: 1.5
      unit: мкмоль/л
      condition: '>= baseline * 1.5'
      comment_template: Креатинин повысился в {value} раз от исходного.
    - parameter: alt
      threshold: 45
      unit: Ед/л
      condition: '>'
      comment_template: АЛТ {value} Ед/л повышена (> 45).
    differentials:
    - condition: acute_hepatitis == true AND acute_kidney_injury == true
      text: Гепаторенальный синдром – исключить преренальную азотемию, обструкцию мочевыводящих путей.
    red_flags:
    - condition: creatinine > 2.0 AND bilirubin_total > 50
      text: Тяжёлая печёночно-почечная недостаточность – требует заместительной терапии.
    treatment_hints:
    - step: Оценка функции почек и печени
      note: УЗИ органов брюшной полости, консультация гепатолога и нефролога.
    - step: Терапия
      note: Восполнение ОЦК (альбумин), при прогрессировании – диализ.
    references:
    - KDIGO 2024 Guidelines for AKI in cirrhosis
  metabolic_bone_disease:
    id: metabolic_bone_disease
    label: Метаболическое заболевание костей (дефицит витамина D + гиперкальциемия)
    category: Ревматология
    description: Сочетание дефицита витамина D и гиперкальциемии.
    criteria:
    - parameter: vitamin_d_25oh
      threshold: 30
      unit: нг/мл
      condition: <
      comment_template: Витамин D {value} нг/мл снижен (< 30).
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л повышен (≥ 2.55).
    differentials:
    - condition: alkaline_phosphatase > 130
      text: Повышенная ЩФ указывает на костную перестройку.
    - condition: pth > 6.9
      text: Исключить первичный гиперпаратиреоз.
    red_flags:
    - condition: calcium_total > 3.0 AND alkaline_phosphatase > 300
      text: Агрессивное метаболическое заболевание костей – риск переломов.
    treatment_hints:
    - step: Исследование костного метаболизма
      note: DEXA-сканирование, маркеры костного ремоделирования.
    - step: Коррекция витамина D
      note: Колекальциферол 2000–5000 МЕ/сут под контролем кальция.
    - step: При гиперкальциемии
      note: Ограничение кальция в диете, гидратация, при необходимости – бисфосфонаты.
    references:
    - Рекомендации по остеопорозу (2023)
  acute_hepatitis:
    id: acute_hepatitis
    label: Острый гепатит
    category: Гепатология
    description: Значительное повышение АЛТ/АСТ (>100 Ед/л) и/или билирубина (>34 мкмоль/л), характерное
      для острого повреждения печени.
    criteria:
    - parameter: alt
      threshold: 100
      unit: Ед/л
      condition: '>='
      comment_template: АЛТ {value} Ед/л. Значительное повышение, характерно для острого гепатоцеллюлярного
        повреждения.
    - parameter: ast
      threshold: 100
      unit: Ед/л
      condition: '>='
      comment_template: АСТ {value} Ед/л.
    - parameter: bilirubin_total
      threshold: 34
      unit: мкмоль/л
      condition: '>='
      comment_template: Билирубин общий {value} мкмоль/л, соответствует клинически заметной желтухе.
    differentials:
    - condition: ''
      text: Вирусные гепатиты (A, B, C, E), лекарственное поражение печени (DILI), алкогольный гепатит,
        аутоиммунный гепатит, ишемический гепатит («шоковая печень»).
    red_flags:
    - condition: bilirubin_total > 200
      text: Резкое нарастание билирубина. Дополнительно клинически оценить коагулопатию (МНО) и признаки
        энцефалопатии — их сочетание с острым гепатитом указывает на острую печёночную недостаточность
        и требует экстренной госпитализации, по возможности в центр с возможностью трансплантации.
    treatment_hints:
    - step: Серологическая панель вирусных гепатитов
      note: Anti-HAV IgM, HBsAg, anti-HBc IgM, anti-HCV.
    - step: Собрать анамнез лекарств и алкоголя
      note: DILI и алкогольный гепатит — частые причины, легко пропустить без прицельного опроса.
    - step: Коагулограмма (МНО)
      note: Ключевой маркер тяжести и показание для экстренного направления при удлинении.
    references:
    - AASLD Practice Guidance on acute liver injury
    - EASL Clinical Practice Guidelines
  cholestasis:
    id: cholestasis
    label: Холестаз
    category: Гепатология
    description: Повышение щелочной фосфатазы, ГГТ и прямого билирубина, характерное для нарушения оттока
      желчи.
    criteria:
    - parameter: alkaline_phosphatase
      threshold: 200
      unit: Ед/л
      condition: '>='
      comment_template: Щелочная фосфатаза {value} Ед/л.
    - parameter: ggt
      threshold: 120
      unit: Ед/л
      condition: '>='
      comment_template: ГГТ {value} Ед/л, подтверждает печёночное происхождение повышенной ЩФ.
    - parameter: bilirubin_direct
      threshold: 10
      unit: мкмоль/л
      condition: '>='
      comment_template: Прямой билирубин {value} мкмоль/л.
    differentials:
    - condition: ''
      text: Обструкция желчных путей (камни, стриктура, опухоль головки поджелудочной железы), первичный
        билиарный холангит, первичный склерозирующий холангит, лекарственно-индуцированный холестаз, внутрипечёночный
        холестаз беременных.
    red_flags:
    - condition: bilirubin_direct > 50
      text: Значительно повышенный прямой билирубин. Клинически проверить триаду Шарко (лихорадка + боль
        в правом подреберье + желтуха) — при её наличии подозревать острый восходящий холангит, экстренное
        состояние.
    treatment_hints:
    - step: УЗИ брюшной полости в первую очередь
      note: Ищем расширение внутри-/внепечёночных желчных протоков — разделяет механическую и немеханическую
        причину холестаза.
    - step: При подозрении на обструкцию — МРХПГ
      note: Неинвазивная визуализация желчных путей перед решением об ЭРХПГ.
    - step: Антимитохондриальные антитела
      note: При отсутствии обструкции и подозрении на первичный билиарный холангит.
    references:
    - EASL Clinical Practice Guidelines on cholestatic liver disease
  hypoalbuminemia:
    id: hypoalbuminemia
    label: Гипоальбуминемия
    category: Гепатология
    description: Альбумин сыворотки < 35 г/л.
    criteria:
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л, ниже нормы.
    differentials:
    - condition: ''
      text: Нарушение синтеза (цирроз, печёночная недостаточность), потеря белка (нефротический синдром,
        энтеропатия с потерей белка, ожоги), хроническое воспаление/острофазовая реакция, недостаточность
        питания, разведение при гипергидратации.
    red_flags:
    - condition: albumin < 20
      text: Выраженная гипоальбуминемия — риск анасарки и повышенной восприимчивости к инфекциям, особенно
        при наличии отёков/асцита.
    treatment_hints:
    - step: СРБ
      note: Разделяет воспалительную причину (альбумин как отрицательный острофазовый белок) от истощения/потери.
    - step: Соотношение белок/креатинин в моче
      note: Исключить протеинурию как причину потери белка.
    - step: Оценка функции печени и нутритивного статуса
      note: Альбумин — не чистый нутритивный маркер, интерпретировать с осторожностью при остром воспалении.
    references:
    - ESPEN guidelines on nutritional assessment
  osteomalacia:
    id: osteomalacia
    label: Остеомаляция
    category: Остеология
    description: Сочетание дефицита витамина D, гипофосфатемии, гипокальциемии и повышенной щелочной фосфатазы
      — картина нарушения минерализации костной ткани у взрослых.
    criteria:
    - parameter: vitamin_d
      threshold: 20
      unit: нг/мл
      condition: <=
      comment_template: Витамин D {value} нг/мл — дефицит.
    - parameter: phosphate
      threshold: 0.8
      unit: ммоль/л
      condition: <=
      comment_template: Фосфат {value} ммоль/л — снижен.
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций общий {value} ммоль/л — снижен.
    - parameter: alkaline_phosphatase
      threshold: 130
      unit: Ед/л
      condition: '>='
      comment_template: Щелочная фосфатаза {value} Ед/л — повышена, типично при активной остеомаляции.
    differentials:
    - condition: ''
      text: Дефицит витамина D (наиболее частая причина), синдромы мальабсорбции, ХБП (нарушение активации
        витамина D), наследственные гипофосфатемические синдромы, длительный приём антиконвульсантов.
    red_flags:
    - condition: calcium_total < 1.9
      text: Выраженная гипокальциемия — риск тетании (парестезии, судороги). Также клинически оценить
        наличие патологических переломов.
    treatment_hints:
    - step: ПТГ
      note: Оценить наличие вторичного гиперпаратиреоза, типичного при дефиците витамина D.
    - step: Денситометрия (DXA)
      note: Помогает отличить от остеопороза, хотя это разные по механизму состояния.
    - step: Рентген
      note: Искать зоны Лоозера (псевдопереломы) — характерный, хоть и не всегда присутствующий признак.
    references:
    - Endocrine Society Clinical Practice Guideline for Vitamin D deficiency
  osteoporosis:
    id: osteoporosis
    label: Остеопороз (вторичный, по лабораторным маркерам)
    category: Остеология
    description: 'Лабораторная картина (дефицит витамина D, сниженный кальций, повышенный ПТГ), которая
      может сопровождать вторичный остеопороз. Важно: диагноз остеопороза клинически ставится по денситометрии
      (DXA, T-score ≤ -2.5), а не по одним лабораторным маркерам — эта находка указывает на вероятную
      метаболическую причину, а не подтверждает диагноз сама по себе.'
    criteria:
    - parameter: vitamin_d
      threshold: 20
      unit: нг/мл
      condition: <=
      comment_template: Витамин D {value} нг/мл — дефицит, частый вторичный фактор снижения костной массы.
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций общий {value} ммоль/л — снижен.
    - parameter: pth
      threshold: 6.9
      unit: пмоль/л
      condition: '>='
      comment_template: ПТГ {value} пмоль/л — повышен, возможен вторичный или первичный гиперпаратиреоз.
    differentials:
    - condition: ''
      text: Первичный остеопороз (постменопаузальный, сенильный) vs вторичный (гиперпаратиреоз, гипертиреоз,
        длительная терапия глюкокортикоидами, гипогонадизм).
    red_flags:
    - condition: pth > 15
      text: 'Значительно повышенный ПТГ — вероятен первичный гиперпаратиреоз как причина, а не первичный
        остеопороз. Также: перелом при минимальной травме — красный флаг для немедленного начала лечения,
        независимо от результата денситометрии (это не выражается лабораторным параметром, оценивается
        клинически).'
    treatment_hints:
    - step: Денситометрия (DXA)
      note: Золотой стандарт диагностики, эти лабораторные маркеры её не заменяют.
    - step: FRAX
      note: Калькулятор 10-летнего риска перелома для решения о начале терапии.
    - step: Скрининг вторичных причин
      note: ТТГ, тестостерон у мужчин, при повышенном ПТГ — исключить первичный гиперпаратиреоз.
    references:
    - Клинические рекомендации по диагностике и лечению остеопороза
  paget_disease:
    id: paget_disease
    label: Болезнь Педжета костей (предположительно)
    category: Остеология
    description: Изолированное значительное повышение щелочной фосфатазы при отсутствии других признаков
      поражения печени — типичная лабораторная находка при болезни Педжета костей.
    criteria:
    - parameter: alkaline_phosphatase
      threshold: 200
      unit: Ед/л
      condition: '>='
      comment_template: Щелочная фосфатаза {value} Ед/л. Если печёночные пробы (АЛТ/АСТ/ГГТ) в норме —
        повышение, вероятно, костного происхождения.
    differentials:
    - condition: ''
      text: Болезнь Педжета костей, метастатическое поражение костей, гиперпаратиреоз, заболевания печени
        (дифференцировать источник ЩФ по изоферментам или ГГТ).
    red_flags:
    - condition: alkaline_phosphatase > 500
      text: Очень высокий уровень ЩФ, ассоциирован с более активным/распространённым процессом. Быстро
        нарастающая боль в поражённой кости (клинический признак, не лабораторный) — редкое, но серьёзное
        подозрение на саркоматозную трансформацию, требует срочного обследования.
    treatment_hints:
    - step: ГГТ или изоферменты ЩФ
      note: Подтвердить костное, а не печёночное происхождение повышенной ЩФ.
    - step: Рентген поражённой области
      note: Характерные изменения структуры кости.
    - step: Сцинтиграфия скелета
      note: Оценка распространённости поражения костей.
    references:
    - Клинические рекомендации по метаболическим заболеваниям костей
  ankylosing_spondylitis:
    id: ankylosing_spondylitis
    label: Анкилозирующий спондилит
    category: Ревматология
    description: Сочетание положительного HLA-B27 с повышенными маркерами воспаления (СРБ, СОЭ) — характерно
      для серонегативной спондилоартропатии с поражением осевого скелета. HLA-B27 сам по себе не диагностичен
      (встречается у части здоровой популяции) — интерпретировать только вместе с клинической картиной
      воспалительной боли в спине.
    criteria:
    - parameter: hla_b27
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: HLA-B27 положителен. Диагностическую ценность имеет только вместе с клинической
        картиной воспалительной боли в спине (начало < 45 лет, улучшение при движении, ночная боль).
    - parameter: crp
      threshold: 5
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: Механическая боль в пояснице, другие серонегативные спондилоартропатии (псориатический артрит,
        реактивный артрит, энтеропатический артрит при ВЗК), у пожилых — диффузный идиопатический скелетный
        гиперостоз (DISH).
    red_flags:
    - condition: esr >= 60
      text: Высокая активность воспаления. Клинически проверить наличие острого переднего увеита (боль,
        покраснение глаза, светобоязнь) — частое внескелетное проявление, требует срочной офтальмологической
        консультации.
    treatment_hints:
    - step: МРТ или рентген крестцово-подвздошных суставов
      note: Сакроилеит — ключевой диагностический признак, лабораторные маркеры его не заменяют.
    - step: Направление к ревматологу при воспалительном характере боли
      note: Начало < 45 лет, длительность > 3 мес, улучшение при движении и НПВП — критерии воспалительной
        боли в спине.
    references:
    - ASAS/EULAR recommendations for axial spondyloarthritis
  rheumatoid_arthritis:
    id: rheumatoid_arthritis
    label: Ревматоидный артрит
    category: Ревматология
    description: Повышенные ревматоидный фактор и/или антитела к циклическому цитруллинированному пептиду
      (анти-ЦЦП) вместе с маркерами воспаления — характерно для ревматоидного артрита.
    criteria:
    - parameter: rheumatoid_factor
      threshold: 14
      unit: МЕ/мл
      condition: '>='
      comment_template: Ревматоидный фактор {value} МЕ/мл — повышен. Менее специфичен, чем анти-ЦЦП, может
        быть положительным при других состояниях (инфекции, другие аутоиммунные заболевания, у части здоровых
        лиц).
    - parameter: anti_ccp
      threshold: 17
      unit: Ед/мл
      condition: '>='
      comment_template: Анти-ЦЦП {value} Ед/мл — повышены, более специфичный маркер РА, чем ревматоидный
        фактор.
    - parameter: crp
      threshold: 5
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: Другие воспалительные артропатии (псориатический артрит, СКВ с артритом), вирусные артриты
        (парвовирус B19, гепатит C), полимиалгия ревматика у пожилых.
    red_flags:
    - condition: anti_ccp > 50
      text: Значительно повышенный титр анти-ЦЦП ассоциирован с более агрессивным, эрозивным течением
        заболевания. Раннее направление к ревматологу критично — существует «окно возможностей» в первые
        недели-месяцы для предотвращения необратимого повреждения суставов.
    treatment_hints:
    - step: Рентген кистей и стоп
      note: Оценка эрозивных изменений на момент постановки диагноза как база для дальнейшего наблюдения.
    - step: Раннее начало БПВП (метотрексат)
      note: Решается ревматологом; задержка начала терапии ухудшает долгосрочный прогноз.
    references:
    - EULAR recommendations for the management of rheumatoid arthritis
  systemic_lupus:
    id: systemic_lupus
    label: Системная красная волчанка
    category: Ревматология
    description: Положительный ANA-скрининг в сочетании с повышенными анти-дсДНК, сниженным комплементом
      (C3/C4) и/или признаками поражения почек (протеинурия, гематурия) — характерно для СКВ.
    criteria:
    - parameter: ana_screening
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: ANA-скрининг положителен. Высокочувствителен, но не специфичен — положителен также
        при других аутоиммунных заболеваниях, инфекциях, и у части здоровых лиц.
    - parameter: anti_ds_dna
      threshold: 10
      unit: МЕ/мл
      condition: '>='
      comment_template: Анти-дсДНК {value} МЕ/мл — повышены, значительно более специфичны для СКВ, чем
        общий ANA, коррелируют с активностью заболевания и риском нефрита.
    - parameter: complement_c3
      threshold: 0.75
      unit: г/л
      condition: <=
      comment_template: Комплемент C3 {value} г/л — снижен, характерно для активного заболевания.
    - parameter: complement_c4
      threshold: 0.1
      unit: г/л
      condition: <=
      comment_template: Комплемент C4 {value} г/л — снижен.
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия, требует исключения волчаночного нефрита.
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    differentials:
    - condition: ''
      text: Другие ревматологические заболевания (смешанное заболевание соединительной ткани, синдром
        Шёгрена), лекарственно-индуцированная волчанка, инфекции (могут давать ложноположительный ANA),
        фибромиалгия (может сопутствовать и усложнять клиническую картину).
    red_flags:
    - condition: urine_protein >= 150 and urine_erythrocytes >= 5
      text: Протеинурия и гематурия одновременно — подозрение на волчаночный нефрит. Требует срочной нефрологической
        оценки и обсуждения биопсии почки для определения класса нефрита, что напрямую влияет на выбор
        терапии.
    treatment_hints:
    - step: Мониторинг анти-дсДНК и комплемента C3/C4 в динамике
      note: Снижение комплемента вместе с ростом анти-дсДНК коррелирует с обострением заболевания.
    - step: Биопсия почки при подозрении на нефрит
      note: Классификация класса волчаночного нефрита определяет тактику иммуносупрессивной терапии.
    references:
    - EULAR recommendations for the management of SLE
    - KDIGO Clinical Practice Guideline on Glomerular Diseases (lupus nephritis)
  vasculitis:
    id: vasculitis
    label: Системный васкулит (предположительно)
    category: Ревматология
    description: Сочетание признаков поражения почек (протеинурия, гематурия) с повышенными маркерами
      воспаления. Паттерн неспецифичен — пересекается с волчаночным нефритом и другими гломерулопатиями;
      ключевой отличающий тест — антинейтрофильные цитоплазматические антитела (ANCA), который не входит
      в набор параметров этого правила и должен быть заказан отдельно при клиническом подозрении.
    criteria:
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия.
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    - parameter: crp
      threshold: 5
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: АНЦА-ассоциированные васкулиты (гранулематоз с полиангиитом, микроскопический полиангиит),
        системная красная волчанка с нефритом, постинфекционный гломерулонефрит, IgA-нефропатия.
    red_flags:
    - condition: urine_protein >= 150 and urine_erythrocytes >= 5 and crp >= 30
      text: Протеинурия и гематурия вместе с выраженным воспалением — подозрение на быстропрогрессирующий
        гломерулонефрит. Требует срочной нефрологической консультации, промедление может привести к необратимой
        потере функции почек.
    treatment_hints:
    - step: ANCA (антитела к протеиназе-3 и миелопероксидазе)
      note: Ключевой тест для подтверждения/исключения АНЦА-ассоциированного васкулита, не входит в текущий
        набор параметров правила.
    - step: Креатинин и СКФ
      note: Оценка тяжести поражения почек на момент выявления.
    - step: Биопсия поражённого органа
      note: Обычно почки — для гистологического подтверждения и определения тактики иммуносупрессии.
    references:
    - KDIGO Clinical Practice Guideline on Glomerular Diseases
    - EULAR recommendations for ANCA-associated vasculitis
  acute_pancreatitis:
    id: acute_pancreatitis
    label: Острый панкреатит
    category: Гастроэнтерология
    description: Значительное повышение амилазы и/или липазы (диагностически значимо — превышение верхней
      границы нормы в 3 раза и более), характерное для острого панкреатита.
    criteria:
    - parameter: amylase
      threshold: 300
      unit: Ед/л
      condition: '>='
      comment_template: Амилаза {value} Ед/л. Менее специфична, чем липаза — может быть повышена при паротите,
        почечной недостаточности, кишечной непроходимости.
    - parameter: lipase
      threshold: 200
      unit: Ед/л
      condition: '>='
      comment_template: Липаза {value} Ед/л — более специфичный маркер панкреатита, чем амилаза.
    differentials:
    - condition: ''
      text: Желчнокаменный панкреатит (наиболее частая причина), алкогольный панкреатит, гипертриглицеридемический
        панкреатит, лекарственно-индуцированный, посттравматический/постЭРХПГ.
    red_flags:
    - condition: lipase > 600
      text: Значительно повышенная липаза — оценить тяжесть по шкале (Ranson, APACHE II или BISAP). Тяжёлый
        острый панкреатит может приводить к полиорганной недостаточности и требует наблюдения в условиях,
        готовых к интенсивной терапии.
    treatment_hints:
    - step: УЗИ брюшной полости в первую очередь
      note: Поиск желчных камней как наиболее частой устранимой причины.
    - step: КТ с контрастом при тяжёлом течении или отсутствии улучшения через 48-72ч
      note: Оценка панкреонекроза и осложнений.
    references:
    - IAP/APA evidence-based guidelines for acute pancreatitis
    - Revised Atlanta classification 2012
  alcoholic_liver_disease:
    id: alcoholic_liver_disease
    label: Алкогольная болезнь печени
    category: Гастроэнтерология
    description: Паттерн АСТ выше АЛТ (соотношение АСТ/АЛТ обычно > 2) с повышенной ГГТ на фоне подтверждённого
      употребления алкоголя — характерно для алкогольного поражения печени.
    criteria:
    - parameter: ggt
      threshold: 80
      unit: Ед/л
      condition: '>='
      comment_template: ГГТ {value} Ед/л — повышена, чувствительный, но не специфичный маркер алкогольного
        поражения печени.
    - parameter: ast
      threshold: 60
      unit: Ед/л
      condition: '>='
      comment_template: АСТ {value} Ед/л.
    - parameter: alt
      threshold: 40
      unit: Ед/л
      condition: '>='
      comment_template: АЛТ {value} Ед/л. Соотношение АСТ/АЛТ > 2 характерно для алкогольной этиологии
        — при вирусных гепатитах и НАЖБП обычно наоборот, АЛТ выше АСТ.
    - parameter: ethanol_blood
      threshold: 0.5
      unit: ‰
      condition: '>='
      comment_template: Этанол в крови {value}‰ — подтверждает недавнее употребление алкоголя.
    differentials:
    - condition: ''
      text: Неалкогольная жировая болезнь печени (НАЖБП), вирусные гепатиты, лекарственное поражение печени,
        гемохроматоз, дефицит альфа-1-антитрипсина.
    red_flags:
    - condition: ast > 200
      text: Значительно повышенная АСТ на фоне алкогольного анамнеза — оценить клинически тяжесть алкогольного
        гепатита (шкала Мэддрея с учётом билирубина и МНО), тяжёлые формы могут требовать кортикостероидной
        терапии.
    treatment_hints:
    - step: Полное прекращение употребления алкоголя
      note: Единственное вмешательство с доказанным влиянием на долгосрочный прогноз.
    - step: УЗИ печени
      note: Оценка стеатоза, признаков фиброза/цирроза.
    references:
    - 'AASLD Practice Guidance: Alcohol-Associated Liver Disease'
  cholelithiasis:
    id: cholelithiasis
    label: Желчнокаменная болезнь (возможный холедохолитиаз)
    category: Гастроэнтерология
    description: Умеренный холестатический лабораторный паттерн, который может указывать на камень в общем
      желчном протоке (холедохолитиаз) или иную обструкцию — при неосложнённой желчнокаменной болезни
      (камни только в желчном пузыре) лабораторные показатели часто остаются в норме.
    criteria:
    - parameter: bilirubin_total
      threshold: 21
      unit: мкмоль/л
      condition: '>='
      comment_template: Билирубин общий {value} мкмоль/л — умеренно повышен.
    - parameter: alkaline_phosphatase
      threshold: 130
      unit: Ед/л
      condition: '>='
      comment_template: Щелочная фосфатаза {value} Ед/л — повышена.
    - parameter: ggt
      threshold: 60
      unit: Ед/л
      condition: '>='
      comment_template: ГГТ {value} Ед/л — повышена, подтверждает печёночное происхождение.
    differentials:
    - condition: ''
      text: Холедохолитиаз (камень в общем желчном протоке — даёт эту лабораторную картину), острый холецистит,
        стриктура желчных путей, опухоль головки поджелудочной железы или желчных путей.
    red_flags:
    - condition: bilirubin_total > 50
      text: Значительно повышенный билирубин. Клинически проверить триаду Шарко (лихорадка + боль в правом
        подреберье + желтуха) — подозрение на восходящий холангит, экстренное состояние.
    treatment_hints:
    - step: УЗИ брюшной полости — метод первой линии
      note: Оценка камней в желчном пузыре и расширения протоков.
    - step: МРХПГ при подозрении на холедохолитиаз
      note: Неинвазивная альтернатива перед решением об ЭРХПГ.
    references:
    - ESGE/EASL Clinical Practice Guidelines on the management of gallstones
  chronic_pancreatitis:
    id: chronic_pancreatitis
    label: Хронический панкреатит (экзокринная недостаточность)
    category: Гастроэнтерология
    description: Сниженная фекальная эластаза-1 указывает на экзокринную недостаточность поджелудочной
      железы, часто вследствие хронического панкреатита.
    criteria:
    - parameter: pancreatic_elastase
      threshold: 200
      unit: мкг/г
      condition: <=
      comment_template: Фекальная эластаза-1 {value} мкг/г — снижена, признак экзокринной недостаточности
        поджелудочной железы.
    differentials:
    - condition: ''
      text: Хронический панкреатит (алкогольный, наследственный, аутоиммунный), муковисцидоз (у молодых
        пациентов), рак поджелудочной железы, состояние после резекции поджелудочной железы.
    red_flags:
    - condition: pancreatic_elastase < 100
      text: Тяжёлая экзокринная недостаточность. При отсутствии предшествующего анамнеза панкреатита,
        особенно у пациентов старшего возраста с необъяснимой потерей веса — важно исключить рак поджелудочной
        железы.
    treatment_hints:
    - step: КТ или МРТ поджелудочной железы
      note: 'Оценка структурных изменений: кальцификаты, атрофия паренхимы, расширение главного протока.'
    - step: Заместительная ферментная терапия при подтверждённой недостаточности
      note: Дозируется по клиническому ответу и стеаторее.
    references:
    - United European Gastroenterology evidence-based guidelines for chronic pancreatitis
  crohns_disease:
    id: crohns_disease
    label: Болезнь Крона
    category: Гастроэнтерология
    description: Повышенный фекальный кальпротектин вместе с системным воспалением (СРБ) и признаками
      хронической потери/мальабсорбции (сниженные альбумин, ферритин) — характерно для активного воспалительного
      заболевания кишечника, в частности болезни Крона (может поражать любой отдел ЖКТ, часто сегментарно).
    criteria:
    - parameter: fecal_calprotectin
      threshold: 120
      unit: мкг/г
      condition: '>='
      comment_template: Фекальный кальпротектин {value} мкг/г — повышен, маркер кишечного воспаления.
    - parameter: crp
      threshold: 10
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен, признак хронического воспаления и/или мальабсорбции.
    - parameter: ferritin
      threshold: 30
      unit: мкг/л
      condition: <=
      comment_template: Ферритин {value} мкг/л — снижен, возможен сопутствующий дефицит железа.
    differentials:
    - condition: ''
      text: Язвенный колит (непрерывное поражение только толстой кишки, в отличие от сегментарного поражения
        при Крона), инфекционный колит, ишемический колит, целиакия (может давать похожую картину мальабсорбции).
    red_flags:
    - condition: fecal_calprotectin > 500 and albumin < 30
      text: Высокий кальпротектин вместе с выраженной гипоальбуминемией — признак тяжёлого активного воспаления
        с нутритивным истощением, повышен риск осложнений (стриктуры, свищи, абсцессы).
    treatment_hints:
    - step: Колоноскопия с биопсией — золотой стандарт
      note: Подтверждение диагноза, определение локализации и протяжённости поражения. Кальпротектин полезен
        для мониторинга активности, не заменяет эндоскопию при первичной диагностике.
    - step: Исключить инфекционную причину перед иммуносупрессией
      note: Посев кала, токсин C. difficile.
    references:
    - ECCO Guidelines on the diagnosis and management of Crohn's disease
  ulcerative_colitis:
    id: ulcerative_colitis
    label: Язвенный колит
    category: Гастроэнтерология
    description: Повышенный фекальный кальпротектин вместе с системным воспалением (СРБ) и сниженным альбумином
      — характерно для активного язвенного колита (непрерывное поражение слизистой толстой кишки, начинается
      от прямой кишки).
    criteria:
    - parameter: fecal_calprotectin
      threshold: 120
      unit: мкг/г
      condition: '>='
      comment_template: Фекальный кальпротектин {value} мкг/г — повышен.
    - parameter: crp
      threshold: 10
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен.
    differentials:
    - condition: ''
      text: Болезнь Крона (сегментарное поражение, может затрагивать любой отдел ЖКТ, часто с образованием
        свищей — в отличие от непрерывного колитического поражения при НЯК), инфекционный колит, ишемический
        колит.
    red_flags:
    - condition: fecal_calprotectin > 500 and crp > 50
      text: Признаки тяжёлой атаки. При остром тяжёлом течении есть риск токсического мегаколона — жизнеугрожающего
        осложнения, требующего экстренной оценки.
    treatment_hints:
    - step: Колоноскопия с биопсией
      note: Подтверждение диагноза и оценка протяжённости поражения.
    - step: При тяжёлой атаке — критерии Truelove-Witts и госпитализация
      note: Внутривенная терапия, исключить C. difficile перед эскалацией иммуносупрессии.
    references:
    - ECCO Guidelines for the management of ulcerative colitis
  inflammatory_bowel_disease:
    id: inflammatory_bowel_disease
    label: Воспалительное заболевание кишечника (неуточнённое)
    category: Гастроэнтерология
    description: 'Обобщённый лабораторный паттерн кишечного воспаления (кальпротектин, альбумин, ферритин).
      Важно: в этой базе есть более специфичные правила `crohns_disease` и `ulcerative_colitis` с частично
      пересекающимися критериями — на практике диагноз ставится как одна из этих двух конкретных форм
      (или неклассифицируемый колит), а не как самостоятельная третья единица. Используйте это правило
      как сигнал «есть кишечное воспаление, нужна дифференциация», а не как отдельный диагноз.'
    criteria:
    - parameter: calprotectin
      threshold: 100
      unit: мкг/г
      condition: '>='
      comment_template: Кальпротектин {value} мкг/г — повышен, маркер кишечного воспаления.
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен.
    - parameter: ferritin
      threshold: 30
      unit: мкг/л
      condition: <=
      comment_template: Ферритин {value} мкг/л — снижен.
    differentials:
    - condition: ''
      text: Болезнь Крона, язвенный колит, неклассифицируемый колит, инфекционный колит (исключить в первую
        очередь при остром начале, особенно после антибиотикотерапии или путешествий).
    red_flags:
    - condition: calprotectin > 500
      text: Высокий кальпротектин — признак тяжёлого активного воспаления, требует своевременной эндоскопической
        оценки для классификации и определения тактики.
    treatment_hints:
    - step: Колоноскопия с биопсией
      note: Необходима для точной классификации (болезнь Крона vs язвенный колит) — от этого зависит тактика
        лечения.
    - step: Исключить инфекционную причину
      note: Посев кала, токсин C. difficile — до начала иммуносупрессивной терапии.
    references:
    - ECCO consensus guidelines on inflammatory bowel disease
