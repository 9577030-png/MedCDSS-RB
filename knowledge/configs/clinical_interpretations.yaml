nterpretations:
  diabetes_mellitus_type_2:
    id: diabetes_mellitus_type_2
    label: Сахарный диабет 2 типа
    category: Эндокринология
    description: Хроническое метаболическое заболевание, характеризующееся гипергликемией вследствие инсулинорезистентности
      и относительной инсулиновой недостаточности.
    criteria:
    - parameter: glucose
      threshold: 7.0
      unit: ммоль/л
      condition: '>='
      comment_template: 'Критерий выполнен. Уровень {value} ммоль/л превышает порог (≥ 7.0).

        {additional}

        '
      additional_rules:
      - condition: value < 11.1
        text: Риск кетоацидоза минимален.
      - condition: value >= 11.1
        text: ВЫСОКИЙ РИСК КЕТОАЦИДОЗА! Требуется срочное обследование (кетоны мочи/крови).
    - parameter: hba1c
      threshold: 6.5
      unit: '%'
      condition: '>='
      comment_template: 'Критерий выполнен. Уровень {value}% отражает среднюю гликемию за 2–3 месяца.

        Целевой уровень для пациентов < 65 лет: < 7.0%.

        {additional}

        '
      additional_rules:
      - condition: value >= 9.0
        text: ЗНАЧИТЕЛЬНОЕ ПОВЫШЕНИЕ. Требуется инсулинотерапия, монотерапия метформином неэффективна.
    - parameter: glucose_random
      threshold: 11.1
      unit: ммоль/л
      condition: '>='
      comment_template: 'Случайный уровень глюкозы {value} ммоль/л превышает порог (≥ 11.1). Является
        самостоятельным критерием диабета при наличии симптомов.

        '
      optional: true
    - parameter: c_peptide
      threshold_low: 0.8
      unit: нг/мл
      condition: '>= 0.8'
      comment_template: 'Уровень С-пептида {value} нг/мл {interpretation}

        '
      additional_rules:
      - condition: value < 0.8
        text: Снижение указывает на абсолютную инсулиновую недостаточность, характерно для СД1 или LADA.
      - condition: value >= 0.8
        text: Сохранная секреция инсулина – характерно для СД2.
    differentials:
    - condition: age < 45 AND c_peptide < 0.8
      text: Заподозрить LADA (латентный аутоиммунный диабет взрослых) или СД1 типа. Проверить антитела
        к GAD, IA-2, ZnT8.
    - condition: glucocorticoids_use == true
      text: Вторичный стероидный диабет. Отмена или снижение дозы ГКС может привести к нормализации гликемии.
    red_flags:
    - condition: hba1c > 9.0
      text: '**Высокий риск декомпенсации и осложнений.** Требуется немедленная коррекция терапии, рассмотреть
        старт инсулина.'
    - condition: glucose_fasting > 15.0
      text: '**Угроза гиперосмолярного состояния.** Срочно проверить осмолярность, кетоны, электролиты.'
    - condition: age > 65 AND hba1c < 6.5
      text: Пожилой возраст + низкий HbA1c – возможны частые гипогликемии. Пересмотреть целевые уровни
        (индивидуализация).
    treatment_hints:
    - step: Метформин 500 мг × 2 раза в день
      note: Титровать до 2000 мг/сут при нормальной СКФ (> 30 мл/мин). Препарат выбора при СД2 и ожирении.
    - step: Скрининг осложнений
      note: 'Обязательно: микроальбуминурия, липидный профиль (ЛПНП), осмотр офтальмолога, консультация
        невролога.'
    - step: Обучение самоконтролю
      note: 'Измерение глюкозы натощак и через 2 часа после еды. Цели: натощак 4.0–7.0, через 2 часа <
        10.0.'
    - step: Контроль HbA1c
      note: Через 3 месяца после старта терапии, далее 1 раз в 3–6 месяцев.
    references:
    - ADA Standards of Medical Care in Diabetes 2025
    - Алгоритмы специализированной медицинской помощи больным сахарным диабетом (2024)
  iron_deficiency:
    id: iron_deficiency
    label: Железодефицитная анемия
    category: Гематология
    description: Анемия, обусловленная недостатком железа в организме, ведущая к нарушению синтеза гемоглобина.
    criteria:
    - parameter: hemoglobin
      unit: г/Л
      comment_template: 'Уровень {value} г/Л. Степень анемии: {severity}.

        {additional}

        '
      severity_mapping:
      - range: '>= 120'
        label: норма (для женщин)
      - range: 110-119
        label: легкая
      - range: 80-109
        label: умеренная
      - range: < 80
        label: тяжелая
      additional_rules:
      - condition: gender == 'female' AND value < 120
        text: 'Критерий анемии для женщин (ВОЗ: < 120 г/Л).'
      - condition: gender == 'male' AND value < 130
        text: 'Критерий анемии для мужчин (ВОЗ: < 130 г/Л).'
    - parameter: ferritin
      threshold: 15
      unit: мкг/Л
      condition: <
      comment_template: 'Уровень ферритина {value} мкг/Л.

        {interpretation}

        '
      additional_rules:
      - condition: value < 15
        text: Абсолютный дефицит железа в депо. Подтверждает этиологию ЖДА.
      - condition: 15 <= value < 30
        text: Снижение запасов железа (латентный дефицит). Возможна ЖДА при наличии снижения гемоглобина.
      - condition: value >= 100
        text: Ферритин повышен – исключает дефицит железа. Вероятна анемия хронического воспаления или
          болезни накопления.
    - parameter: mcv
      threshold: 80
      unit: фл
      condition: <
      comment_template: 'MCV {value} фл.

        {interpretation}

        '
      additional_rules:
      - condition: value < 80
        text: Микроцитоз – характерен для ЖДА (и талассемии).
      - condition: value >= 80
        text: Нормоцитоз или макроцитоз – не характерен для ЖДА. Требуется пересмотр гипотезы (B12, фолаты,
          ХЗП).
      optional: true
    differentials:
    - condition: ferritin > 100 AND crp > 5
      text: Анемия хронического воспаления (АХВ). Ферритин высокий, CRP повышен. Проверить трансферрин,
        железо сыворотки.
    - condition: mcv < 75 AND erythrocytes > 5.0
      text: Талассемия (особенно малая). Исследовать гемоглобин A2 и F.
    - condition: hemoglobin < 100 AND reticulocytes < 1%
      text: Апластическая анемия или гипоплазия костного мозга. Провести стернальную пункцию.
    red_flags:
    - condition: gender == 'male' AND hemoglobin < 110
      text: У мужчин анемия любой степени требует исключения скрытого кровотечения (ЖКТ). Провести колоноскопию,
        ФГДС.
    - condition: age > 50 AND hemoglobin < 100
      text: У пациентов старше 50 лет – риск онкозаболеваний. Обязательно исключить колоректальный рак,
        рак желудка.
    - condition: ferritin < 15 AND hb < 80
      text: Критическая анемия на фоне истощения запасов. Рассмотреть парентеральное введение железа (в/в),
        а не пероральное.
    treatment_hints:
    - step: Пероральные препараты железа
      note: Доза элементарного железа 100–200 мг/сут (например, железа сульфат 325 мг × 2–3 р/д). Добавить
        витамин С 500 мг для улучшения всасывания.
    - step: Контроль эффективности
      note: Ретикулоциты через 7 дней – их подъём (>1%) подтверждает ответ на терапию. Hb контроль через
        4 недели.
    - step: Если нет ответа через 2 недели
      note: 'Пересмотреть диагноз: возможна мальабсорбция (целиакия, атрофический гастрит), продолжающаяся
        кровопотеря, или нарушение комплаенса.'
    - step: Парентеральное железо
      note: При непереносимости пероральных препаратов, тяжелой анемии (Hb < 70), ХБП – назначают в/в
        железо (например, карбоксимальтозат).
    references:
    - WHO guideline on haemoglobin cutoffs to define anaemia (2024)
    - Клинические рекомендации по железодефицитной анемии (Россия, 2023)
  anemia_male:
    id: anemia_male
    label: Анемия (мужчины)
    category: Общие лабораторные показатели
    description: Гемоглобин ниже критерия ВОЗ для мужчин.
    criteria:
    - parameter: hemoglobin
      threshold: 130
      unit: г/Л
      condition: <=
      comment_template: Гемоглобин {value} г/Л — ниже нормы (критерий ВОЗ).
    differentials:
    - condition: ''
      text: Железодефицитная анемия (наиболее частая, см. `ferritin_low_male`), анемия хронического заболевания,
        В12-/фолат-дефицитная анемия (макроцитарная, см. `macrocytic_anemia`), гемолитическая анемия,
        кровопотеря (у мужчин без очевидной причины — в первую очередь исключить источник в ЖКТ).
    red_flags:
    - condition: hemoglobin <= 70
      text: Тяжёлая анемия — оценить необходимость трансфузии в зависимости от остроты развития и клинической
        переносимости.
    treatment_hints:
    - step: MCV, ферритин, B12, фолаты
      note: Определяют морфологический тип анемии и направление дальнейшего поиска.
    references:
    - WHO haemoglobin thresholds for the diagnosis of anaemia
  anemia_female:
    id: anemia_female
    label: Анемия (женщины)
    category: Общие лабораторные показатели
    description: Гемоглобин ниже критерия ВОЗ для женщин.
    criteria:
    - parameter: hemoglobin
      threshold: 120
      unit: г/Л
      condition: <=
      comment_template: Гемоглобин {value} г/Л — ниже нормы (критерий ВОЗ).
    differentials:
    - condition: ''
      text: Железодефицитная анемия (наиболее частая, часто вследствие менструальной кровопотери — см.
        `ferritin_low_female`), анемия хронического заболевания, В12-/фолат-дефицитная анемия, гемолитическая
        анемия.
    red_flags:
    - condition: hemoglobin <= 70
      text: Тяжёлая анемия — оценить необходимость трансфузии.
    treatment_hints:
    - step: MCV, ферритин, B12, фолаты
      note: Определяют тип анемии и направление поиска.
    references:
    - WHO haemoglobin thresholds for the diagnosis of anaemia
  hypothyroidism:
    id: hypothyroidism
    label: Гипотиреоз
    category: Общие лабораторные показатели
    description: ТТГ выше нормы — указывает на сниженную функцию щитовидной железы (при первичном гипотиреозе).
    criteria:
    - parameter: tsh
      threshold: 4.0
      unit: мМЕ/л
      condition: '>='
      comment_template: ТТГ {value} мМЕ/л — повышен.
    differentials:
    - condition: ''
      text: Аутоиммунный тиреоидит Хашимото (наиболее частая причина), послеоперационный/пострадиационный
        гипотиреоз, приём амиодарона/лития, субклинический гипотиреоз (изолированно повышенный ТТГ при
        нормальном свободном Т4).
    red_flags:
    - condition: tsh > 10
      text: Значительно повышенный ТТГ — как правило, показание для начала заместительной терапии левотироксином
        даже при отсутствии выраженных симптомов.
    treatment_hints:
    - step: Свободный Т4, антитела к ТПО
      note: Т4 разделяет субклинический и манифестный гипотиреоз; антитела к ТПО подтверждают аутоиммунную
        этиологию.
    - step: Титрация левотироксина под контролем ТТГ
      note: Контроль через 6-8 недель после начала/изменения дозы.
    references:
    - ATA Guidelines for the treatment of hypothyroidism
  hyperthyroidism:
    id: hyperthyroidism
    label: Гипертиреоз
    category: Общие лабораторные показатели
    description: ТТГ ниже нормы — указывает на избыточную функцию щитовидной железы (при первичном гипертиреозе)
      или подавление ТТГ по другой причине.
    criteria:
    - parameter: tsh
      threshold: 0.4
      unit: мМЕ/л
      condition: <=
      comment_template: ТТГ {value} мМЕ/л — снижен.
    differentials:
    - condition: ''
      text: Болезнь Грейвса (диффузный токсический зоб), токсическая аденома, многоузловой токсический
        зоб, подострый тиреоидит (транзиторный тиреотоксикоз), избыточный приём препаратов левотироксина.
    red_flags:
    - condition: ''
      text: Клинически проверить симптомы тиреотоксического криза (лихорадка, тахиаритмия, спутанность
        сознания) — редкое, но жизнеугрожающее осложнение, требует экстренной помощи.
    treatment_hints:
    - step: Свободный Т4, Т3, антитела к рецепторам ТТГ
      note: Подтверждение диагноза и определение этиологии (антитела к рецепторам ТТГ — при болезни Грейвса).
    - step: Сцинтиграфия щитовидной железы
      note: Помогает различить болезнь Грейвса, токсическую аденому и тиреоидит по характеру захвата.
    references:
    - ATA/AACE Guidelines for hyperthyroidism and other causes of thyrotoxicosis
  vitamin_d_deficiency:
    id: vitamin_d_deficiency
    label: Дефицит витамина D
    category: Общие лабораторные показатели
    description: 25(OH)D ниже нормы. В этой базе также есть более детализированное правило `vitamin_d_deficiency_severe`
      (специальность «Витамины») с более строгим порогом — оба ориентированы на один и тот же лабораторный
      показатель, используйте более специфичное правило там, где доступно.
    criteria:
    - parameter: vitamin_d_25oh
      threshold: 30
      unit: нг/мл
      condition: <=
      comment_template: 25(OH)D {value} нг/мл — ниже нормы.
    differentials:
    - condition: ''
      text: Недостаточная инсоляция, недостаточное питание, синдромы мальабсорбции, ожирение, ХБП. См.
        также `osteomalacia` при сопутствующих изменениях кальция/фосфата/ЩФ.
    red_flags:
    - condition: vitamin_d_25oh <= 10
      text: Выраженный дефицит — оценить кальций, фосфат, ПТГ для исключения нарушений минерализации костей.
    treatment_hints:
    - step: Колекальциферол перорально
      note: Стартовая доза 2000-5000 МЕ/сут в течение 2-3 месяцев, затем поддерживающая доза 800-2000
        МЕ/сут — по решению врача, с учётом исходного уровня и сопутствующих состояний.
    references:
    - Endocrine Society Clinical Practice Guideline for Vitamin D deficiency
  hypertension:
    id: hypertension
    label: Артериальная гипертензия
    category: Общие лабораторные показатели
    description: Систолическое АД выше порога, требует подтверждения повторными измерениями/суточным мониторированием
      перед постановкой диагноза.
    criteria:
    - parameter: blood_pressure_systolic
      threshold: 140
      unit: мм рт. ст.
      condition: '>='
      comment_template: Систолическое АД {value} мм рт. ст. — повышено.
    differentials:
    - condition: ''
      text: Эссенциальная (первичная) гипертензия — наиболее частая причина. Вторичная гипертензия (заболевания
        почек, эндокринные причины — гиперальдостеронизм, феохромоцитома, синдром Кушинга; апноэ сна)
        — заподозрить при резистентной к терапии или дебютировавшей в молодом возрасте гипертензии.
    red_flags:
    - condition: blood_pressure_systolic >= 180
      text: Гипертонический криз — при наличии признаков поражения органов-мишеней (энцефалопатия, отёк
        лёгких, острый коронарный синдром, расслоение аорты) требует немедленного вмешательства.
    treatment_hints:
    - step: Подтвердить повторными измерениями или СМАД
      note: Однократное измерение недостаточно для диагноза, в т.ч. из-за «гипертензии белого халата».
    - step: Модификация образа жизни как основа терапии
      note: Снижение соли, вес, физическая активность.
    references:
    - ESC/ESH Guidelines for the management of arterial hypertension
  hypercholesterolemia:
    id: hypercholesterolemia
    label: Гиперхолестеринемия (повышенный ЛПНП)
    category: Общие лабораторные показатели
    description: ЛПНП выше порога, ассоциированного с повышенным сердечно-сосудистым риском. Целевой уровень
      зависит от индивидуального сердечно-сосудистого риска пациента, а не является единым для всех.
    criteria:
    - parameter: ldl_cholesterol
      threshold: 3.0
      unit: ммоль/л
      condition: '>='
      comment_template: ЛПНП {value} ммоль/л — повышен.
    differentials:
    - condition: ''
      text: Первичная (полигенная или семейная) гиперхолестеринемия, вторичная (гипотиреоз, нефротический
        синдром, холестаз, приём некоторых препаратов).
    red_flags:
    - condition: ldl_cholesterol >= 5.0
      text: Значительно повышенный ЛПНП, особенно у молодых пациентов или с семейным анамнезом раннего
        сердечно-сосудистого заболевания — заподозрить семейную гиперхолестеринемию.
    treatment_hints:
    - step: Оценка общего сердечно-сосудистого риска (SCORE2 или аналог)
      note: Целевой уровень ЛПНП и решение о статинотерапии определяются суммарным риском, не изолированной
        цифрой.
    - step: ТТГ
      note: Исключить вторичную причину — гипотиреоз.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  hypertriglyceridemia:
    id: hypertriglyceridemia
    label: Гипертриглицеридемия
    category: Общие лабораторные показатели
    description: Триглицериды выше нормы — фактор риска атеросклероза, при очень высоких значениях — панкреатита.
    criteria:
    - parameter: triglycerides
      threshold: 1.7
      unit: ммоль/л
      condition: '>='
      comment_template: Триглицериды {value} ммоль/л — повышены.
    differentials:
    - condition: ''
      text: Метаболический синдром, сахарный диабет 2 типа, ожирение, злоупотребление алкоголем, гипотиреоз,
        приём некоторых препаратов (эстрогены, кортикостероиды). Реже — наследственные формы гипертриглицеридемии.
    red_flags:
    - condition: triglycerides > 10
      text: Значительно повышенные триглицериды — существенный риск острого панкреатита, требует активной
        медикаментозной коррекции (фибраты) независимо от сердечно-сосудистого риска.
    treatment_hints:
    - step: Исключить вторичные причины
      note: Гликемический контроль, ТТГ, алкогольный анамнез.
    - step: Диета с ограничением простых углеводов и алкоголя
      note: Первая линия при умеренном повышении.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  low_hdl_male:
    id: low_hdl_male
    label: Низкий ХС ЛПВП (мужчины)
    category: Общие лабораторные показатели
    description: ЛПВП ниже нормы для мужчин — независимый фактор сердечно-сосудистого риска.
    criteria:
    - parameter: hdl_cholesterol
      threshold: 1.0
      unit: ммоль/л
      condition: <=
      comment_template: ЛПВП {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: Метаболический синдром, ожирение, курение, малоподвижный образ жизни, сахарный диабет 2 типа.
        Реже — генетические причины.
    red_flags:
    - condition: ''
      text: Оценивать в комплексе с общим сердечно-сосудистым риском, а не изолированно — низкий ЛПВП
        сам по себе не является терапевтической мишенью для медикаментозной коррекции по современным рекомендациям.
    treatment_hints:
    - step: Физическая активность, отказ от курения, снижение веса
      note: Наиболее эффективные вмешательства для повышения ЛПВП.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  low_hdl_female:
    id: low_hdl_female
    label: Низкий ХС ЛПВП (женщины)
    category: Общие лабораторные показатели
    description: ЛПВП ниже нормы для женщин.
    criteria:
    - parameter: hdl_cholesterol
      threshold: 1.2
      unit: ммоль/л
      condition: <=
      comment_template: ЛПВП {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: Метаболический синдром, ожирение, курение, малоподвижный образ жизни, сахарный диабет 2 типа.
    red_flags:
    - condition: ''
      text: Оценивать в комплексе с общим сердечно-сосудистым риском.
    treatment_hints:
    - step: Физическая активность, отказ от курения, снижение веса
      note: Наиболее эффективные вмешательства.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  obesity:
    id: obesity
    label: Ожирение
    category: Общие лабораторные показатели
    description: Индекс массы тела в диапазоне ожирения.
    criteria:
    - parameter: bmi
      threshold: 30
      unit: кг/м²
      condition: '>='
      comment_template: ИМТ {value} кг/м² — ожирение.
    differentials:
    - condition: ''
      text: Алиментарное ожирение (наиболее частое), вторичное ожирение (гипотиреоз, синдром Кушинга,
        приём некоторых психотропных препаратов). ИМТ не различает жировую и мышечную массу — у спортсменов
        может быть завышен.
    red_flags:
    - condition: bmi >= 40
      text: Морбидное ожирение — существенно повышенный риск сердечно-сосудистых осложнений, сахарного
        диабета, апноэ сна; рассмотреть направление на оценку бариатрической хирургии при неэффективности
        консервативных мер.
    treatment_hints:
    - step: Оценить метаболические осложнения
      note: Глюкоза/HbA1c, липидный профиль, АД, скрининг апноэ сна.
    - step: Модификация образа жизни как первая линия
      note: Дефицит калорий, физическая активность 150-300 мин/нед.
    references:
    - WHO obesity and overweight guidelines
  chronic_kidney_disease:
    id: chronic_kidney_disease
    label: Хроническая болезнь почек
    category: Общие лабораторные показатели
    description: СКФ ниже 60 мл/мин/1.73м². Требует подтверждения стойкости снижения (повторное измерение
      через ≥3 месяца) для формального диагноза ХБП. В этой базе есть более детальные правила по стадиям
      (`ckd_stage3`, `ckd_stage4`, `ckd_stage5`) и связанная логика исключений в `clinical_logic.yaml`.
    criteria:
    - parameter: egfr
      threshold: 60
      unit: мл/мин/1.73м²
      condition: <=
      comment_template: СКФ {value} мл/мин/1.73м² — снижена.
    differentials:
    - condition: ''
      text: Диабетическая нефропатия, гипертензивная нефропатия, гломерулонефриты, поликистоз почек, обструктивная
        уропатия. Острое снижение СКФ (без предшествующего анамнеза) — сначала исключить острое повреждение
        почек, а не сразу трактовать как хроническое.
    red_flags:
    - condition: egfr <= 15
      text: Терминальная стадия почечной недостаточности — см. `ckd_stage5`, требует срочной нефрологической
        помощи и обсуждения заместительной почечной терапии.
    treatment_hints:
    - step: Оценка протеинурии
      note: Соотношение альбумин/креатинин мочи — важно для стадирования и прогноза наравне со СКФ.
    - step: Контроль АД, иАПФ/БРА
      note: Нефропротективная терапия при наличии протеинурии.
    - step: Повторный контроль СКФ через 3 месяца
      note: Для подтверждения хронического, а не острого характера снижения.
    references:
    - KDIGO Clinical Practice Guideline for the Evaluation and Management of CKD
  creatinine_high_male:
    id: creatinine_high_male
    label: Повышенный креатинин (мужчины)
    category: Общие лабораторные показатели
    description: Креатинин выше нормы для мужчин.
    criteria:
    - parameter: creatinine
      threshold: 115
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Острое повреждение почек, хроническая болезнь почек (см. `chronic_kidney_disease`), преренальные
        причины (обезвоживание, снижение перфузии почек), постренальная обструкция.
    red_flags:
    - condition: creatinine > 300
      text: Значительное повышение — оценить СКФ, электролиты (особенно калий), исключить постренальную
        обструкцию (УЗИ почек).
    treatment_hints:
    - step: СКФ, мочевина, электролиты
      note: Оценка степени и остроты почечной дисфункции.
    references:
    - KDIGO Clinical Practice Guideline for Acute Kidney Injury
  creatinine_high_female:
    id: creatinine_high_female
    label: Повышенный креатинин (женщины)
    category: Общие лабораторные показатели
    description: Креатинин выше нормы для женщин.
    criteria:
    - parameter: creatinine
      threshold: 97
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Острое повреждение почек, хроническая болезнь почек, преренальные причины, постренальная обструкция.
    red_flags:
    - condition: creatinine > 300
      text: Значительное повышение — оценить СКФ, электролиты, исключить постренальную обструкцию.
    treatment_hints:
    - step: СКФ, мочевина, электролиты
      note: Оценка степени и остроты почечной дисфункции.
    references:
    - KDIGO Clinical Practice Guideline for Acute Kidney Injury
  alt_high_male:
    id: alt_high_male
    label: Повышенная АЛТ (мужчины)
    category: Общие лабораторные показатели
    description: АЛТ выше нормы для мужчин.
    criteria:
    - parameter: alt
      threshold: 45
      unit: Ед/л
      condition: '>='
      comment_template: АЛТ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Неалкогольная жировая болезнь печени (наиболее частая причина изолированного повышения АЛТ),
        вирусные гепатиты, лекарственное поражение печени, алкогольное поражение печени (обычно АСТ>АЛТ,
        см. `alcoholic_liver_disease`).
    red_flags:
    - condition: alt > 200
      text: Значительное повышение — расширить обследование (см. также `acute_hepatitis`).
    treatment_hints:
    - step: АСТ, ГГТ, щелочная фосфатаза, билирубин
      note: Полная печёночная панель для определения паттерна поражения.
    references:
    - Общие рекомендации по интерпретации печёночных проб
  alt_high_female:
    id: alt_high_female
    label: Повышенная АЛТ (женщины)
    category: Общие лабораторные показатели
    description: АЛТ выше нормы для женщин.
    criteria:
    - parameter: alt
      threshold: 35
      unit: Ед/л
      condition: '>='
      comment_template: АЛТ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Неалкогольная жировая болезнь печени, вирусные гепатиты, лекарственное поражение печени, алкогольное
        поражение печени.
    red_flags:
    - condition: alt > 200
      text: Значительное повышение — расширить обследование (см. также `acute_hepatitis`).
    treatment_hints:
    - step: АСТ, ГГТ, щелочная фосфатаза, билирубин
      note: Полная печёночная панель.
    references:
    - Общие рекомендации по интерпретации печёночных проб
  ast_high_male:
    id: ast_high_male
    label: Повышенная АСТ (мужчины)
    category: Общие лабораторные показатели
    description: АСТ выше нормы для мужчин. Менее специфична для печени, чем АЛТ — присутствует также
      в мышцах и сердце.
    criteria:
    - parameter: ast
      threshold: 40
      unit: Ед/л
      condition: '>='
      comment_template: АСТ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Поражение печени (см. АЛТ для сравнения), поражение мышц (рабдомиолиз, интенсивная физическая
        нагрузка), поражение сердца (инфаркт миокарда).
    red_flags:
    - condition: ast > 200
      text: Значительное повышение — сопоставить с АЛТ и клинической картиной (печень vs мышцы vs сердце).
    treatment_hints:
    - step: АЛТ, КФК
      note: Соотношение АСТ/АЛТ и КФК помогают различить печёночное и мышечное происхождение.
    references:
    - Общие рекомендации по интерпретации печёночных проб
  ast_high_female:
    id: ast_high_female
    label: Повышенная АСТ (женщины)
    category: Общие лабораторные показатели
    description: АСТ выше нормы для женщин.
    criteria:
    - parameter: ast
      threshold: 32
      unit: Ед/л
      condition: '>='
      comment_template: АСТ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Поражение печени, поражение мышц, поражение сердца.
    red_flags:
    - condition: ast > 200
      text: Значительное повышение — сопоставить с АЛТ и клинической картиной.
    treatment_hints:
    - step: АЛТ, КФК
      note: Для дифференциации происхождения повышения.
    references:
    - Общие рекомендации по интерпретации печёночных проб
  ggt_high_male:
    id: ggt_high_male
    label: Повышенная ГГТ (мужчины)
    category: Общие лабораторные показатели
    description: ГГТ выше нормы для мужчин. Чувствительный, но не специфичный маркер — повышается при
      холестазе, алкогольном поражении печени, приёме некоторых лекарств, даже без значимого поражения
      печени.
    criteria:
    - parameter: ggt
      threshold: 71
      unit: Ед/л
      condition: '>='
      comment_template: ГГТ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Холестаз (см. `cholestasis`), алкогольное поражение печени (см. `alcoholic_liver_disease`),
        лекарственная индукция ферментов (противосудорожные и др.), стеатоз печени.
    red_flags:
    - condition: ggt > 300
      text: Значительное повышение — сопоставить со щелочной фосфатазой и билирубином для оценки холестатического
        паттерна.
    treatment_hints:
    - step: Щелочная фосфатаза, билирубин
      note: Для оценки холестатического паттерна поражения печени.
    references:
    - Общие рекомендации по интерпретации печёночных проб
  ggt_high_female:
    id: ggt_high_female
    label: Повышенная ГГТ (женщины)
    category: Общие лабораторные показатели
    description: ГГТ выше нормы для женщин.
    criteria:
    - parameter: ggt
      threshold: 42
      unit: Ед/л
      condition: '>='
      comment_template: ГГТ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Холестаз, алкогольное поражение печени, лекарственная индукция ферментов, стеатоз печени.
    red_flags:
    - condition: ggt > 300
      text: Значительное повышение — сопоставить со щелочной фосфатазой и билирубином.
    treatment_hints:
    - step: Щелочная фосфатаза, билирубин
      note: Для оценки холестатического паттерна.
    references:
    - Общие рекомендации по интерпретации печёночных проб
  ferritin_low_male:
    id: ferritin_low_male
    label: Сниженный ферритин (мужчины)
    category: Общие лабораторные показатели
    description: Ферритин ниже нормы для мужчин — надёжный маркер истощения запасов железа (в отличие
      от повышенного, который менее специфичен).
    criteria:
    - parameter: ferritin
      threshold: 30
      unit: мкг/Л
      condition: <=
      comment_template: Ферритин {value} мкг/Л — снижен.
    differentials:
    - condition: ''
      text: Железодефицитная анемия. У мужчин низкий ферритин без явной причины питания требует поиска
        источника хронической кровопотери (чаще ЖКТ).
    red_flags:
    - condition: ferritin <= 10
      text: Выраженное истощение запасов железа — у мужчин без очевидной причины показано обследование
        ЖКТ (колоноскопия/гастроскопия) для исключения источника скрытой кровопотери.
    treatment_hints:
    - step: Железо сыворотки, ОЖСС, гемоглобин
      note: Полная картина статуса железа.
    references:
    - Общие рекомендации по диагностике железодефицита
  ferritin_low_female:
    id: ferritin_low_female
    label: Сниженный ферритин (женщины)
    category: Общие лабораторные показатели
    description: Ферритин ниже нормы для женщин.
    criteria:
    - parameter: ferritin
      threshold: 15
      unit: мкг/Л
      condition: <=
      comment_template: Ферритин {value} мкг/Л — снижен.
    differentials:
    - condition: ''
      text: Железодефицитная анемия — у женщин репродуктивного возраста часто вследствие менструальной
        кровопотери. В постменопаузе или при отсутствии объяснимой причины — оценить источник кровопотери,
        включая ЖКТ.
    red_flags:
    - condition: ferritin <= 10
      text: Выраженное истощение запасов железа.
    treatment_hints:
    - step: Железо сыворотки, ОЖСС, гемоглобин
      note: Полная картина статуса железа.
    references:
    - Общие рекомендации по диагностике железодефицита
  ferritin_high_male:
    id: ferritin_high_male
    label: Повышенный ферритин (мужчины)
    category: Общие лабораторные показатели
    description: Ферритин выше нормы для мужчин. Острофазовый белок — повышается при воспалении независимо
      от статуса железа, интерпретировать с осторожностью.
    criteria:
    - parameter: ferritin
      threshold: 400
      unit: мкг/Л
      condition: '>='
      comment_template: Ферритин {value} мкг/Л — повышен.
    differentials:
    - condition: ''
      text: Воспаление/острофазовая реакция (наиболее частая причина), заболевания печени, гемохроматоз
        (при значительно повышенном насыщении трансферрина), метаболический синдром.
    red_flags:
    - condition: ferritin > 1000
      text: 'Очень высокий ферритин — расширенный поиск: гемохроматоз, гемофагоцитарный синдром (при соответствующей
        клинике), тяжёлое воспаление/инфекция.'
    treatment_hints:
    - step: Насыщение трансферрина, печёночные пробы, СРБ
      note: Разделяет перегрузку железом, воспаление и заболевание печени.
    references:
    - Общие рекомендации по диагностике гиперферритинемии
  ferritin_high_female:
    id: ferritin_high_female
    label: Повышенный ферритин (женщины)
    category: Общие лабораторные показатели
    description: Ферритин выше нормы для женщин.
    criteria:
    - parameter: ferritin
      threshold: 150
      unit: мкг/Л
      condition: '>='
      comment_template: Ферритин {value} мкг/Л — повышен.
    differentials:
    - condition: ''
      text: Воспаление/острофазовая реакция, заболевания печени, метаболический синдром, реже — гемохроматоз.
    red_flags:
    - condition: ferritin > 1000
      text: Очень высокий ферритин — расширенный поиск причины.
    treatment_hints:
    - step: Насыщение трансферрина, печёночные пробы, СРБ
      note: Разделяет возможные причины.
    references:
    - Общие рекомендации по диагностике гиперферритинемии
  serum_iron_low_male:
    id: serum_iron_low_male
    label: Сниженное железо сыворотки (мужчины)
    category: Общие лабораторные показатели
    description: Железо сыворотки ниже нормы для мужчин. Само по себе более изменчиво в течение суток,
      чем ферритин — интерпретировать вместе с ферритином и ОЖСС.
    criteria:
    - parameter: serum_iron
      threshold: 11
      unit: мкмоль/л
      condition: <=
      comment_template: Железо сыворотки {value} мкмоль/л — снижено.
    differentials:
    - condition: ''
      text: Железодефицит (см. `ferritin_low_male`), анемия хронического заболевания (при которой ферритин
        может быть нормальным/повышенным при низком железе сыворотки — важное отличие от истинного дефицита).
    red_flags:
    - condition: ''
      text: У мужчин без явной причины — рассмотреть источник хронической кровопотери (чаще ЖКТ).
    treatment_hints:
    - step: Ферритин, ОЖСС, насыщение трансферрина
      note: Для разделения истинного дефицита железа и анемии хронического заболевания.
    references:
    - Общие рекомендации по диагностике железодефицита
  serum_iron_low_female:
    id: serum_iron_low_female
    label: Сниженное железо сыворотки (женщины)
    category: Общие лабораторные показатели
    description: Железо сыворотки ниже нормы для женщин.
    criteria:
    - parameter: serum_iron
      threshold: 9
      unit: мкмоль/л
      condition: <=
      comment_template: Железо сыворотки {value} мкмоль/л — снижено.
    differentials:
    - condition: ''
      text: Железодефицит (см. `ferritin_low_female`), анемия хронического заболевания.
    red_flags:
    - condition: ''
      text: При отсутствии явной причины (менструальная кровопотеря) — рассмотреть дополнительный поиск
        источника.
    treatment_hints:
    - step: Ферритин, ОЖСС, насыщение трансферрина
      note: Для разделения причин.
    references:
    - Общие рекомендации по диагностике железодефицита
  serum_iron_high_male:
    id: serum_iron_high_male
    label: Повышенное железо сыворотки (мужчины)
    category: Общие лабораторные показатели
    description: Железо сыворотки выше нормы для мужчин.
    criteria:
    - parameter: serum_iron
      threshold: 30
      unit: мкмоль/л
      condition: '>='
      comment_template: Железо сыворотки {value} мкмоль/л — повышено.
    differentials:
    - condition: ''
      text: Гемохроматоз, гемолиз, недавняя трансфузия крови, передозировка препаратов железа.
    red_flags:
    - condition: ''
      text: Стойкое повышение без явной причины — оценить насыщение трансферрина и ферритин для исключения
        гемохроматоза.
    treatment_hints:
    - step: Насыщение трансферрина, ферритин
      note: Насыщение трансферрина >45% — показание для дальнейшего обследования на гемохроматоз.
    references:
    - Общие рекомендации по диагностике перегрузки железом
  serum_iron_high_female:
    id: serum_iron_high_female
    label: Повышенное железо сыворотки (женщины)
    category: Общие лабораторные показатели
    description: Железо сыворотки выше нормы для женщин.
    criteria:
    - parameter: serum_iron
      threshold: 27
      unit: мкмоль/л
      condition: '>='
      comment_template: Железо сыворотки {value} мкмоль/л — повышено.
    differentials:
    - condition: ''
      text: Гемохроматоз (у женщин часто проявляется позже, чем у мужчин, из-за менструальных потерь железа),
        гемолиз, недавняя трансфузия, передозировка препаратов железа.
    red_flags:
    - condition: ''
      text: Стойкое повышение без явной причины — оценить насыщение трансферрина и ферритин.
    treatment_hints:
    - step: Насыщение трансферрина, ферритин
      note: Для исключения гемохроматоза.
    references:
    - Общие рекомендации по диагностике перегрузки железом
  rbc_low_male:
    id: rbc_low_male
    label: Сниженные эритроциты (мужчины)
    category: Общие лабораторные показатели
    description: Эритроциты ниже нормы для мужчин.
    criteria:
    - parameter: rbc
      threshold: 4.3
      unit: ×10¹²/Л
      condition: <=
      comment_template: Эритроциты {value} ×10¹²/Л — снижены.
    differentials:
    - condition: ''
      text: См. дифдиагноз анемии (`anemia_male`).
    red_flags:
    - condition: ''
      text: Интерпретировать вместе с гемоглобином и MCV — изолированное снижение эритроцитов без учёта
        остальных показателей неполно характеризует анемию.
    treatment_hints:
    - step: Гемоглобин, MCV, ферритин, B12, фолаты
      note: Полная картина.
    references:
    - Общие рекомендации по диагностике анемий
  rbc_low_female:
    id: rbc_low_female
    label: Сниженные эритроциты (женщины)
    category: Общие лабораторные показатели
    description: Эритроциты ниже нормы для женщин.
    criteria:
    - parameter: rbc
      threshold: 3.8
      unit: ×10¹²/Л
      condition: <=
      comment_template: Эритроциты {value} ×10¹²/Л — снижены.
    differentials:
    - condition: ''
      text: См. дифдиагноз анемии (`anemia_female`).
    red_flags:
    - condition: ''
      text: Интерпретировать вместе с гемоглобином и MCV.
    treatment_hints:
    - step: Гемоглобин, MCV, ферритин, B12, фолаты
      note: Полная картина.
    references:
    - Общие рекомендации по диагностике анемий
  rbc_high_male:
    id: rbc_high_male
    label: Повышенные эритроциты (мужчины)
    category: Общие лабораторные показатели
    description: Эритроциты выше нормы для мужчин.
    criteria:
    - parameter: rbc
      threshold: 5.7
      unit: ×10¹²/Л
      condition: '>='
      comment_template: Эритроциты {value} ×10¹²/Л — повышены.
    differentials:
    - condition: ''
      text: См. дифдиагноз полицитемии (`polycythemia`).
    red_flags:
    - condition: ''
      text: Сопоставить с гематокритом и гемоглобином для полной картины.
    treatment_hints:
    - step: Гематокрит, см. `polycythemia`
      note: Дальнейшая оценка.
    references:
    - WHO classification of myeloproliferative neoplasms
  rbc_high_female:
    id: rbc_high_female
    label: Повышенные эритроциты (женщины)
    category: Общие лабораторные показатели
    description: Эритроциты выше нормы для женщин.
    criteria:
    - parameter: rbc
      threshold: 5.2
      unit: ×10¹²/Л
      condition: '>='
      comment_template: Эритроциты {value} ×10¹²/Л — повышены.
    differentials:
    - condition: ''
      text: См. дифдиагноз полицитемии (`polycythemia`).
    red_flags:
    - condition: ''
      text: Сопоставить с гематокритом и гемоглобином.
    treatment_hints:
    - step: Гематокрит, см. `polycythemia`
      note: Дальнейшая оценка.
    references:
    - WHO classification of myeloproliferative neoplasms
  hematocrit_low_male:
    id: hematocrit_low_male
    label: Сниженный гематокрит (мужчины)
    category: Общие лабораторные показатели
    description: Гематокрит ниже нормы для мужчин — коррелирует с анемией.
    criteria:
    - parameter: hematocrit
      threshold: 40
      unit: '%'
      condition: <=
      comment_template: Гематокрит {value}% — снижен.
    differentials:
    - condition: ''
      text: См. дифдиагноз анемии (`anemia_male`) — гематокрит и гемоглобин обычно снижаются параллельно
        и отражают одну и ту же патологию.
    red_flags:
    - condition: hematocrit < 25
      text: Выраженное снижение — оценить необходимость трансфузии в зависимости от клинической картины
        и остроты развития.
    treatment_hints:
    - step: Гемоглобин, эритроциты, MCV, ферритин
      note: Полная картина для определения типа и причины анемии.
    references:
    - Общие рекомендации по диагностике анемий
  hematocrit_low_female:
    id: hematocrit_low_female
    label: Сниженный гематокрит (женщины)
    category: Общие лабораторные показатели
    description: Гематокрит ниже нормы для женщин.
    criteria:
    - parameter: hematocrit
      threshold: 36
      unit: '%'
      condition: <=
      comment_template: Гематокрит {value}% — снижен.
    differentials:
    - condition: ''
      text: См. дифдиагноз анемии (`anemia_female`).
    red_flags:
    - condition: hematocrit < 25
      text: Выраженное снижение — оценить необходимость трансфузии.
    treatment_hints:
    - step: Гемоглобин, эритроциты, MCV, ферритин
      note: Полная картина для определения причины.
    references:
    - Общие рекомендации по диагностике анемий
  hematocrit_high_male:
    id: hematocrit_high_male
    label: Повышенный гематокрит (мужчины)
    category: Общие лабораторные показатели
    description: Гематокрит выше нормы для мужчин.
    criteria:
    - parameter: hematocrit
      threshold: 52
      unit: '%'
      condition: '>='
      comment_template: Гематокрит {value}% — повышен.
    differentials:
    - condition: ''
      text: См. дифдиагноз полицитемии (`polycythemia`) — истинная полицитемия, вторичный или относительный
        эритроцитоз.
    red_flags:
    - condition: hematocrit > 60
      text: Значительно повышенный гематокрит — повышенная вязкость крови, риск тромбоза.
    treatment_hints:
    - step: См. `polycythemia`
      note: Оценка статуса гидратации, JAK2, эритропоэтин.
    references:
    - WHO classification of myeloproliferative neoplasms
  hematocrit_high_female:
    id: hematocrit_high_female
    label: Повышенный гематокрит (женщины)
    category: Общие лабораторные показатели
    description: Гематокрит выше нормы для женщин.
    criteria:
    - parameter: hematocrit
      threshold: 46
      unit: '%'
      condition: '>='
      comment_template: Гематокрит {value}% — повышен.
    differentials:
    - condition: ''
      text: См. дифдиагноз полицитемии (`polycythemia`).
    red_flags:
    - condition: hematocrit > 55
      text: Значительно повышенный гематокрит — повышенная вязкость крови, риск тромбоза.
    treatment_hints:
    - step: См. `polycythemia`
      note: Оценка статуса гидратации, JAK2, эритропоэтин.
    references:
    - WHO classification of myeloproliferative neoplasms
  esr_high_male:
    id: esr_high_male
    label: Повышенная СОЭ (мужчины)
    category: Общие лабораторные показатели
    description: СОЭ выше нормы для мужчин. Неспецифичный маркер воспаления.
    criteria:
    - parameter: esr
      threshold: 15
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: Инфекция, воспаление любой этиологии, аутоиммунные заболевания, злокачественные новообразования
        (особенно множественная миелома при очень высоких значениях), анемия (сама по себе повышает СОЭ).
    red_flags:
    - condition: esr > 100
      text: 'Крайне высокая СОЭ — расширенный поиск причины: множественная миелома, васкулиты (в т.ч.
        гигантоклеточный артериит у пожилых), тяжёлая инфекция, злокачественные новообразования.'
    treatment_hints:
    - step: СРБ
      note: СРБ реагирует быстрее и специфичнее СОЭ, полезен для сопоставления динамики.
    references:
    - Общие рекомендации по интерпретации СОЭ
  esr_high_female:
    id: esr_high_female
    label: Повышенная СОЭ (женщины)
    category: Общие лабораторные показатели
    description: СОЭ выше нормы для женщин.
    criteria:
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: Инфекция, воспаление, аутоиммунные заболевания, злокачественные новообразования, анемия, беременность
        (физиологическое повышение).
    red_flags:
    - condition: esr > 100
      text: Крайне высокая СОЭ — расширенный поиск причины.
    treatment_hints:
    - step: СРБ
      note: Для сопоставления динамики воспаления.
    references:
    - Общие рекомендации по интерпретации СОЭ
  nonalcoholic_fatty_liver:
    id: nonalcoholic_fatty_liver
    label: Неалкогольная жировая болезнь печени
    category: Гепатология
    description: Повышение АЛТ/АСТ/ГГТ на фоне метаболического синдрома.
    criteria:
    - parameter: alt
      threshold: 45
      unit: Ед/л
      condition: '>'
      comment_template: АЛТ {value} Ед/л превышает норму (> 45 для мужчин, > 35 для женщин).
    - parameter: ast
      threshold: 40
      unit: Ед/л
      condition: '>'
      comment_template: АСТ {value} Ед/л превышает норму (> 40).
      optional: true
    - parameter: ggt
      threshold: 71
      unit: Ед/л
      condition: '>'
      comment_template: ГГТ {value} Ед/л превышает норму (> 71).
      optional: true
    treatment_hints:
    - step: Модификация образа жизни
      note: Потеря веса (7–10%), диета с ограничением простых углеводов и насыщенных жиров.
    - step: Витамин Е
      note: При отсутствии диабета – 800 МЕ/сут может улучшить гистологию.
    references:
    - Рекомендации по неалкогольной жировой болезни печени (2023)
  celiac_disease:
    id: celiac_disease
    label: Целиакия (подозрение)
    category: Гастроэнтерология
    description: Повышение антител к тканевой трансглютаминазе (anti‑tTG).
    criteria:
    - parameter: tga_iga
      threshold: 10
      unit: Ед/мл
      condition: '>'
      comment_template: Уровень антител к тканевой трансглютаминазе IgA {value} Ед/мл превышает норму
        (> 10).
    treatment_hints:
    - step: Строгая аглютеновая диета
      note: Пожизненное исключение глютенсодержащих продуктов.
    - step: Обследование у гастроэнтеролога
      note: Для подтверждения – биопсия двенадцатиперстной кишки.
    references:
    - Клинические рекомендации по целиакии (2023)
  anemia_chronic_disease:
    id: anemia_chronic_disease
    label: Анемия хронического воспаления (подозрение)
    category: Гематология
    description: Низкий гемоглобин, ферритин > 100, повышенный CRP.
    criteria:
    - parameter: hemoglobin
      threshold: 120
      unit: г/Л
      condition: <
      comment_template: Гемоглобин {value} г/Л снижен.
    - parameter: ferritin
      threshold: 100
      unit: мкг/Л
      condition: '>'
      comment_template: Ферритин {value} мкг/Л повышен (> 100), что характерно для воспаления.
    - parameter: crp
      threshold: 5
      unit: мг/Л
      condition: '>'
      comment_template: CRP {value} мг/Л повышен (> 5).
      optional: true
    treatment_hints:
    - step: Лечение основного заболевания
      note: При инфекции – антибиотики, при аутоиммунном процессе – иммуносупрессия.
    - step: Железо в/в (при дефиците)
      note: Если ферритин < 100, но нет абсолютного дефицита, в/в железо может быть неэффективным.
    references:
    - Рекомендации по анемии хронического воспаления (2023)
  b12_deficiency:
    id: b12_deficiency
    label: Дефицит витамина B12
    category: Гематология
    description: Уровень B12 < 200 пг/мл.
    criteria:
    - parameter: vitamin_b12
      threshold: 200
      unit: пг/мл
      condition: <
      comment_template: Уровень B12 {value} пг/мл ниже нормы (< 200).
    treatment_hints:
    - step: Пероральный цианокобаламин
      note: 1000–2000 мкг/сут, при нарушении всасывания – в/м 1000 мкг/мес.
    references:
    - Рекомендации по дефициту B12 (2023)
  folate_deficiency:
    id: folate_deficiency
    label: Дефицит фолиевой кислоты
    category: Гематология
    description: Фолат < 4 нг/мл.
    criteria:
    - parameter: folate
      threshold: 4
      unit: нг/мл
      condition: <
      comment_template: Уровень фолата {value} нг/мл ниже нормы (< 4).
    treatment_hints:
    - step: Фолиевая кислота
      note: 1–5 мг/сут перорально.
    references:
    - Рекомендации по дефициту фолата (2023)
  urinary_tract_infection:
    id: urinary_tract_infection
    label: Инфекция мочевыводящих путей (подозрение)
    category: Инфекционные заболевания
    description: Наличие лейкоцитурии, нитритов в моче, бактерий.
    criteria:
    - parameter: urine_leukocytes
      threshold: 5
      unit: кл/мкл
      condition: '>'
      comment_template: Лейкоциты в моче {value} кл/мкл повышены (> 5).
    - parameter: urine_nitrites
      threshold: 0
      unit: качественно
      condition: '>'
      comment_template: Нитриты в моче положительны, что говорит о бактериурии.
      optional: true
    treatment_hints:
    - step: Антибиотики
      note: Препараты выбора – фосфомицин, нитрофурантоин, цефалоспорины (в зависимости от резистентности).
    references:
    - Клинические рекомендации по ИМВП (2023)
  lower_respiratory_infection:
    id: lower_respiratory_infection
    label: Нижняя респираторная инфекция (подозрение)
    category: Инфекционные заболевания
    description: Повышение CRP, лейкоцитов, прокальцитонина на фоне симптомов.
    criteria:
    - parameter: crp
      threshold: 10
      unit: мг/Л
      condition: '>'
      comment_template: CRP {value} мг/Л повышен (> 10).
    - parameter: procalcitonin
      threshold: 0.5
      unit: нг/мл
      condition: '>'
      comment_template: Прокальцитонин {value} нг/мл повышен, что говорит о бактериальной природе.
      optional: true
    treatment_hints:
    - step: Антибиотикотерапия
      note: При бактериальной инфекции – амоксициллин, макролиды, респираторные фторхинолоны.
    references:
    - Клинические рекомендации по пневмонии (2023)
  systemic_inflammation:
    id: systemic_inflammation
    label: Системное воспаление
    category: Инфекционные заболевания
    description: Повышение CRP, СОЭ, лейкоцитов.
    criteria:
    - parameter: crp
      threshold: 10
      unit: мг/Л
      condition: '>'
      comment_template: CRP {value} мг/Л повышен (> 10).
    - parameter: esr
      threshold: 25
      unit: мм/ч
      condition: '>'
      comment_template: СОЭ {value} мм/ч повышена (> 25).
      optional: true
    treatment_hints:
    - step: Поиск причины
      note: Исключить инфекцию, аутоиммунные процессы, злокачественные новообразования.
    references:
    - Рекомендации по интерпретации маркеров воспаления (2023)
  gout:
    id: gout
    label: Подагра (гиперурикемия)
    category: Общие лабораторные показатели
    description: 'Мочевая кислота выше нормы. Важно: гиперурикемия сама по себе не равна подагре — у многих
      людей с повышенной мочевой кислотой клинических приступов подагры никогда не бывает; диагноз подагры
      клинический (и/или по кристаллам в суставной жидкости), а не только лабораторный.'
    criteria:
    - parameter: uric_acid
      threshold: 420
      unit: мкмоль/л
      condition: '>='
      comment_template: Мочевая кислота {value} мкмоль/л — повышена.
    differentials:
    - condition: ''
      text: Бессимптомная гиперурикемия (наиболее частая ситуация), подагра (при наличии характерных клинических
        приступов), вторичная гиперурикемия (ХБП, приём диуретиков, миелопролиферативные заболевания с
        высоким клеточным обновлением).
    red_flags:
    - condition: uric_acid > 600
      text: Значительная гиперурикемия — при остром моноартрите (классически первый плюснефаланговый сустав)
        клинически подтвердить диагноз, по возможности исследованием суставной жидкости на кристаллы.
    treatment_hints:
    - step: При остром приступе — НПВП или колхицин
      note: Уратснижающую терапию не начинать во время острого приступа.
    - step: Аллопуринол под контролем мочевой кислоты
      note: При рецидивирующих приступах или тофусах — длительная уратснижающая терапия с целевым уровнем
        мочевой кислоты.
    references:
    - ACR Guideline for the Management of Gout
  hypoglycemia:
    id: hypoglycemia
    label: Гипогликемия
    category: Эндокринология
    description: Уровень глюкозы ниже 3.9 ммоль/л.
    criteria:
    - parameter: glucose
      threshold: 3.9
      unit: ммоль/л
      condition: <
      comment_template: Уровень глюкозы {value} ммоль/л ниже нормы (< 3.9). Требуется срочная коррекция.
    red_flags:
    - condition: glucose < 3.0
      text: Тяжёлая гипогликемия! Требуется немедленное введение глюкозы (в/в 40% раствор) или глюкагон.
    - condition: glucose < 2.2 AND patient_age > 65
      text: Пожилой возраст + тяжёлая гипогликемия – высокий риск неврологических осложнений.
    treatment_hints:
    - step: Приём быстрых углеводов (15–20 г глюкозы)
      note: При лёгкой гипогликемии – сок, сладкий чай, глюкоза в таблетках.
    - step: В/в введение 40% раствора глюкозы
      note: При уровне глюкозы < 2.2 ммоль/л или при невозможности перорального приёма.
    - step: Поиск причины
      note: Исключить передозировку инсулина/препаратов сульфонилмочевины, инсулиному, надпочечниковую
        недостаточность.
    references:
    - Рекомендации по гипогликемии (2023)
  hyperkalemia:
    id: hyperkalemia
    label: Гиперкалиемия
    category: Электролиты
    description: Калий сыворотки ≥ 5.1 ммоль/л.
    criteria:
    - parameter: potassium
      threshold: 5.1
      unit: ммоль/л
      condition: '>='
      comment_template: Калий {value} ммоль/л превышает норму (≥ 5.1).
    red_flags:
    - condition: potassium > 6.0
      text: 'Критическая гиперкалиемия! Риск остановки сердца. Требуется экстренное лечение: кальция глюконат,
        инсулин + глюкоза, диуретики, гемодиализ.'
    treatment_hints:
    - step: Исключить гемолиз (ложное повышение)
      note: Повторить анализ.
    - step: При подтверждении
      note: Отменить калийсберегающие диуретики, ингибиторы АПФ; назначить кальция глюконат (при изменениях
        на ЭКГ), инсулин с глюкозой, петлевые диуретики.
    references:
    - KDIGO 2024 guidelines for electrolyte disorders
  hypokalemia:
    id: hypokalemia
    label: Гипокалиемия
    category: Электролиты
    description: Калий сыворотки ≤ 3.5 ммоль/л.
    criteria:
    - parameter: potassium
      threshold: 3.5
      unit: ммоль/л
      condition: <=
      comment_template: Калий {value} ммоль/л ниже нормы (≤ 3.5).
    red_flags:
    - condition: potassium < 2.5
      text: Тяжёлая гипокалиемия – риск паралича, аритмий. Требуется внутривенное восполнение.
    treatment_hints:
    - step: Коррекция диеты
      note: Продукты, богатые калием (бананы, картофель, бобовые).
    - step: Пероральные препараты калия
      note: Калия хлорид 1–2 г/сут, при уровне < 3.0 – 3–4 г/сут.
    - step: Поиск причины
      note: Исключить приём диуретиков, гиперфункцию коры надпочечников, потерю через ЖКТ.
    references:
    - KDIGO 2024 guidelines for electrolyte disorders
  hyponatremia:
    id: hyponatremia
    label: Гипонатриемия
    category: Электролиты
    description: Натрий ≤ 136 ммоль/л.
    criteria:
    - parameter: sodium
      threshold: 136
      unit: ммоль/л
      condition: <=
      comment_template: Натрий {value} ммоль/л ниже нормы (≤ 136).
    red_flags:
    - condition: sodium < 120
      text: Тяжёлая гипонатриемия – риск отёка мозга. Требуется медленная коррекция гипертоническим раствором.
    treatment_hints:
    - step: Уточнить причину
      note: СИАДГ, гиповолемия, сердечная недостаточность, приём диуретиков.
    - step: При СИАДГ
      note: Ограничение жидкости до 800–1000 мл/сут.
    - step: При гиповолемии
      note: Восполнение физиологическим раствором.
    references:
    - European guidelines on hyponatremia (2023)
  hypernatremia:
    id: hypernatremia
    label: Гипернатриемия
    category: Электролиты
    description: Натрий ≥ 145 ммоль/л.
    criteria:
    - parameter: sodium
      threshold: 145
      unit: ммоль/л
      condition: '>='
      comment_template: Натрий {value} ммоль/л превышает норму (≥ 145).
    red_flags:
    - condition: sodium > 155
      text: Тяжёлая гипернатриемия – риск нарушения сознания. Требуется медленное восполнение жидкости.
    treatment_hints:
    - step: Восполнение жидкости
      note: Перорально или в/в (5% глюкоза или 0.45% NaCl).
    - step: Поиск причины
      note: Дегидратация, несахарный диабет, приём диуретиков.
    references:
    - European guidelines on hypernatremia (2023)
  hypercalcemia:
    id: hypercalcemia
    label: Гиперкальциемия
    category: Общие лабораторные показатели
    description: Общий кальций сыворотки выше нормы. Интерпретировать с учётом альбумина (гипоальбуминемия
      занижает общий кальций).
    criteria:
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л — повышен.
    differentials:
    - condition: ''
      text: 'Первичный гиперпаратиреоз и злокачественные новообразования (гуморальная гиперкальциемия,
        костные метастазы) — вместе составляют более 90% случаев. Реже: избыток витамина D, тиреотоксикоз,
        длительная иммобилизация, приём тиазидных диуретиков.'
    red_flags:
    - condition: calcium_total > 3.0
      text: Тяжёлая гиперкальциемия — риск нарушений ритма сердца, острого повреждения почек, нарушения
        сознания. Требует неотложной терапии (гидратация, диуретики, при необходимости кальцитонин/бисфосфонаты).
    treatment_hints:
    - step: ПТГ
      note: Ключевой тест для разделения ПТГ-зависимой (гиперпаратиреоз) и ПТГ-независимой (злокачественные
        опухоли и др.) причины.
    - step: Альбумин
      note: Для коррекции общего кальция при гипоальбуминемии.
    references:
    - Общие рекомендации по диагностике гиперкальциемии
  hypocalcemia:
    id: hypocalcemia
    label: Гипокальциемия
    category: Общие лабораторные показатели
    description: Общий кальций сыворотки ниже нормы.
    criteria:
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: Дефицит витамина D (см. `osteomalacia`), гипопаратиреоз (в т.ч. послеоперационный, после тиреоидэктомии/паратиреоидэктомии),
        ХБП, гипомагниемия (нарушает секрецию ПТГ), острый панкреатит.
    red_flags:
    - condition: calcium_total < 1.9
      text: Выраженная гипокальциемия — риск тетании, судорог, удлинения QT с риском аритмии.
    treatment_hints:
    - step: Витамин D, ПТГ, магний
      note: Определяют причину и тактику коррекции.
    - step: ЭКГ при выраженной гипокальциемии
      note: Оценка удлинения QT.
    references:
    - Общие рекомендации по диагностике гипокальциемии
  severe_hyperglycemia:
    id: severe_hyperglycemia
    label: Тяжёлая гипергликемия
    category: Эндокринология
    description: Глюкоза крови ≥ 11.1 ммоль/л – высокий риск кетоацидоза и гиперосмолярного состояния.
    criteria:
    - parameter: glucose
      threshold: 11.1
      unit: ммоль/л
      condition: '>='
      comment_template: Уровень глюкозы {value} ммоль/л превышает порог тяжёлой гипергликемии (≥ 11.1).
    - parameter: hba1c
      threshold: 9.0
      unit: '%'
      condition: '>='
      comment_template: HbA1c {value}% превышает 9%, что указывает на хроническую декомпенсацию.
      optional: true
    red_flags:
    - condition: glucose >= 16.7
      text: '**Угроза гиперосмолярной комы.** Срочно проверить осмолярность, кетоны, электролиты, газовый
        состав крови.'
    - condition: glucose >= 13.9 AND ketone_bodies > 0
      text: '**Риск диабетического кетоацидоза.** Требуется экстренная госпитализация, инфузионная терапия,
        инсулин.'
    treatment_hints:
    - step: Инсулинотерапия
      note: Короткий инсулин в/в или п/к, титрация под контролем гликемии каждые 1–2 часа.
    - step: Восполнение жидкости
      note: Физиологический раствор 0.9% NaCl в/в, контроль электролитов (особенно калия).
    - step: Мониторинг
      note: Ежечасный контроль глюкозы, кетонов, электролитов, осмолярности.
    references:
    - ADA Standards of Medical Care in Diabetes 2025
  prediabetes:
    id: prediabetes
    label: Предиабет
    category: Эндокринология
    description: Глюкоза натощак 5.6–6.9 ммоль/л или HbA1c 5.7–6.4% – высокий риск развития СД2.
    criteria:
    - parameter: glucose
      threshold: 5.6
      unit: ммоль/л
      condition: '>='
      comment_template: Глюкоза натощак {value} ммоль/л в диапазоне предиабета (5.6–6.9).
    - parameter: hba1c
      threshold: 5.7
      unit: '%'
      condition: '>='
      comment_template: HbA1c {value}% в диапазоне предиабета (5.7–6.4%).
      optional: true
    treatment_hints:
    - step: Модификация образа жизни
      note: Снижение массы тела на 5–7%, увеличение физической активности (150 мин/нед).
    - step: Диета
      note: Ограничение простых углеводов, насыщенных жиров, увеличение клетчатки.
    - step: Медикаментозная профилактика
      note: При высоком риске – метформин 850 мг × 2 р/д.
    references:
    - ADA Standards of Medical Care in Diabetes 2025
  acute_kidney_injury:
    id: acute_kidney_injury
    label: Острое повреждение почек
    category: Нефрология
    description: Внезапное снижение функции почек – повышение креатинина, снижение диуреза, электролитные
      нарушения.
    criteria:
    - parameter: creatinine
      threshold: 1.5
      unit: мкмоль/л
      condition: '>= baseline * 1.5'
      comment_template: Креатинин повысился в {value} раз от исходного (критерий ОПП).
    - parameter: egfr
      threshold: 60
      unit: мл/мин/1.73м²
      condition: <
      comment_template: СКФ {value} мл/мин/1.73м² снижена (< 60).
    red_flags:
    - condition: creatinine > baseline * 3
      text: Тяжёлое ОПП (стадия 3) – требуется заместительная почечная терапия.
    - condition: potassium > 6.0
      text: Гиперкалиемия – риск аритмий. Срочная коррекция.
    treatment_hints:
    - step: Оценка гемодинамики и волемического статуса
      note: Исключить гиповолемию, обструкцию мочевых путей, вазоконстрикцию (НПВП, иАПФ).
    - step: Коррекция электролитов
      note: Гиперкалиемия – кальция глюконат, инсулин+глюкоза, диуретики, при необходимости диализ.
    - step: Мониторинг диуреза
      note: Ежечасно, катетеризация мочевого пузыря при олигурии.
    - step: Нефропротекция
      note: Отмена нефротоксичных препаратов, поддержание перфузии почек.
    references:
    - KDIGO Clinical Practice Guideline for Acute Kidney Injury (2024)
  metabolic_syndrome:
    id: metabolic_syndrome
    label: Метаболический синдром
    category: Липидный обмен
    description: Сочетание ожирения, гипергликемии, дислипидемии и артериальной гипертензии.
    criteria:
    - parameter: waist_circumference
      threshold: 94
      unit: см
      condition: '>='
      comment_template: Окружность талии {value} см превышает порог (≥ 94 у мужчин, ≥ 80 у женщин).
    - parameter: triglycerides
      threshold: 1.7
      unit: ммоль/л
      condition: '>='
      comment_template: Триглицериды {value} ммоль/л повышены (≥ 1.7).
    - parameter: hdl_cholesterol
      threshold: 1.0
      unit: ммоль/л
      condition: <
      comment_template: ЛПВП {value} ммоль/л снижен (< 1.0 у мужчин, < 1.3 у женщин).
    - parameter: blood_pressure_systolic
      threshold: 130
      unit: мм рт. ст.
      condition: '>='
      comment_template: САД {value} мм рт. ст. ≥ 130.
    - parameter: glucose
      threshold: 5.6
      unit: ммоль/л
      condition: '>='
      comment_template: Глюкоза натощак {value} ммоль/л ≥ 5.6.
    treatment_hints:
    - step: Комплексный подход
      note: Снижение веса (7–10%), диета, физическая активность 150–300 мин/нед.
    - step: Медикаментозная коррекция
      note: Статины при дислипидемии, антигипертензивная терапия, метформин при предиабете.
    references:
    - IDF Consensus on Metabolic Syndrome (2023)
  primary_hyperparathyroidism:
    id: primary_hyperparathyroidism
    label: Первичный гиперпаратиреоз (предположительно)
    category: Эндокринология
    description: Сочетание гиперкальциемии и дефицита витамина D может указывать на первичный гиперпаратиреоз.
    criteria:
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л повышен (≥ 2.55).
    - parameter: vitamin_d_25oh
      threshold: 30
      unit: нг/мл
      condition: <
      comment_template: Витамин D {value} нг/мл снижен (< 30).
    differentials:
    - condition: pth > 6.9 AND calcium_ionized > 1.33
      text: Подтверждает первичный гиперпаратиреоз. Необходимо провести УЗИ паращитовидных желёз.
    - condition: creatinine_high_male OR creatinine_high_female
      text: Исключить вторичный гиперпаратиреоз на фоне ХБП.
    red_flags:
    - condition: calcium_total > 3.0 AND pth > 10
      text: Гиперкальциемический криз – требует экстренного лечения, возможно хирургического вмешательства.
    treatment_hints:
    - step: Консультация эндокринолога
      note: Определение PTH, кальций суточной мочи, УЗИ паращитовидных желёз.
    - step: При подтверждении
      note: Показано хирургическое удаление аденомы паращитовидной железы.
    - step: Медикаментозная терапия
      note: При невозможности операции – цинакальцет, бисфосфонаты.
    references:
    - Endocrine Society Guidelines on Primary Hyperparathyroidism (2022)
  septic_syndrome:
    id: septic_syndrome
    label: Септический синдром
    category: Инфекционные заболевания
    description: Сочетание системного воспаления и подозрения на сепсис.
    criteria:
    - parameter: crp
      threshold: 50
      unit: мг/Л
      condition: '>'
      comment_template: CRP {value} мг/Л значительно повышен (> 50).
    - parameter: procalcitonin
      threshold: 0.5
      unit: нг/мл
      condition: '>'
      comment_template: Прокальцитонин {value} нг/мл повышен (> 0.5).
      optional: true
    red_flags:
    - condition: lactate > 2.0
      text: Гиперлактатемия указывает на септический шок. Срочная госпитализация в ОРИТ.
    - condition: systolic_bp < 90 OR diastolic_bp < 60
      text: Гипотензия – признак шока. Немедленная инфузионная терапия и вазопрессоры.
    treatment_hints:
    - step: Госпитализация в ОРИТ
      note: Контроль гемодинамики, антибиотикотерапия, посев крови.
    - step: Антибиотики
      note: Эмпирическая терапия широкого спектра после взятия посевов.
    - step: Инфузионная терапия
      note: Кристаллоиды 30 мл/кг, при нестабильности – вазопрессоры (норадреналин).
    references:
    - Surviving Sepsis Campaign Guidelines (2024)
  hepatorenal_syndrome:
    id: hepatorenal_syndrome
    label: Гепаторенальный синдром (предположительно)
    category: Нефрология
    description: Сочетание острого повреждения почек и острого гепатита.
    criteria:
    - parameter: creatinine
      threshold: 1.5
      unit: мкмоль/л
      condition: '>= baseline * 1.5'
      comment_template: Креатинин повысился в {value} раз от исходного.
    - parameter: alt
      threshold: 45
      unit: Ед/л
      condition: '>'
      comment_template: АЛТ {value} Ед/л повышена (> 45).
    differentials:
    - condition: acute_hepatitis == true AND acute_kidney_injury == true
      text: Гепаторенальный синдром – исключить преренальную азотемию, обструкцию мочевыводящих путей.
    red_flags:
    - condition: creatinine > 2.0 AND bilirubin_total > 50
      text: Тяжёлая печёночно-почечная недостаточность – требует заместительной терапии.
    treatment_hints:
    - step: Оценка функции почек и печени
      note: УЗИ органов брюшной полости, консультация гепатолога и нефролога.
    - step: Терапия
      note: Восполнение ОЦК (альбумин), при прогрессировании – диализ.
    references:
    - KDIGO 2024 Guidelines for AKI in cirrhosis
  metabolic_bone_disease:
    id: metabolic_bone_disease
    label: Метаболическое заболевание костей (дефицит витамина D + гиперкальциемия)
    category: Ревматология
    description: Сочетание дефицита витамина D и гиперкальциемии.
    criteria:
    - parameter: vitamin_d_25oh
      threshold: 30
      unit: нг/мл
      condition: <
      comment_template: Витамин D {value} нг/мл снижен (< 30).
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л повышен (≥ 2.55).
    differentials:
    - condition: alkaline_phosphatase > 130
      text: Повышенная ЩФ указывает на костную перестройку.
    - condition: pth > 6.9
      text: Исключить первичный гиперпаратиреоз.
    red_flags:
    - condition: calcium_total > 3.0 AND alkaline_phosphatase > 300
      text: Агрессивное метаболическое заболевание костей – риск переломов.
    treatment_hints:
    - step: Исследование костного метаболизма
      note: DEXA-сканирование, маркеры костного ремоделирования.
    - step: Коррекция витамина D
      note: Колекальциферол 2000–5000 МЕ/сут под контролем кальция.
    - step: При гиперкальциемии
      note: Ограничение кальция в диете, гидратация, при необходимости – бисфосфонаты.
    references:
    - Рекомендации по остеопорозу (2023)
  acute_hepatitis:
    id: acute_hepatitis
    label: Острый гепатит
    category: Гепатология
    description: Значительное повышение АЛТ/АСТ (>100 Ед/л) и/или билирубина (>34 мкмоль/л), характерное
      для острого повреждения печени.
    criteria:
    - parameter: alt
      threshold: 100
      unit: Ед/л
      condition: '>='
      comment_template: АЛТ {value} Ед/л. Значительное повышение, характерно для острого гепатоцеллюлярного
        повреждения.
    - parameter: ast
      threshold: 100
      unit: Ед/л
      condition: '>='
      comment_template: АСТ {value} Ед/л.
    - parameter: bilirubin_total
      threshold: 34
      unit: мкмоль/л
      condition: '>='
      comment_template: Билирубин общий {value} мкмоль/л, соответствует клинически заметной желтухе.
    differentials:
    - condition: ''
      text: Вирусные гепатиты (A, B, C, E), лекарственное поражение печени (DILI), алкогольный гепатит,
        аутоиммунный гепатит, ишемический гепатит («шоковая печень»).
    red_flags:
    - condition: bilirubin_total > 200
      text: Резкое нарастание билирубина. Дополнительно клинически оценить коагулопатию (МНО) и признаки
        энцефалопатии — их сочетание с острым гепатитом указывает на острую печёночную недостаточность
        и требует экстренной госпитализации, по возможности в центр с возможностью трансплантации.
    treatment_hints:
    - step: Серологическая панель вирусных гепатитов
      note: Anti-HAV IgM, HBsAg, anti-HBc IgM, anti-HCV.
    - step: Собрать анамнез лекарств и алкоголя
      note: DILI и алкогольный гепатит — частые причины, легко пропустить без прицельного опроса.
    - step: Коагулограмма (МНО)
      note: Ключевой маркер тяжести и показание для экстренного направления при удлинении.
    references:
    - AASLD Practice Guidance on acute liver injury
    - EASL Clinical Practice Guidelines
  cholestasis:
    id: cholestasis
    label: Холестаз
    category: Гепатология
    description: Повышение щелочной фосфатазы, ГГТ и прямого билирубина, характерное для нарушения оттока
      желчи.
    criteria:
    - parameter: alkaline_phosphatase
      threshold: 200
      unit: Ед/л
      condition: '>='
      comment_template: Щелочная фосфатаза {value} Ед/л.
    - parameter: ggt
      threshold: 120
      unit: Ед/л
      condition: '>='
      comment_template: ГГТ {value} Ед/л, подтверждает печёночное происхождение повышенной ЩФ.
    - parameter: bilirubin_direct
      threshold: 10
      unit: мкмоль/л
      condition: '>='
      comment_template: Прямой билирубин {value} мкмоль/л.
    differentials:
    - condition: ''
      text: Обструкция желчных путей (камни, стриктура, опухоль головки поджелудочной железы), первичный
        билиарный холангит, первичный склерозирующий холангит, лекарственно-индуцированный холестаз, внутрипечёночный
        холестаз беременных.
    red_flags:
    - condition: bilirubin_direct > 50
      text: Значительно повышенный прямой билирубин. Клинически проверить триаду Шарко (лихорадка + боль
        в правом подреберье + желтуха) — при её наличии подозревать острый восходящий холангит, экстренное
        состояние.
    treatment_hints:
    - step: УЗИ брюшной полости в первую очередь
      note: Ищем расширение внутри-/внепечёночных желчных протоков — разделяет механическую и немеханическую
        причину холестаза.
    - step: При подозрении на обструкцию — МРХПГ
      note: Неинвазивная визуализация желчных путей перед решением об ЭРХПГ.
    - step: Антимитохондриальные антитела
      note: При отсутствии обструкции и подозрении на первичный билиарный холангит.
    references:
    - EASL Clinical Practice Guidelines on cholestatic liver disease
  hypoalbuminemia:
    id: hypoalbuminemia
    label: Гипоальбуминемия
    category: Гепатология
    description: Альбумин сыворотки < 35 г/л.
    criteria:
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л, ниже нормы.
    differentials:
    - condition: ''
      text: Нарушение синтеза (цирроз, печёночная недостаточность), потеря белка (нефротический синдром,
        энтеропатия с потерей белка, ожоги), хроническое воспаление/острофазовая реакция, недостаточность
        питания, разведение при гипергидратации.
    red_flags:
    - condition: albumin < 20
      text: Выраженная гипоальбуминемия — риск анасарки и повышенной восприимчивости к инфекциям, особенно
        при наличии отёков/асцита.
    treatment_hints:
    - step: СРБ
      note: Разделяет воспалительную причину (альбумин как отрицательный острофазовый белок) от истощения/потери.
    - step: Соотношение белок/креатинин в моче
      note: Исключить протеинурию как причину потери белка.
    - step: Оценка функции печени и нутритивного статуса
      note: Альбумин — не чистый нутритивный маркер, интерпретировать с осторожностью при остром воспалении.
    references:
    - ESPEN guidelines on nutritional assessment
  osteomalacia:
    id: osteomalacia
    label: Остеомаляция
    category: Остеология
    description: Сочетание дефицита витамина D, гипофосфатемии, гипокальциемии и повышенной щелочной фосфатазы
      — картина нарушения минерализации костной ткани у взрослых.
    criteria:
    - parameter: vitamin_d
      threshold: 20
      unit: нг/мл
      condition: <=
      comment_template: Витамин D {value} нг/мл — дефицит.
    - parameter: phosphate
      threshold: 0.8
      unit: ммоль/л
      condition: <=
      comment_template: Фосфат {value} ммоль/л — снижен.
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций общий {value} ммоль/л — снижен.
    - parameter: alkaline_phosphatase
      threshold: 130
      unit: Ед/л
      condition: '>='
      comment_template: Щелочная фосфатаза {value} Ед/л — повышена, типично при активной остеомаляции.
    differentials:
    - condition: ''
      text: Дефицит витамина D (наиболее частая причина), синдромы мальабсорбции, ХБП (нарушение активации
        витамина D), наследственные гипофосфатемические синдромы, длительный приём антиконвульсантов.
    red_flags:
    - condition: calcium_total < 1.9
      text: Выраженная гипокальциемия — риск тетании (парестезии, судороги). Также клинически оценить
        наличие патологических переломов.
    treatment_hints:
    - step: ПТГ
      note: Оценить наличие вторичного гиперпаратиреоза, типичного при дефиците витамина D.
    - step: Денситометрия (DXA)
      note: Помогает отличить от остеопороза, хотя это разные по механизму состояния.
    - step: Рентген
      note: Искать зоны Лоозера (псевдопереломы) — характерный, хоть и не всегда присутствующий признак.
    references:
    - Endocrine Society Clinical Practice Guideline for Vitamin D deficiency
  osteoporosis:
    id: osteoporosis
    label: Остеопороз (вторичный, по лабораторным маркерам)
    category: Остеология
    description: 'Лабораторная картина (дефицит витамина D, сниженный кальций, повышенный ПТГ), которая
      может сопровождать вторичный остеопороз. Важно: диагноз остеопороза клинически ставится по денситометрии
      (DXA, T-score ≤ -2.5), а не по одним лабораторным маркерам — эта находка указывает на вероятную
      метаболическую причину, а не подтверждает диагноз сама по себе.'
    criteria:
    - parameter: vitamin_d
      threshold: 20
      unit: нг/мл
      condition: <=
      comment_template: Витамин D {value} нг/мл — дефицит, частый вторичный фактор снижения костной массы.
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций общий {value} ммоль/л — снижен.
    - parameter: pth
      threshold: 6.9
      unit: пмоль/л
      condition: '>='
      comment_template: ПТГ {value} пмоль/л — повышен, возможен вторичный или первичный гиперпаратиреоз.
    differentials:
    - condition: ''
      text: Первичный остеопороз (постменопаузальный, сенильный) vs вторичный (гиперпаратиреоз, гипертиреоз,
        длительная терапия глюкокортикоидами, гипогонадизм).
    red_flags:
    - condition: pth > 15
      text: 'Значительно повышенный ПТГ — вероятен первичный гиперпаратиреоз как причина, а не первичный
        остеопороз. Также: перелом при минимальной травме — красный флаг для немедленного начала лечения,
        независимо от результата денситометрии (это не выражается лабораторным параметром, оценивается
        клинически).'
    treatment_hints:
    - step: Денситометрия (DXA)
      note: Золотой стандарт диагностики, эти лабораторные маркеры её не заменяют.
    - step: FRAX
      note: Калькулятор 10-летнего риска перелома для решения о начале терапии.
    - step: Скрининг вторичных причин
      note: ТТГ, тестостерон у мужчин, при повышенном ПТГ — исключить первичный гиперпаратиреоз.
    references:
    - Клинические рекомендации по диагностике и лечению остеопороза
  paget_disease:
    id: paget_disease
    label: Болезнь Педжета костей (предположительно)
    category: Остеология
    description: Изолированное значительное повышение щелочной фосфатазы при отсутствии других признаков
      поражения печени — типичная лабораторная находка при болезни Педжета костей.
    criteria:
    - parameter: alkaline_phosphatase
      threshold: 200
      unit: Ед/л
      condition: '>='
      comment_template: Щелочная фосфатаза {value} Ед/л. Если печёночные пробы (АЛТ/АСТ/ГГТ) в норме —
        повышение, вероятно, костного происхождения.
    differentials:
    - condition: ''
      text: Болезнь Педжета костей, метастатическое поражение костей, гиперпаратиреоз, заболевания печени
        (дифференцировать источник ЩФ по изоферментам или ГГТ).
    red_flags:
    - condition: alkaline_phosphatase > 500
      text: Очень высокий уровень ЩФ, ассоциирован с более активным/распространённым процессом. Быстро
        нарастающая боль в поражённой кости (клинический признак, не лабораторный) — редкое, но серьёзное
        подозрение на саркоматозную трансформацию, требует срочного обследования.
    treatment_hints:
    - step: ГГТ или изоферменты ЩФ
      note: Подтвердить костное, а не печёночное происхождение повышенной ЩФ.
    - step: Рентген поражённой области
      note: Характерные изменения структуры кости.
    - step: Сцинтиграфия скелета
      note: Оценка распространённости поражения костей.
    references:
    - Клинические рекомендации по метаболическим заболеваниям костей
  ankylosing_spondylitis:
    id: ankylosing_spondylitis
    label: Анкилозирующий спондилит
    category: Ревматология
    description: Сочетание положительного HLA-B27 с повышенными маркерами воспаления (СРБ, СОЭ) — характерно
      для серонегативной спондилоартропатии с поражением осевого скелета. HLA-B27 сам по себе не диагностичен
      (встречается у части здоровой популяции) — интерпретировать только вместе с клинической картиной
      воспалительной боли в спине.
    criteria:
    - parameter: hla_b27
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: HLA-B27 положителен. Диагностическую ценность имеет только вместе с клинической
        картиной воспалительной боли в спине (начало < 45 лет, улучшение при движении, ночная боль).
    - parameter: crp
      threshold: 5
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: Механическая боль в пояснице, другие серонегативные спондилоартропатии (псориатический артрит,
        реактивный артрит, энтеропатический артрит при ВЗК), у пожилых — диффузный идиопатический скелетный
        гиперостоз (DISH).
    red_flags:
    - condition: esr >= 60
      text: Высокая активность воспаления. Клинически проверить наличие острого переднего увеита (боль,
        покраснение глаза, светобоязнь) — частое внескелетное проявление, требует срочной офтальмологической
        консультации.
    treatment_hints:
    - step: МРТ или рентген крестцово-подвздошных суставов
      note: Сакроилеит — ключевой диагностический признак, лабораторные маркеры его не заменяют.
    - step: Направление к ревматологу при воспалительном характере боли
      note: Начало < 45 лет, длительность > 3 мес, улучшение при движении и НПВП — критерии воспалительной
        боли в спине.
    references:
    - ASAS/EULAR recommendations for axial spondyloarthritis
  rheumatoid_arthritis:
    id: rheumatoid_arthritis
    label: Ревматоидный артрит
    category: Ревматология
    description: Повышенные ревматоидный фактор и/или антитела к циклическому цитруллинированному пептиду
      (анти-ЦЦП) вместе с маркерами воспаления — характерно для ревматоидного артрита.
    criteria:
    - parameter: rheumatoid_factor
      threshold: 14
      unit: МЕ/мл
      condition: '>='
      comment_template: Ревматоидный фактор {value} МЕ/мл — повышен. Менее специфичен, чем анти-ЦЦП, может
        быть положительным при других состояниях (инфекции, другие аутоиммунные заболевания, у части здоровых
        лиц).
    - parameter: anti_ccp
      threshold: 17
      unit: Ед/мл
      condition: '>='
      comment_template: Анти-ЦЦП {value} Ед/мл — повышены, более специфичный маркер РА, чем ревматоидный
        фактор.
    - parameter: crp
      threshold: 5
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: Другие воспалительные артропатии (псориатический артрит, СКВ с артритом), вирусные артриты
        (парвовирус B19, гепатит C), полимиалгия ревматика у пожилых.
    red_flags:
    - condition: anti_ccp > 50
      text: Значительно повышенный титр анти-ЦЦП ассоциирован с более агрессивным, эрозивным течением
        заболевания. Раннее направление к ревматологу критично — существует «окно возможностей» в первые
        недели-месяцы для предотвращения необратимого повреждения суставов.
    treatment_hints:
    - step: Рентген кистей и стоп
      note: Оценка эрозивных изменений на момент постановки диагноза как база для дальнейшего наблюдения.
    - step: Раннее начало БПВП (метотрексат)
      note: Решается ревматологом; задержка начала терапии ухудшает долгосрочный прогноз.
    references:
    - EULAR recommendations for the management of rheumatoid arthritis
  systemic_lupus:
    id: systemic_lupus
    label: Системная красная волчанка
    category: Ревматология
    description: Положительный ANA-скрининг в сочетании с повышенными анти-дсДНК, сниженным комплементом
      (C3/C4) и/или признаками поражения почек (протеинурия, гематурия) — характерно для СКВ.
    criteria:
    - parameter: ana_screening
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: ANA-скрининг положителен. Высокочувствителен, но не специфичен — положителен также
        при других аутоиммунных заболеваниях, инфекциях, и у части здоровых лиц.
    - parameter: anti_ds_dna
      threshold: 10
      unit: МЕ/мл
      condition: '>='
      comment_template: Анти-дсДНК {value} МЕ/мл — повышены, значительно более специфичны для СКВ, чем
        общий ANA, коррелируют с активностью заболевания и риском нефрита.
    - parameter: complement_c3
      threshold: 0.75
      unit: г/л
      condition: <=
      comment_template: Комплемент C3 {value} г/л — снижен, характерно для активного заболевания.
    - parameter: complement_c4
      threshold: 0.1
      unit: г/л
      condition: <=
      comment_template: Комплемент C4 {value} г/л — снижен.
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия, требует исключения волчаночного нефрита.
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    differentials:
    - condition: ''
      text: Другие ревматологические заболевания (смешанное заболевание соединительной ткани, синдром
        Шёгрена), лекарственно-индуцированная волчанка, инфекции (могут давать ложноположительный ANA),
        фибромиалгия (может сопутствовать и усложнять клиническую картину).
    red_flags:
    - condition: urine_protein >= 150 and urine_erythrocytes >= 5
      text: Протеинурия и гематурия одновременно — подозрение на волчаночный нефрит. Требует срочной нефрологической
        оценки и обсуждения биопсии почки для определения класса нефрита, что напрямую влияет на выбор
        терапии.
    treatment_hints:
    - step: Мониторинг анти-дсДНК и комплемента C3/C4 в динамике
      note: Снижение комплемента вместе с ростом анти-дсДНК коррелирует с обострением заболевания.
    - step: Биопсия почки при подозрении на нефрит
      note: Классификация класса волчаночного нефрита определяет тактику иммуносупрессивной терапии.
    references:
    - EULAR recommendations for the management of SLE
    - KDIGO Clinical Practice Guideline on Glomerular Diseases (lupus nephritis)
  vasculitis:
    id: vasculitis
    label: Системный васкулит (предположительно)
    category: Ревматология
    description: Сочетание признаков поражения почек (протеинурия, гематурия) с повышенными маркерами
      воспаления. Паттерн неспецифичен — пересекается с волчаночным нефритом и другими гломерулопатиями;
      ключевой отличающий тест — антинейтрофильные цитоплазматические антитела (ANCA), который не входит
      в набор параметров этого правила и должен быть заказан отдельно при клиническом подозрении.
    criteria:
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия.
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    - parameter: crp
      threshold: 5
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: АНЦА-ассоциированные васкулиты (гранулематоз с полиангиитом, микроскопический полиангиит),
        системная красная волчанка с нефритом, постинфекционный гломерулонефрит, IgA-нефропатия.
    red_flags:
    - condition: urine_protein >= 150 and urine_erythrocytes >= 5 and crp >= 30
      text: Протеинурия и гематурия вместе с выраженным воспалением — подозрение на быстропрогрессирующий
        гломерулонефрит. Требует срочной нефрологической консультации, промедление может привести к необратимой
        потере функции почек.
    treatment_hints:
    - step: ANCA (антитела к протеиназе-3 и миелопероксидазе)
      note: Ключевой тест для подтверждения/исключения АНЦА-ассоциированного васкулита, не входит в текущий
        набор параметров правила.
    - step: Креатинин и СКФ
      note: Оценка тяжести поражения почек на момент выявления.
    - step: Биопсия поражённого органа
      note: Обычно почки — для гистологического подтверждения и определения тактики иммуносупрессии.
    references:
    - KDIGO Clinical Practice Guideline on Glomerular Diseases
    - EULAR recommendations for ANCA-associated vasculitis
  acute_pancreatitis:
    id: acute_pancreatitis
    label: Острый панкреатит
    category: Гастроэнтерология
    description: Значительное повышение амилазы и/или липазы (диагностически значимо — превышение верхней
      границы нормы в 3 раза и более), характерное для острого панкреатита.
    criteria:
    - parameter: amylase
      threshold: 300
      unit: Ед/л
      condition: '>='
      comment_template: Амилаза {value} Ед/л. Менее специфична, чем липаза — может быть повышена при паротите,
        почечной недостаточности, кишечной непроходимости.
    - parameter: lipase
      threshold: 200
      unit: Ед/л
      condition: '>='
      comment_template: Липаза {value} Ед/л — более специфичный маркер панкреатита, чем амилаза.
    differentials:
    - condition: ''
      text: Желчнокаменный панкреатит (наиболее частая причина), алкогольный панкреатит, гипертриглицеридемический
        панкреатит, лекарственно-индуцированный, посттравматический/постЭРХПГ.
    red_flags:
    - condition: lipase > 600
      text: Значительно повышенная липаза — оценить тяжесть по шкале (Ranson, APACHE II или BISAP). Тяжёлый
        острый панкреатит может приводить к полиорганной недостаточности и требует наблюдения в условиях,
        готовых к интенсивной терапии.
    treatment_hints:
    - step: УЗИ брюшной полости в первую очередь
      note: Поиск желчных камней как наиболее частой устранимой причины.
    - step: КТ с контрастом при тяжёлом течении или отсутствии улучшения через 48-72ч
      note: Оценка панкреонекроза и осложнений.
    references:
    - IAP/APA evidence-based guidelines for acute pancreatitis
    - Revised Atlanta classification 2012
  alcoholic_liver_disease:
    id: alcoholic_liver_disease
    label: Алкогольная болезнь печени
    category: Гастроэнтерология
    description: Паттерн АСТ выше АЛТ (соотношение АСТ/АЛТ обычно > 2) с повышенной ГГТ на фоне подтверждённого
      употребления алкоголя — характерно для алкогольного поражения печени.
    criteria:
    - parameter: ggt
      threshold: 80
      unit: Ед/л
      condition: '>='
      comment_template: ГГТ {value} Ед/л — повышена, чувствительный, но не специфичный маркер алкогольного
        поражения печени.
    - parameter: ast
      threshold: 60
      unit: Ед/л
      condition: '>='
      comment_template: АСТ {value} Ед/л.
    - parameter: alt
      threshold: 40
      unit: Ед/л
      condition: '>='
      comment_template: АЛТ {value} Ед/л. Соотношение АСТ/АЛТ > 2 характерно для алкогольной этиологии
        — при вирусных гепатитах и НАЖБП обычно наоборот, АЛТ выше АСТ.
    - parameter: ethanol_blood
      threshold: 0.5
      unit: ‰
      condition: '>='
      comment_template: Этанол в крови {value}‰ — подтверждает недавнее употребление алкоголя.
    differentials:
    - condition: ''
      text: Неалкогольная жировая болезнь печени (НАЖБП), вирусные гепатиты, лекарственное поражение печени,
        гемохроматоз, дефицит альфа-1-антитрипсина.
    red_flags:
    - condition: ast > 200
      text: Значительно повышенная АСТ на фоне алкогольного анамнеза — оценить клинически тяжесть алкогольного
        гепатита (шкала Мэддрея с учётом билирубина и МНО), тяжёлые формы могут требовать кортикостероидной
        терапии.
    treatment_hints:
    - step: Полное прекращение употребления алкоголя
      note: Единственное вмешательство с доказанным влиянием на долгосрочный прогноз.
    - step: УЗИ печени
      note: Оценка стеатоза, признаков фиброза/цирроза.
    references:
    - 'AASLD Practice Guidance: Alcohol-Associated Liver Disease'
  cholelithiasis:
    id: cholelithiasis
    label: Желчнокаменная болезнь (возможный холедохолитиаз)
    category: Гастроэнтерология
    description: Умеренный холестатический лабораторный паттерн, который может указывать на камень в общем
      желчном протоке (холедохолитиаз) или иную обструкцию — при неосложнённой желчнокаменной болезни
      (камни только в желчном пузыре) лабораторные показатели часто остаются в норме.
    criteria:
    - parameter: bilirubin_total
      threshold: 21
      unit: мкмоль/л
      condition: '>='
      comment_template: Билирубин общий {value} мкмоль/л — умеренно повышен.
    - parameter: alkaline_phosphatase
      threshold: 130
      unit: Ед/л
      condition: '>='
      comment_template: Щелочная фосфатаза {value} Ед/л — повышена.
    - parameter: ggt
      threshold: 60
      unit: Ед/л
      condition: '>='
      comment_template: ГГТ {value} Ед/л — повышена, подтверждает печёночное происхождение.
    differentials:
    - condition: ''
      text: Холедохолитиаз (камень в общем желчном протоке — даёт эту лабораторную картину), острый холецистит,
        стриктура желчных путей, опухоль головки поджелудочной железы или желчных путей.
    red_flags:
    - condition: bilirubin_total > 50
      text: Значительно повышенный билирубин. Клинически проверить триаду Шарко (лихорадка + боль в правом
        подреберье + желтуха) — подозрение на восходящий холангит, экстренное состояние.
    treatment_hints:
    - step: УЗИ брюшной полости — метод первой линии
      note: Оценка камней в желчном пузыре и расширения протоков.
    - step: МРХПГ при подозрении на холедохолитиаз
      note: Неинвазивная альтернатива перед решением об ЭРХПГ.
    references:
    - ESGE/EASL Clinical Practice Guidelines on the management of gallstones
  chronic_pancreatitis:
    id: chronic_pancreatitis
    label: Хронический панкреатит (экзокринная недостаточность)
    category: Гастроэнтерология
    description: Сниженная фекальная эластаза-1 указывает на экзокринную недостаточность поджелудочной
      железы, часто вследствие хронического панкреатита.
    criteria:
    - parameter: pancreatic_elastase
      threshold: 200
      unit: мкг/г
      condition: <=
      comment_template: Фекальная эластаза-1 {value} мкг/г — снижена, признак экзокринной недостаточности
        поджелудочной железы.
    differentials:
    - condition: ''
      text: Хронический панкреатит (алкогольный, наследственный, аутоиммунный), муковисцидоз (у молодых
        пациентов), рак поджелудочной железы, состояние после резекции поджелудочной железы.
    red_flags:
    - condition: pancreatic_elastase < 100
      text: Тяжёлая экзокринная недостаточность. При отсутствии предшествующего анамнеза панкреатита,
        особенно у пациентов старшего возраста с необъяснимой потерей веса — важно исключить рак поджелудочной
        железы.
    treatment_hints:
    - step: КТ или МРТ поджелудочной железы
      note: 'Оценка структурных изменений: кальцификаты, атрофия паренхимы, расширение главного протока.'
    - step: Заместительная ферментная терапия при подтверждённой недостаточности
      note: Дозируется по клиническому ответу и стеаторее.
    references:
    - United European Gastroenterology evidence-based guidelines for chronic pancreatitis
  crohns_disease:
    id: crohns_disease
    label: Болезнь Крона
    category: Гастроэнтерология
    description: Повышенный фекальный кальпротектин вместе с системным воспалением (СРБ) и признаками
      хронической потери/мальабсорбции (сниженные альбумин, ферритин) — характерно для активного воспалительного
      заболевания кишечника, в частности болезни Крона (может поражать любой отдел ЖКТ, часто сегментарно).
    criteria:
    - parameter: fecal_calprotectin
      threshold: 120
      unit: мкг/г
      condition: '>='
      comment_template: Фекальный кальпротектин {value} мкг/г — повышен, маркер кишечного воспаления.
    - parameter: crp
      threshold: 10
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен, признак хронического воспаления и/или мальабсорбции.
    - parameter: ferritin
      threshold: 30
      unit: мкг/л
      condition: <=
      comment_template: Ферритин {value} мкг/л — снижен, возможен сопутствующий дефицит железа.
    differentials:
    - condition: ''
      text: Язвенный колит (непрерывное поражение только толстой кишки, в отличие от сегментарного поражения
        при Крона), инфекционный колит, ишемический колит, целиакия (может давать похожую картину мальабсорбции).
    red_flags:
    - condition: fecal_calprotectin > 500 and albumin < 30
      text: Высокий кальпротектин вместе с выраженной гипоальбуминемией — признак тяжёлого активного воспаления
        с нутритивным истощением, повышен риск осложнений (стриктуры, свищи, абсцессы).
    treatment_hints:
    - step: Колоноскопия с биопсией — золотой стандарт
      note: Подтверждение диагноза, определение локализации и протяжённости поражения. Кальпротектин полезен
        для мониторинга активности, не заменяет эндоскопию при первичной диагностике.
    - step: Исключить инфекционную причину перед иммуносупрессией
      note: Посев кала, токсин C. difficile.
    references:
    - ECCO Guidelines on the diagnosis and management of Crohn's disease
  ulcerative_colitis:
    id: ulcerative_colitis
    label: Язвенный колит
    category: Гастроэнтерология
    description: Повышенный фекальный кальпротектин вместе с системным воспалением (СРБ) и сниженным альбумином
      — характерно для активного язвенного колита (непрерывное поражение слизистой толстой кишки, начинается
      от прямой кишки).
    criteria:
    - parameter: fecal_calprotectin
      threshold: 120
      unit: мкг/г
      condition: '>='
      comment_template: Фекальный кальпротектин {value} мкг/г — повышен.
    - parameter: crp
      threshold: 10
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен.
    differentials:
    - condition: ''
      text: Болезнь Крона (сегментарное поражение, может затрагивать любой отдел ЖКТ, часто с образованием
        свищей — в отличие от непрерывного колитического поражения при НЯК), инфекционный колит, ишемический
        колит.
    red_flags:
    - condition: fecal_calprotectin > 500 and crp > 50
      text: Признаки тяжёлой атаки. При остром тяжёлом течении есть риск токсического мегаколона — жизнеугрожающего
        осложнения, требующего экстренной оценки.
    treatment_hints:
    - step: Колоноскопия с биопсией
      note: Подтверждение диагноза и оценка протяжённости поражения.
    - step: При тяжёлой атаке — критерии Truelove-Witts и госпитализация
      note: Внутривенная терапия, исключить C. difficile перед эскалацией иммуносупрессии.
    references:
    - ECCO Guidelines for the management of ulcerative colitis
  inflammatory_bowel_disease:
    id: inflammatory_bowel_disease
    label: Воспалительное заболевание кишечника (неуточнённое)
    category: Гастроэнтерология
    description: 'Обобщённый лабораторный паттерн кишечного воспаления (кальпротектин, альбумин, ферритин).
      Важно: в этой базе есть более специфичные правила `crohns_disease` и `ulcerative_colitis` с частично
      пересекающимися критериями — на практике диагноз ставится как одна из этих двух конкретных форм
      (или неклассифицируемый колит), а не как самостоятельная третья единица. Используйте это правило
      как сигнал «есть кишечное воспаление, нужна дифференциация», а не как отдельный диагноз.'
    criteria:
    - parameter: calprotectin
      threshold: 100
      unit: мкг/г
      condition: '>='
      comment_template: Кальпротектин {value} мкг/г — повышен, маркер кишечного воспаления.
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен.
    - parameter: ferritin
      threshold: 30
      unit: мкг/л
      condition: <=
      comment_template: Ферритин {value} мкг/л — снижен.
    differentials:
    - condition: ''
      text: Болезнь Крона, язвенный колит, неклассифицируемый колит, инфекционный колит (исключить в первую
        очередь при остром начале, особенно после антибиотикотерапии или путешествий).
    red_flags:
    - condition: calprotectin > 500
      text: Высокий кальпротектин — признак тяжёлого активного воспаления, требует своевременной эндоскопической
        оценки для классификации и определения тактики.
    treatment_hints:
    - step: Колоноскопия с биопсией
      note: Необходима для точной классификации (болезнь Крона vs язвенный колит) — от этого зависит тактика
        лечения.
    - step: Исключить инфекционную причину
      note: Посев кала, токсин C. difficile — до начала иммуносупрессивной терапии.
    references:
    - ECCO consensus guidelines on inflammatory bowel disease
  copper_deficiency:
    id: copper_deficiency
    label: Дефицит меди
    category: Витамины и микроэлементы
    description: Медь сыворотки ниже нормы.
    criteria:
    - parameter: copper
      threshold: 11
      unit: мкмоль/л
      condition: <=
      comment_template: Медь {value} мкмоль/л — снижена.
    differentials:
    - condition: ''
      text: Недостаточное питание (в т.ч. парентеральное без добавок), синдромы мальабсорбции (после бариатрической
        хирургии, целиакия), избыточный приём цинка (конкурентно снижает всасывание меди), редко — болезнь
        Менкеса (наследственная, у детей).
    red_flags:
    - condition: copper < 5
      text: Выраженный дефицит. В сочетании с неврологическими симптомами (миелопатия, атаксия) дефицит
        меди может имитировать картину, сходную с B12-дефицитом (подострая комбинированная дегенерация)
        — важно не пропустить как потенциально обратимую причину.
    treatment_hints:
    - step: Уточнить анамнез приёма цинксодержащих добавок
      note: Избыточный цинк — частая устранимая причина.
    - step: При бариатрических операциях в анамнезе — целенаправленный скрининг микроэлементов
      note: Медь, цинк, витамины A/D/E/B12 часто дефицитны совместно.
    references:
    - Общие рекомендации по нутритивной поддержке (ESPEN)
  copper_elevated:
    id: copper_elevated
    label: Повышенная медь сыворотки
    category: Витамины и микроэлементы
    description: Медь сыворотки выше нормы. Интерпретировать вместе с церулоплазмином — большая часть
      меди циркулирует связанной с ним.
    criteria:
    - parameter: copper
      threshold: 24
      unit: мкмоль/л
      condition: '>='
      comment_template: Медь {value} мкмоль/л — повышена.
    differentials:
    - condition: ''
      text: Холестатические заболевания печени, беременность/приём эстрогенов (физиологическое повышение
        церулоплазмина), острая фаза воспаления (медь — острофазовый белок). При болезни Вильсона медь
        сыворотки чаще снижена, а несвязанная (свободная) медь повышена — изолированное повышение общей
        меди этому диагнозу не противоречит, но и не подтверждает его напрямую.
    red_flags:
    - condition: copper > 30
      text: Значительно повышенная медь на фоне признаков поражения печени — требует исключения болезни
        Вильсона (церулоплазмин, суточная экскреция меди с мочой).
    treatment_hints:
    - step: Церулоплазмин
      note: Необходим для корректной интерпретации уровня меди.
    - step: Суточная моча на медь при подозрении на болезнь Вильсона
      note: Особенно у молодых пациентов с необъяснимым поражением печени.
    references:
    - 'EASL Clinical Practice Guidelines: Wilson''s disease'
  folate_deficiency_severe:
    id: folate_deficiency_severe
    label: Тяжёлый дефицит фолиевой кислоты
    category: Витамины и микроэлементы
    description: Значительное снижение фолата сыворотки.
    criteria:
    - parameter: folate
      threshold: 4.0
      unit: нг/мл
      condition: <=
      comment_template: Фолат {value} нг/мл — значительно снижен.
    differentials:
    - condition: ''
      text: Недостаточное питание, синдромы мальабсорбции (целиакия, ВЗК), повышенная потребность (беременность,
        гемолитическая анемия), приём антифолатных препаратов (метотрексат, отдельные противосудорожные),
        хронический алкоголизм.
    red_flags:
    - condition: folate < 2
      text: Выраженный дефицит. Обязательно проверить B12 параллельно — восполнение только фолиевой кислоты
        при недиагностированном дефиците B12 может улучшить показатели крови, но не остановит прогрессирование
        неврологических осложнений B12-дефицита.
    treatment_hints:
    - step: Проверить витамин B12 в этом же заборе
      note: Изолированная коррекция фолата при сопутствующем недиагностированном дефиците B12 клинически
        опасна.
    - step: У женщин детородного возраста — оценить в контексте планирования беременности
      note: Профилактика дефектов нервной трубки плода.
    references:
    - Общие рекомендации по диагностике мегалобластных анемий
  iodine_deficiency:
    id: iodine_deficiency
    label: Дефицит йода
    category: Витамины и микроэлементы
    description: Йод в разовой порции мочи ниже порога ВОЗ для популяционной оценки достаточности потребления
      йода.
    criteria:
    - parameter: iodine_urine
      threshold: 100
      unit: мкг/л
      condition: <=
      comment_template: Йод в моче {value} мкг/л — ниже порога достаточности по критериям ВОЗ.
    differentials:
    - condition: ''
      text: Недостаточное потребление йода с пищей, диета без йодированной соли, проживание в регионах
        с йододефицитными почвами.
    red_flags:
    - condition: iodine_urine < 50
      text: Выраженный дефицит. Особенно значим у беременных — йод критичен для нейроразвития плода.
    treatment_hints:
    - step: Учитывать высокую суточную вариабельность
      note: Разовый анализ мочи плохо отражает индивидуальный статус — надёжен для популяционного скрининга,
        для индивидуальной оценки предпочтительны повторные измерения.
    references:
    - WHO/UNICEF/ICCIDD guidelines for iodine deficiency
  iodine_excess:
    id: iodine_excess
    label: Избыток йода
    category: Витамины и микроэлементы
    description: Йод в моче выше порога ВОЗ, указывающего на избыточное потребление.
    criteria:
    - parameter: iodine_urine
      threshold: 300
      unit: мкг/л
      condition: '>='
      comment_template: Йод в моче {value} мкг/л — избыточное потребление.
    differentials:
    - condition: ''
      text: Избыточное потребление йода (морские водоросли, йодсодержащие добавки), недавнее контрастирование
        йодсодержащим контрастом, приём амиодарона.
    red_flags:
    - condition: iodine_urine > 500
      text: Избыток йода может индуцировать как гипертиреоз (феномен Йода-Базедова), так и гипотиреоз
        (эффект Вольфа-Чайкова), особенно на фоне уже существующей патологии щитовидной железы — оценить
        функцию щитовидной железы.
    treatment_hints:
    - step: ТТГ и свободный Т4
      note: Оценка функции щитовидной железы.
    - step: Уточнить недавние контрастные исследования или приём амиодарона
      note: Частые устранимые причины.
    references:
    - WHO guidance on iodine status assessment
  selenium_deficiency:
    id: selenium_deficiency
    label: Дефицит селена
    category: Витамины и микроэлементы
    description: Селен сыворотки ниже нормы.
    criteria:
    - parameter: selenium_reference
      threshold: 70
      unit: мкг/л
      condition: <=
      comment_template: Селен {value} мкг/л — снижен.
    differentials:
    - condition: ''
      text: Недостаточное питание (регионы с низким содержанием селена в почве), длительное парентеральное
        питание без добавок, синдромы мальабсорбции.
    red_flags:
    - condition: selenium_reference < 40
      text: Тяжёлый дефицит ассоциирован с кардиомиопатией (болезнь Кешана) и артропатией (болезнь Кашина-Бека)
        — не пропустить при необъяснимой кардиомиопатии у пациентов из групп риска (длительное парентеральное
        питание, эндемичные регионы).
    treatment_hints:
    - step: Оценить нутритивный статус в целом
      note: Дефициты микроэлементов часто сочетаются.
    references:
    - Общие рекомендации по нутритивной поддержке
  vitamin_a_deficiency:
    id: vitamin_a_deficiency
    label: Дефицит витамина A
    category: Витамины и микроэлементы
    description: Ретинол сыворотки ниже нормы.
    criteria:
    - parameter: vitamin_a
      threshold: 1.0
      unit: мкмоль/л
      condition: <=
      comment_template: Ретинол {value} мкмоль/л — снижен.
    differentials:
    - condition: ''
      text: Недостаточное питание, синдромы мальабсорбции жиров (муковисцидоз, целиакия, холестатические
        заболевания печени — витамин A жирорастворимый), хронические заболевания печени.
    red_flags:
    - condition: vitamin_a < 0.7
      text: Риск ночной слепоты и ксерофтальмии. При наличии зрительных симптомов — срочная офтальмологическая
        оценка и восполнение, без лечения возможно необратимое повреждение роговицы.
    treatment_hints:
    - step: Оценить статус остальных жирорастворимых витаминов (D, E, K)
      note: При мальабсорбции жиров дефициты часто сочетаются.
    references:
    - 'WHO guideline: Vitamin A supplementation'
  vitamin_b12_deficiency_severe:
    id: vitamin_b12_deficiency_severe
    label: Тяжёлый дефицит витамина B12
    category: Витамины и микроэлементы
    description: Значительное снижение витамина B12.
    criteria:
    - parameter: vitamin_b12
      threshold: 200
      unit: пг/мл
      condition: <=
      comment_template: B12 {value} пг/мл — значительно снижен.
    differentials:
    - condition: ''
      text: Пернициозная анемия (аутоиммунный гастрит, антитела к внутреннему фактору), синдромы мальабсорбции
        (после резекции желудка/подвздошной кишки, целиакия), строгая веганская диета без добавок, длительный
        приём метформина.
    red_flags:
    - condition: vitamin_b12 < 150
      text: 'Неврологические симптомы (парестезии, нарушение походки, когнитивные нарушения) на фоне тяжёлого
        дефицита — подострая комбинированная дегенерация спинного мозга, требует безотлагательного начала
        заместительной терапии: неврологические изменения могут стать необратимыми при промедлении.'
    treatment_hints:
    - step: Антитела к внутреннему фактору и париетальным клеткам
      note: При подозрении на пернициозную анемию.
    - step: Метилмалоновая кислота и гомоцистеин
      note: Более чувствительные функциональные маркеры при пограничных значениях B12.
    references:
    - British Society for Haematology guidelines for the diagnosis of B12 deficiency
  vitamin_d_deficiency_severe:
    id: vitamin_d_deficiency_severe
    label: Тяжёлый дефицит витамина D
    category: Витамины и микроэлементы
    description: Значительное снижение витамина D.
    criteria:
    - parameter: vitamin_d
      threshold: 20
      unit: нг/мл
      condition: <=
      comment_template: Витамин D {value} нг/мл — значительно снижен.
    differentials:
    - condition: ''
      text: Недостаточная инсоляция, недостаточное питание, синдромы мальабсорбции жиров, ХБП (нарушение
        активации витамина D), ожирение (депонирование в жировой ткани снижает биодоступность).
    red_flags:
    - condition: vitamin_d < 10
      text: Крайне выраженный дефицит — риск гипокальциемии и тетании, у детей риск рахита, у взрослых
        остеомаляции (см. также правило `osteomalacia` в этой базе).
    treatment_hints:
    - step: Кальций, фосфат, ПТГ
      note: При выраженном дефиците — оценить признаки вторичного гиперпаратиреоза и нарушения минерализации
        костей.
    references:
    - Endocrine Society Clinical Practice Guideline for Vitamin D deficiency
  vitamin_e_deficiency:
    id: vitamin_e_deficiency
    label: Дефицит витамина E
    category: Витамины и микроэлементы
    description: Токоферол сыворотки ниже нормы.
    criteria:
    - parameter: vitamin_e
      threshold: 5.5
      unit: мг/л
      condition: <=
      comment_template: Витамин E {value} мг/л — снижен.
    differentials:
    - condition: ''
      text: Синдромы мальабсорбции жиров (муковисцидоз, холестаз, абеталипопротеинемия), редко — изолированный
        наследственный дефицит (атаксия с изолированным дефицитом витамина E).
    red_flags:
    - condition: vitamin_e < 3
      text: Длительный дефицит может проявляться атаксией, периферической нейропатией, снижением проприоцепции
        — потенциально предотвратимая причина неврологической дисфункции.
    treatment_hints:
    - step: Оценить статус остальных жирорастворимых витаминов при подозрении на мальабсорбцию
      note: Дефициты A, D, E, K часто сочетаются.
    references:
    - Общие рекомендации по диагностике жирорастворимых дефицитов
  zinc_deficiency:
    id: zinc_deficiency
    label: Дефицит цинка
    category: Витамины и микроэлементы
    description: Цинк сыворотки ниже нормы.
    criteria:
    - parameter: zinc
      threshold: 10
      unit: мкмоль/л
      condition: <=
      comment_template: Цинк {value} мкмоль/л — снижен.
    differentials:
    - condition: ''
      text: Недостаточное питание, синдромы мальабсорбции, повышенные потери (хроническая диарея, ожоги,
        нефротический синдром), редко — акродерматит энтеропатический (наследственный).
    red_flags:
    - condition: zinc < 7
      text: Сочетание с кожными поражениями (периорифициальный/акральный дерматит) и диареей — классическая
        триада тяжёлого дефицита цинка.
    treatment_hints:
    - step: Оценить нутритивный статус
      note: У пациентов на длительном парентеральном питании — целенаправленный контроль микроэлементов.
    - step: Учитывать взаимодействие с медью
      note: Избыточная заместительная терапия цинком может индуцировать вторичный дефицit меди.
    references:
    - Общие рекомендации по нутритивной поддержке
  bacterial_infection_risk:
    id: bacterial_infection_risk
    label: Признаки вероятной бактериальной инфекции
    category: Инфекционные заболевания
    description: Сочетание повышенного СРБ, лейкоцитоза и нейтрофилёза — неспецифичный, но характерный
      паттерн для бактериальной инфекции. Эти маркеры также повышаются при травме, хирургии, стрессе,
      обострении некоторых аутоиммунных заболеваний.
    criteria:
    - parameter: crp
      threshold: 10
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: wbc
      threshold: 11
      unit: ×10⁹/л
      condition: '>='
      comment_template: Лейкоциты {value} ×10⁹/л — повышены.
    - parameter: neutrophils_percent
      threshold: 70
      unit: '%'
      condition: '>='
      comment_template: Нейтрофилы {value}% — повышены, сдвиг в сторону нейтрофилии типичен для бактериальной
        инфекции.
    differentials:
    - condition: ''
      text: Бактериальная инфекция любой локализации. Также — травма, послеоперационный период, стресс-реакция,
        обострение аутоиммунного заболевания.
    red_flags:
    - condition: crp > 100 and wbc > 20
      text: Все маркеры значительно повышены — при наличии лихорадки или признаков органной дисфункции
        расширить обследование на предмет сепсиса (см. правило `sepsis`).
    treatment_hints:
    - step: Искать очаг инфекции
      note: Анамнез, осмотр, визуализация по клинической картине.
    - step: Прокальцитонин
      note: Более специфичен для бактериальной этиологии, чем СРБ/лейкоциты.
    references:
    - IDSA guidelines on the use of inflammatory biomarkers
  hepatitis_b_active:
    id: hepatitis_b_active
    label: Активный гепатит B
    category: Инфекционные заболевания
    description: Положительный HBsAg с определяемой вирусной нагрузкой (HBV DNA) и повышенной АЛТ — признаки
      активной репликации вируса гепатита B.
    criteria:
    - parameter: hbsag
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: HBsAg положителен.
    - parameter: hbv_dna
      threshold: 2000
      unit: МЕ/мл
      condition: '>='
      comment_template: HBV DNA {value} МЕ/мл — определяется активная репликация.
    - parameter: alt
      threshold: 40
      unit: Ед/л
      condition: '>='
      comment_template: АЛТ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Острый гепатит B, обострение хронического гепатита B. При высокой вирусной нагрузке с непропорционально
        высокой АЛТ — проверить коинфекцию дельта-вирусом (HDV).
    red_flags:
    - condition: hbv_dna > 20000
      text: Высокая вирусная нагрузка. В сочетании с признаками печёночной недостаточности (см. правило
        `acute_hepatitis`) — срочное направление к гепатологу.
    treatment_hints:
    - step: HBeAg/anti-HBe
      note: Оценка фазы инфекции.
    - step: Эластография (фиброскан)
      note: Оценка стадии фиброза.
    - step: Скрининг гепатоцеллюлярной карциномы
      note: АФП + УЗИ при циррозе или длительном носительстве.
    references:
    - EASL Clinical Practice Guidelines on the management of hepatitis B
  hepatitis_c_active:
    id: hepatitis_c_active
    label: Активный гепатит C
    category: Инфекционные заболевания
    description: Положительные anti-HCV и определяемая HCV RNA — признак активной репликации вируса (в
      отличие от перенесённой инфекции, при которой anti-HCV положителен, но РНК не определяется).
    criteria:
    - parameter: anti_hcv
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: Anti-HCV положителен.
    - parameter: hcv_rna
      threshold: 0
      unit: МЕ/мл
      condition: '>'
      comment_template: HCV RNA определяется — подтверждает активную репликацию, а не только перенесённый
        контакт с вирусом.
    - parameter: alt
      threshold: 40
      unit: Ед/л
      condition: '>='
      comment_template: АЛТ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Активная репликация HCV любого генотипа. Отличать от спонтанно разрешившейся инфекции (anti-HCV+
        без определяемой РНК).
    red_flags:
    - condition: alt > 100
      text: Значительно повышенная АЛТ — оценить стадию фиброза/цирроза до начала терапии.
    treatment_hints:
    - step: Эластография
      note: Оценка стадии фиброза.
    - step: Направление на противовирусную терапию
      note: Современный стандарт — лечить всех пациентов с подтверждённой виремией, не дожидаясь прогрессирования.
    references:
    - AASLD/IDSA HCV Guidance
  hiv_infection:
    id: hiv_infection
    label: ВИЧ-инфекция
    category: Инфекционные заболевания
    description: Определяемая РНК ВИЧ в плазме.
    criteria:
    - parameter: hiv_rna
      threshold: 1000
      unit: копий/мл
      condition: '>='
      comment_template: РНК ВИЧ {value} копий/мл.
    differentials:
    - condition: ''
      text: Острая ВИЧ-инфекция (высокая вирусная нагрузка на раннем этапе, возможно «серологическое окно»
        с отрицательными антителами), хроническая нелеченная ВИЧ-инфекция, вирусологическая неудача терапии
        у пациентов уже на АРТ.
    red_flags:
    - condition: hiv_rna > 100000
      text: Очень высокая вирусная нагрузка. При сочетании с лихорадкой, сыпью, лимфаденопатией — заподозрить
        острую ретровирусную инфекцию, важно для профилактики передачи и раннего начала терапии.
    treatment_hints:
    - step: Подтверждающий тест антиген/антитела 4-го поколения
      note: Для верификации первичного скрининга.
    - step: Количество CD4
      note: Оценка иммунного статуса, определяет необходимость профилактики оппортунистических инфекций.
    - step: Немедленное начало антиретровирусной терапии
      note: Современный стандарт — независимо от исходного уровня CD4.
    references:
    - DHHS Guidelines for the Use of Antiretroviral Agents in Adults and Adolescents with HIV
  infectious_mononucleosis:
    id: infectious_mononucleosis
    label: Инфекционный мононуклеоз
    category: Инфекционные заболевания
    description: Положительные IgM к капсидному антигену ВЭБ (EBV VCA IgM) вместе с лимфоцитозом — характерно
      для острого инфекционного мононуклеоза.
    criteria:
    - parameter: ebv_vca_igm
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: EBV VCA IgM положителен.
    - parameter: lymphocytes_percent
      threshold: 45
      unit: '%'
      condition: '>='
      comment_template: Лимфоциты {value}% — лимфоцитоз.
    differentials:
    - condition: ''
      text: Инфекционный мононуклеоз (ВЭБ), ЦМВ-мононуклеозоподобный синдром, острая ВИЧ-инфекция (может
        имитировать мононуклеоз), стрептококковый тонзиллофарингит — важно дифференцировать, так как ампициллин/амоксициллин
        при мононуклеозе часто вызывает характерную сыпь.
    red_flags:
    - condition: lymphocytes_percent > 60
      text: 'Выраженный лимфоцитоз, коррелирует с более тяжёлым течением. Клинически проверить спленомегалию
        — риск разрыва селезёнки, обычная рекомендация: ограничение контактных видов спорта на 3-4 недели
        от начала болезни.'
    treatment_hints:
    - step: Осмотр на спленомегалию перед разрешением физической активности
      note: Клиническая, не лабораторная оценка.
    - step: Избегать ампициллина/амоксициллина при подозрении на мононуклеоз
      note: Частая причина ошибочного диагноза «аллергии на пенициллины».
    references:
    - Общие рекомендации по диагностике инфекционного мононуклеоза
  postoperative_inflammation:
    id: postoperative_inflammation
    label: Послеоперационное воспаление
    category: Инфекционные заболевания
    description: 'Повышение СРБ, СОЭ и лейкоцитов после операции. Важно: умеренное повышение этих маркеров
      ожидаемо в первые 2-3 дня после любого вмешательства как физиологическая реакция на хирургическую
      травму — тревожный признак не сам факт повышения, а его чрезмерность или нарастание в динамике вместо
      ожидаемого снижения.'
    criteria:
    - parameter: crp
      threshold: 100
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л.
    - parameter: esr
      threshold: 30
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч.
    - parameter: wbc
      threshold: 11
      unit: ×10⁹/л
      condition: '>='
      comment_template: Лейкоциты {value} ×10⁹/л.
    differentials:
    - condition: ''
      text: Ожидаемая физиологическая послеоперационная реакция, хирургическая инфекция области вмешательства,
        системное осложнение (сепсис, тромбоэмболия с воспалительным компонентом).
    red_flags:
    - condition: crp > 200
      text: Значительное повышение. Нарастание СРБ после 3-4 дня вместо ожидаемого снижения — характерный
        признак развивающегося инфекционного осложнения, требует целенаправленного поиска очага (рана,
        катетеры, лёгкие, мочевыводящие пути).
    treatment_hints:
    - step: Оценивать в динамике, не по одному значению
      note: Тренд важнее абсолютной цифры в раннем послеоперационном периоде.
    - step: Осмотр операционной раны
      note: Первый шаг при подозрении на инфекцию области хирургического вмешательства.
    references:
    - Общие рекомендации по ведению послеоперационного периода
  procalcitonin_bacterial:
    id: procalcitonin_bacterial
    label: Прокальцитонин, признак вероятной бактериальной инфекции
    category: Инфекционные заболевания
    description: Повышенный прокальцитонин — более специфичный маркер бактериальной инфекции, чем СРБ,
      обычно остаётся низким при вирусных инфекциях и неинфекционном воспалении.
    criteria:
    - parameter: procalcitonin
      threshold: 0.5
      unit: нг/мл
      condition: '>='
      comment_template: Прокальцитонин {value} нг/мл — повышен.
    differentials:
    - condition: ''
      text: Бактериальная инфекция (локальная или системная). Также может быть ложноповышен при тяжёлой
        травме, обширных ожогах, некоторых видах шока без инфекции, редко — при медуллярном раке щитовидной
        железы.
    red_flags:
    - condition: procalcitonin > 2
      text: Значительное повышение коррелирует с тяжестью бактериальной инфекции, используется для стратификации
        риска сепсиса.
    treatment_hints:
    - step: Отслеживать в динамике
      note: Снижение прокальцитонина поддерживает решение о деэскалации/отмене антибиотиков (procalcitonin-guided
        therapy).
    references:
    - Рекомендации по применению прокальцитонин-ориентированной терапии
  sepsis:
    id: sepsis
    label: Сепсис
    category: Инфекционные заболевания
    description: Сочетание повышенного прокальцитонина, значительно повышенного СРБ и выраженного лейкоцитоза
      — картина, характерная для сепсиса. В этой базе есть комбинированный диагноз `septic_syndrome` (см.
      `clinical_logic.yaml`), который объединяет это правило с `systemic_inflammation` при их одновременном
      срабатывании.
    criteria:
    - parameter: procalcitonin
      threshold: 0.5
      unit: нг/мл
      condition: '>='
      comment_template: Прокальцитонин {value} нг/мл — повышен.
    - parameter: crp
      threshold: 50
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — значительно повышен.
    - parameter: wbc
      threshold: 15
      unit: ×10⁹/л
      condition: '>='
      comment_template: Лейкоциты {value} ×10⁹/л — выраженный лейкоцитоз.
    differentials:
    - condition: ''
      text: 'Сепсис любой этиологии (чаще грамотрицательные бактерии, но может быть грибковым/вирусным).
        Отличать от синдрома системного воспалительного ответа (SIRS) без инфекции — травма, панкреатит,
        ожоги: тактика в этих случаях иная.'
    red_flags:
    - condition: procalcitonin > 2 and wbc > 20
      text: В сочетании с гипотензией и/или признаками органной дисфункции — критерии септического шока.
        Требует немедленной госпитализации в ОРИТ и начала антибиотикотерапии в течение часа («hour-1
        bundle»).
    treatment_hints:
    - step: Посев крови до начала антибиотикотерапии
      note: Если это не задерживает начало лечения.
    - step: Лактат
      note: Маркер тканевой гипоперфузии.
    - step: Эмпирическая антибиотикотерапия широкого спектра немедленно
      note: С последующей деэскалацией по результатам посевов.
    references:
    - 'Surviving Sepsis Campaign: International Guidelines 2021'
  syphilis_active:
    id: syphilis_active
    label: Активный сифилис (серологически)
    category: Инфекционные заболевания
    description: Одновременно положительные нетрепонемный (RPR) и трепонемный (TPHA) тесты — характерно
      для активной или недавно леченной инфекции. RPR также используется для мониторинга ответа на лечение
      (титр должен снижаться).
    criteria:
    - parameter: rpr_syphilis
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: RPR положителен.
    - parameter: tpha_syphilis
      threshold: 1
      unit: ''
      condition: '>='
      comment_template: TPHA положителен. TPHA более специфичен, чем RPR, и обычно остаётся положительным
        пожизненно даже после успешного лечения.
    differentials:
    - condition: ''
      text: Активный сифилис на любой стадии. Изолированно положительный RPR без TPHA может быть ложноположительным
        (беременность, аутоиммунные заболевания, некоторые другие инфекции).
    red_flags:
    - condition: ''
      text: При наличии неврологических симптомов (независимо от титра RPR/TPHA) — клинически заподозрить
        нейросифилис, требует люмбальной пункции с исследованием ликвора.
    treatment_hints:
    - step: Количественный титр RPR
      note: Для оценки активности и последующего мониторинга ответа на терапию.
    - step: Тестирование на ВИЧ и другие ИППП
      note: Частое сочетание с сифилисом.
    - step: Уведомление и лечение партнёров
      note: Стандарт ведения ИППП.
    references:
    - CDC Sexually Transmitted Infections Treatment Guidelines
  viral_infection_suspect:
    id: viral_infection_suspect
    label: Подозрение на вирусную инфекцию
    category: Инфекционные заболевания
    description: Лимфоцитоз с умеренно повышенным СРБ (в отличие от более выраженного повышения при бактериальной
      инфекции) — неспецифичный паттерн, характерный для вирусных инфекций. В этой базе есть более специфичное
      правило `infectious_mononucleosis` для частного случая ВЭБ-инфекции с соответствующей серологией.
    criteria:
    - parameter: lymphocytes_percent
      threshold: 45
      unit: '%'
      condition: '>='
      comment_template: Лимфоциты {value}% — лимфоцитоз.
    - parameter: crp
      threshold: 5
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — умеренно повышен.
    differentials:
    - condition: ''
      text: Любая вирусная инфекция (ОРВИ, грипп, инфекционный мононуклеоз — см. отдельное правило, острая
        ВИЧ-инфекция). У пожилых пациентов с изолированным лимфоцитозом без острой клиники — держать в
        уме хронические гематологические причины (например хронический лимфолейкоз).
    red_flags:
    - condition: lymphocytes_percent > 70
      text: Выраженный лимфоцитоз. При отсутствии острой инфекционной клиники, особенно у пожилых пациентов
        — рассмотреть необходимость исключения гематологической патологии.
    treatment_hints:
    - step: Оценить клиническую картину (острое начало, лихорадка, катаральные симптомы)
      note: Ключевой фактор дифференциации от хронических гематологических причин лимфоцитоза.
    references:
    - Общие рекомендации по дифференциальной диагностике лимфоцитоза
  basophilia:
    id: basophilia
    label: Базофилия
    category: Гематология
    description: Повышенная доля базофилов в лейкоцитарной формуле.
    criteria:
    - parameter: basophils_percent
      threshold: 1
      unit: '%'
      condition: '>='
      comment_template: Базофилы {value}% — повышены.
    differentials:
    - condition: ''
      text: Аллергические реакции, гипотиреоз, хронические воспалительные состояния. При стойкой значительной
        базофилии — исключить миелопролиферативное заболевание (хронический миелолейкоз, истинная полицитемия).
    red_flags:
    - condition: basophils_percent > 3
      text: Значительная базофилия — при отсутствии явной аллергической/эндокринной причины показано исключение
        миелопролиферативного заболевания.
    treatment_hints:
    - step: Общий анализ крови с ручным подсчётом лейкоцитарной формулы
      note: Автоматические анализаторы могут неточно подсчитывать базофилы при их малом числе.
    references:
    - Общие рекомендации по интерпретации лейкоцитарной формулы
  eosinophilia:
    id: eosinophilia
    label: Эозинофилия
    category: Гематология
    description: Повышенная доля эозинофилов в лейкоцитарной формуле.
    criteria:
    - parameter: eosinophils_percent
      threshold: 5
      unit: '%'
      condition: '>='
      comment_template: Эозинофилы {value}% — повышены.
    differentials:
    - condition: ''
      text: Паразитарные инвазии, аллергия/атопия (астма, атопический дерматит), лекарственная реакция,
        эозинофильные заболевания (эозинофильный эзофагит, гранулематоз с полиангиитом и эозинофилией
        — синдром Черджа-Стросс).
    red_flags:
    - condition: eosinophils_percent > 20
      text: Выраженная эозинофилия — рассмотреть гиперэозинофильный синдром, требует расширенного обследования
        на предмет поражения органов-мишеней (сердце, лёгкие).
    treatment_hints:
    - step: Анализ кала на яйца гельминтов
      note: Особенно при соответствующем эпидемиологическом анамнезе.
    - step: Уточнить лекарственный анамнез
      note: Частая причина — лекарственная реакция.
    references:
    - Общие рекомендации по диагностике эозинофилии
  hemolytic_anemia:
    id: hemolytic_anemia
    label: Гемолитическая анемия (лабораторные признаки гемолиза)
    category: Гематология
    description: Повышенные ЛДГ и непрямой билирубин — классические лабораторные маркеры гемолиза.
    criteria:
    - parameter: ldh
      threshold: 250
      unit: Ед/л
      condition: '>='
      comment_template: ЛДГ {value} Ед/л — повышена.
    - parameter: indirect_bilirubin
      threshold: 17
      unit: мкмоль/л
      condition: '>='
      comment_template: Непрямой билирубин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Аутоиммунная гемолитическая анемия, наследственный сфероцитоз, дефицит Г6ФД, микроангиопатическая
        гемолитическая анемия (тромботическая тромбоцитопеническая пурпура, гемолитико-уремический синдром
        — экстренные состояния), механический гемолиз (протезированный клапан сердца).
    red_flags:
    - condition: ldh > 1000
      text: Значительно повышенная ЛДГ. В сочетании с тромбоцитопенией и шистоцитами в мазке крови — исключить
        микроангиопатическую гемолитическую анемию (ТТП/ГУС), экстренное состояние, требующее немедленной
        консультации гематолога.
    treatment_hints:
    - step: Прямая проба Кумбса
      note: Разделяет иммунный и неиммунный гемолиз.
    - step: Мазок периферической крови
      note: Шистоциты — признак микроангиопатического гемолиза, сфероциты — наследственного сфероцитоза/аутоиммунного
        гемолиза.
    - step: Гаптоглобин
      note: Снижен при внутрисосудистом гемолизе, дополняет картину.
    references:
    - Общие рекомендации по диагностике гемолитических анемий
  ldh_elevated_severe:
    id: ldh_elevated_severe
    label: Значительно повышенная ЛДГ
    category: Гематология
    description: Изолированное значительное повышение ЛДГ — неспецифичный маркер клеточного повреждения/распада.
    criteria:
    - parameter: ldh
      threshold: 250
      unit: Ед/л
      condition: '>='
      comment_template: ЛДГ {value} Ед/л — повышена.
    differentials:
    - condition: ''
      text: Гемолиз, некроз тканей (инфаркт миокарда, инфаркт лёгкого), лимфопролиферативные заболевания
        (особенно агрессивные лимфомы — ЛДГ коррелирует с опухолевой массой), повреждение мышц (рабдомиолиз),
        заболевания печени.
    red_flags:
    - condition: ldh > 1000
      text: Очень высокая ЛДГ без явной причины — у пациентов с лимфаденопатией или В-симптомами (лихорадка,
        ночная потливость, похудание) рассмотреть лимфопролиферативное заболевание.
    treatment_hints:
    - step: Клинический контекст определяет направление поиска
      note: ЛДГ сама по себе крайне неспецифична — интерпретировать вместе с анамнезом и другими находками.
    references:
    - Общие рекомендации по интерпретации ЛДГ
  leukemoid_reaction:
    id: leukemoid_reaction
    label: Лейкемоидная реакция
    category: Гематология
    description: Крайне высокий лейкоцитоз реактивного (не лейкозного) происхождения.
    criteria:
    - parameter: wbc
      threshold: 50
      unit: ×10⁹/л
      condition: '>='
      comment_template: Лейкоциты {value} ×10⁹/л — крайне высокие, требуют дифференциации от лейкоза.
    differentials:
    - condition: ''
      text: Тяжёлая бактериальная инфекция, сепсис, выраженная воспалительная реакция. Требует исключения
        хронического миелолейкоза и других миелопролиферативных заболеваний.
    red_flags:
    - condition: wbc > 100
      text: Крайне выраженный лейкоцитоз — обязательна дифференциация от острого/хронического лейкоза
        (мазок крови на бластные клетки, при необходимости — консультация гематолога).
    treatment_hints:
    - step: Мазок периферической крови с подсчётом формулы
      note: Лейкемоидная реакция обычно даёт сдвиг влево без значимого числа бластов, в отличие от лейкоза.
    - step: Искать очаг тяжёлой инфекции
      note: Наиболее частая причина.
    references:
    - Общие рекомендации по дифференциальной диагностике выраженного лейкоцитоза
  leukocytosis_extreme:
    id: leukocytosis_extreme
    label: Выраженный лейкоцитоз
    category: Гематология
    description: Значительно повышенные лейкоциты.
    criteria:
    - parameter: wbc
      threshold: 25
      unit: ×10⁹/л
      condition: '>='
      comment_template: Лейкоциты {value} ×10⁹/л — значительно повышены.
    differentials:
    - condition: ''
      text: Тяжёлая инфекция/сепсис, выраженная воспалительная реакция, приём кортикостероидов, миелопролиферативные
        заболевания. При очень высоких значениях — см. также `leukemoid_reaction`.
    red_flags:
    - condition: wbc > 50
      text: Приближается к диапазону лейкемоидной реакции — см. соответствующее правило для дифференциации
        от лейкоза.
    treatment_hints:
    - step: Лейкоцитарная формула
      note: Определить, за счёт какой фракции лейкоцитоз (нейтрофилы, лимфоциты и т.д.) для направленного
        поиска причины.
    references:
    - Общие рекомендации по интерпретации лейкоцитоза
  leukocytosis_moderate:
    id: leukocytosis_moderate
    label: Умеренный лейкоцитоз
    category: Гематология
    description: Умеренно повышенные лейкоциты.
    criteria:
    - parameter: wbc
      threshold: 11
      unit: ×10⁹/л
      condition: '>='
      comment_template: Лейкоциты {value} ×10⁹/л — умеренно повышены.
    differentials:
    - condition: ''
      text: Инфекция (бактериальная чаще, чем вирусная), воспаление, стресс-реакция, курение, приём кортикостероидов,
        беременность (физиологическое умеренное повышение).
    red_flags:
    - condition: wbc > 20
      text: Значительный лейкоцитоз для «умеренной» категории — см. `leukocytosis_extreme`.
    treatment_hints:
    - step: Оценить клинический контекст
      note: Умеренный лейкоцитоз часто физиологичен (стресс, курение) — не всегда требует дообследования
        при отсутствии клинических симптомов.
    references:
    - Общие рекомендации по интерпретации лейкоцитоза
  leukopenia:
    id: leukopenia
    label: Лейкопения
    category: Гематология
    description: Сниженное общее число лейкоцитов.
    criteria:
    - parameter: wbc
      threshold: 4.0
      unit: ×10⁹/л
      condition: <=
      comment_template: Лейкоциты {value} ×10⁹/л — снижены.
    differentials:
    - condition: ''
      text: Вирусные инфекции, приём некоторых лекарств (химиотерапия, отдельные антибиотики, антипсихотики),
        аутоиммунные заболевания (СКВ), апластическая анемия, инфильтрация костного мозга.
    red_flags:
    - condition: wbc < 2.0
      text: Выраженная лейкопения — повышенный риск инфекций, особенно если преимущественно за счёт нейтрофилов
        (см. `neutropenia`).
    treatment_hints:
    - step: Лейкоцитарная формула
      note: Определить, какая фракция снижена (нейтропения несёт наибольший инфекционный риск).
    references:
    - Общие рекомендации по диагностике цитопений
  lymphocytosis_extreme:
    id: lymphocytosis_extreme
    label: Выраженный лимфоцитоз
    category: Гематология
    description: Значительно повышенная доля лимфоцитов.
    criteria:
    - parameter: lymphocytes_percent
      threshold: 45
      unit: '%'
      condition: '>='
      comment_template: Лимфоциты {value}% — значительно повышены.
    differentials:
    - condition: ''
      text: Вирусные инфекции (см. `viral_infection_suspect`, `infectious_mononucleosis`), коклюш у детей.
        У пожилых пациентов с изолированным стойким лимфоцитозом без острой инфекционной клиники — рассмотреть
        хронический лимфолейкоз.
    red_flags:
    - condition: lymphocytes_percent > 70
      text: Очень выраженный лимфоцитоз. При отсутствии острой инфекционной картины, особенно у пожилых
        — обследование на предмет лимфопролиферативного заболевания.
    treatment_hints:
    - step: Клиническая картина решает направление поиска
      note: Острое начало с лихорадкой — инфекция; стойкий бессимптомный лимфоцитоз у пожилых — гематологическое
        обследование.
    references:
    - Общие рекомендации по дифференциальной диагностике лимфоцитоза
  lymphopenia:
    id: lymphopenia
    label: Лимфопения
    category: Гематология
    description: Сниженная доля лимфоцитов.
    criteria:
    - parameter: lymphocytes_percent
      threshold: 20
      unit: '%'
      condition: <=
      comment_template: Лимфоциты {value}% — снижены.
    differentials:
    - condition: ''
      text: Острые вирусные инфекции (в т.ч. ВИЧ), приём кортикостероидов, аутоиммунные заболевания, лимфома,
        острый стресс/тяжёлое заболевание (реактивная лимфопения).
    red_flags:
    - condition: lymphocytes_percent < 10
      text: Выраженная лимфопения — при соответствующих факторах риска рассмотреть ВИЧ-инфекцию, также
        повышен риск оппортунистических инфекций.
    treatment_hints:
    - step: Оценить клинический контекст и факторы риска
      note: Приём кортикостероидов и острое тяжёлое заболевание — самые частые причины.
    references:
    - Общие рекомендации по диагностике лимфопении
  macrocytic_anemia:
    id: macrocytic_anemia
    label: Макроцитарная анемия
    category: Гематология
    description: Повышенный средний объём эритроцита (MCV) — характерно для макроцитарной анемии.
    criteria:
    - parameter: mcv
      threshold: 100
      unit: фл
      condition: '>='
      comment_template: MCV {value} фл — повышен.
    differentials:
    - condition: ''
      text: Дефицит витамина B12 (см. `vitamin_b12_deficiency_severe`), дефицит фолиевой кислоты (см.
        `folate_deficiency_severe`), заболевания печени, гипотиреоз, миелодиспластический синдром, хронический
        алкоголизм.
    red_flags:
    - condition: mcv > 120
      text: Выраженная макроцитоз — при отсутствии дефицита B12/фолата и заболеваний печени/щитовидной
        железы рассмотреть миелодиспластический синдром, особенно у пожилых пациентов.
    treatment_hints:
    - step: Витамин B12 и фолиевая кислота
      note: Наиболее частые устранимые причины.
    - step: ТТГ, печёночные пробы
      note: Исключить гипотиреоз и заболевания печени.
    references:
    - Общие рекомендации по диагностике макроцитарных анемий
  monocytosis:
    id: monocytosis
    label: Моноцитоз
    category: Гематология
    description: Повышенная доля моноцитов.
    criteria:
    - parameter: monocytes_percent
      threshold: 10
      unit: '%'
      condition: '>='
      comment_template: Моноциты {value}% — повышены.
    differentials:
    - condition: ''
      text: Хронические инфекции (туберкулёз, инфекционный эндокардит), воспалительные заболевания (ВЗК,
        ревматоидный артрит), период выздоровления после острой инфекции. Стойкий моноцитоз — рассмотреть
        хронический миеломоноцитарный лейкоз, особенно у пожилых.
    red_flags:
    - condition: monocytes_percent > 20
      text: Выраженный моноцитоз — при отсутствии явной инфекционной/воспалительной причины у пожилых
        пациентов рассмотреть миелодиспластическое/миелопролиферативное заболевание.
    treatment_hints:
    - step: Искать очаг хронической инфекции или воспаления
      note: Наиболее частые причины.
    references:
    - Общие рекомендации по дифференциальной диагностике моноцитоза
  neutropenia:
    id: neutropenia
    label: Нейтропения
    category: Гематология
    description: Сниженная доля нейтрофилов — основной фактор риска бактериальных и грибковых инфекций
      среди цитопений.
    criteria:
    - parameter: neutrophils_percent
      threshold: 40
      unit: '%'
      condition: <=
      comment_template: Нейтрофилы {value}% — снижены.
    differentials:
    - condition: ''
      text: Вирусные инфекции, приём лекарств (химиотерапия, некоторые антибиотики, антитиреоидные препараты,
        клозапин), аутоиммунная нейтропения, апластическая анемия, инфильтрация костного мозга.
    red_flags:
    - condition: neutrophils_percent < 20
      text: Выраженная нейтропения. При лихорадке на фоне выраженной нейтропении (фебрильная нейтропения)
        — неотложное состояние, требует немедленной эмпирической антибиотикотерапии широкого спектра.
    treatment_hints:
    - step: Абсолютное число нейтрофилов (АЧН)
      note: Клинически значимее процентной доли для оценки риска инфекции.
    - step: При лихорадке — немедленная оценка на фебрильную нейтропению
      note: Не откладывать эмпирическую антибиотикотерапию в ожидании результатов посевов.
    references:
    - Общие рекомендации по ведению фебрильной нейтропении (IDSA/NCCN)
  neutrophilia:
    id: neutrophilia
    label: Нейтрофилия
    category: Гематология
    description: Повышенная доля нейтрофилов.
    criteria:
    - parameter: neutrophils_percent
      threshold: 70
      unit: '%'
      condition: '>='
      comment_template: Нейтрофилы {value}% — повышены.
    differentials:
    - condition: ''
      text: Бактериальная инфекция, острое воспаление, стресс-реакция, приём кортикостероидов, курение,
        миелопролиферативные заболевания при стойком повышении без явной причины.
    red_flags:
    - condition: neutrophils_percent > 90
      text: Выраженная нейтрофилия — в сочетании с другими признаками инфекции см. `bacterial_infection_risk`,
        `sepsis`.
    treatment_hints:
    - step: Оценить клинический контекст
      note: Наиболее частая причина — бактериальная инфекция или острое воспаление.
    references:
    - Общие рекомендации по интерпретации лейкоцитарной формулы
  pancytopenia:
    id: pancytopenia
    label: Панцитопения
    category: Гематология
    description: Одновременное снижение всех трёх клеточных линий крови (эритроцитов/гемоглобина, лейкоцитов,
      тромбоцитов) — требует срочной оценки, спектр причин широк и включает жизнеугрожающие состояния.
    criteria:
    - parameter: hemoglobin
      threshold: 100
      unit: г/Л
      condition: <=
      comment_template: Гемоглобин {value} г/Л — снижен.
    - parameter: wbc
      threshold: 4.0
      unit: ×10⁹/л
      condition: <=
      comment_template: Лейкоциты {value} ×10⁹/л — снижены.
    - parameter: platelets
      threshold: 100
      unit: ×10⁹/л
      condition: <=
      comment_template: Тромбоциты {value} ×10⁹/л — снижены.
    differentials:
    - condition: ''
      text: Апластическая анемия, инфильтрация костного мозга (острый лейкоз, метастазы солидных опухолей,
        миелофиброз), тяжёлый дефицит B12/фолиевой кислоты, гиперспленизм, миелодиспластический синдром,
        некоторые вирусные инфекции (парвовирус B19), лекарственная токсичность.
    red_flags:
    - condition: hemoglobin <= 70 and platelets <= 20
      text: Тяжёлая панцитопения с критически низкими гемоглобином и тромбоцитами — риск сердечно-сосудистой
        декомпенсации и спонтанного кровотечения одновременно, требует срочной госпитализации и консультации
        гематолога.
    treatment_hints:
    - step: Мазок периферической крови
      note: Поиск бластных клеток, аномальных форм.
    - step: Направление к гематологу для биопсии костного мозга
      note: Ключевое исследование для определения причины панцитопении.
    references:
    - Общие рекомендации по диагностическому поиску при панцитопении
  polycythemia:
    id: polycythemia
    label: Полицитемия / эритроцитоз
    category: Гематология
    description: Повышенный гемоглобин.
    criteria:
    - parameter: hemoglobin
      threshold: 170
      unit: г/Л
      condition: '>='
      comment_template: Гемоглобин {value} г/Л — повышен.
    differentials:
    - condition: ''
      text: Истинная полицитемия (миелопролиферативное заболевание), вторичный эритроцитоз (хроническая
        гипоксия — ХОБЛ, апноэ сна, проживание на высокогорье, курение; опухоли, продуцирующие эритропоэтин),
        относительный эритроцитоз (дегидратация, гемоконцентрация).
    red_flags:
    - condition: hemoglobin > 200
      text: Значительно повышенный гемоглобин — повышенный риск тромбоза, требует оценки на предмет истинной
        полицитемии (мутация JAK2) и своевременного начала терапии.
    treatment_hints:
    - step: Оценить статус гидратации
      note: Исключить относительный (ложный) эритроцитоз перед расширенным обследованием.
    - step: Мутация JAK2, эритропоэтин сыворотки
      note: При подозрении на истинную полицитемию — низкий эритропоэтин при высоком гемоглобине указывает
        на первичный процесс.
    references:
    - Общие рекомендации по диагностике полицитемии (WHO classification of myeloproliferative neoplasms)
  thrombocytopenia_critical:
    id: thrombocytopenia_critical
    label: Критическая тромбоцитопения
    category: Гематология
    description: Критически низкие тромбоциты — высокий риск спонтанного кровотечения.
    criteria:
    - parameter: platelets
      threshold: 20
      unit: ×10⁹/л
      condition: <=
      comment_template: Тромбоциты {value} ×10⁹/л — критически снижены.
    differentials:
    - condition: ''
      text: Иммунная тромбоцитопения (ИТП), апластическая анемия, острый лейкоз, ДВС-синдром, тромботическая
        тромбоцитопеническая пурпура (ТТП — экстренное состояние), лекарственно-индуцированная тромбоцитопения
        (в т.ч. гепарин-индуцированная).
    red_flags:
    - condition: platelets <= 10
      text: Крайне высокий риск спонтанного, в том числе внутричерепного кровотечения. Требует немедленной
        консультации гематолога и, как правило, госпитализации.
    treatment_hints:
    - step: Мазок периферической крови немедленно
      note: Исключить псевдотромбоцитопению (агглютинация в пробирке с ЭДТА) и искать шистоциты (ТТП/ДВС).
    - step: Оценить клинические признаки кровотечения
      note: Петехии, экхимозы, кровоточивость слизистых.
    references:
    - Общие рекомендации по ведению тяжёлой тромбоцитопении
  thrombocytopenia_severe:
    id: thrombocytopenia_severe
    label: Тяжёлая тромбоцитопения
    category: Гематология
    description: Значительно сниженные тромбоциты.
    criteria:
    - parameter: platelets
      threshold: 50
      unit: ×10⁹/л
      condition: <=
      comment_template: Тромбоциты {value} ×10⁹/л — значительно снижены.
    differentials:
    - condition: ''
      text: Иммунная тромбоцитопения, лекарственно-индуцированная тромбоцитопения, гиперспленизм, инфильтрация
        костного мозга, вирусные инфекции.
    red_flags:
    - condition: platelets <= 20
      text: Приближается к критическому диапазону — см. `thrombocytopenia_critical`.
    treatment_hints:
    - step: Мазок периферической крови
      note: Исключить псевдотромбоцитопению и оценить морфологию других клеточных линий.
    references:
    - Общие рекомендации по диагностике тромбоцитопении
  thrombocytosis:
    id: thrombocytosis
    label: Тромбоцитоз
    category: Гематология
    description: Повышенные тромбоциты.
    criteria:
    - parameter: platelets
      threshold: 400
      unit: ×10⁹/л
      condition: '>='
      comment_template: Тромбоциты {value} ×10⁹/л — повышены.
    differentials:
    - condition: ''
      text: Реактивный тромбоцитоз (наиболее частый — воспаление, инфекция, железодефицитная анемия, состояние
        после спленэктомии, кровопотеря) значительно чаще эссенциальной тромбоцитемии (миелопролиферативное
        заболевание).
    red_flags:
    - condition: platelets >= 1000
      text: Выраженный тромбоцитоз — см. `thrombocytosis_extreme`.
    treatment_hints:
    - step: Искать реактивную причину в первую очередь
      note: СРБ, ферритин, недавние операции/кровопотеря — реактивный тромбоцитоз встречается значительно
        чаще первичного.
    references:
    - Общие рекомендации по диагностике тромбоцитоза
  thrombocytosis_extreme:
    id: thrombocytosis_extreme
    label: Выраженный тромбоцитоз
    category: Гематология
    description: Значительно повышенные тромбоциты — при таких значениях повышается вероятность первичного
      (клонального) процесса.
    criteria:
    - parameter: platelets
      threshold: 1000
      unit: ×10⁹/л
      condition: '>='
      comment_template: Тромбоциты {value} ×10⁹/л — значительно повышены.
    differentials:
    - condition: ''
      text: Эссенциальная тромбоцитемия и другие миелопролиферативные заболевания становятся более вероятны
        при таком уровне, хотя реактивные причины (см. `thrombocytosis`) полностью не исключаются.
    red_flags:
    - condition: platelets >= 1500
      text: Крайне высокий тромбоцитоз — парадоксально может сопровождаться как повышенным риском тромбоза,
        так и риском кровотечения (приобретённая болезнь Виллебранда при экстремальном тромбоцитозе).
        Показана консультация гематолога.
    treatment_hints:
    - step: Мутация JAK2/CALR/MPL
      note: При подозрении на эссенциальную тромбоцитемию.
    references:
    - WHO classification of myeloproliferative neoplasms
  venous_thromboembolism:
    id: venous_thromboembolism
    label: Подозрение на венозную тромбоэмболию (по D-димеру)
    category: Гематология
    description: Повышенный D-димер. Высокочувствительный, но низкоспецифичный маркер — используется в
      первую очередь для исключения тромбоза при низкой клинической вероятности, а не для подтверждения
      диагноза.
    criteria:
    - parameter: d_dimer
      threshold: 0.5
      unit: мкг/мл
      condition: '>='
      comment_template: D-димер {value} мкг/мл — повышен.
    differentials:
    - condition: ''
      text: Тромбоз глубоких вен, тромбоэмболия лёгочной артерии. Также повышается при беременности, после
        операций, при воспалении, злокачественных новообразованиях, у пожилых пациентов — специфичность
        падает с возрастом.
    red_flags:
    - condition: d_dimer > 5
      text: Значительно повышенный D-димер при соответствующей клинической картине (боль/отёк конечности,
        одышка, боль в груди) — требует срочной визуализации (УЗИ вен, КТ-ангиография лёгочной артерии).
    treatment_hints:
    - step: Оценить клиническую вероятность (шкала Уэллса)
      note: Отрицательный D-димер при низкой клинической вероятности эффективно исключает ТГВ/ТЭЛА. Положительный
        результат при любой вероятности требует визуализации, а не служит подтверждением диагноза.
    references:
    - ESC Guidelines for the diagnosis and management of acute pulmonary embolism
  afp_elevated:
    id: afp_elevated
    label: Повышенный альфа-фетопротеин (АФП)
    category: Онкомаркеры
    description: Повышенный АФП. Ассоциирован с гепатоцеллюлярной карциномой и герминогенными опухолями
      (несеминомные опухоли яичка/яичника). Онкомаркер — неспецифичный тест, не является диагностическим
      сам по себе и не рекомендован для скрининга бессимптомного населения (кроме отдельно оговорённых
      случаев). Повышение требует клинической оценки и визуализации, а не немедленного заключения о злокачественности.
    criteria:
    - parameter: afp_tumor_marker
      threshold: 10
      unit: МЕ/мл
      condition: '>='
      comment_template: АФП {value} МЕ/мл — повышен.
    differentials:
    - condition: ''
      text: 'Гепатоцеллюлярная карцинома, герминогенные опухоли. Доброкачественные причины: беременность
        (используется как отдельный скрининг дефектов нервной трубки плода), острый/хронический гепатит,
        цирроз печени.'
    red_flags:
    - condition: afp_tumor_marker > 400
      text: Значительное повышение — у пациента с образованием печени на фоне цирроза этот уровень имеет
        высокую диагностическую значимость для гепатоцеллюлярной карциномы.
    treatment_hints:
    - step: УЗИ печени или образования яичка/яичника по клинической картине
      note: Визуализация обязательна перед любыми выводами.
    - step: При циррозе — АФП используется вместе с УЗИ для скрининга ГЦК
      note: Не как самостоятельный тест.
    references:
    - AASLD Practice Guidance for hepatocellular carcinoma
    - Общие рекомендации по ведению герминогенных опухолей
  beta_hcg_tumor_marker_elevated:
    id: beta_hcg_tumor_marker_elevated
    label: Повышенный бета-ХГЧ (онкомаркер)
    category: Онкомаркеры
    description: Повышенный бета-ХГЧ вне контекста беременности. Ассоциирован с герминогенными опухолями
      (хориокарцинома, семинома), пузырным заносом. Онкомаркер — неспецифичный тест, не является диагностическим
      сам по себе и не рекомендован для скрининга бессимптомного населения (кроме отдельно оговорённых
      случаев). Повышение требует клинической оценки и визуализации, а не немедленного заключения о злокачественности.
    criteria:
    - parameter: beta_hcg_tumor_marker
      threshold: 5
      unit: МЕ/л
      condition: '>='
      comment_template: Бета-ХГЧ {value} МЕ/л — повышен.
    differentials:
    - condition: ''
      text: Герминогенные опухоли, пузырный занос, хориокарцинома. У женщин детородного возраста в первую
        очередь исключить беременность.
    red_flags:
    - condition: ''
      text: У женщин детородного возраста беременность должна быть исключена до любой онкологической интерпретации
        этого результата.
    treatment_hints:
    - step: Исключить беременность в первую очередь
      note: У женщин детородного возраста — обязательный первый шаг.
    references:
    - Общие рекомендации по ведению герминогенных опухолей
  ca125_elevated:
    id: ca125_elevated
    label: Повышенный CA-125
    category: Онкомаркеры
    description: Повышенный CA-125. Ассоциирован с эпителиальным раком яичника, но имеет много причин
      ложного повышения, особенно у женщин репродуктивного возраста. Онкомаркер — неспецифичный тест,
      не является диагностическим сам по себе и не рекомендован для скрининга бессимптомного населения
      (кроме отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации, а не
      немедленного заключения о злокачественности.
    criteria:
    - parameter: ca125
      threshold: 35
      unit: Ед/мл
      condition: '>='
      comment_template: CA-125 {value} Ед/мл — повышен.
    differentials:
    - condition: ''
      text: 'Рак яичника. Частые доброкачественные причины: менструация, эндометриоз, миома матки, беременность,
        воспалительные заболевания органов малого таза, асцит любой этиологии, плевральный выпот, сердечная
        недостаточность.'
    red_flags:
    - condition: ca125 > 200
      text: Значительное повышение, особенно в постменопаузе с образованием яичника на УЗИ — существенно
        повышает вероятность злокачественности.
    treatment_hints:
    - step: Трансвагинальное УЗИ
      note: Ключевой метод визуализации при подозрении на образование яичника.
    - step: Расчёт индекса ROMA (совместно с HE4)
      note: Повышает точность оценки риска малигнизации по сравнению с изолированным CA-125.
    references:
    - ACOG guidelines on the evaluation of adnexal masses
  ca15_3_elevated:
    id: ca15_3_elevated
    label: Повышенный CA 15-3
    category: Онкомаркеры
    description: Повышенный CA 15-3. Используется преимущественно для мониторинга уже диагностированного
      рака молочной железы, не рекомендован для первичного скрининга. Онкомаркер — неспецифичный тест,
      не является диагностическим сам по себе и не рекомендован для скрининга бессимптомного населения
      (кроме отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации, а не
      немедленного заключения о злокачественности.
    criteria:
    - parameter: ca153
      threshold: 30
      unit: Ед/мл
      condition: '>='
      comment_template: CA 15-3 {value} Ед/мл — повышен.
    differentials:
    - condition: ''
      text: 'Рак молочной железы (мониторинг, не первичная диагностика). Доброкачественные причины: доброкачественные
        заболевания молочной железы, заболевания печени.'
    red_flags:
    - condition: ''
      text: Нарастание уровня в динамике у пациентки с уже леченным раком молочной железы — повод для
        оценки рецидива.
    treatment_hints:
    - step: Использовать в динамике, не как разовый скрининговый тест
      note: Наибольшая ценность — мониторинг ответа на лечение и выявление рецидива у уже диагностированных
        пациентов.
    references:
    - ASCO guidelines on tumor markers in breast cancer
  ca19_9_elevated:
    id: ca19_9_elevated
    label: Повышенный CA 19-9
    category: Онкомаркеры
    description: Повышенный CA 19-9. Ассоциирован с раком поджелудочной железы, холангиокарциномой, колоректальным
      раком. Значительно повышается при холестазе — важно исключить обструкцию желчных путей перед интерпретацией.
      Онкомаркер — неспецифичный тест, не является диагностическим сам по себе и не рекомендован для скрининга
      бессимптомного населения (кроме отдельно оговорённых случаев). Повышение требует клинической оценки
      и визуализации, а не немедленного заключения о злокачественности.
    criteria:
    - parameter: ca19_9
      threshold: 37
      unit: Ед/мл
      condition: '>='
      comment_template: CA 19-9 {value} Ед/мл — повышен.
    differentials:
    - condition: ''
      text: 'Рак поджелудочной железы, холангиокарцинома, рак желудка/колоректальный рак. Доброкачественные
        причины: холестаз/обструкция желчных путей (может давать очень высокие значения), панкреатит,
        цирроз печени.'
    red_flags:
    - condition: ca19_9 > 1000
      text: Очень высокий уровень — при исключённом холестазе значительно повышает вероятность злокачественного
        процесса, чаще поджелудочной железы или желчных путей.
    treatment_hints:
    - step: Сначала исключить/устранить холестаз
      note: Обструкция желчных путей сама по себе даёт выраженное ложное повышение — интерпретировать
        после устранения обструкции.
    - step: КТ/МРТ поджелудочной железы
      note: При сохраняющемся повышении вне холестаза.
    - step: Учитывать Lewis-негативный фенотип (~5-10% популяции)
      note: У этих пациентов CA 19-9 не синтезируется даже при наличии опухоли — возможен ложноотрицательный
        результат.
    references:
    - NCCN Guidelines for pancreatic adenocarcinoma
  ca50_elevated:
    id: ca50_elevated
    label: Повышенный CA-50
    category: Онкомаркеры
    description: Повышенный CA-50. Спектр ассоциаций схож с CA 19-9 (панкреатический, желудочно-кишечный
      рак), используется реже, обычно вместе с CA 19-9, а не отдельно. Онкомаркер — неспецифичный тест,
      не является диагностическим сам по себе и не рекомендован для скрининга бессимптомного населения
      (кроме отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации, а не
      немедленного заключения о злокачественности.
    criteria:
    - parameter: ca50
      threshold: 20
      unit: Ед/мл
      condition: '>='
      comment_template: CA-50 {value} Ед/мл — повышен.
    differentials:
    - condition: ''
      text: 'Рак поджелудочной железы, желудочно-кишечные опухоли — схожий спектр с CA 19-9. Доброкачественные
        причины: панкреатит, заболевания печени и желчных путей.'
    red_flags:
    - condition: ''
      text: Интерпретировать вместе с CA 19-9 и клинической картиной — изолированное повышение CA-50 без
        других данных малоинформативно.
    treatment_hints:
    - step: Сопоставить с CA 19-9 и визуализацией
      note: Редко используется как самостоятельный тест.
    references:
    - Общие рекомендации по опухолевым маркерам ЖКТ
  ca72_4_elevated:
    id: ca72_4_elevated
    label: Повышенный CA 72-4
    category: Онкомаркеры
    description: Повышенный CA 72-4. Ассоциирован с раком желудка и муцинозным раком яичника. Онкомаркер
      — неспецифичный тест, не является диагностическим сам по себе и не рекомендован для скрининга бессимптомного
      населения (кроме отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации,
      а не немедленного заключения о злокачественности.
    criteria:
    - parameter: ca72_4
      threshold: 6.9
      unit: Ед/мл
      condition: '>='
      comment_template: CA 72-4 {value} Ед/мл — повышен.
    differentials:
    - condition: ''
      text: 'Рак желудка, муцинозный рак яичника. Доброкачественные причины: доброкачественные заболевания
        ЖКТ, панкреатит.'
    red_flags:
    - condition: ''
      text: В сочетании с симптомами со стороны ЖКТ (диспепсия, потеря веса) — показание для эндоскопии
        верхних отделов ЖКТ.
    treatment_hints:
    - step: ЭГДС при симптомах со стороны ЖКТ
      note: Ключевой метод для оценки рака желудка.
    references:
    - Общие рекомендации по опухолевым маркерам ЖКТ
  cea_elevated_non_smoker:
    id: cea_elevated_non_smoker
    label: Повышенный РЭА (некурящие)
    category: Онкомаркеры
    description: Повышенный раково-эмбриональный антиген (РЭА) у некурящего. Наиболее изучен для мониторинга
      колоректального рака, не рекомендован для скрининга в общей популяции. Онкомаркер — неспецифичный
      тест, не является диагностическим сам по себе и не рекомендован для скрининга бессимптомного населения
      (кроме отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации, а не
      немедленного заключения о злокачественности.
    criteria:
    - parameter: cea
      threshold: 3
      unit: нг/мл
      condition: '>='
      comment_template: РЭА {value} нг/мл — повышен (порог для некурящих).
    differentials:
    - condition: ''
      text: 'Колоректальный рак (наиболее изучен), также рак лёгкого, желудка, поджелудочной железы, молочной
        железы. Доброкачественные причины: воспалительные заболевания кишечника, панкреатит, заболевания
        печени, гипотиреоз.'
    red_flags:
    - condition: cea > 20
      text: Значительное повышение — при наличии колоректального рака в анамнезе или подозрении на него
        оценить как признак прогрессирования/рецидива.
    treatment_hints:
    - step: Использовать преимущественно для мониторинга, не для скрининга
      note: Наибольшая ценность — динамика после лечения колоректального рака.
    references:
    - ASCO guidelines on the use of tumor markers in colorectal cancer
  cea_elevated_smoker:
    id: cea_elevated_smoker
    label: Повышенный РЭА (курящие)
    category: Онкомаркеры
    description: Повышенный РЭА у курящего. Курение физиологически повышает базовый уровень РЭА, поэтому
      порог выше, чем у некурящих. Онкомаркер — неспецифичный тест, не является диагностическим сам по
      себе и не рекомендован для скрининга бессимптомного населения (кроме отдельно оговорённых случаев).
      Повышение требует клинической оценки и визуализации, а не немедленного заключения о злокачественности.
    criteria:
    - parameter: cea
      threshold: 5
      unit: нг/мл
      condition: '>='
      comment_template: РЭА {value} нг/мл — повышен (порог для курящих, скорректирован на физиологическое
        повышение от курения).
    differentials:
    - condition: ''
      text: См. `cea_elevated_non_smoker` — тот же спектр причин. Курение само по себе объясняет умеренное
        повышение, но не отменяет необходимость оценки при значительном превышении даже скорректированного
        порога.
    red_flags:
    - condition: cea > 20
      text: Значительное повышение даже с учётом курения — требует дальнейшей оценки.
    treatment_hints:
    - step: Учитывать статус курения при интерпретации в динамике
      note: Отказ от курения может со временем снизить базовый уровень, что стоит учитывать при мониторинге.
    references:
    - ASCO guidelines on the use of tumor markers in colorectal cancer
  chromogranin_a_elevated:
    id: chromogranin_a_elevated
    label: Повышенный хромогранин А
    category: Онкомаркеры
    description: Повышенный хромогранин А. Ассоциирован с нейроэндокринными опухолями. Приём ингибиторов
      протонной помпы — частая причина значимого ложного повышения. Онкомаркер — неспецифичный тест, не
      является диагностическим сам по себе и не рекомендован для скрининга бессимптомного населения (кроме
      отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации, а не немедленного
      заключения о злокачественности.
    criteria:
    - parameter: chromogranin_a
      threshold: 100
      unit: нг/мл
      condition: '>='
      comment_template: Хромогранин А {value} нг/мл — повышен.
    differentials:
    - condition: ''
      text: 'Нейроэндокринные опухоли (карциноид, нейроэндокринные опухоли поджелудочной железы, феохромоцитома).
        Доброкачественные причины: приём ингибиторов протонной помпы (значительное повышение за счёт вторичной
        гипергастринемии), почечная недостаточность, атрофический гастрит, сердечная недостаточность.'
    red_flags:
    - condition: ''
      text: Обязательно уточнить приём ингибиторов протонной помпы перед интерпретацией — одна из самых
        частых причин ложноположительного результата.
    treatment_hints:
    - step: Уточнить и по возможности временно отменить ИПП перед повторным анализом
      note: После согласования с лечащим врачом пациента по основному заболеванию.
    references:
    - ENETS guidelines for neuroendocrine tumors
  cyfra_21_1_elevated:
    id: cyfra_21_1_elevated
    label: Повышенный CYFRA 21-1
    category: Онкомаркеры
    description: Повышенный CYFRA 21-1. Ассоциирован преимущественно с немелкоклеточным раком лёгкого,
      особенно плоскоклеточным. Онкомаркер — неспецифичный тест, не является диагностическим сам по себе
      и не рекомендован для скрининга бессимптомного населения (кроме отдельно оговорённых случаев). Повышение
      требует клинической оценки и визуализации, а не немедленного заключения о злокачественности.
    criteria:
    - parameter: cyfra_21_1
      threshold: 3.3
      unit: нг/мл
      condition: '>='
      comment_template: CYFRA 21-1 {value} нг/мл — повышен.
    differentials:
    - condition: ''
      text: 'Немелкоклеточный рак лёгкого (особенно плоскоклеточный). Доброкачественные причины: доброкачественные
        заболевания лёгких, почечная недостаточность.'
    red_flags:
    - condition: ''
      text: В сочетании с образованием в лёгком на визуализации — дополнительный аргумент в пользу дальнейшего
        онкологического обследования.
    treatment_hints:
    - step: КТ грудной клетки при клиническом подозрении
      note: Маркер дополняет, но не заменяет визуализацию.
    references:
    - Общие рекомендации по опухолевым маркерам рака лёгкого
  he4_elevated:
    id: he4_elevated
    label: Повышенный HE4
    category: Онкомаркеры
    description: Повышенный HE4. Ассоциирован с эпителиальным раком яичника, более специфичен, чем CA-125,
      особенно в пременопаузе (реже ложноположителен при эндометриозе). Онкомаркер — неспецифичный тест,
      не является диагностическим сам по себе и не рекомендован для скрининга бессимптомного населения
      (кроме отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации, а не
      немедленного заключения о злокачественности.
    criteria:
    - parameter: he4
      threshold: 70
      unit: пмоль/л
      condition: '>='
      comment_template: HE4 {value} пмоль/л — повышен.
    differentials:
    - condition: ''
      text: Рак яичника. В отличие от CA-125, значительно реже повышается при эндометриозе и других доброкачественных
        гинекологических состояниях.
    red_flags:
    - condition: ''
      text: Совместно с CA-125 используется для расчёта индекса ROMA — существенно повышает точность оценки
        риска малигнизации образования яичника.
    treatment_hints:
    - step: Расчёт индекса ROMA (совместно с CA-125)
      note: Учитывает менопаузальный статус для расчёта риска.
    references:
    - ACOG guidelines on the evaluation of adnexal masses
  nse_elevated:
    id: nse_elevated
    label: Повышенная нейрон-специфическая енолаза (NSE)
    category: Онкомаркеры
    description: Повышенная NSE. Ассоциирована с мелкоклеточным раком лёгкого, нейробластомой, другими
      нейроэндокринными опухолями. Гемолиз образца — частая преаналитическая причина ложного повышения
      (эритроциты содержат NSE). Онкомаркер — неспецифичный тест, не является диагностическим сам по себе
      и не рекомендован для скрининга бессимптомного населения (кроме отдельно оговорённых случаев). Повышение
      требует клинической оценки и визуализации, а не немедленного заключения о злокачественности.
    criteria:
    - parameter: nse
      threshold: 16.3
      unit: нг/мл
      condition: '>='
      comment_template: NSE {value} нг/мл — повышена.
    differentials:
    - condition: ''
      text: 'Мелкоклеточный рак лёгкого, нейробластома, другие нейроэндокринные опухоли. Доброкачественные
        причины: гемолиз образца, судорожный синдром, черепно-мозговая травма, инсульт.'
    red_flags:
    - condition: ''
      text: Перед интерпретацией уточнить у лаборатории наличие гемолиза в образце — частая причина ложноположительного
        результата, не связанная с онкологией.
    treatment_hints:
    - step: При подозрении на гемолиз — повторить анализ
      note: Исключить преаналитическую причину прежде чем продолжать онкологический поиск.
    references:
    - Общие рекомендации по опухолевым маркерам мелкоклеточного рака лёгкого
  psa_elevated_age_50:
    id: psa_elevated_age_50
    label: Повышенный ПСА (мужчины до 50-59 лет)
    category: Онкомаркеры
    description: Повышенный общий ПСА для возрастной группы до 60 лет. Ассоциирован с раком простаты,
      но доброкачественная гиперплазия простаты (ДГПЖ) — значительно более частая причина повышения. Скрининг
      ПСА у бессимптомных мужчин остаётся предметом дискуссии — решение о тестировании принимается совместно
      с пациентом с обсуждением рисков гипердиагностики. Онкомаркер — неспецифичный тест, не является
      диагностическим сам по себе и не рекомендован для скрининга бессимптомного населения (кроме отдельно
      оговорённых случаев). Повышение требует клинической оценки и визуализации, а не немедленного заключения
      о злокачественности.
    criteria:
    - parameter: psa_total
      threshold: 3.5
      unit: нг/мл
      condition: '>='
      comment_template: ПСА {value} нг/мл — повышен для данной возрастной группы.
    differentials:
    - condition: ''
      text: 'Доброкачественная гиперплазия простаты (наиболее частая причина), простатит, рак простаты.
        Также: недавняя эякуляция, катетеризация мочевого пузыря могут временно повышать уровень.'
    red_flags:
    - condition: psa_total > 10
      text: Значительное повышение существенно увеличивает вероятность рака простаты по сравнению с пограничными
        значениями — приоритетное направление к урологу.
    treatment_hints:
    - step: Соотношение свободный/общий ПСА при пограничных значениях
      note: См. правило `psa_ratio_low` — помогает дифференцировать ДГПЖ от рака.
    - step: Обсудить с пациентом баланс пользы/вреда дальнейшего обследования
      note: Рутинный скрининг ПСА у бессимптомных мужчин — предмет дискуссии в клинических рекомендациях.
    references:
    - EAU-ESTRO-ESUR-SIOG Guidelines on Prostate Cancer
  psa_elevated_age_60:
    id: psa_elevated_age_60
    label: Повышенный ПСА (мужчины 60-69 лет)
    category: Онкомаркеры
    description: Повышенный общий ПСА для возрастной группы 60-69 лет — порог выше, чем для более молодых
      мужчин, так как ПСА физиологически растёт с возрастом (в основном за счёт ДГПЖ). Онкомаркер — неспецифичный
      тест, не является диагностическим сам по себе и не рекомендован для скрининга бессимптомного населения
      (кроме отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации, а не
      немедленного заключения о злокачественности.
    criteria:
    - parameter: psa_total
      threshold: 4.5
      unit: нг/мл
      condition: '>='
      comment_template: ПСА {value} нг/мл — повышен для данной возрастной группы.
    differentials:
    - condition: ''
      text: См. `psa_elevated_age_50` — тот же спектр причин, доброкачественная гиперплазия простаты встречается
        ещё чаще в этой возрастной группе.
    red_flags:
    - condition: psa_total > 10
      text: Значительное повышение — приоритетное направление к урологу.
    treatment_hints:
    - step: Соотношение свободный/общий ПСА при пограничных значениях
      note: См. правило `psa_ratio_low`.
    references:
    - EAU-ESTRO-ESUR-SIOG Guidelines on Prostate Cancer
  psa_elevated_age_70:
    id: psa_elevated_age_70
    label: Повышенный ПСА (мужчины 70+ лет)
    category: Онкомаркеры
    description: Повышенный общий ПСА для возрастной группы 70+ лет — самый высокий возраст-специфичный
      порог, так как физиологический рост ПСА (за счёт ДГПЖ) наиболее выражен в этом возрасте. Онкомаркер
      — неспецифичный тест, не является диагностическим сам по себе и не рекомендован для скрининга бессимптомного
      населения (кроме отдельно оговорённых случаев). Повышение требует клинической оценки и визуализации,
      а не немедленного заключения о злокачественности.
    criteria:
    - parameter: psa_total
      threshold: 6.5
      unit: нг/мл
      condition: '>='
      comment_template: ПСА {value} нг/мл — повышен для данной возрастной группы.
    differentials:
    - condition: ''
      text: См. `psa_elevated_age_50`. В этой возрастной группе также стоит учитывать ожидаемую продолжительность
        жизни и сопутствующие заболевания при решении об инвазивном дообследовании.
    red_flags:
    - condition: psa_total > 10
      text: Значительное повышение — направление к урологу с учётом общего состояния и сопутствующих заболеваний
        пациента.
    treatment_hints:
    - step: Учитывать ожидаемую продолжительность жизни при планировании дальнейшего обследования
      note: Особенно значимо в этой возрастной группе.
    references:
    - EAU-ESTRO-ESUR-SIOG Guidelines on Prostate Cancer
  psa_ratio_low:
    id: psa_ratio_low
    label: Низкое соотношение свободный/общий ПСА
    category: Онкомаркеры
    description: Низкое соотношение свободного ПСА к общему повышает вероятность рака простаты по сравнению
      с доброкачественной гиперплазией при пограничных значениях общего ПСА. Уточняющий, а не самостоятельный
      тест.
    criteria:
    - parameter: psa_ratio
      threshold: 25
      unit: '%'
      condition: <=
      comment_template: Соотношение свободный/общий ПСА {value}% — снижено.
    differentials:
    - condition: ''
      text: Используется при пограничном общем ПСА для дифференциации рака простаты от доброкачественной
        гиперплазии — низкое соотношение смещает вероятность в сторону злокачественного процесса.
    red_flags:
    - condition: psa_ratio <= 10
      text: Очень низкое соотношение при повышенном общем ПСА — значительно повышает вероятность рака
        простаты, приоритетное направление к урологу для решения вопроса о биопсии.
    treatment_hints:
    - step: Интерпретировать вместе с абсолютным значением общего ПСА и возрастом
      note: Изолированно, без контекста общего ПСА, малоинформативен.
    references:
    - EAU-ESTRO-ESUR-SIOG Guidelines on Prostate Cancer
  scc_elevated:
    id: scc_elevated
    label: Повышенный антиген плоскоклеточной карциномы (SCC)
    category: Онкомаркеры
    description: Повышенный SCC-антиген. Ассоциирован с плоскоклеточным раком различных локализаций (шейка
      матки, лёгкое, пищевод, голова и шея, кожа). Онкомаркер — неспецифичный тест, не является диагностическим
      сам по себе и не рекомендован для скрининга бессимптомного населения (кроме отдельно оговорённых
      случаев). Повышение требует клинической оценки и визуализации, а не немедленного заключения о злокачественности.
    criteria:
    - parameter: scc_antigen
      threshold: 1.5
      unit: нг/мл
      condition: '>='
      comment_template: SCC-антиген {value} нг/мл — повышен.
    differentials:
    - condition: ''
      text: 'Плоскоклеточный рак шейки матки, лёгкого, пищевода, головы и шеи, кожи. Доброкачественные
        причины: кожные заболевания (псориаз, экзема), заболевания печени и почек, беременность.'
    red_flags:
    - condition: ''
      text: В сочетании с клиническими признаками поражения конкретной локализации (шейка матки, лёгкое
        и т.д.) — направленное дообследование именно этой области.
    treatment_hints:
    - step: Направленный поиск по клинической картине
      note: Маркер сам по себе не указывает локализацию — нужен клинический контекст.
    references:
    - Общие рекомендации по опухолевым маркерам плоскоклеточного рака
  troponin_i_high:
    id: troponin_i_high
    label: Повышенный тропонин I
    category: Кардиология
    description: Повышенный кардиоспецифичный тропонин I — маркер повреждения миокарда. Любой один из
      кардиомаркеров (тропонин I, тропонин T, КФК-МВ) уже достаточен для клинического подозрения на острый
      коронарный синдром — не требуется одновременное повышение всех.
    criteria:
    - parameter: troponin_i
      threshold: 40
      unit: нг/л
      condition: '>='
      comment_template: Тропонин I {value} нг/л — повышен.
    differentials:
    - condition: ''
      text: Острый коронарный синдром, миокардит, тромбоэмболия лёгочной артерии, сепсис с миокардиальной
        депрессией, хроническая почечная недостаточность (может давать хронически повышенный уровень без
        острого события).
    red_flags:
    - condition: troponin_i >= 100
      text: Значительное повышение — см. также `acute_myocardial_infarction_troponin_i` для более строгого
        диагностического порога.
    treatment_hints:
    - step: Динамика тропонина (повторный забор через 1-3 часа)
      note: Нарастание/снижение в динамике — ключ к дифференциации острого события от хронически повышенного
        уровня.
    - step: ЭКГ немедленно
      note: Параллельно с лабораторной оценкой, не дожидаясь результата тропонина.
    references:
    - ESC Guidelines for the management of acute coronary syndromes
  troponin_t_high:
    id: troponin_t_high
    label: Повышенный тропонин T
    category: Кардиология
    description: Повышенный кардиоспецифичный тропонин T. Клинически эквивалентен тропонину I как маркер
      повреждения миокарда — используется тот тест, что доступен в конкретной лаборатории.
    criteria:
    - parameter: troponin_t
      threshold: 14
      unit: нг/л
      condition: '>='
      comment_template: Тропонин T {value} нг/л — повышен.
    differentials:
    - condition: ''
      text: См. `troponin_i_high` — тот же спектр причин.
    red_flags:
    - condition: troponin_t >= 100
      text: Значительное повышение — см. также `acute_myocardial_infarction_troponin_t`.
    treatment_hints:
    - step: Динамика в повторных заборах
      note: См. `troponin_i_high`.
    references:
    - ESC Guidelines for the management of acute coronary syndromes
  ck_mb_elevated:
    id: ck_mb_elevated
    label: Повышенный КФК-МВ
    category: Кардиология
    description: Повышенная МВ-фракция креатинфосфокиназы — менее специфичный маркер повреждения миокарда,
      чем тропонины (также присутствует в скелетных мышцах), но остаётся полезным при их недоступности
      или для оценки повторного инфаркта (тропонин остаётся повышенным дольше, что затрудняет диагностику
      реинфаркта).
    criteria:
    - parameter: ck_mb
      threshold: 25
      unit: Ед/л
      condition: '>='
      comment_template: КФК-МВ {value} Ед/л — повышен.
    differentials:
    - condition: ''
      text: Острый коронарный синдром, повреждение скелетных мышц (травма, интенсивная физическая нагрузка,
        миозит) — менее специфичен, чем тропонины.
    red_flags:
    - condition: ''
      text: Полезен для оценки повторного инфаркта в первые дни после первого события — тропонин остаётся
        повышенным до 1-2 недель, что затрудняет обнаружение нового повреждения по одному лишь тропонину.
    treatment_hints:
    - step: Интерпретировать вместе с тропонином, не заменять его
      note: Тропонин остаётся более чувствительным и специфичным маркером первичной диагностики.
    references:
    - ESC Guidelines for the management of acute coronary syndromes
  acute_myocardial_infarction_troponin_i:
    id: acute_myocardial_infarction_troponin_i
    label: Тропонин I на уровне, характерном для инфаркта миокарда
    category: Кардиология
    description: Тропонин I значительно выше базового порога повреждения миокарда — уровень, более специфично
      указывающий на острый инфаркт, а не пограничное повреждение другой этиологии.
    criteria:
    - parameter: troponin_i
      threshold: 100
      unit: нг/л
      condition: '>='
      comment_template: Тропонин I {value} нг/л — значительно повышен.
    differentials:
    - condition: ''
      text: Острый инфаркт миокарда, тяжёлый миокардит, тяжёлая тромбоэмболия лёгочной артерии с перегрузкой
        правого желудочка.
    red_flags:
    - condition: troponin_i >= 200
      text: Крайне высокий уровень — см. `myocardial_infarction_severe`.
    treatment_hints:
    - step: ЭКГ и клиническая картина в комплексе
      note: Диагноз ИМ не ставится по одному лабораторному значению — универсальное определение ИМ требует
        динамики тропонина плюс хотя бы один клинический критерий (симптомы ишемии, изменения ЭКГ, визуализация).
    references:
    - Fourth Universal Definition of Myocardial Infarction (ESC/ACC/AHA/WHF)
  acute_myocardial_infarction_troponin_t:
    id: acute_myocardial_infarction_troponin_t
    label: Тропонин T на уровне, характерном для инфаркта миокарда
    category: Кардиология
    description: Тропонин T значительно выше базового порога повреждения миокарда.
    criteria:
    - parameter: troponin_t
      threshold: 100
      unit: нг/л
      condition: '>='
      comment_template: Тропонин T {value} нг/л — значительно повышен.
    differentials:
    - condition: ''
      text: См. `acute_myocardial_infarction_troponin_i` — тот же спектр причин.
    red_flags:
    - condition: ''
      text: Диагноз ИМ требует динамики тропонина плюс хотя бы один клинический критерий (симптомы ишемии,
        изменения ЭКГ, визуализация), не ставится по одному значению.
    treatment_hints:
    - step: ЭКГ и клиническая картина в комплексе
      note: См. `acute_myocardial_infarction_troponin_i`.
    references:
    - Fourth Universal Definition of Myocardial Infarction (ESC/ACC/AHA/WHF)
  myocardial_infarction_severe:
    id: myocardial_infarction_severe
    label: Тропонин I на уровне тяжёлого повреждения миокарда
    category: Кардиология
    description: Крайне высокий уровень тропонина I — обычно соответствует обширной зоне повреждения миокарда.
    criteria:
    - parameter: troponin_i
      threshold: 200
      unit: нг/л
      condition: '>='
      comment_template: Тропонин I {value} нг/л — крайне высокий уровень.
    differentials:
    - condition: ''
      text: Обширный инфаркт миокарда, тяжёлый миокардит с выраженным повреждением.
    red_flags:
    - condition: ''
      text: Уровень такой степени обычно ассоциирован с большей зоной поражения и более высоким риском
        осложнений (сердечная недостаточность, аритмии) — требует немедленной кардиологической оценки,
        если ещё не проведена.
    treatment_hints:
    - step: Экстренная кардиологическая консультация, если ещё не выполнена
      note: При соответствующей клинической картине — рассмотреть срочную реваскуляризацию.
    references:
    - Fourth Universal Definition of Myocardial Infarction (ESC/ACC/AHA/WHF)
  myoglobin_elevated:
    id: myoglobin_elevated
    label: Повышенный миоглобин
    category: Кардиология
    description: Повышенный миоглобин — ранний, но крайне неспецифичный маркер повреждения мышечной ткани
      (включая миокард). Повышается раньше тропонина, но также при любом повреждении скелетных мышц.
    criteria:
    - parameter: myoglobin
      threshold: 106
      unit: мкг/л
      condition: '>='
      comment_template: Миоглобин {value} мкг/л — повышен.
    differentials:
    - condition: ''
      text: Раннее повреждение миокарда, повреждение скелетных мышц (травма, интенсивная нагрузка, рабдомиолиз),
        почечная недостаточность (снижение выведения).
    red_flags:
    - condition: ''
      text: Крайне неспецифичен сам по себе — не использовать изолированно для диагностики поражения миокарда,
        обязательно подтверждать тропонином.
    treatment_hints:
    - step: Подтвердить тропонином
      note: Миоглобин полезен только как ранний, дополняющий тропонин маркер, не как самостоятельный диагностический
        тест.
    references:
    - Общие рекомендации по кардиомаркерам
  bnp_elevated:
    id: bnp_elevated
    label: Повышенный BNP
    category: Кардиология
    description: Повышенный мозговой натрийуретический пептид (BNP) — маркер перегрузки/растяжения миокарда,
      характерен для сердечной недостаточности, но неспецифичен.
    criteria:
    - parameter: bnp
      threshold: 100
      unit: пг/мл
      condition: '>='
      comment_template: BNP {value} пг/мл — повышен.
    differentials:
    - condition: ''
      text: Сердечная недостаточность (любой этиологии), тромбоэмболия лёгочной артерии с перегрузкой
        правых отделов, почечная недостаточность (снижение выведения), пожилой возраст (физиологическое
        повышение).
    red_flags:
    - condition: bnp >= 500
      text: Значительное повышение — см. также `heart_failure_decompensation`.
    treatment_hints:
    - step: ЭхоКГ
      note: Ключевой метод оценки структуры и функции сердца при подозрении на сердечную недостаточность.
    - step: Учитывать возраст, пол, почечную функцию, ожирение при интерпретации
      note: Все эти факторы влияют на базовый уровень BNP.
    references:
    - ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
  nt_probnp_elevated:
    id: nt_probnp_elevated
    label: Повышенный NT-proBNP
    category: Кардиология
    description: Повышенный N-концевой промозговой натрийуретический пептид (NT-proBNP) — альтернатива
      BNP с более длительным периодом полувыведения, чаще используется для исключения сердечной недостаточности
      благодаря высокой отрицательной прогностической ценности при низком уровне.
    criteria:
    - parameter: nt_probnp
      threshold: 125
      unit: пг/мл
      condition: '>='
      comment_template: NT-proBNP {value} пг/мл — повышен.
    differentials:
    - condition: ''
      text: См. `bnp_elevated` — тот же спектр причин. NT-proBNP сильнее зависит от функции почек, чем
        BNP.
    red_flags:
    - condition: nt_probnp >= 1200
      text: Значительное повышение — см. также `heart_failure_nyha_4`.
    treatment_hints:
    - step: ЭхоКГ
      note: См. `bnp_elevated`.
    references:
    - ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
  heart_failure_nyha_2_bnp:
    id: heart_failure_nyha_2_bnp
    label: BNP, соответствующий сердечной недостаточности NYHA II
    category: Кардиология
    description: Уровень BNP, типично соответствующий функциональному классу NYHA II (незначительное ограничение
      физической активности) при уже установленном диагнозе сердечной недостаточности.
    criteria:
    - parameter: bnp
      threshold: 100
      unit: пг/мл
      condition: '>='
      comment_template: BNP {value} пг/мл — соответствует диапазону NYHA II.
    differentials:
    - condition: ''
      text: Функциональный класс определяется прежде всего клинически (переносимость нагрузки), лабораторный
        уровень лишь ориентировочно с ним коррелирует — не заменяет клиническую оценку.
    red_flags:
    - condition: ''
      text: Нарастание уровня в динамике на фоне лечения — сигнал ухудшения, требует пересмотра терапии.
    treatment_hints:
    - step: Оценивать в динамике вместе с клинической переносимостью нагрузки
      note: Разовое значение малоинформативно без контекста предыдущих измерений.
    references:
    - ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
  heart_failure_nyha_2_nt_probnp:
    id: heart_failure_nyha_2_nt_probnp
    label: NT-proBNP, соответствующий сердечной недостаточности NYHA II
    category: Кардиология
    description: Уровень NT-proBNP, типично соответствующий функциональному классу NYHA II.
    criteria:
    - parameter: nt_probnp
      threshold: 300
      unit: пг/мл
      condition: '>='
      comment_template: NT-proBNP {value} пг/мл — соответствует диапазону NYHA II.
    differentials:
    - condition: ''
      text: См. `heart_failure_nyha_2_bnp`.
    red_flags:
    - condition: ''
      text: Нарастание уровня в динамике — сигнал ухудшения.
    treatment_hints:
    - step: Оценивать в динамике
      note: См. `heart_failure_nyha_2_bnp`.
    references:
    - ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
  heart_failure_nyha_3_bnp:
    id: heart_failure_nyha_3_bnp
    label: BNP, соответствующий сердечной недостаточности NYHA III
    category: Кардиология
    description: Уровень BNP, типично соответствующий функциональному классу NYHA III (значительное ограничение
      физической активности).
    criteria:
    - parameter: bnp
      threshold: 200
      unit: пг/мл
      condition: '>='
      comment_template: BNP {value} пг/мл — соответствует диапазону NYHA III.
    differentials:
    - condition: ''
      text: См. `heart_failure_nyha_2_bnp` — тот же принцип, более выраженная степень.
    red_flags:
    - condition: ''
      text: На этом уровне тяжести — оценить оптимизацию терапии по действующим рекомендациям (ингибиторы
        РААС/АРНИ, бета-блокаторы, антагонисты минералокортикоидных рецепторов, при показаниях — устройства).
    treatment_hints:
    - step: Пересмотреть полноту терапии по рекомендациям ESC
      note: NYHA III — показание для оценки расширенных вариантов лечения.
    references:
    - ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
  heart_failure_nyha_3_nt_probnp:
    id: heart_failure_nyha_3_nt_probnp
    label: NT-proBNP, соответствующий сердечной недостаточности NYHA III
    category: Кардиология
    description: Уровень NT-proBNP, типично соответствующий функциональному классу NYHA III.
    criteria:
    - parameter: nt_probnp
      threshold: 600
      unit: пг/мл
      condition: '>='
      comment_template: NT-proBNP {value} пг/мл — соответствует диапазону NYHA III.
    differentials:
    - condition: ''
      text: См. `heart_failure_nyha_3_bnp`.
    red_flags:
    - condition: ''
      text: См. `heart_failure_nyha_3_bnp` — оценить полноту терапии.
    treatment_hints:
    - step: Пересмотреть полноту терапии
      note: См. `heart_failure_nyha_3_bnp`.
    references:
    - ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
  heart_failure_nyha_4_bnp:
    id: heart_failure_nyha_4_bnp
    label: BNP, соответствующий сердечной недостаточности NYHA IV
    category: Кардиология
    description: Уровень BNP, типично соответствующий функциональному классу NYHA IV (симптомы в покое)
      — наиболее тяжёлый функциональный класс.
    criteria:
    - parameter: bnp
      threshold: 400
      unit: пг/мл
      condition: '>='
      comment_template: BNP {value} пг/мл — соответствует диапазону NYHA IV.
    differentials:
    - condition: ''
      text: Тяжёлая сердечная недостаточность. При симптомах в покое — оценить необходимость госпитализации.
    red_flags:
    - condition: ''
      text: NYHA IV — тяжёлый функциональный класс, симптомы в покое. Требует срочной кардиологической
        оценки и, при признаках декомпенсации, госпитализации.
    treatment_hints:
    - step: Срочная кардиологическая консультация
      note: Оценка показаний к расширенной терапии (в т.ч. устройства, трансплантация в отдельных случаях).
    references:
    - ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
  heart_failure_nyha_4_nt_probnp:
    id: heart_failure_nyha_4_nt_probnp
    label: NT-proBNP, соответствующий сердечной недостаточности NYHA IV
    category: Кардиология
    description: Уровень NT-proBNP, типично соответствующий функциональному классу NYHA IV.
    criteria:
    - parameter: nt_probnp
      threshold: 1200
      unit: пг/мл
      condition: '>='
      comment_template: NT-proBNP {value} пг/мл — соответствует диапазону NYHA IV.
    differentials:
    - condition: ''
      text: См. `heart_failure_nyha_4_bnp`.
    red_flags:
    - condition: ''
      text: См. `heart_failure_nyha_4_bnp` — срочная оценка.
    treatment_hints:
    - step: Срочная кардиологическая консультация
      note: См. `heart_failure_nyha_4_bnp`.
    references:
    - ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure
  heart_failure_decompensation:
    id: heart_failure_decompensation
    label: Признаки острой декомпенсации сердечной недостаточности
    category: Кардиология
    description: Уровень BNP, характерный для острой декомпенсации сердечной недостаточности — выше типичного
      хронического уровня NYHA IV.
    criteria:
    - parameter: bnp
      threshold: 500
      unit: пг/мл
      condition: '>='
      comment_template: BNP {value} пг/мл — характерно для острой декомпенсации.
    differentials:
    - condition: ''
      text: Острая декомпенсация ранее стабильной хронической сердечной недостаточности, впервые выявленная
        острая сердечная недостаточность.
    red_flags:
    - condition: bnp >= 1000
      text: Очень высокий уровень при клинической картине острой одышки — требует немедленной оценки на
        предмет госпитализации.
    treatment_hints:
    - step: Оценить клинические признаки перегрузки объёмом
      note: Отёки, влажные хрипы, набухание шейных вен — определяют неотложность и тактику (диуретики,
        вазодилататоры).
    references:
    - ESC Guidelines for acute heart failure
  d_dimer_elevated:
    id: d_dimer_elevated
    label: Повышенный D-димер
    category: Кардиология
    description: Повышенный D-димер. Высокочувствительный, но низкоспецифичный маркер — в первую очередь
      используется для исключения венозной тромбоэмболии при низкой клинической вероятности, а не для
      подтверждения диагноза.
    criteria:
    - parameter: d_dimer
      threshold: 0.5
      unit: мкг/мл
      condition: '>='
      comment_template: D-димер {value} мкг/мл — повышен.
    differentials:
    - condition: ''
      text: Тромбоз глубоких вен, тромбоэмболия лёгочной артерии. Также повышается при беременности, после
        операций, при воспалении, злокачественных новообразованиях, у пожилых пациентов.
    red_flags:
    - condition: d_dimer >= 2.0
      text: Значительное повышение — см. также `pulmonary_embolism_high_risk`.
    treatment_hints:
    - step: Оценить клиническую вероятность (шкала Уэллса) перед интерпретацией
      note: Отрицательный D-димер при низкой клинической вероятности эффективно исключает ТГВ/ТЭЛА без
        визуализации.
    references:
    - ESC Guidelines for the diagnosis and management of acute pulmonary embolism
  dilated_cardiomyopathy_marker:
    id: dilated_cardiomyopathy_marker
    label: NT-proBNP на уровне, характерном для дилатационной кардиомиопатии
    category: Кардиология
    description: Значительно повышенный NT-proBNP вне контекста острого коронарного события — может отражать
      выраженную дилатацию и снижение сократимости желудочков.
    criteria:
    - parameter: nt_probnp
      threshold: 1000
      unit: пг/мл
      condition: '>='
      comment_template: NT-proBNP {value} пг/мл — значительно повышен.
    differentials:
    - condition: ''
      text: Дилатационная кардиомиопатия (идиопатическая, семейная, вследствие миокардита, токсическая
        — алкоголь, химиотерапия), терминальная стадия сердечной недостаточности другой этиологии.
    red_flags:
    - condition: ''
      text: Требует ЭхоКГ для оценки фракции выброса и размеров камер сердца — лабораторное значение само
        по себе не устанавливает диагноз кардиомиопатии.
    treatment_hints:
    - step: ЭхоКГ
      note: Ключевое исследование для подтверждения дилатации и оценки систолической функции.
    - step: Уточнить семейный анамнез и токсические воздействия
      note: Алкоголь, кардиотоксичная химиотерапия, семейные случаи кардиомиопатии.
    references:
    - ESC Guidelines on cardiomyopathies
  familial_hypercholesterolemia_cholesterol_total:
    id: familial_hypercholesterolemia_cholesterol_total
    label: Общий холестерин на уровне, подозрительном для семейной гиперхолестеринемии
    category: Кардиология
    description: Значительно повышенный общий холестерин — при отсутствии вторичных причин повышает вероятность
      семейной гиперхолестеринемии, особенно при раннем начале сердечно-сосудистых заболеваний в семье.
    criteria:
    - parameter: cholesterol_total
      threshold: 6.2
      unit: ммоль/л
      condition: '>='
      comment_template: Общий холестерин {value} ммоль/л — значительно повышен.
    differentials:
    - condition: ''
      text: Семейная гиперхолестеринемия (моногенное наследственное заболевание), вторичная гиперхолестеринемия
        (гипотиреоз, нефротический синдром, холестаз, некоторые лекарства). Диагноз семейной формы клинически
        опирается на комплексные критерии (например Dutch Lipid Clinic Score), не только на уровень холестерина.
    red_flags:
    - condition: ''
      text: В сочетании с ранним началом ИБС в семейном анамнезе (у родственников первой линии до 55 лет
        у мужчин/60 лет у женщин) или сухожильными ксантомами — существенно повышает вероятность семейной
        формы.
    treatment_hints:
    - step: Исключить вторичные причины
      note: ТТГ, функция почек и печени.
    - step: Собрать семейный анамнез ранних сердечно-сосудистых событий
      note: Ключевой элемент клинических критериев диагностики.
    - step: Каскадный скрининг родственников при подтверждении диагноза
      note: Семейная гиперхолестеринемия — аутосомно-доминантное заболевание.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  familial_hypercholesterolemia_ldl_cholesterol:
    id: familial_hypercholesterolemia_ldl_cholesterol
    label: ЛПНП на уровне, подозрительном для семейной гиперхолестеринемии
    category: Кардиология
    description: Значительно повышенный холестерин ЛПНП — более специфичный компонент липидного профиля
      для оценки семейной гиперхолестеринемии, чем общий холестерин.
    criteria:
    - parameter: ldl_cholesterol
      threshold: 4.0
      unit: ммоль/л
      condition: '>='
      comment_template: ЛПНП {value} ммоль/л — значительно повышен.
    differentials:
    - condition: ''
      text: См. `familial_hypercholesterolemia_cholesterol_total` — тот же спектр причин.
    red_flags:
    - condition: ldl_cholesterol >= 5.0
      text: Очень высокий уровень ЛПНП без вторичной причины у молодого пациента — веский повод для генетического
        тестирования на семейную гиперхолестеринемию.
    treatment_hints:
    - step: Каскадный скрининг родственников при подтверждении
      note: См. `familial_hypercholesterolemia_cholesterol_total`.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  infective_endocarditis_risk_crp:
    id: infective_endocarditis_risk_crp
    label: СРБ в контексте подозрения на инфекционный эндокардит
    category: Кардиология
    description: Повышенный СРБ у пациента с факторами риска эндокардита (протезированный клапан, врождённый
      порок сердца, внутривенное употребление наркотиков, недавняя бактериемия) — неспецифичный, но часто
      отслеживаемый маркер активности процесса.
    criteria:
    - parameter: crp
      threshold: 100
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — значительно повышен.
    differentials:
    - condition: ''
      text: Инфекционный эндокардит у пациентов с факторами риска. Также любая другая тяжёлая бактериальная
        инфекция — маркер сам по себе не специфичен для эндокардита.
    red_flags:
    - condition: ''
      text: При наличии факторов риска (протезированный клапан, лихорадка, новый шум в сердце) — критерии
        Duke для диагностики эндокардита требуют эхокардиографии и посевов крови, лабораторные маркеры
        воспаления их не заменяют.
    treatment_hints:
    - step: Посевы крови (минимум 3 забора до антибиотиков)
      note: Ключевой диагностический критерий Duke.
    - step: ЭхоКГ (трансторакальная, при необходимости чреспищеводная)
      note: Поиск вегетаций — второй ключевой критерий Duke.
    references:
    - ESC Guidelines for the management of infective endocarditis
  infective_endocarditis_risk_esr:
    id: infective_endocarditis_risk_esr
    label: СОЭ в контексте подозрения на инфекционный эндокардит
    category: Кардиология
    description: Повышенная СОЭ у пациента с факторами риска эндокардита.
    criteria:
    - parameter: esr
      threshold: 40
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: См. `infective_endocarditis_risk_crp` — тот же контекст.
    red_flags:
    - condition: ''
      text: См. `infective_endocarditis_risk_crp` — критерии Duke требуют посевов и ЭхоКГ.
    treatment_hints:
    - step: Посевы крови и ЭхоКГ
      note: См. `infective_endocarditis_risk_crp`.
    references:
    - ESC Guidelines for the management of infective endocarditis
  infective_endocarditis_risk_procalcitonin:
    id: infective_endocarditis_risk_procalcitonin
    label: Прокальцитонин в контексте подозрения на инфекционный эндокардит
    category: Кардиология
    description: Повышенный прокальцитонин у пациента с факторами риска эндокардита — более специфичен
      для бактериальной этиологии, чем СРБ/СОЭ.
    criteria:
    - parameter: procalcitonin
      threshold: 0.5
      unit: нг/мл
      condition: '>='
      comment_template: Прокальцитонин {value} нг/мл — повышен.
    differentials:
    - condition: ''
      text: См. `infective_endocarditis_risk_crp` — тот же контекст, но прокальцитонин более специфичен
        для бактериальной инфекции в целом.
    red_flags:
    - condition: procalcitonin >= 2
      text: Значительное повышение при наличии факторов риска — усиливает подозрение на бактериемию/эндокардит,
        требует посевов и ЭхоКГ.
    treatment_hints:
    - step: Посевы крови и ЭхоКГ
      note: См. `infective_endocarditis_risk_crp`.
    references:
    - ESC Guidelines for the management of infective endocarditis
  isolated_hypertriglyceridemia:
    id: isolated_hypertriglyceridemia
    label: Изолированная гипертриглицеридемия
    category: Кардиология
    description: Значительно повышенные триглицериды при отсутствии выраженного повышения холестерина
      ЛПНП.
    criteria:
    - parameter: triglycerides
      threshold: 5.6
      unit: ммоль/л
      condition: '>='
      comment_template: Триглицериды {value} ммоль/л — значительно повышены.
    differentials:
    - condition: ''
      text: Первичная (семейная) гипертриглицеридемия, вторичная (неконтролируемый диабет, ожирение, злоупотребление
        алкоголем, гипотиреоз, приём эстрогенов/тамоксифена/некоторых других препаратов), нефротический
        синдром.
    red_flags:
    - condition: triglycerides >= 11.3
      text: Очень высокий уровень — существенный риск острого панкреатита (см. `acute_pancreatitis` в
        гастроэнтерологии), требует срочного снижения уровня.
    treatment_hints:
    - step: Оценить гликемический контроль и употребление алкоголя
      note: Частые обратимые причины.
    - step: При уровне >11.3 ммоль/л — срочные меры по снижению
      note: Риск острого панкреатита нарастает экспоненциально с уровнем триглицеридов.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  low_hdl_severe:
    id: low_hdl_severe
    label: Выраженно сниженный ЛПВП
    category: Кардиология
    description: Значительно сниженный холестерин ЛПВП («хороший» холестерин) — независимый фактор сердечно-сосудистого
      риска.
    criteria:
    - parameter: hdl_cholesterol
      threshold: 0.8
      unit: ммоль/л
      condition: <=
      comment_template: ЛПВП {value} ммоль/л — значительно снижен.
    differentials:
    - condition: ''
      text: Метаболический синдром, сахарный диабет 2 типа, ожирение, курение, малоподвижный образ жизни,
        приём анаболических стероидов, некоторые генетические варианты.
    red_flags:
    - condition: ''
      text: Учитывать как часть общей оценки сердечно-сосудистого риска (например SCORE2), не изолированно.
    treatment_hints:
    - step: Оценить общий сердечно-сосудистый риск
      note: Низкий ЛПВП сам по себе не является отдельной целью терапии в большинстве современных рекомендаций
        — фокус на ЛПНП и общем риске.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  myocarditis_suspected_crp:
    id: myocarditis_suspected_crp
    label: СРБ в контексте подозрения на миокардит
    category: Кардиология
    description: Повышенный СРБ вместе с признаками повреждения миокарда — часть картины подозрения на
      миокардит.
    criteria:
    - parameter: crp
      threshold: 10
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    differentials:
    - condition: ''
      text: Миокардит (вирусный чаще всего, также аутоиммунный, токсический), перикардит с вовлечением
        миокарда (миоперикардит).
    red_flags:
    - condition: ''
      text: В сочетании с повышенным тропонином и клинической картиной (боль в груди, недавняя вирусная
        инфекция, аритмии, признаки сердечной недостаточности) — показание для МРТ сердца.
    treatment_hints:
    - step: МРТ сердца
      note: Ключевой неинвазивный метод диагностики миокардита (критерии Lake Louise).
    - step: ЭхоКГ для оценки систолической функции
      note: Базовая оценка перед МРТ.
    references:
    - ESC Position Statement on myocarditis
  myocarditis_suspected_esr:
    id: myocarditis_suspected_esr
    label: СОЭ в контексте подозрения на миокардит
    category: Кардиология
    description: Повышенная СОЭ вместе с признаками повреждения миокарда.
    criteria:
    - parameter: esr
      threshold: 20
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: См. `myocarditis_suspected_crp` — тот же контекст.
    red_flags:
    - condition: ''
      text: См. `myocarditis_suspected_crp` — МРТ сердца при соответствующей клинической картине.
    treatment_hints:
    - step: МРТ сердца
      note: См. `myocarditis_suspected_crp`.
    references:
    - ESC Position Statement on myocarditis
  pericarditis_markers_crp:
    id: pericarditis_markers_crp
    label: СРБ в контексте подозрения на перикардит
    category: Кардиология
    description: Повышенный СРБ — часть диагностических критериев острого перикардита (наряду с клинической
      картиной, шумом трения перикарда, изменениями ЭКГ, выпотом на ЭхоКГ).
    criteria:
    - parameter: crp
      threshold: 50
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    differentials:
    - condition: ''
      text: Острый перикардит (чаще вирусный/идиопатический, также аутоиммунный, постинфарктный синдром
        Дресслера, туберкулёзный, уремический).
    red_flags:
    - condition: ''
      text: Повышенный СРБ также используется как один из критериев для определения длительности противовоспалительной
        терапии и оценки рецидива.
    treatment_hints:
    - step: ЭхоКГ для оценки выпота
      note: Поиск тампонады при значительном выпоте — жизнеугрожающее осложнение.
    references:
    - ESC Guidelines for the diagnosis and management of pericardial diseases
  pericarditis_markers_esr:
    id: pericarditis_markers_esr
    label: СОЭ в контексте подозрения на перикардит
    category: Кардиология
    description: Повышенная СОЭ — часть картины острого перикардита.
    criteria:
    - parameter: esr
      threshold: 30
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена.
    differentials:
    - condition: ''
      text: См. `pericarditis_markers_crp` — тот же контекст.
    red_flags:
    - condition: ''
      text: См. `pericarditis_markers_crp` — оценить наличие значительного выпота на ЭхоКГ.
    treatment_hints:
    - step: ЭхоКГ для оценки выпота
      note: См. `pericarditis_markers_crp`.
    references:
    - ESC Guidelines for the diagnosis and management of pericardial diseases
  pulmonary_embolism_high_risk_d_dimer:
    id: pulmonary_embolism_high_risk_d_dimer
    label: D-димер на уровне высокого риска ТЭЛА
    category: Кардиология
    description: Значительно повышенный D-димер — выше базового порога, более специфично указывает на
      активный тромботический процесс.
    criteria:
    - parameter: d_dimer
      threshold: 2.0
      unit: мкг/мл
      condition: '>='
      comment_template: D-димер {value} мкг/мл — значительно повышен.
    differentials:
    - condition: ''
      text: Тромбоэмболия лёгочной артерии, обширный тромбоз глубоких вен, ДВС-синдром.
    red_flags:
    - condition: ''
      text: В сочетании с одышкой, тахикардией, болью в груди — срочная КТ-ангиография лёгочной артерии.
    treatment_hints:
    - step: КТ-ангиография лёгочной артерии
      note: Метод выбора при высокой клинической вероятности ТЭЛА.
    references:
    - ESC Guidelines for the diagnosis and management of acute pulmonary embolism
  atherogenic_index_high_cholesterol_total:
    id: atherogenic_index_high_cholesterol_total
    label: Повышенный общий холестерин (атерогенный профиль)
    category: Кардиология
    description: Повышенный общий холестерин в контексте оценки атерогенного профиля (соотношение общего
      холестерина и ЛПВП).
    criteria:
    - parameter: cholesterol_total
      threshold: 5.0
      unit: ммоль/л
      condition: '>='
      comment_template: Общий холестерин {value} ммоль/л — повышен.
    differentials:
    - condition: ''
      text: Атерогенная дислипидемия, вторичная гиперхолестеринемия. См. также `familial_hypercholesterolemia_cholesterol_total`
        при значительно более высоких значениях.
    red_flags:
    - condition: ''
      text: Интерпретировать вместе с ЛПВП/ЛПНП и общим сердечно-сосудистым риском, не изолированно.
    treatment_hints:
    - step: Полный липидный профиль и оценка общего риска (SCORE2)
      note: Изолированный общий холестерин недостаточен для решения о терапии.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  atherogenic_index_high_hdl:
    id: atherogenic_index_high_hdl
    label: Сниженный ЛПВП (атерогенный профиль)
    category: Кардиология
    description: 'Сниженный ЛПВП в контексте оценки атерогенного профиля. Примечание: в этом условии параметр
      указан как `hdl`, а не `hdl_cholesterol`, как в остальных липидных правилах этой базы — стоит проверить,
      что нормализатор параметров действительно распознаёт оба варианта как один и тот же показатель,
      иначе условие может не срабатывать на практике.'
    criteria:
    - parameter: hdl
      threshold: 1.0
      unit: ммоль/л
      condition: <=
      comment_template: ЛПВП {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: См. `low_hdl_severe` при более выраженном снижении.
    red_flags:
    - condition: ''
      text: Интерпретировать вместе с общим холестерином/ЛПНП и общим сердечно-сосудистым риском.
    treatment_hints:
    - step: Полный липидный профиль
      note: См. `atherogenic_index_high_cholesterol_total`.
    references:
    - ESC/EAS Guidelines for the management of dyslipidaemias
  acromegaly:
    id: acromegaly
    label: Акромегалия
    category: Эндокринология
    description: Повышенные ИФР-1 и гормон роста — характерно для акромегалии (обычно вследствие соматотропиномы
      гипофиза).
    criteria:
    - parameter: igf1
      threshold: 250
      unit: нг/мл
      condition: '>='
      comment_template: ИФР-1 {value} нг/мл — повышен.
    - parameter: growth_hormone
      threshold: 5
      unit: нг/мл
      condition: '>='
      comment_template: Гормон роста {value} нг/мл — повышен.
    differentials:
    - condition: ''
      text: Соматотропинома гипофиза (наиболее частая причина), редко — эктопическая секреция гормона
        роста/рилизинг-фактора.
    red_flags:
    - condition: igf1 > 500
      text: Значительное повышение ИФР-1 — оценить размер аденомы гипофиза (МРТ) и признаки компрессии
        зрительного перекреста (нарушения полей зрения).
    treatment_hints:
    - step: МРТ гипофиза
      note: Поиск аденомы.
    - step: Пероральный глюкозотолерантный тест с определением гормона роста
      note: Подтверждающий тест — отсутствие подавления ГР при нагрузке глюкозой характерно для акромегалии.
    references:
    - Endocrine Society Clinical Practice Guideline for acromegaly
  acth_high:
    id: acth_high
    label: Повышенный АКТГ
    category: Эндокринология
    description: Изолированно повышенный АКТГ. Интерпретация зависит от одновременного уровня кортизола
      — повышены оба (болезнь/синдром Кушинга АКТГ-зависимого типа) или АКТГ высок при низком кортизоле
      (первичная надпочечниковая недостаточность, компенсаторное повышение).
    criteria:
    - parameter: acth
      threshold: 60
      unit: пг/мл
      condition: '>='
      comment_template: АКТГ {value} пг/мл — повышен.
    differentials:
    - condition: ''
      text: АКТГ-зависимый гиперкортицизм (см. `cushing_syndrome`) при одновременно высоком кортизоле;
        первичная надпочечниковая недостаточность (см. `adrenal_insufficiency`) при низком кортизоле —
        обязательно интерпретировать вместе.
    red_flags:
    - condition: ''
      text: Всегда оценивать вместе с уровнем кортизола — изолированный АКТГ без него малоинформативен.
    treatment_hints:
    - step: Одновременная оценка кортизола сыворотки
      note: Определяет направление дальнейшей диагностики (гипер- или гипокортицизм).
    references:
    - Endocrine Society Clinical Practice Guidelines
  adrenal_insufficiency:
    id: adrenal_insufficiency
    label: Надпочечниковая недостаточность
    category: Эндокринология
    description: Сниженный кортизол вместе со сниженным АКТГ — картина, характерная для вторичной (гипофизарной)
      надпочечниковой недостаточности.
    criteria:
    - parameter: cortisol_serum
      threshold: 140
      unit: нмоль/л
      condition: <=
      comment_template: Кортизол {value} нмоль/л — снижен.
    - parameter: acth
      threshold: 10
      unit: пг/мл
      condition: <=
      comment_template: АКТГ {value} пг/мл — снижен.
    differentials:
    - condition: ''
      text: Вторичная надпочечниковая недостаточность (гипофизарная патология, длительный приём глюкокортикоидов
        с подавлением оси). При первичной надпочечниковой недостаточности (болезнь Аддисона) АКТГ обычно
        повышен, а не снижен — компенсаторно.
    red_flags:
    - condition: cortisol_serum <= 80
      text: Выраженный дефицит кортизола — риск надпочечникового криза при стрессе/инфекции/травме, требует
        готовности к экстренному введению гидрокортизона.
    treatment_hints:
    - step: Уточнить анамнез приёма глюкокортикоидов
      note: Частая обратимая причина подавления оси.
    - step: Стимуляционный тест с АКТГ (синактеном)
      note: Подтверждающий тест для оценки резервной функции надпочечников.
    references:
    - Endocrine Society Clinical Practice Guideline for adrenal insufficiency
  congenital_adrenal_hyperplasia:
    id: congenital_adrenal_hyperplasia
    label: Врождённая гиперплазия коры надпочечников (предположительно)
    category: Эндокринология
    description: Повышенный 17-гидроксипрогестерон — основной скрининговый маркер врождённой гиперплазии
      коры надпочечников (чаще всего вследствие дефицита 21-гидроксилазы).
    criteria:
    - parameter: 17_oh_progesterone
      threshold: 6
      unit: нг/мл
      condition: '>='
      comment_template: 17-ОН-прогестерон {value} нг/мл — повышен.
    differentials:
    - condition: ''
      text: Классическая или неклассическая (поздняя) форма дефицита 21-гидроксилазы — наиболее частая
        причина. У новорождённых — часть неонатального скрининга.
    red_flags:
    - condition: ''
      text: У новорождённых с сольтеряющей формой — риск надпочечникового криза с гипонатриемией и гиперкалиемией,
        требует экстренной оценки электролитов.
    treatment_hints:
    - step: Генетическое тестирование при подтверждённом биохимическом диагнозе
      note: Для уточнения формы и консультирования семьи.
    references:
    - Endocrine Society Clinical Practice Guideline for congenital adrenal hyperplasia
  cortisol_evening_high:
    id: cortisol_evening_high
    label: Повышенный вечерний кортизол
    category: Эндокринология
    description: Повышенный кортизол в вечернее время — в норме кортизол должен значительно снижаться
      к вечеру (суточный ритм); отсутствие снижения — ранний признак возможного гиперкортицизма.
    criteria:
    - parameter: cortisol_serum
      threshold: 250
      unit: нмоль/л
      condition: '>='
      comment_template: Вечерний кортизол {value} нмоль/л — повышен, потеря нормального суточного ритма.
    differentials:
    - condition: ''
      text: Синдром/болезнь Кушинга (см. `cushing_syndrome`), псевдо-синдром Кушинга при тяжёлой депрессии/алкоголизме/выраженном
        ожирении, физиологический стресс на момент забора.
    red_flags:
    - condition: ''
      text: Один аномальный результат недостаточен для диагноза — требуется подтверждение (ночной кортизол
        слюны, малая дексаметазоновая проба, свободный кортизол суточной мочи).
    treatment_hints:
    - step: Малая дексаметазоновая проба или кортизол слюны в полночь
      note: Подтверждающие тесты первой линии при подозрении на гиперкортицизм.
    references:
    - Endocrine Society Clinical Practice Guideline for Cushing's syndrome
  cushing_syndrome:
    id: cushing_syndrome
    label: Синдром/болезнь Кушинга
    category: Эндокринология
    description: 'Повышенные кортизол и АКТГ — картина АКТГ-зависимого гиперкортицизма. Примечание: в
      этой базе `cushing_syndrome.yaml` и `cushing_disease.yaml` имеют полностью идентичные критерии срабатывания
      — технически один и тот же файл под двумя именами, хотя клинически это разные понятия (болезнь Кушинга
      — конкретно аденома гипофиза, синдром — любая причина гиперкортицизма). Текст написан один раз под
      `cushing_syndrome`.'
    criteria:
    - parameter: cortisol_serum
      threshold: 690
      unit: нмоль/л
      condition: '>='
      comment_template: Кортизол {value} нмоль/л — значительно повышен.
    - parameter: acth
      threshold: 60
      unit: пг/мл
      condition: '>='
      comment_template: АКТГ {value} пг/мл — повышен.
    differentials:
    - condition: ''
      text: Болезнь Кушинга (АКТГ-секретирующая аденома гипофиза, наиболее частая эндогенная причина),
        эктопическая секреция АКТГ (мелкоклеточный рак лёгкого и другие нейроэндокринные опухоли). Экзогенный
        приём глюкокортикоидов даёт похожую клиническую картину, но с подавленным, а не повышенным АКТГ
        — важно для дифференциации.
    red_flags:
    - condition: cortisol_serum > 1000
      text: Крайне высокий уровень, особенно с быстрым началом симптомов и выраженной гипокалиемией —
        заподозрить эктопическую секрецию АКТГ, а не аденому гипофиза.
    treatment_hints:
    - step: МРТ гипофиза
      note: Поиск АКТГ-секретирующей аденомы.
    - step: При отрицательной МРТ — поиск эктопического источника
      note: КТ грудной клетки/брюшной полости, октреотид-сцинтиграфия.
    references:
    - Endocrine Society Clinical Practice Guideline for Cushing's syndrome
  diabetes_insipidus:
    id: diabetes_insipidus
    label: Несахарный диабет (предположительно)
    category: Эндокринология
    description: Повышенные натрий и осмоляльность сыворотки — картина, характерная для несахарного диабета
      (недостаточность или резистентность к антидиуретическому гормону).
    criteria:
    - parameter: sodium
      threshold: 145
      unit: ммоль/л
      condition: '>='
      comment_template: Натрий {value} ммоль/л — повышен.
    - parameter: osmolality_serum
      threshold: 295
      unit: мОсм/кг
      condition: '>='
      comment_template: Осмоляльность сыворотки {value} мОсм/кг — повышена.
    differentials:
    - condition: ''
      text: Центральный несахарный диабет (дефицит АДГ — травма головы, нейрохирургия, опухоли гипофиза/гипоталамуса),
        нефрогенный несахарный диабет (резистентность почек к АДГ — литий, гиперкальциемия, наследственные
        формы).
    red_flags:
    - condition: sodium >= 155
      text: Выраженная гипернатриемия — риск неврологических осложнений (судороги, нарушение сознания),
        требует контролируемой коррекции (не слишком быстрой).
    treatment_hints:
    - step: Проба с водной депривацией и десмопрессином
      note: Дифференцирует центральную и нефрогенную формы.
    references:
    - Endocrine Society Clinical Practice Guideline for diabetes insipidus
  endocrine_infertility:
    id: endocrine_infertility
    label: Эндокринные причины бесплодия (скрининг)
    category: Эндокринология
    description: Отклонения в гормональной панели (ФСГ, ЛГ, эстрадиол, тестостерон, пролактин), которые
      могут объяснять эндокринное бесплодие. Каждый параметр интерпретируется в контексте пола и, у женщин,
      фазы менструального цикла.
    criteria:
    - parameter: fsh
      threshold: 12.4
      unit: МЕ/л
      condition: '>='
      comment_template: ФСГ {value} МЕ/л — повышен.
    - parameter: lh
      threshold: 8.6
      unit: МЕ/л
      condition: '>='
      comment_template: ЛГ {value} МЕ/л — повышен.
    - parameter: estradiol
      threshold: 160
      unit: пмоль/л
      condition: '>='
      comment_template: Эстрадиол {value} пмоль/л — повышен.
    - parameter: testosterone_total
      threshold: 35
      unit: нг/дл
      condition: '>='
      comment_template: Общий тестостерон {value} нг/дл — повышен.
    - parameter: prolactin
      threshold: 500
      unit: мЕд/л
      condition: '>='
      comment_template: Пролактин {value} мЕд/л — повышен.
    differentials:
    - condition: ''
      text: Первичная или вторичная недостаточность гонад, гиперпролактинемия (подавляет гонадотропную
        функцию), СПКЯ у женщин (см. `pcos`). Каждый отклонённый параметр требует отдельной интерпретации
        в клиническом контексте.
    red_flags:
    - condition: prolactin >= 1000
      text: Значительно повышенный пролактин — см. `prolactin_very_high`, приоритетная причина для исключения
        пролактиномы перед остальным обследованием на бесплодие.
    treatment_hints:
    - step: Интерпретировать каждый гормон в контексте пола и дня цикла
      note: Разовое значение без клинического контекста малоинформативно.
    references:
    - ESHRE Guideline on the diagnosis and management of infertility
  free_androgen_index_high:
    id: free_androgen_index_high
    label: Повышенный индекс свободных андрогенов
    category: Эндокринология
    description: Повышенный индекс свободных андрогенов (расчётный показатель биодоступного тестостерона)
      — указывает на избыток андрогенной активности.
    criteria:
    - parameter: free_androgen_index
      threshold: 150
      unit: '%'
      condition: '>='
      comment_template: Индекс свободных андрогенов {value}% — повышен.
    differentials:
    - condition: ''
      text: У женщин — СПКЯ, гиперандрогения другой этиологии (см. `hyperandrogenism_female`); у мужчин
        — обычно вариант нормы или следствие сниженного ГСПГ.
    red_flags:
    - condition: ''
      text: У женщин с быстро прогрессирующими признаками вирилизации — исключить андроген-секретирующую
        опухоль, а не только СПКЯ.
    treatment_hints:
    - step: Интерпретировать вместе с общим тестостероном и ГСПГ
      note: Расчётный индекс без контекста абсолютных значений малоинформативен.
    references:
    - Endocrine Society Clinical Practice Guideline for hyperandrogenism
  free_androgen_index_low:
    id: free_androgen_index_low
    label: Сниженный индекс свободных андрогенов
    category: Эндокринология
    description: Сниженный индекс свободных андрогенов.
    criteria:
    - parameter: free_androgen_index
      threshold: 30
      unit: '%'
      condition: <=
      comment_template: Индекс свободных андрогенов {value}% — снижен.
    differentials:
    - condition: ''
      text: У мужчин — гипогонадизм (см. `hypogonadism_male`); повышенный ГСПГ (гипертиреоз, приём эстрогенов,
        заболевания печени) также снижает индекс при нормальном общем тестостероне.
    red_flags:
    - condition: ''
      text: У мужчин с симптомами гипогонадизма — не полагаться на индекс изолированно, оценить общий
        и, при возможности, свободный тестостерон напрямую.
    treatment_hints:
    - step: ГСПГ и общий тестостерон отдельно
      note: Для понимания, за счёт чего снижен расчётный индекс.
    references:
    - Endocrine Society Clinical Practice Guideline for male hypogonadism
  glucagonoma:
    id: glucagonoma
    label: Глюкагонома (предположительно)
    category: Эндокринология
    description: Повышенная глюкоза — крайне неспецифичный отдельный признак глюкагономы (редкой нейроэндокринной
      опухоли поджелудочной железы), неотличимый по этому одному критерию от обычного сахарного диабета.
      Диагноз опирается прежде всего на клиническую картину и специфичный тест на глюкагон.
    criteria:
    - parameter: glucose
      threshold: 7.0
      unit: ммоль/л
      condition: '>='
      comment_template: Глюкоза {value} ммоль/л — повышена (неспецифичный признак).
    differentials:
    - condition: ''
      text: В подавляющем большинстве случаев — обычный сахарный диабет 2 типа (см. `diabetes_mellitus_type_2`),
        а не глюкагонома. Глюкагонома — крайне редкая опухоль, заподозрить дополнительно при характерной
        некролитической мигрирующей эритеме, необъяснимой потере веса, венозных тромбозах.
    red_flags:
    - condition: ''
      text: Без характерных внелабораторных клинических признаков (сыпь, тромбозы) один лишь повышенный
        уровень глюкозы не является поводом для поиска этой редкой опухоли.
    treatment_hints:
    - step: Уровень глюкагона в плазме
      note: Специфичный подтверждающий тест, не входит в текущий набор параметров этого правила.
    references:
    - ENETS guidelines for neuroendocrine tumors of the pancreas
  graves_disease:
    id: graves_disease
    label: Болезнь Грейвса (предположительно)
    category: Эндокринология
    description: Сниженный ТТГ вместе с повышенным свободным Т4 — картина первичного тиреотоксикоза, наиболее
      часто вследствие болезни Грейвса.
    criteria:
    - parameter: tsh
      threshold: 0.4
      unit: мЕд/л
      condition: <=
      comment_template: ТТГ {value} мЕд/л — снижен.
    - parameter: free_t4
      threshold: 22
      unit: пмоль/л
      condition: '>='
      comment_template: Свободный Т4 {value} пмоль/л — повышен.
    differentials:
    - condition: ''
      text: Болезнь Грейвса (наиболее частая причина, аутоиммунная), токсическая многоузловая струма,
        токсическая аденома, ранняя фаза подострого тиреоидита (см. `subacute_thyroiditis` — но там дополнительно
        повышены маркеры воспаления).
    red_flags:
    - condition: ''
      text: Клинически проверить наличие офтальмопатии (экзофтальм) и претибиальной микседемы — специфичные
        для болезни Грейвса признаки, отсутствующие при других причинах тиреотоксикоза.
    treatment_hints:
    - step: Антитела к рецептору ТТГ (TRAb)
      note: Подтверждает болезнь Грейвса, отличает от других причин тиреотоксикоза.
    - step: Сцинтиграфия щитовидной железы при неясной этиологии
      note: Диффузное накопление при Грейвса, узловое — при токсической аденоме/струме.
    references:
    - ATA Guidelines for the diagnosis and management of hyperthyroidism
  gynecomastia:
    id: gynecomastia
    label: Гормональный профиль, характерный для гинекомастии
    category: Эндокринология
    description: Повышенные эстрадиол и/или пролактин со сниженным тестостероном — гормональный дисбаланс,
      способствующий развитию гинекомастии у мужчин.
    criteria:
    - parameter: estradiol
      threshold: 160
      unit: пмоль/л
      condition: '>='
      comment_template: Эстрадиол {value} пмоль/л — повышен.
    - parameter: prolactin
      threshold: 500
      unit: мЕд/л
      condition: '>='
      comment_template: Пролактин {value} мЕд/л — повышен.
    - parameter: testosterone_total
      threshold: 10
      unit: нг/дл
      condition: <=
      comment_template: Общий тестостерон {value} нг/дл — снижен.
    differentials:
    - condition: ''
      text: Гипогонадизм (первичный или вторичный), эстроген-секретирующие опухоли (яичка, надпочечника),
        гиперпролактинемия, приём лекарств (спиронолактон, некоторые антиандрогены, анаболические стероиды
        после отмены), заболевания печени (нарушение метаболизма эстрогенов), физиологическая гинекомастия
        пубертатного возраста.
    red_flags:
    - condition: ''
      text: Асимметричное, быстро растущее или болезненное образование, особенно у мужчин старшего возраста
        — исключить объёмное образование яичка/надпочечника и, редко, рак молочной железы у мужчин.
    treatment_hints:
    - step: Пальпация яичек и УЗИ мошонки при подозрении на опухоль
      note: Эстроген-секретирующие опухоли яичка — важная, хотя редкая, устранимая причина.
    references:
    - Endocrine Society Clinical Practice Guideline for gynecomastia
  high_dhea_s_male:
    id: high_dhea_s_male
    label: Повышенный ДГЭА-С (мужчины)
    category: Эндокринология
    description: Повышенный дегидроэпиандростерон-сульфат (ДГЭА-С) у мужчин — маркер андрогенной активности
      надпочечников.
    criteria:
    - parameter: dhea_s
      threshold: 15
      unit: мкмоль/л
      condition: '>='
      comment_template: ДГЭА-С {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Аденома или карцинома коры надпочечников, врождённая гиперплазия коры надпочечников (неклассическая
        форма).
    red_flags:
    - condition: dhea_s >= 25
      text: Значительно повышенный уровень — усиливает подозрение на опухоль надпочечника, требует визуализации.
    treatment_hints:
    - step: КТ/МРТ надпочечников при значительном повышении
      note: Исключить объёмное образование.
    references:
    - Endocrine Society Clinical Practice Guideline for adrenal incidentalomas
  hyperandrogenism_female:
    id: hyperandrogenism_female
    label: Гиперандрогения у женщин
    category: Эндокринология
    description: Повышенные общий тестостерон и/или ДГЭА-С у женщин.
    criteria:
    - parameter: testosterone_total
      threshold: 2.0
      unit: нмоль/л
      condition: '>='
      comment_template: Общий тестостерон {value} нмоль/л — повышен.
    - parameter: dhea_s
      threshold: 15
      unit: мкмоль/л
      condition: '>='
      comment_template: ДГЭА-С {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: СПКЯ (наиболее частая причина, см. `pcos`), неклассическая врождённая гиперплазия коры надпочечников,
        андроген-секретирующая опухоль яичника или надпочечника (заподозрить при быстром начале и выраженной
        вирилизации).
    red_flags:
    - condition: testosterone_total >= 5
      text: Значительно повышенный тестостерон с быстрым началом вирилизации (огрубение голоса, облысение
        по мужскому типу, клиторомегалия) — заподозрить андроген-секретирующую опухоль, а не СПКЯ.
    treatment_hints:
    - step: УЗИ яичников и надпочечников при значительном повышении или быстром начале
      note: Исключить опухоль перед предположением о СПКЯ.
    references:
    - Endocrine Society Clinical Practice Guideline for hyperandrogenism
  hyperestrogenemia_male:
    id: hyperestrogenemia_male
    label: Повышенный эстрадиол у мужчин
    category: Эндокринология
    description: Повышенный эстрадиол у мужчин.
    criteria:
    - parameter: estradiol
      threshold: 160
      unit: пмоль/л
      condition: '>='
      comment_template: Эстрадиол {value} пмоль/л — повышен.
    differentials:
    - condition: ''
      text: Ожирение (периферическая ароматизация андрогенов в жировой ткани), заболевания печени, эстроген-секретирующая
        опухоль яичка/надпочечника, приём препаратов. См. также `gynecomastia`, если есть соответствующая
        клиническая картина.
    red_flags:
    - condition: ''
      text: См. `gynecomastia` — асимметричное образование яичка требует УЗИ мошонки.
    treatment_hints:
    - step: Оценить ИМТ и функцию печени
      note: Наиболее частые обратимые причины.
    references:
    - Endocrine Society Clinical Practice Guideline for gynecomastia
  hyperprolactinemia:
    id: hyperprolactinemia
    label: Гиперпролактинемия
    category: Эндокринология
    description: Повышенный пролактин.
    criteria:
    - parameter: prolactin
      threshold: 500
      unit: мЕд/л
      condition: '>='
      comment_template: Пролактин {value} мЕд/л — повышен.
    differentials:
    - condition: ''
      text: Пролактинома (см. `prolactinoma`), приём лекарств (антипсихотики, метоклопрамид, некоторые
        антидепрессанты), гипотиреоз, беременность, стресс на момент забора, макропролактинемия (лабораторный
        феномен без клинической значимости).
    red_flags:
    - condition: prolactin >= 1000
      text: Значительно повышенный уровень — см. `prolactin_very_high`, высокая вероятность пролактиномы.
    treatment_hints:
    - step: Уточнить лекарственный анамнез
      note: Частая обратимая причина.
    - step: ТТГ
      note: Исключить гипотиреоз как причину вторичной гиперпролактинемии.
    references:
    - Endocrine Society Clinical Practice Guideline for hyperprolactinemia
  hypogonadism_male:
    id: hypogonadism_male
    label: Гипогонадизм у мужчин (первичный, по лабораторным маркерам)
    category: Эндокринология
    description: Сниженный тестостерон вместе с повышенным ЛГ — картина первичного (тестикулярного) гипогонадизма
      с компенсаторным повышением гонадотропина.
    criteria:
    - parameter: testosterone_total
      threshold: 10
      unit: нг/дл
      condition: <=
      comment_template: Общий тестостерон {value} нг/дл — снижен.
    - parameter: lh
      threshold: 8.6
      unit: МЕ/л
      condition: '>='
      comment_template: ЛГ {value} МЕ/л — повышен, компенсаторная реакция при первичном поражении яичек.
    differentials:
    - condition: ''
      text: Первичная тестикулярная недостаточность (синдром Клайнфельтера, после химиотерапии/лучевой
        терапии, травма, орхит, возрастное снижение).
    red_flags:
    - condition: ''
      text: Подтверждать повторным измерением тестостерона утром (циркадный ритм) перед началом заместительной
        терапии.
    treatment_hints:
    - step: Повторное измерение тестостерона утром
      note: Однократное измерение, особенно не утреннее, недостаточно для диагноза.
    references:
    - Endocrine Society Clinical Practice Guideline for testosterone therapy in men with hypogonadism
  hypoparathyroidism:
    id: hypoparathyroidism
    label: Гипопаратиреоз
    category: Эндокринология
    description: Сниженный кальций с повышенным фосфатом и сниженным ПТГ — картина гипопаратиреоза (недостаточная
      секреция паратгормона).
    criteria:
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций общий {value} ммоль/л — снижен.
    - parameter: phosphate
      threshold: 1.5
      unit: ммоль/л
      condition: '>='
      comment_template: Фосфат {value} ммоль/л — повышен.
    - parameter: pth
      threshold: 1.6
      unit: пмоль/л
      condition: <=
      comment_template: ПТГ {value} пмоль/л — снижен.
    differentials:
    - condition: ''
      text: Послеоперационный гипопаратиреоз (после операций на щитовидной/паращитовидных железах — наиболее
        частая причина), аутоиммунный гипопаратиреоз, врождённые синдромы (ди Джорджи).
    red_flags:
    - condition: calcium_total <= 1.9
      text: Выраженная гипокальциемия — риск тетании и судорог, требует контроля симптомов и, при необходимости,
        внутривенного введения кальция.
    treatment_hints:
    - step: Уточнить анамнез операций на шее
      note: Наиболее частая причина — случайное удаление/повреждение паращитовидных желёз при тиреоидэктомии.
    references:
    - Endocrine Society Clinical Practice Guideline for hypoparathyroidism
  hypopituitarism:
    id: hypopituitarism
    label: Гипопитуитаризм
    category: Эндокринология
    description: Одновременное снижение нескольких гормонов гипофиза (ТТГ, кортизол, тестостерон/эстрадиол,
      ИФР-1) — картина множественного дефицита тропных гормонов гипофиза.
    criteria:
    - parameter: tsh
      threshold: 0.4
      unit: мЕд/л
      condition: <=
      comment_template: ТТГ {value} мЕд/л — снижен.
    - parameter: cortisol_serum
      threshold: 140
      unit: нмоль/л
      condition: <=
      comment_template: Кортизол {value} нмоль/л — снижен.
    - parameter: testosterone_total
      threshold: 10
      unit: нг/дл
      condition: <=
      comment_template: Тестостерон {value} нг/дл — снижен.
    - parameter: estradiol
      threshold: 40
      unit: пмоль/л
      condition: <=
      comment_template: Эстрадиол {value} пмоль/л — снижен.
    - parameter: igf1
      threshold: 100
      unit: нг/мл
      condition: <=
      comment_template: ИФР-1 {value} нг/мл — снижен.
    differentials:
    - condition: ''
      text: Аденома гипофиза с компрессией здоровой ткани, послеоперационное/пострадиационное состояние,
        синдром Шихана (послеродовой инфаркт гипофиза), травма головы, гипофизит.
    red_flags:
    - condition: cortisol_serum <= 80
      text: Дефицит кортизола среди множественных дефицитов — приоритет заместительной терапии, так как
        несёт риск надпочечникового криза; заместительную терапию гидрокортизоном начинают раньше терапии
        других осей.
    treatment_hints:
    - step: МРТ гипофиза
      note: Поиск структурной причины.
    - step: Начинать заместительную терапию с кортизола
      note: Прежде чем начинать заместительную терапию тиреоидными гормонами — иначе может ускориться
        метаболизм остаточного кортизола и спровоцировать криз.
    references:
    - Endocrine Society Clinical Practice Guideline for hypopituitarism
  insulinoma:
    id: insulinoma
    label: Инсулинома (предположительно)
    category: Эндокринология
    description: 'Классическая триада Уиппла: низкая глюкоза с одновременно неадекватно высокими инсулином
      и С-пептидом — характерно для эндогенного гиперинсулинизма (инсулинома или, реже, незидиобластоз).'
    criteria:
    - parameter: glucose
      threshold: 3.9
      unit: ммоль/л
      condition: <=
      comment_template: Глюкоза {value} ммоль/л — снижена.
    - parameter: insulin
      threshold: 25
      unit: мкЕд/мл
      condition: '>='
      comment_template: Инсулин {value} мкЕд/мл — неадекватно повышен при низкой глюкозе.
    - parameter: c_peptide
      threshold: 3.5
      unit: нг/мл
      condition: '>='
      comment_template: С-пептид {value} нг/мл — повышен, подтверждает эндогенное происхождение инсулина.
    differentials:
    - condition: ''
      text: Инсулинома (наиболее частая причина эндогенного гиперинсулинизма), незидиобластоз, экзогенное
        введение инсулина (при этом C-пептид будет НИЗКИМ, а не высоким — ключевой дифференцирующий признак),
        приём препаратов сульфонилмочевины.
    red_flags:
    - condition: glucose <= 2.5
      text: Выраженная гипогликемия — риск неврологических симптомов и потери сознания, требует немедленной
        коррекции глюкозой.
    treatment_hints:
    - step: Проба с 72-часовым голоданием под наблюдением
      note: Золотой стандарт провокации и подтверждения эндогенного гиперинсулинизма.
    - step: Визуализация поджелудочной железы (КТ/МРТ/эндо-УЗИ)
      note: Поиск опухоли после биохимического подтверждения.
    references:
    - Endocrine Society Clinical Practice Guideline for hypoglycemia
  low_dhea_s_male:
    id: low_dhea_s_male
    label: Сниженный ДГЭА-С (мужчины)
    category: Эндокринология
    description: Сниженный ДГЭА-С у мужчин.
    criteria:
    - parameter: dhea_s
      threshold: 5
      unit: мкмоль/л
      condition: <=
      comment_template: ДГЭА-С {value} мкмоль/л — снижен.
    differentials:
    - condition: ''
      text: Надпочечниковая недостаточность (см. `adrenal_insufficiency`), возрастное физиологическое
        снижение, гипопитуитаризм.
    red_flags:
    - condition: ''
      text: В сочетании с симптомами надпочечниковой недостаточности (слабость, гипотензия) — оценить
        кортизол и АКТГ.
    treatment_hints:
    - step: Оценить в контексте возраста
      note: Физиологическое снижение с возрастом — частая, доброкачественная причина.
    references:
    - Endocrine Society Clinical Practice Guideline for adrenal insufficiency
  men1:
    id: men1
    label: Множественная эндокринная неоплазия 1 типа (МЭН1, предположительно)
    category: Эндокринология
    description: Сочетание гиперкальциемии, гиперпролактинемии и гиперинсулинемии — классическая триада
      поражения органов при синдроме МЭН1 (паращитовидные железы, гипофиз, поджелудочная железа).
    criteria:
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л — повышен (поражение паращитовидных желёз).
    - parameter: prolactin
      threshold: 500
      unit: мЕд/л
      condition: '>='
      comment_template: Пролактин {value} мЕд/л — повышен (поражение гипофиза).
    - parameter: insulin
      threshold: 25
      unit: мкЕд/мл
      condition: '>='
      comment_template: Инсулин {value} мкЕд/мл — повышен (поражение поджелудочной железы).
    differentials:
    - condition: ''
      text: Синдром МЭН1 (мутация гена MEN1) при сочетании поражения нескольких из трёх органов (паращитовидные
        железы, гипофиз, поджелудочная железа). Каждый отдельный признак значительно чаще объясняется
        изолированным, несиндромным заболеванием того же органа.
    red_flags:
    - condition: ''
      text: Сочетание двух и более из трёх компонентов у молодого пациента или с семейным анамнезом —
        показание для генетического консультирования и тестирования на мутацию MEN1.
    treatment_hints:
    - step: Семейный анамнез эндокринных опухолей
      note: Ключевой фактор для повышения клинической настороженности.
    - step: Генетическое тестирование при подозрении
      note: Подтверждает синдром и определяет необходимость скрининга родственников.
    references:
    - Endocrine Society Clinical Practice Guideline for MEN1
  men2:
    id: men2
    label: Множественная эндокринная неоплазия 2 типа (МЭН2, предположительно)
    category: Эндокринология
    description: Повышенные кальцитонин и метанефрины — сочетание, характерное для синдрома МЭН2 (медуллярный
      рак щитовидной железы + феохромоцитома).
    criteria:
    - parameter: calcitonin
      threshold: 10
      unit: пг/мл
      condition: '>='
      comment_template: Кальцитонин {value} пг/мл — повышен (маркер медуллярного рака щитовидной железы).
    - parameter: metanephrines
      threshold: 0.5
      unit: нмоль/л
      condition: '>='
      comment_template: Метанефрины {value} нмоль/л — повышены (см. также `pheochromocytoma`).
    differentials:
    - condition: ''
      text: Синдром МЭН2 (мутация гена RET) при сочетании обоих признаков. Изолированно повышенный кальцитонин
        — медуллярный рак щитовидной железы вне синдрома; изолированно повышенные метанефрины — см. `pheochromocytoma`.
    red_flags:
    - condition: ''
      text: Феохромоцитома должна быть исключена и, при подтверждении, пролечена ПЕРЕД операцией на щитовидной
        железе по поводу медуллярного рака — иначе анестезия/операция могут спровоцировать катехоламиновый
        криз.
    treatment_hints:
    - step: Генетическое тестирование на мутацию RET
      note: Подтверждает синдром, определяет тактику и скрининг родственников.
    references:
    - ATA Guidelines for medullary thyroid carcinoma
    - Endocrine Society Clinical Practice Guideline for pheochromocytoma
  pcos:
    id: pcos
    label: Синдром поликистозных яичников (СПКЯ, по лабораторным маркерам)
    category: Эндокринология
    description: Сочетание повышенных глюкозы, инсулина, тестостерона и ЛГ со сниженным ФСГ — лабораторный
      паттерн, часто сопровождающий СПКЯ (инсулинорезистентность + гиперандрогения + нарушение соотношения
      ЛГ/ФСГ). Диагноз СПКЯ клинически опирается на Роттердамские критерии (олиго/ановуляция, гиперандрогения,
      поликистозная морфология яичников на УЗИ — 2 из 3), не только на эти лабораторные маркеры.
    criteria:
    - parameter: glucose
      threshold: 5.6
      unit: ммоль/л
      condition: '>='
      comment_template: Глюкоза {value} ммоль/л — повышена (оценить инсулинорезистентность).
    - parameter: insulin
      threshold: 25
      unit: мкЕд/мл
      condition: '>='
      comment_template: Инсулин {value} мкЕд/мл — повышен (инсулинорезистентность).
    - parameter: testosterone_total
      threshold: 35
      unit: нг/дл
      condition: '>='
      comment_template: Тестостерон {value} нг/дл — повышен.
    - parameter: lh
      threshold: 8.6
      unit: МЕ/л
      condition: '>='
      comment_template: ЛГ {value} МЕ/л — повышен.
    - parameter: fsh
      threshold: 1.5
      unit: МЕ/л
      condition: <=
      comment_template: ФСГ {value} МЕ/л — снижен относительно ЛГ (повышенное соотношение ЛГ/ФСГ характерно
        для СПКЯ).
    differentials:
    - condition: ''
      text: СПКЯ (Роттердамские критерии), неклассическая врождённая гиперплазия коры надпочечников, гиперпролактинемия
        (может имитировать ановуляцию СПКЯ), заболевания щитовидной железы.
    red_flags:
    - condition: testosterone_total >= 100
      text: Значительно повышенный тестостерон — см. `hyperandrogenism_female`, исключить андроген-секретирующую
        опухоль, а не сразу предполагать СПКЯ.
    treatment_hints:
    - step: УЗИ органов малого таза
      note: Оценка поликистозной морфологии яичников — один из Роттердамских критериев.
    - step: Оценка инсулинорезистентности (HOMA-IR)
      note: Важна для выбора тактики (метформин) и оценки метаболического риска.
    references:
    - ESHRE/ASRM International Evidence-based Guideline for PCOS
  pheochromocytoma:
    id: pheochromocytoma
    label: Феохромоцитома (предположительно)
    category: Эндокринология
    description: Повышенные метанефрины и норметанефрины в плазме — наиболее чувствительный биохимический
      маркер феохромоцитомы/параганглиомы.
    criteria:
    - parameter: metanephrines
      threshold: 0.5
      unit: нмоль/л
      condition: '>='
      comment_template: Метанефрины {value} нмоль/л — повышены.
    - parameter: normetanephrine
      threshold: 0.9
      unit: нмоль/л
      condition: '>='
      comment_template: Норметанефрины {value} нмоль/л — повышены.
    differentials:
    - condition: ''
      text: Феохромоцитома (опухоль мозгового вещества надпочечника), параганглиома (вненадпочечниковая
        локализация). Часть синдрома МЭН2 (см. `men2`) или нейрофиброматоза 1 типа/болезни Гиппеля-Линдау
        при семейных случаях.
    red_flags:
    - condition: ''
      text: Перед любой операцией или инвазивной процедурой у пациента с подтверждённой феохромоцитомой
        обязательна альфа-адреноблокада — иначе высокий риск катехоламинового криза с гипертоническим
        кризом.
    treatment_hints:
    - step: КТ/МРТ надпочечников
      note: Локализация опухоли после биохимического подтверждения.
    - step: Альфа-адреноблокада перед любым инвазивным вмешательством
      note: Обязательный этап предоперационной подготовки.
    references:
    - Endocrine Society Clinical Practice Guideline for pheochromocytoma and paraganglioma
  primary_hyperaldosteronism:
    id: primary_hyperaldosteronism
    label: Первичный гиперальдостеронизм (предположительно)
    category: Эндокринология
    description: Сниженный калий вместе с повышенным альдостероном и подавленным ренином — классическая
      картина первичного гиперальдостеронизма (синдром Конна и другие формы).
    criteria:
    - parameter: potassium
      threshold: 3.5
      unit: ммоль/л
      condition: <=
      comment_template: Калий {value} ммоль/л — снижен.
    - parameter: aldosterone
      threshold: 20
      unit: нг/дл
      condition: '>='
      comment_template: Альдостерон {value} нг/дл — повышен.
    - parameter: renin
      threshold: 1.0
      unit: нг/мл/ч
      condition: <=
      comment_template: Ренин {value} нг/мл/ч — подавлен.
    differentials:
    - condition: ''
      text: Альдостерон-продуцирующая аденома надпочечника (синдром Конна), двусторонняя гиперплазия надпочечников,
        редко — семейные формы гиперальдостеронизма.
    red_flags:
    - condition: ''
      text: Одна из наиболее частых устранимых причин резистентной артериальной гипертензии — стоит целенаправленно
        исключать у пациентов с гипертензией, плохо поддающейся стандартной терапии, особенно при сопутствующей
        гипокалиемии.
    treatment_hints:
    - step: Соотношение альдостерон/ренин
      note: Основной скрининговый тест, часто более информативен, чем изолированные значения.
    - step: КТ надпочечников и, при показаниях, селективный забор крови из надпочечниковых вен
      note: Дифференциация одностороннего (аденома) и двустороннего (гиперплазия) процесса — определяет
        тактику (операция vs медикаментозная терапия).
    references:
    - Endocrine Society Clinical Practice Guideline for primary aldosteronism
  primary_hypogonadism_female:
    id: primary_hypogonadism_female
    label: Первичный гипогонадизм у женщин
    category: Эндокринология
    description: Сниженный эстрадиол с повышенными ФСГ и ЛГ — картина первичной (яичниковой) недостаточности
      с компенсаторным повышением гонадотропинов.
    criteria:
    - parameter: estradiol
      threshold: 40
      unit: пмоль/л
      condition: <=
      comment_template: Эстрадиол {value} пмоль/л — снижен.
    - parameter: fsh
      threshold: 12.4
      unit: МЕ/л
      condition: '>='
      comment_template: ФСГ {value} МЕ/л — повышен.
    - parameter: lh
      threshold: 8.6
      unit: МЕ/л
      condition: '>='
      comment_template: ЛГ {value} МЕ/л — повышен.
    differentials:
    - condition: ''
      text: Физиологическая менопауза (у женщин соответствующего возраста), преждевременная недостаточность
        яичников (до 40 лет — требует дообследования), после химиотерапии/лучевой терапии, аутоиммунный
        оофорит, синдром Тёрнера.
    red_flags:
    - condition: ''
      text: У женщин младше 40 лет — преждевременная недостаточность яичников требует дообследования (кариотип,
        аутоиммунные маркеры) и обсуждения репродуктивных перспектив и заместительной гормональной терапии.
    treatment_hints:
    - step: Уточнить возраст и репродуктивный анамнез
      note: Определяет объём дальнейшего обследования.
    references:
    - Endocrine Society Clinical Practice Guideline for primary ovarian insufficiency
  primary_obesity:
    id: primary_obesity
    label: Ожирение
    category: Эндокринология
    description: Индекс массы тела в диапазоне ожирения.
    criteria:
    - parameter: bmi
      threshold: 30
      unit: кг/м²
      condition: '>='
      comment_template: ИМТ {value} кг/м² — ожирение.
    differentials:
    - condition: ''
      text: Первичное (алиментарное) ожирение в большинстве случаев. Вторичные эндокринные причины (гипотиреоз,
        синдром Кушинга) встречаются значительно реже, но стоит держать в уме при непропорционально быстром
        наборе веса или сопутствующих симптомах.
    red_flags:
    - condition: bmi >= 40
      text: Морбидное ожирение — существенно повышенный риск сердечно-сосудистых заболеваний, диабета,
        апноэ сна; рассмотреть направление на комплексную оценку и, при показаниях, бариатрическую хирургию.
    treatment_hints:
    - step: Скрининг метаболических осложнений
      note: Гликемия/HbA1c, липидный профиль, оценка апноэ сна при соответствующих симптомах.
    references:
    - WHO obesity guidelines
    - Endocrine Society Clinical Practice Guideline for obesity management
  prolactin_very_high:
    id: prolactin_very_high
    label: Очень высокий пролактин
    category: Эндокринология
    description: Крайне высокий уровень пролактина — при таких значениях макропролактинома значительно
      более вероятна, чем другие причины гиперпролактинемии.
    criteria:
    - parameter: prolactin
      threshold: 1000
      unit: мЕд/л
      condition: '>='
      comment_template: Пролактин {value} мЕд/л — крайне высокий.
    differentials:
    - condition: ''
      text: Макропролактинома — наиболее вероятная причина при таком уровне. Умеренная гиперпролактинемия
        (лекарственная, гипотиреоз, стресс) редко достигает такого уровня.
    red_flags:
    - condition: ''
      text: Клинически оценить нарушения полей зрения — крупная аденома гипофиза может сдавливать зрительный
        перекрёст.
    treatment_hints:
    - step: МРТ гипофиза с прицельной оценкой размера аденомы
      note: При макроаденоме — оценка полей зрения и, при необходимости, срочная консультация нейрохирурга.
    references:
    - Endocrine Society Clinical Practice Guideline for hyperprolactinemia
  prolactinoma:
    id: prolactinoma
    label: Пролактинома (предположительно)
    category: Эндокринология
    description: Повышенный пролактин на уровне, типичном для пролактиномы (аденомы гипофиза, секретирующей
      пролактин) — самая частая гормонально-активная опухоль гипофиза.
    criteria:
    - parameter: prolactin
      threshold: 200
      unit: мЕд/л
      condition: '>='
      comment_template: Пролактин {value} мЕд/л — повышен.
    differentials:
    - condition: ''
      text: Пролактинома. См. также `hyperprolactinemia` для более широкого спектра причин при этом уровне
        — на данном пороге лекарственные и другие вторичные причины ещё достаточно вероятны, не только
        опухоль.
    red_flags:
    - condition: prolactin >= 1000
      text: См. `prolactin_very_high` — значительно повышает вероятность именно пролактиномы, особенно
        макроаденомы.
    treatment_hints:
    - step: МРТ гипофиза
      note: Подтверждение и оценка размера аденомы.
    - step: Исключить лекарственные причины перед визуализацией
      note: Антипсихотики, метоклопрамид и другие частые причины медикаментозной гиперпролактинемии.
    references:
    - Endocrine Society Clinical Practice Guideline for hyperprolactinemia
  pseudohypoparathyroidism:
    id: pseudohypoparathyroidism
    label: Псевдогипопаратиреоз
    category: Эндокринология
    description: Сниженный кальций и повышенный фосфат — как при гипопаратиреозе, но ПТГ при этом ПОВЫШЕН
      (не снижен) — признак резистентности тканей к паратгормону, а не его дефицита.
    criteria:
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций общий {value} ммоль/л — снижен.
    - parameter: phosphate
      threshold: 1.5
      unit: ммоль/л
      condition: '>='
      comment_template: Фосфат {value} ммоль/л — повышен.
    - parameter: pth
      threshold: 6.9
      unit: пмоль/л
      condition: '>='
      comment_template: ПТГ {value} пмоль/л — повышен (в отличие от `hypoparathyroidism`, где ПТГ снижен)
        — признак резистентности тканей-мишеней к паратгормону.
    differentials:
    - condition: ''
      text: Псевдогипопаратиреоз (наследственная резистентность к ПТГ, часто с характерным фенотипом —
        низкий рост, короткие пястные кости, подкожные оссификаты). Отличать от `hypoparathyroidism` именно
        по повышенному, а не сниженному ПТГ.
    red_flags:
    - condition: calcium_total <= 1.9
      text: Выраженная гипокальциемия — риск тетании, требует контроля симптомов.
    treatment_hints:
    - step: Оценить фенотипические признаки (рост, кисти рук)
      note: Характерный фенотип помогает заподозрить диагноз клинически, до генетического подтверждения.
    references:
    - Endocrine Society/European consensus on pseudohypoparathyroidism
  secondary_hyperparathyroidism:
    id: secondary_hyperparathyroidism
    label: Вторичный гиперпаратиреоз
    category: Эндокринология
    description: Сниженные кальций и витамин D вместе с повышенным ПТГ — картина вторичного гиперпаратиреоза
      (компенсаторное повышение ПТГ в ответ на гипокальциемию/дефицит витамина D, часто на фоне ХБП).
    criteria:
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций общий {value} ммоль/л — снижен.
    - parameter: vitamin_d
      threshold: 30
      unit: нг/мл
      condition: <=
      comment_template: Витамин D {value} нг/мл — снижен.
    - parameter: pth
      threshold: 6.9
      unit: пмоль/л
      condition: '>='
      comment_template: ПТГ {value} пмоль/л — повышен, компенсаторно.
    differentials:
    - condition: ''
      text: Хроническая болезнь почек (наиболее частая причина у взрослых — см. также правила ХБП в нефрологии),
        дефицит витамина D, синдромы мальабсорбции. Отличать от первичного гиперпаратиреоза (см. `primary_hyperparathyroidism`),
        где кальций повышен, а не снижен.
    red_flags:
    - condition: pth >= 30
      text: Значительно повышенный ПТГ, характерно для длительно текущей ХБП — риск почечной остеодистрофии
        при отсутствии коррекции.
    treatment_hints:
    - step: Оценить функцию почек (креатинин, СКФ)
      note: ХБП — наиболее частая причина у взрослых.
    - step: Восполнение витамина D
      note: При дефиците как компоненте причины.
    references:
    - KDIGO Clinical Practice Guideline for CKD-Mineral and Bone Disorder
  secondary_hypogonadism_female:
    id: secondary_hypogonadism_female
    label: Вторичный гипогонадизм у женщин
    category: Эндокринология
    description: Сниженные эстрадиол, ФСГ и ЛГ (в отличие от первичной недостаточности, где гонадотропины
      повышены) — картина гипоталамо-гипофизарной причины, часто с сопутствующим повышением пролактина.
    criteria:
    - parameter: estradiol
      threshold: 40
      unit: пмоль/л
      condition: <=
      comment_template: Эстрадиол {value} пмоль/л — снижен.
    - parameter: fsh
      threshold: 1.5
      unit: МЕ/л
      condition: <=
      comment_template: ФСГ {value} МЕ/л — снижен.
    - parameter: lh
      threshold: 1.7
      unit: МЕ/л
      condition: <=
      comment_template: ЛГ {value} МЕ/л — снижен.
    - parameter: prolactin
      threshold: 500
      unit: мЕд/л
      condition: '>='
      comment_template: Пролактин {value} мЕд/л — повышен.
    differentials:
    - condition: ''
      text: Гипоталамическая аменорея (стресс, чрезмерные физические нагрузки, недостаточное питание/расстройства
        пищевого поведения), гиперпролактинемия (подавляет гонадотропную функцию), гипопитуитаризм (см.
        `hypopituitarism`).
    red_flags:
    - condition: ''
      text: У молодых спортсменок/пациенток с расстройствами пищевого поведения — оценить риск триады
        относительного энергодефицита в спорте (нарушение менструального цикла, низкая минеральная плотность
        костей, недостаточное потребление энергии).
    treatment_hints:
    - step: Оценить пищевое поведение, физическую активность, стресс
      note: Частые обратимые причины у молодых женщин.
    - step: МРТ гипофиза при значительном повышении пролактина
      note: Исключить пролактиному.
    references:
    - Endocrine Society Clinical Practice Guideline for functional hypothalamic amenorrhea
  shbg_abnormal:
    id: shbg_abnormal
    label: Отклонение уровня ГСПГ
    category: Эндокринология
    description: Повышенный глобулин, связывающий половые гормоны (ГСПГ) — влияет на долю биодоступного
      (свободного) тестостерона/эстрадиола независимо от их общего уровня.
    criteria:
    - parameter: shbg
      threshold: 54
      unit: нмоль/л
      condition: '>='
      comment_template: ГСПГ {value} нмоль/л — повышен.
    differentials:
    - condition: ''
      text: Гипертиреоз, заболевания печени (цирроз), приём эстрогенов/пероральных контрацептивов, возрастное
        повышение у мужчин. Повышенный ГСПГ снижает долю свободного тестостерона даже при нормальном общем
        уровне.
    red_flags:
    - condition: ''
      text: При симптомах гипогонадизма с нормальным ОБЩИМ тестостероном — оценить ГСПГ и, по возможности,
        свободный тестостерон напрямую, так как повышенный ГСПГ может маскировать истинный дефицит.
    treatment_hints:
    - step: Оценивать вместе с общим и, при возможности, свободным тестостероном
      note: Изолированный ГСПГ без контекста малоинформативен.
    references:
    - Endocrine Society Clinical Practice Guideline for testosterone therapy
  somatostatinoma:
    id: somatostatinoma
    label: Соматостатинома (предположительно)
    category: Эндокринология
    description: Повышенная глюкоза — крайне неспецифичный отдельный признак соматостатиномы (редкой нейроэндокринной
      опухоли поджелудочной железы), неотличимый по этому одному критерию от обычного сахарного диабета.
      Диагноз опирается на клиническую триаду и специфичный тест на соматостатин.
    criteria:
    - parameter: glucose
      threshold: 7.0
      unit: ммоль/л
      condition: '>='
      comment_template: Глюкоза {value} ммоль/л — повышена (неспецифичный признак).
    differentials:
    - condition: ''
      text: 'В подавляющем большинстве случаев — обычный сахарный диабет 2 типа. Соматостатинома — крайне
        редкая опухоль, заподозрить дополнительно при классической триаде: диабет + желчнокаменная болезнь
        + стеаторея/ахлоргидрия.'
    red_flags:
    - condition: ''
      text: Без характерной внелабораторной клинической триады один лишь повышенный уровень глюкозы не
        является поводом для поиска этой редкой опухоли.
    treatment_hints:
    - step: Уровень соматостатина в плазме
      note: Специфичный подтверждающий тест, не входит в текущий набор параметров этого правила.
    references:
    - ENETS guidelines for neuroendocrine tumors of the pancreas
  subacute_thyroiditis:
    id: subacute_thyroiditis
    label: Подострый тиреоидит (предположительно)
    category: Эндокринология
    description: Повышенные маркеры воспаления (СОЭ, СРБ) вместе с картиной тиреотоксикоза (сниженный
      ТТГ, повышенный свободный Т4) — характерно для подострого (де Кервена) тиреоидита в острой фазе.
    criteria:
    - parameter: esr
      threshold: 30
      unit: мм/ч
      condition: '>='
      comment_template: СОЭ {value} мм/ч — повышена, часто значительно при подостром тиреоидите.
    - parameter: crp
      threshold: 10
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — повышен.
    - parameter: tsh
      threshold: 0.4
      unit: мЕд/л
      condition: <=
      comment_template: ТТГ {value} мЕд/л — снижен.
    - parameter: free_t4
      threshold: 22
      unit: пмоль/л
      condition: '>='
      comment_template: Свободный Т4 {value} пмоль/л — повышен.
    differentials:
    - condition: ''
      text: Подострый (де Кервена) тиреоидит — обычно после вирусной инфекции верхних дыхательных путей,
        с болезненностью щитовидной железы. Отличать от болезни Грейвса (см. `graves_disease`) — там маркеры
        воспаления в норме.
    red_flags:
    - condition: ''
      text: Клинически характерна выраженная болезненность щитовидной железы при пальпации — в отличие
        от большинства других причин тиреотоксикоза, обычно безболезненных.
    treatment_hints:
    - step: Сцинтиграфия щитовидной железы при неясности
      note: Сниженное накопление при подостром тиреоидите (в отличие от повышенного при Грейвса).
    - step: Течение обычно трёхфазное
      note: Тиреотоксическая фаза сменяется гипотиреоидной, затем восстановлением — важно предупредить
        пациента, чтобы не пропустить переход в гипотиреоз.
    references:
    - ATA Guidelines for the management of thyrotoxicosis
  hypercalcemia_severe:
    id: hypercalcemia_severe
    label: Тяжёлая гиперкальциемия
    category: Нефрология
    description: Значительно повышенный кальций — жизнеугрожающее электролитное нарушение.
    criteria:
    - parameter: calcium_total
      threshold: 3.5
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л — критически повышен.
    differentials:
    - condition: ''
      text: Первичный гиперпаратиреоз, злокачественные новообразования (гуморальная гиперкальциемия, метастазы
        в кости), гранулематозные заболевания (саркоидоз), избыток витамина D, длительная иммобилизация.
    red_flags:
    - condition: calcium_total >= 3.75
      text: Гиперкальциемический криз — риск аритмий, острого повреждения почек, нарушения сознания. Требует
        экстренной госпитализации и внутривенной регидратации.
    treatment_hints:
    - step: Внутривенная регидратация физраствором
      note: Первоочередное мероприятие перед специфической терапией.
    - step: ПТГ для дифференциации причины
      note: Повышен при первичном гиперпаратиреозе, подавлен при большинстве других причин.
    references:
    - Endocrine Society Clinical Practice Guideline for hypercalcemia of malignancy
  hypocalcemia_severe:
    id: hypocalcemia_severe
    label: Тяжёлая гипокальциемия
    category: Нефрология
    description: Значительно сниженный кальций — риск тетании и сердечных аритмий.
    criteria:
    - parameter: calcium_total
      threshold: 1.5
      unit: ммоль/л
      condition: <=
      comment_template: Кальций {value} ммоль/л — критически снижен.
    differentials:
    - condition: ''
      text: Гипопаратиреоз, тяжёлый дефицит витамина D, острый панкреатит, массивное переливание крови
        (цитратная интоксикация), ХБП с вторичным гиперпаратиреозом.
    red_flags:
    - condition: ''
      text: Риск ларингоспазма, судорог, удлинения интервала QT с угрозой аритмий — требует экстренной
        коррекции внутривенным кальцием при симптомной гипокальциемии.
    treatment_hints:
    - step: ЭКГ немедленно
      note: Оценка удлинения QT.
    - step: Магний
      note: Гипомагниемия часто сопутствует и мешает коррекции кальция — проверить и восполнить параллельно.
    references:
    - Общие рекомендации по неотложной коррекции электролитных нарушений
  hyperkalemia_critical:
    id: hyperkalemia_critical
    label: Критическая гиперкалиемия
    category: Нефрология
    description: Критически повышенный калий — жизнеугрожающее состояние с высоким риском остановки сердца.
    criteria:
    - parameter: potassium
      threshold: 6.5
      unit: ммоль/л
      condition: '>='
      comment_template: Калий {value} ммоль/л — критически повышен.
    differentials:
    - condition: ''
      text: Острое повреждение почек/ХБП, ложное повышение из-за гемолиза пробы, приём калийсберегающих
        диуретиков/ингибиторов РААС, рабдомиолиз, синдром распада опухоли, надпочечниковая недостаточность.
    red_flags:
    - condition: ''
      text: Экстренное состояние — риск жизнеугрожающих аритмий и остановки сердца. Требует немедленной
        ЭКГ и экстренного лечения (кальция глюконат для стабилизации мембраны, инсулин с глюкозой, при
        показаниях — гемодиализ).
    treatment_hints:
    - step: ЭКГ немедленно
      note: Пикообразные зубцы T, расширение QRS — признаки кардиотоксичности.
    - step: Исключить гемолиз пробы, но не откладывать лечение при клинических признаках
      note: Повторный забор для подтверждения, но при явных изменениях на ЭКГ лечение начинают немедленно.
    references:
    - KDIGO guidelines for electrolyte disorders
  hypokalemia_severe:
    id: hypokalemia_severe
    label: Тяжёлая гипокалиемия
    category: Нефрология
    description: Значительно сниженный калий — риск тяжёлых аритмий и мышечной слабости вплоть до паралича.
    criteria:
    - parameter: potassium
      threshold: 2.5
      unit: ммоль/л
      condition: <=
      comment_template: Калий {value} ммоль/л — критически снижен.
    differentials:
    - condition: ''
      text: Потери через ЖКТ (рвота, диарея), приём диуретиков, первичный гиперальдостеронизм, почечный
        канальцевый ацидоз, недостаточное потребление, инсулинотерапия (перераспределение в клетки).
    red_flags:
    - condition: ''
      text: Риск жизнеугрожающих аритмий и восходящего паралича при крайне низких значениях — требует
        ЭКГ-мониторинга и осторожного внутривенного восполнения (риск при слишком быстром введении).
    treatment_hints:
    - step: ЭКГ
      note: Уплощение зубца T, появление зубца U.
    - step: Магний
      note: Гипомагниемия часто сопутствует и препятствует коррекции калия.
    references:
    - Общие рекомендации по неотложной коррекции электролитных нарушений
  hypernatremia_severe:
    id: hypernatremia_severe
    label: Тяжёлая гипернатриемия
    category: Нефрология
    description: Значительно повышенный натрий — риск тяжёлых неврологических осложнений.
    criteria:
    - parameter: sodium
      threshold: 160
      unit: ммоль/л
      condition: '>='
      comment_template: Натрий {value} ммоль/л — критически повышен.
    differentials:
    - condition: ''
      text: Несахарный диабет (см. соответствующее правило в эндокринологии), недостаточное потребление
        воды (особенно у пожилых, детей, лежачих пациентов), избыточные потери жидкости без адекватного
        возмещения, ятрогенное введение гипертонических растворов.
    red_flags:
    - condition: ''
      text: Риск судорог и необратимого повреждения мозга — коррекция должна быть постепенной (не более
        10-12 ммоль/л в сутки), слишком быстрая коррекция опасна отёком мозга.
    treatment_hints:
    - step: Медленная, контролируемая коррекция жидкостью
      note: Скорость снижения натрия — критически важный параметр безопасности.
    references:
    - Общие рекомендации по коррекции гипернатриемии
  hyponatremia_severe:
    id: hyponatremia_severe
    label: Тяжёлая гипонатриемия
    category: Нефрология
    description: Значительно сниженный натрий — риск отёка мозга и жизнеугрожающих неврологических симптомов.
    criteria:
    - parameter: sodium
      threshold: 120
      unit: ммоль/л
      condition: <=
      comment_template: Натрий {value} ммоль/л — критически снижен.
    differentials:
    - condition: ''
      text: Синдром неадекватной секреции АДГ (SIADH), сердечная/печёночная/почечная недостаточность с
        задержкой жидкости, приём тиазидных диуретиков, полидипсия, надпочечниковая недостаточность.
    red_flags:
    - condition: ''
      text: Риск судорог, комы, вклинения мозга при быстром развитии. Коррекция также должна быть постепенной
        (не более 8-10 ммоль/л в сутки) — слишком быстрая коррекция вызывает осмотический демиелинизирующий
        синдром, потенциально необратимый.
    treatment_hints:
    - step: Определить остроту развития (острая vs хроническая)
      note: Определяет допустимую скорость коррекции — острая гипонатриемия (<48ч) допускает более быструю
        коррекцию, чем хроническая.
    references:
    - European Clinical Practice Guideline on the diagnosis and treatment of hyponatraemia
  hypermagnesemia:
    id: hypermagnesemia
    label: Гипермагниемия
    category: Нефрология
    description: Повышенный магний — редкое нарушение, почти всегда связанное с почечной недостаточностью
      или избыточным экзогенным поступлением.
    criteria:
    - parameter: magnesium
      threshold: 1.07
      unit: ммоль/л
      condition: '>='
      comment_template: Магний {value} ммоль/л — повышен.
    differentials:
    - condition: ''
      text: Почечная недостаточность (наиболее частая причина — почки не могут вывести избыток магния),
        избыточный приём магнийсодержащих антацидов/слабительных, введение магния сульфата (например при
        преэклампсии).
    red_flags:
    - condition: magnesium >= 2.0
      text: Значительное повышение — риск угнетения дыхания, потери глубоких сухожильных рефлексов, брадикардии,
        остановки сердца при крайне высоких уровнях.
    treatment_hints:
    - step: Оценить функцию почек
      note: Ключевой фактор — при сохранной функции почек организм обычно справляется самостоятельно.
    - step: Кальция глюконат как антидот при тяжёлых симптомах
      note: Прямой антагонист кардио/нейротоксических эффектов магния.
    references:
    - Общие рекомендации по электролитным нарушениям
  hypomagnesemia:
    id: hypomagnesemia
    label: Гипомагниемия
    category: Нефрология
    description: Сниженный магний — часто недооценивается, но важен, так как мешает коррекции калия и
      кальция.
    criteria:
    - parameter: magnesium
      threshold: 0.66
      unit: ммоль/л
      condition: <=
      comment_template: Магний {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: Потери через ЖКТ (диарея, синдромы мальабсорбции), почечные потери (диуретики, некоторые нефротоксичные
        препараты — аминогликозиды, цисплатин), хронический алкоголизм, недостаточное питание.
    red_flags:
    - condition: ''
      text: Часто сопутствует резистентной к лечению гипокалиемии и гипокальциемии — если эти нарушения
        не корректируются стандартной терапией, проверить и восполнить магний.
    treatment_hints:
    - step: Проверять при рефрактерной гипокалиемии/гипокальциемии
      note: Некоррегированная гипомагниемия мешает эффективной коррекции обоих.
    references:
    - Общие рекомендации по электролитным нарушениям
  hyperphosphatemia:
    id: hyperphosphatemia
    label: Гиперфосфатемия
    category: Нефрология
    description: Повышенный фосфат — часто сопровождает ХБП, важен для оценки минерально-костных нарушений.
    criteria:
    - parameter: phosphate
      threshold: 1.5
      unit: ммоль/л
      condition: '>='
      comment_template: Фосфат {value} ммоль/л — повышен.
    differentials:
    - condition: ''
      text: ХБП (сниженное выведение фосфата — наиболее частая причина), гипопаратиреоз/псевдогипопаратиреоз
        (см. соответствующие правила в эндокринологии), синдром распада опухоли, избыточное потребление
        фосфатов.
    red_flags:
    - condition: ''
      text: Длительная гиперфосфатемия при ХБП способствует сосудистой кальцификации и вторичному гиперпаратиреозу
        — важна для долгосрочного контроля минерально-костного обмена.
    treatment_hints:
    - step: Оценить функцию почек
      note: ХБП — наиболее частая причина.
    - step: Фосфат-связывающие препараты при ХБП
      note: Стандартный компонент терапии минерально-костных нарушений при ХБП.
    references:
    - KDIGO Clinical Practice Guideline for CKD-Mineral and Bone Disorder
  hypophosphatemia:
    id: hypophosphatemia
    label: Гипофосфатемия
    category: Нефрология
    description: Сниженный фосфат.
    criteria:
    - parameter: phosphate
      threshold: 0.8
      unit: ммоль/л
      condition: <=
      comment_template: Фосфат {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: Синдром возобновлённого питания (refeeding syndrome) у истощённых пациентов, гиперпаратиреоз
        (см. `primary_hyperparathyroidism`), дефицит витамина D (см. `osteomalacia`), почечные потери
        (синдром Фанкони), хронический алкоголизм.
    red_flags:
    - condition: phosphate <= 0.3
      text: Выраженная гипофосфатемия — риск мышечной слабости (вплоть до дыхательной недостаточности),
        рабдомиолиза, гемолиза. Особенно опасна при синдроме возобновлённого питания — требует медленного,
        контролируемого начала питания у истощённых пациентов.
    treatment_hints:
    - step: Уточнить недавнее возобновление питания после голодания/истощения
      note: Классическая, потенциально предотвратимая причина.
    references:
    - Общие рекомендации по синдрому возобновлённого питания
  acute_kidney_injury_stage2:
    id: acute_kidney_injury_stage2
    label: Острое повреждение почек, стадия 2
    category: Нефрология
    description: Повышение креатинина в 2-2.9 раза от исходного вместе со снижением СКФ — соответствует
      стадии 2 острого повреждения почек по критериям KDIGO.
    criteria:
    - parameter: creatinine
      threshold: 200
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — значительно повышен.
    - parameter: egfr
      threshold: 30
      unit: мл/мин
      condition: <=
      comment_template: СКФ {value} мл/мин — снижена.
    differentials:
    - condition: ''
      text: Преренальные причины (гиповолемия, гипотензия), ренальные причины (острый тубулярный некроз,
        нефротоксины), постренальные причины (обструкция мочевых путей) — классическая триада причин ОПП.
    red_flags:
    - condition: ''
      text: Оценить диурез в динамике — олигурия/анурия свидетельствует о более тяжёлом течении и худшем
        прогнозе.
    treatment_hints:
    - step: Определить преренальную/ренальную/постренальную причину
      note: УЗИ почек для исключения обструкции, оценка волемического статуса.
    - step: Отменить нефротоксичные препараты
      note: НПВС, определённые антибиотики, контрастные вещества по возможности.
    references:
    - KDIGO Clinical Practice Guideline for Acute Kidney Injury
  acute_kidney_injury_stage3:
    id: acute_kidney_injury_stage3
    label: Острое повреждение почек, стадия 3
    category: Нефрология
    description: Значительное повышение креатинина (в 3 и более раз от исходного) вместе с выраженным
      снижением СКФ — соответствует стадии 3 острого повреждения почек, наиболее тяжёлой по критериям
      KDIGO.
    criteria:
    - parameter: creatinine
      threshold: 350
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — значительно повышен.
    - parameter: egfr
      threshold: 15
      unit: мл/мин
      condition: <=
      comment_template: СКФ {value} мл/мин — значительно снижена.
    differentials:
    - condition: ''
      text: См. `acute_kidney_injury_stage2` — тот же спектр причин, более выраженная степень.
    red_flags:
    - condition: ''
      text: Стадия 3 — показание для рассмотрения заместительной почечной терапии (диализа), особенно
        при сопутствующей гиперкалиемии, ацидозе, перегрузке объёмом или уремических симптомах.
    treatment_hints:
    - step: Оценить показания к экстренному диализу
      note: Тяжёлая гиперкалиемия, ацидоз, перегрузка объёмом, уремический перикардит/энцефалопатия —
        классические показания.
    references:
    - KDIGO Clinical Practice Guideline for Acute Kidney Injury
  ckd_stage3:
    id: ckd_stage3
    label: Хроническая болезнь почек, стадия 3
    category: Нефрология
    description: Умеренное снижение СКФ (30-59 мл/мин) — соответствует стадии 3 хронической болезни почек.
    criteria:
    - parameter: egfr
      threshold: 60
      unit: мл/мин
      condition: <=
      comment_template: СКФ {value} мл/мин — снижена, соответствует стадии 3 ХБП.
    differentials:
    - condition: ''
      text: Диабетическая нефропатия, гипертензивная нефропатия, гломерулонефриты, поликистозная болезнь
        почек — наиболее частые причины ХБП. Требуется подтверждение стойкости снижения (повторное измерение
        через 3 месяца) для окончательной постановки диагноза ХБП.
    red_flags:
    - condition: ''
      text: Стадия 3 — этап для активной оценки и коррекции факторов прогрессирования (артериальное давление,
        протеинурия, гликемический контроль при диабете) и подготовки к возможному наблюдению у нефролога.
    treatment_hints:
    - step: Подтвердить стойкость снижения СКФ
      note: Повторное измерение через 3 месяца — однократное снижение не равно диагнозу ХБП.
    - step: Оценить протеинурию
      note: Соотношение альбумин/креатинин мочи — важный дополнительный маркер стадирования риска (KDIGO
        heat map).
    references:
    - KDIGO Clinical Practice Guideline for CKD
  ckd_stage4:
    id: ckd_stage4
    label: Хроническая болезнь почек, стадия 4 (по креатинину/мочевине)
    category: Нефрология
    description: 'Значительно повышенные креатинин и мочевина — соответствует стадии 4 хронической болезни
      почек (тяжёлое снижение функции, СКФ 15-29 мл/мин). Примечание: критерий по СКФ в этом файле (`egfr
      >= 15` без верхней границы) технически охватывает и нормальные значения eGFR — см. список находок
      по данным, текст интерпретации написан только для критериев по креатинину и мочевине, не для этого
      условия.'
    criteria:
    - parameter: creatinine
      threshold: 300
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — значительно повышен.
    - parameter: urea
      threshold: 20
      unit: ммоль/л
      condition: '>='
      comment_template: Мочевина {value} ммоль/л — значительно повышена.
    differentials:
    - condition: ''
      text: Прогрессирование ХБП любой этиологии (см. `ckd_stage3`).
    red_flags:
    - condition: ''
      text: 'Стадия 4 — этап для подготовки к заместительной почечной терапии: обсуждение вариантов (диализ,
        трансплантация), формирование сосудистого доступа заблаговременно, направление на лист ожидания
        трансплантации при подходящих кандидатах.'
    treatment_hints:
    - step: Направление к нефрологу для планирования ЗПТ
      note: Заблаговременная подготовка улучшает исходы по сравнению с экстренным началом диализа.
    references:
    - KDIGO Clinical Practice Guideline for CKD
  ckd_stage5:
    id: ckd_stage5
    label: Хроническая болезнь почек, стадия 5 (терминальная)
    category: Нефрология
    description: Критически повышенные креатинин и мочевина при выраженно сниженной СКФ — терминальная
      стадия хронической болезни почек, требующая заместительной почечной терапии.
    criteria:
    - parameter: egfr
      threshold: 14
      unit: мл/мин
      condition: <=
      comment_template: СКФ {value} мл/мин — критически снижена.
    - parameter: creatinine
      threshold: 500
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — критически повышен.
    - parameter: urea
      threshold: 30
      unit: ммоль/л
      condition: '>='
      comment_template: Мочевина {value} ммоль/л — критически повышена.
    differentials:
    - condition: ''
      text: Терминальная стадия ХБП любой этиологии.
    red_flags:
    - condition: ''
      text: 'Оценить неотложные показания к диализу: тяжёлая гиперкалиемия, ацидоз, перегрузка объёмом
        с отёком лёгких, уремический перикардит или энцефалопатия.'
    treatment_hints:
    - step: Заместительная почечная терапия
      note: Гемодиализ, перитонеальный диализ или трансплантация почки в зависимости от готовности и предпочтений
        пациента.
    references:
    - KDIGO Clinical Practice Guideline for CKD
  iga_nephropathy:
    id: iga_nephropathy
    label: IgA-нефропатия (предположительно)
    category: Нефрология
    description: Сочетание протеинурии и гематурии — наиболее частый лабораторный паттерн IgA-нефропатии,
      самого распространённого первичного гломерулонефрита в мире.
    criteria:
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия.
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    differentials:
    - condition: ''
      text: IgA-нефропатия (часто проявляется эпизодами макрогематурии на фоне/сразу после респираторной
        инфекции), тонкая базальная мембрана (доброкачественная семейная гематурия), другие гломерулонефриты
        (см. `lupus_nephritis`, `rapidly_progressive_glomerulonephritis`).
    red_flags:
    - condition: urine_protein >= 1000
      text: Значительная протеинурия — фактор худшего прогноза, повышает приоритетность нефрологической
        оценки и биопсии.
    treatment_hints:
    - step: Биопсия почки
      note: Единственный способ окончательно подтвердить диагноз и оценить активность/хронизацию процесса.
    - step: Контроль артериального давления и ингибиторы РААС
      note: Основа консервативной терапии независимо от подтверждения биопсией — снижают протеинурию и
        замедляют прогрессирование.
    references:
    - KDIGO Clinical Practice Guideline for glomerular diseases
  membranous_nephropathy:
    id: membranous_nephropathy
    label: Мембранозная нефропатия (предположительно)
    category: Нефрология
    description: Значительная протеинурия нефротического уровня со сниженным альбумином — характерно для
      мембранозной нефропатии, частой причины нефротического синдрома у взрослых.
    criteria:
    - parameter: urine_protein
      threshold: 3500
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия нефротического уровня.
    - parameter: albumin
      threshold: 30
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен.
    differentials:
    - condition: ''
      text: Первичная (аутоиммунная, антитела к PLA2R) мембранозная нефропатия, вторичная (злокачественные
        новообразования, гепатит B, СКВ, лекарства). У пациентов старше 60 лет с новым нефротическим синдромом
        стоит целенаправленно искать скрытое злокачественное новообразование.
    red_flags:
    - condition: albumin <= 20
      text: Выраженная гипоальбуминемия — повышенный риск тромбоэмболических осложнений (нефротический
        синдром — известный протромботический фактор, особенно при мембранозной нефропатии).
    treatment_hints:
    - step: Антитела к рецептору фосфолипазы A2 (анти-PLA2R)
      note: Положительны у большинства пациентов с первичной мембранозной нефропатией — снижает потребность
        в биопсии в типичных случаях.
    - step: Скрининг вторичных причин у пациентов старшего возраста
      note: Онкопоиск, серология гепатита B, антинуклеарные антитела.
    references:
    - KDIGO Clinical Practice Guideline for glomerular diseases
  minimal_change_disease:
    id: minimal_change_disease
    label: Болезнь минимальных изменений (предположительно)
    category: Нефрология
    description: Массивная протеинурия нефротического уровня с выраженной гипоальбуминемией без гематурии
      — типичная картина болезни минимальных изменений, наиболее частой причины нефротического синдрома
      у детей.
    criteria:
    - parameter: urine_protein
      threshold: 3500
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия нефротического уровня.
    - parameter: albumin
      threshold: 25
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — значительно снижен.
    differentials:
    - condition: ''
      text: Болезнь минимальных изменений (у детей — наиболее частая причина нефротического синдрома,
        обычно хорошо отвечает на кортикостероиды), у взрослых — также рассмотреть фокально-сегментарный
        гломерулосклероз (см. `focal_segmental_glomerulosclerosis`), мембранозную нефропатию.
    red_flags:
    - condition: ''
      text: У детей с типичной картиной часто начинают эмпирическую терапию кортикостероидами без биопсии
        — хороший ответ подтверждает диагноз ретроспективно; у взрослых порог для биопсии ниже.
    treatment_hints:
    - step: У детей — пробная терапия кортикостероидами часто предшествует биопсии
      note: Хороший ответ на стероиды типичен именно для этого заболевания.
    references:
    - KDIGO Clinical Practice Guideline for glomerular diseases
  focal_segmental_glomerulosclerosis:
    id: focal_segmental_glomerulosclerosis
    label: Фокально-сегментарный гломерулосклероз (предположительно)
    category: Нефрология
    description: Нефротическая протеинурия со сниженным альбумином и часто сопутствующим снижением функции
      почек — характерно для фокально-сегментарного гломерулосклероза, частой причины нефротического синдрома
      у взрослых, особенно резистентного к стандартной стероидной терапии.
    criteria:
    - parameter: urine_protein
      threshold: 3500
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия нефротического уровня.
    - parameter: albumin
      threshold: 30
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен.
    - parameter: creatinine
      threshold: 120
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Первичный (идиопатический) ФСГС, вторичный (ожирение, рефлюкс-нефропатия, снижение массы функционирующих
        нефронов), генетические формы (у детей и молодых взрослых), ВИЧ-ассоциированная нефропатия.
    red_flags:
    - condition: creatinine >= 200
      text: Снижение функции почек на момент постановки диагноза — известный неблагоприятный прогностический
        фактор.
    treatment_hints:
    - step: Биопсия почки обязательна
      note: ФСГС — гистологический диагноз, клинико-лабораторная картина только предположительна.
    references:
    - KDIGO Clinical Practice Guideline for glomerular diseases
  goodpasture_syndrome:
    id: goodpasture_syndrome
    label: Синдром Гудпасчера (предположительно)
    category: Нефрология
    description: Быстро нарастающая протеинурия и гематурия со снижением функции почек — картина быстропрогрессирующего
      гломерулонефрита, требующая исключения синдрома Гудпасчера (антитела к базальной мембране клубочков)
      при сопутствующем лёгочном кровотечении.
    criteria:
    - parameter: urine_protein
      threshold: 300
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия.
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    - parameter: creatinine
      threshold: 150
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Синдром Гудпасчера (анти-GBM болезнь) при сопутствующем лёгочном кровотечении (кровохарканье),
        другие причины быстропрогрессирующего гломерулонефрита — см. `rapidly_progressive_glomerulonephritis`,
        АНЦА-ассоциированный васкулит (см. `vasculitis` в ревматологии).
    red_flags:
    - condition: ''
      text: Сочетание с кровохарканьем/лёгочными инфильтратами — жизнеугрожающее состояние (лёгочно-почечный
        синдром), требует экстренной оценки антител к базальной мембране клубочков (анти-GBM) и немедленного
        начала плазмафереза/иммуносупрессии при подтверждении.
    treatment_hints:
    - step: Антитела к базальной мембране клубочков (анти-GBM)
      note: Ключевой подтверждающий тест.
    - step: Срочная биопсия почки
      note: Линейное свечение вдоль базальной мембраны — патогномоничный признак.
    references:
    - KDIGO Clinical Practice Guideline for glomerular diseases
  lupus_nephritis:
    id: lupus_nephritis
    label: Волчаночный нефрит (предположительно)
    category: Нефрология
    description: Протеинурия и гематурия у пациента с известной или предполагаемой СКВ — см. также `systemic_lupus`
      в ревматологии для полной серологической картины.
    criteria:
    - parameter: urine_protein
      threshold: 500
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия.
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    differentials:
    - condition: ''
      text: Волчаночный нефрит при подтверждённой СКВ. Изолированно, без серологического подтверждения
        СКВ (анти-дсДНК, комплемент — см. `systemic_lupus`), протеинурия и гематурия неспецифичны и требуют
        более широкого дифдиагноза гломерулярных заболеваний.
    red_flags:
    - condition: urine_protein >= 3000
      text: Нефротический уровень протеинурии у пациента с СКВ — приоритетное показание к биопсии почки
        для определения класса волчаночного нефрита, что напрямую определяет тактику иммуносупрессии.
    treatment_hints:
    - step: Проверить серологию СКВ (анти-дсДНК, комплемент C3/C4)
      note: См. `systemic_lupus` — критично для подтверждения контекста.
    - step: Биопсия почки
      note: Классификация класса волчаночного нефрита (I-VI по ISN/RPS) определяет терапию.
    references:
    - KDIGO Clinical Practice Guideline for glomerular diseases (lupus nephritis)
  acute_glomerulonephritis:
    id: acute_glomerulonephritis
    label: Острый гломерулонефрит (предположительно)
    category: Нефрология
    description: Гематурия и протеинурия с острым снижением функции почек — картина острого гломерулонефрита,
      классически (хоть не всегда) вследствие постинфекционного (постстрептококкового) процесса.
    criteria:
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    - parameter: urine_protein
      threshold: 300
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия.
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Постинфекционный (постстрептококковый) гломерулонефрит (типично через 1-3 недели после стрептококковой
        инфекции горла/кожи, чаще у детей), IgA-нефропатия (см. `iga_nephropathy`), другие первичные и
        вторичные гломерулонефриты.
    red_flags:
    - condition: ''
      text: Артериальная гипертензия и отёки на фоне остро возникшей гематурии/протеинурии — классическая
        нефритическая триада, усиливает подозрение на острый гломерулонефрит.
    treatment_hints:
    - step: Уточнить недавнюю инфекцию (горло, кожа)
      note: Особенно у детей — типичный анамнез для постстрептококкового ГН.
    - step: Титр АСЛ-О, комплемент C3
      note: Подтверждающие тесты для постстрептококкового варианта — С3 транзиторно снижен.
    references:
    - KDIGO Clinical Practice Guideline for glomerular diseases
  acute_pyelonephritis:
    id: acute_pyelonephritis
    label: Острый пиелонефрит (предположительно)
    category: Нефрология
    description: Лейкоцитурия с признаками системного воспаления — картина острого пиелонефрита (инфекции
      верхних мочевых путей). См. также `urinary_tract_infection` в инфекционных болезнях для более общего
      скрининга ИМП.
    criteria:
    - parameter: urine_leukocytes
      threshold: 10
      unit: в п/зр
      condition: '>='
      comment_template: Лейкоциты в моче {value} в поле зрения — лейкоцитурия.
    - parameter: crp
      threshold: 50
      unit: мг/л
      condition: '>='
      comment_template: СРБ {value} мг/л — значительно повышен, характерно для пиелонефрита в отличие
        от неосложнённого цистита.
    differentials:
    - condition: ''
      text: Острый пиелонефрит (чаще восходящая инфекция, E. coli — наиболее частый возбудитель), в отличие
        от неосложнённого цистита нижних мочевых путей (там СРБ обычно в норме/незначительно повышен).
    red_flags:
    - condition: crp >= 150
      text: Значительное повышение СРБ — оценить признаки осложнённого течения (обструкция, абсцесс почки,
        уросепсис), особенно при отсутствии быстрого клинического улучшения на антибиотиках.
    treatment_hints:
    - step: Посев мочи до начала антибиотикотерапии
      note: Определяет чувствительность и позволяет деэскалацию терапии.
    - step: УЗИ почек при тяжёлом течении или отсутствии улучшения через 48-72ч
      note: Исключить обструкцию или абсцесс.
    references:
    - EAU Guidelines on urological infections
  chronic_pyelonephritis:
    id: chronic_pyelonephritis
    label: Хронический пиелонефрит (предположительно)
    category: Нефрология
    description: Персистирующая лейкоцитурия со снижением функции почек — картина хронического пиелонефрита,
      часто на фоне анатомических аномалий или рецидивирующих инфекций.
    criteria:
    - parameter: urine_leukocytes
      threshold: 10
      unit: в п/зр
      condition: '>='
      comment_template: Лейкоциты в моче {value} в поле зрения — лейкоцитурия.
    - parameter: egfr
      threshold: 60
      unit: мл/мин
      condition: <=
      comment_template: СКФ {value} мл/мин — снижена.
    differentials:
    - condition: ''
      text: Хронический пиелонефрит, часто на фоне пузырно-мочеточникового рефлюкса, мочекаменной болезни,
        обструктивной уропатии. У детей с рецидивирующими ИМП — целенаправленный поиск анатомических аномалий.
    red_flags:
    - condition: ''
      text: Рецидивирующие эпизоды у детей — показание для визуализации мочевых путей (УЗИ, при необходимости
        цистоуретрография) для поиска устранимой анатомической причины.
    treatment_hints:
    - step: УЗИ мочевых путей
      note: Поиск структурной причины рецидивирования.
    references:
    - EAU Guidelines on urological infections
  acute_tubulointerstitial_nephritis:
    id: acute_tubulointerstitial_nephritis
    label: Острый тубулоинтерстициальный нефрит (предположительно)
    category: Нефрология
    description: Острое снижение функции почек с эозинофилией в моче — классическое, хоть и не всегда
      присутствующее сочетание для острого тубулоинтерстициального нефрита, часто лекарственно-индуцированного.
    criteria:
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    - parameter: urine_eosinophils
      threshold: 1
      unit: '%'
      condition: '>='
      comment_template: Эозинофилы в моче {value}% — присутствуют, наводят на лекарственную этиологию.
    differentials:
    - condition: ''
      text: Лекарственно-индуцированный (антибиотики — особенно бета-лактамы, НПВС, ингибиторы протонной
        помпы — наиболее частая причина), инфекционный, аутоиммунный тубулоинтерстициальный нефрит.
    red_flags:
    - condition: ''
      text: Уточнить недавнее начало нового препарата — своевременная отмена причинного лекарства критична
        для восстановления функции.
    treatment_hints:
    - step: Тщательный пересмотр всех принимаемых препаратов
      note: Отмена подозреваемого препарата — основа лечения.
    - step: Биопсия почки при неясности или отсутствии улучшения после отмены
      note: Подтверждает диагноз и оценивает необходимость кортикостероидов.
    references:
    - Общие рекомендации по острому тубулоинтерстициальному нефриту
  chronic_interstitial_nephritis:
    id: chronic_interstitial_nephritis
    label: Хронический интерстициальный нефрит (предположительно)
    category: Нефрология
    description: Постепенное снижение функции почек с минимальной протеинурией — типичная, хоть и неспецифичная
      картина хронического интерстициального нефрита (в отличие от гломерулярных заболеваний, где протеинурия
      обычно более выражена).
    criteria:
    - parameter: egfr
      threshold: 60
      unit: мл/мин
      condition: <=
      comment_template: СКФ {value} мл/мин — снижена.
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: <=
      comment_template: Белок в моче {value} мг/сут — незначительный, типично для интерстициального, а
        не гломерулярного поражения.
    differentials:
    - condition: ''
      text: Длительный приём нефротоксичных препаратов (см. `nsaid_nephropathy`, `lithium_nephropathy`),
        хронический пиелонефрит, обструктивная уропатия, анальгетическая нефропатия.
    red_flags:
    - condition: ''
      text: Непропорционально малая протеинурия относительно степени снижения СКФ — характерный паттерн,
        отличающий интерстициальное поражение от гломерулярного, стоит целенаправленно искать токсическую/обструктивную
        причину.
    treatment_hints:
    - step: Тщательный пересмотр длительно принимаемых препаратов
      note: НПВС, литий, анальгетики в анамнезе — частые причины.
    references:
    - Общие рекомендации по хроническому тубулоинтерстициальному нефриту
  contrast_nephropathy:
    id: contrast_nephropathy
    label: Контраст-индуцированная нефропатия (предположительно)
    category: Нефрология
    description: Повышение креатинина после недавнего введения йодсодержащего контрастного вещества —
      характерно для контраст-индуцированной нефропатии.
    criteria:
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Контраст-индуцированная нефропатия при недавнем (обычно 48-72 часа) введении йодсодержащего
        контраста, особенно у пациентов с исходно сниженной функцией почек, диабетом, обезвоживанием.
    red_flags:
    - condition: ''
      text: Обычно самоограничивающееся состояние с восстановлением функции в течение 1-2 недель — но
        требует наблюдения, особенно при исходно скомпрометированной функции почек.
    treatment_hints:
    - step: Уточнить время и объём введённого контраста
      note: Ключевой анамнестический факт для подтверждения временной связи.
    - step: Адекватная гидратация перед плановыми контрастными исследованиями у пациентов группы риска
      note: Основная профилактическая мера.
    references:
    - ESUR Guidelines on contrast media
  nsaid_nephropathy:
    id: nsaid_nephropathy
    label: НПВС-индуцированная нефропатия (предположительно)
    category: Нефрология
    description: Снижение функции почек на фоне регулярного приёма нестероидных противовоспалительных
      препаратов.
    criteria:
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Острое повреждение почек вследствие нарушения ауторегуляции почечного кровотока (НПВС блокируют
        простагландин-опосредованную вазодилатацию), особенно у пациентов с исходной гиповолемией, ХБП,
        приёмом ингибиторов РААС/диуретиков одновременно. При длительном приёме — хроническая анальгетическая
        нефропатия.
    red_flags:
    - condition: ''
      text: Комбинация НПВС + ингибитор АПФ/БРА + диуретик («тройной удар») — особенно высокий риск острого
        повреждения почек, стоит целенаправленно выявлять такие комбинации.
    treatment_hints:
    - step: Отмена НПВС
      note: Основа лечения, функция обычно восстанавливается после отмены при остром повреждении.
    references:
    - Общие рекомендации по лекарственно-индуцированному поражению почек
  lithium_nephropathy:
    id: lithium_nephropathy
    label: Литий-индуцированная нефропатия (предположительно)
    category: Нефрология
    description: Снижение функции почек у пациента, длительно принимающего препараты лития.
    criteria:
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Хроническая тубулоинтерстициальная нефропатия вследствие длительного приёма лития, часто сопровождается
        нефрогенным несахарным диабетом (резистентность собирательных трубочек к АДГ).
    red_flags:
    - condition: ''
      text: Полиурия/полидипсия на фоне приёма лития — признак сопутствующего нефрогенного несахарного
        диабета, требует оценки осмоляльности мочи и обсуждения с психиатром баланса пользы/риска продолжения
        терапии литием.
    treatment_hints:
    - step: Уровень лития в крови
      note: Оценка токсичности текущей дозы.
    - step: Мониторинг функции почек в динамике при длительной терапии литием
      note: Регулярный контроль — стандарт наблюдения пациентов на литии.
    references:
    - Общие рекомендации по мониторингу терапии литием
  gouty_nephropathy:
    id: gouty_nephropathy
    label: Подагрическая нефропатия (предположительно)
    category: Нефрология
    description: Повышенная мочевая кислота вместе со снижением функции почек — характерно для подагрической
      нефропатии (хроническое поражение почек вследствие длительной гиперурикемии/уратных кристаллов).
    criteria:
    - parameter: uric_acid
      threshold: 420
      unit: мкмоль/л
      condition: '>='
      comment_template: Мочевая кислота {value} мкмоль/л — повышена.
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Хроническая подагрическая нефропатия при длительной гиперурикемии, острая уратная нефропатия
        (синдром распада опухоли — резкое массивное повышение мочевой кислоты после начала химиотерапии).
    red_flags:
    - condition: uric_acid >= 800
      text: Очень высокая мочевая кислота, особенно на фоне недавно начатой химиотерапии — заподозрить
        острый синдром распада опухоли, требует экстренной коррекции и профилактики острого повреждения
        почек.
    treatment_hints:
    - step: Уточнить анамнез подагры и недавней химиотерапии
      note: Разделяет хронический и острый механизм.
    references:
    - Общие рекомендации по подагрической нефропатии
  atheroembolic_kidney_disease:
    id: atheroembolic_kidney_disease
    label: Атероэмболическая болезнь почек (предположительно)
    category: Нефрология
    description: Подострое снижение функции почек после недавней сосудистой процедуры (катетеризация,
      ангиография) — характерно для атероэмболической болезни почек вследствие эмболизации холестериновыми
      кристаллами.
    criteria:
    - parameter: creatinine
      threshold: 150
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Атероэмболическая болезнь почек после недавнего сосудистого вмешательства (в отличие от контраст-индуцированной
        нефропатии, ухудшение функции развивается позже — дни-недели, а не сразу).
    red_flags:
    - condition: ''
      text: 'Сопутствующие признаки: livedo reticularis, синдром синего пальца стопы, эозинофилия — характерная,
        хоть не всегда полная триада, усиливающая подозрение на атероэмболию.'
    treatment_hints:
    - step: Осмотр кожи нижних конечностей
      note: Поиск livedo reticularis и признаков дистальной эмболизации.
    - step: Эозинофилы крови
      note: Транзиторная эозинофилия часто сопутствует.
    references:
    - Общие рекомендации по атероэмболической болезни
  hypertensive_nephropathy:
    id: hypertensive_nephropathy
    label: Гипертензивная нефропатия (предположительно)
    category: Нефрология
    description: Снижение функции почек с умеренной протеинурией у пациента с длительной артериальной
      гипертензией — характерно для гипертензивного нефросклероза.
    criteria:
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — умеренная протеинурия, типична для гипертензивного
        поражения (обычно менее выражена, чем при первичных гломерулопатиях).
    differentials:
    - condition: ''
      text: Гипертензивный нефросклероз при длительной плохо контролируемой артериальной гипертензии.
        Значительная протеинурия (нефротического уровня) нехарактерна для чисто гипертензивного поражения
        — стоит искать сопутствующую гломерулярную патологию.
    red_flags:
    - condition: ''
      text: Плохо контролируемое артериальное давление — ключевая цель терапии для замедления прогрессирования,
        независимо от подтверждения биопсией.
    treatment_hints:
    - step: Оптимизация контроля артериального давления
      note: Ингибиторы РААС предпочтительны при сопутствующей протеинурии.
    references:
    - KDIGO Clinical Practice Guideline for CKD
  renal_artery_stenosis:
    id: renal_artery_stenosis
    label: Стеноз почечной артерии (предположительно)
    category: Нефрология
    description: Ухудшение функции почек, особенно после начала терапии ингибитором АПФ/БРА — классический
      косвенный признак значимого стеноза почечной артерии.
    criteria:
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Атеросклеротический стеноз почечной артерии (чаще у пожилых с распространённым атеросклерозом),
        фибромускулярная дисплазия (чаще у молодых женщин).
    red_flags:
    - condition: ''
      text: Значительное ухудшение функции почек после начала ингибитора АПФ/БРА — важный клинический
        признак двустороннего значимого стеноза (или стеноза единственной почки), требует немедленной
        отмены препарата и обследования.
    treatment_hints:
    - step: УЗИ почечных артерий с допплерографией
      note: Скрининговый метод первой линии.
    - step: Уточнить временную связь с началом ингибитора АПФ/БРА
      note: Ключевой анамнестический признак.
    references:
    - ESC Guidelines on peripheral arterial diseases (включая почечные артерии)
  renal_vein_thrombosis:
    id: renal_vein_thrombosis
    label: Тромбоз почечной вены (предположительно)
    category: Нефрология
    description: Острое ухудшение функции почек с выраженной протеинурией — у пациента с нефротическим
      синдромом (сам являющимся протромботическим состоянием) заставляет заподозрить тромбоз почечной
      вены.
    criteria:
    - parameter: creatinine
      threshold: 150
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    - parameter: urine_protein
      threshold: 3500
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — нефротический уровень протеинурии, известный фактор
        протромботического риска.
    differentials:
    - condition: ''
      text: Тромбоз почечной вены, особенно как осложнение нефротического синдрома (см. `membranous_nephropathy`
        — наиболее частая ассоциированная причина среди гломерулопатий).
    red_flags:
    - condition: ''
      text: Острая боль в боку с макрогематурией у пациента с нефротическим синдромом — классическая,
        хоть не всегда полная картина, требует экстренной визуализации.
    treatment_hints:
    - step: КТ или МР-венография почек
      note: Метод выбора для подтверждения диагноза.
    - step: Антикоагуляция при подтверждении
      note: Стандартная тактика, длительность зависит от сохранения провоцирующего фактора (нефротический
        синдром).
    references:
    - Общие рекомендации по тромботическим осложнениям нефротического синдрома
  chronic_rejection:
    id: chronic_rejection
    label: Хроническое отторжение трансплантата (предположительно)
    category: Нефрология
    description: Постепенное снижение функции почечного трансплантата с нарастающей протеинурией — характерно
      для хронического отторжения (в отличие от острого, развивается медленно, месяцы-годы).
    criteria:
    - parameter: creatinine
      threshold: 150
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен относительно стабильного посттрансплантационного
        уровня.
    - parameter: urine_protein
      threshold: 500
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия.
    differentials:
    - condition: ''
      text: Хроническое антитело-опосредованное отторжение (наиболее частая причина позднего снижения
        функции трансплантата), возврат первичного гломерулярного заболевания в трансплантате, хроническая
        токсичность ингибиторов кальциневрина.
    red_flags:
    - condition: ''
      text: Любое необъяснимое снижение функции трансплантата требует срочной консультации трансплантационного
        центра — самостоятельная коррекция иммуносупрессии без биопсии не рекомендуется.
    treatment_hints:
    - step: Биопсия трансплантата
      note: Необходима для дифференциации причины снижения функции и выбора тактики.
    - step: Донор-специфичные антитела
      note: Оценка антитело-опосредованного компонента отторжения.
    references:
    - KDIGO Clinical Practice Guideline for the care of kidney transplant recipients
  adpkd:
    id: adpkd
    label: Аутосомно-доминантная поликистозная болезнь почек (предположительно)
    category: Нефрология
    description: Снижение функции почек у пациента с известным семейным анамнезом поликистозной болезни
      почек или множественными кистами на визуализации.
    criteria:
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: АДПКП (мутации PKD1/PKD2) — наиболее частая наследственная причина ХБП, обычно проявляется
        в зрелом возрасте. Диагноз преимущественно визуализационный (УЗИ/МРТ выявляет множественные кисты
        в обеих почках), а не лабораторный.
    red_flags:
    - condition: ''
      text: 'Сопутствующие внепочечные проявления: кисты печени, внутричерепные аневризмы (семейный скрининг
        при отягощённом анамнезе субарахноидальных кровоизлияний), пролапс митрального клапана.'
    treatment_hints:
    - step: УЗИ почек — основной диагностический метод
      note: Возраст-специфичные критерии Равина для подсчёта кист.
    - step: Контроль артериального давления
      note: Артериальная гипертензия развивается рано и требует активного контроля для замедления прогрессирования.
    references:
    - KDIGO Controversies Conference on ADPKD
  alport_syndrome:
    id: alport_syndrome
    label: Синдром Альпорта (предположительно)
    category: Нефрология
    description: Стойкая гематурия, часто с семейным анамнезом почечной недостаточности и/или тугоухости
      — характерно для синдрома Альпорта (наследственная патология коллагена базальной мембраны).
    criteria:
    - parameter: urine_erythrocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Эритроциты в моче {value} в поле зрения — гематурия.
    differentials:
    - condition: ''
      text: Синдром Альпорта (X-сцепленный чаще всего, мутации генов коллагена IV типа) — заподозрить
        при семейном анамнезе ХБП и/или нейросенсорной тугоухости. Изолированная гематурия без такого
        анамнеза значительно чаще объясняется другими причинами (см. `iga_nephropathy`, тонкая базальная
        мембрана).
    red_flags:
    - condition: ''
      text: Сопутствующая нейросенсорная тугоухость и/или изменения хрусталика глаза (передний лентиконус)
        — характерная, хоть не универсальная триада, усиливающая подозрение.
    treatment_hints:
    - step: Уточнить семейный анамнез ХБП и тугоухости
      note: Ключевой элемент клинического подозрения.
    - step: Аудиометрия
      note: Скрининг сопутствующей тугоухости.
    references:
    - Общие рекомендации по наследственным нефропатиям
  fabry_disease:
    id: fabry_disease
    label: Болезнь Фабри (предположительно)
    category: Нефрология
    description: Протеинурия у пациента с характерными внепочечными признаками (акропарестезии, ангиокератомы,
      гипогидроз) — редкая наследственная лизосомная болезнь накопления, поражающая почки как одно из
      системных проявлений.
    criteria:
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия (неспецифичный лабораторный признак
        для этого редкого диагноза).
    differentials:
    - condition: ''
      text: 'В подавляющем большинстве случаев изолированная протеинурия объясняется значительно более
        частыми причинами (см. другие правила этой базы). Болезнь Фабри — крайне редкое X-сцепленное заболевание,
        заподозрить дополнительно при характерных внепочечных признаках: акропарестезии с детства, ангиокератомы
        кожи, гипогидроз, помутнение роговицы, ранние инсульты/кардиомиопатия в семье.'
    red_flags:
    - condition: ''
      text: Без характерных внепочечных признаков один лишь повышенный белок в моче не является поводом
        для целенаправленного поиска этого редкого диагноза.
    treatment_hints:
    - step: Активность альфа-галактозидазы А
      note: Специфичный подтверждающий тест, не входит в текущий набор параметров этого правила.
    references:
    - Общие рекомендации по лизосомным болезням накопления
  cystinuria:
    id: cystinuria
    label: Цистинурия (предположительно)
    category: Нефрология
    description: Рецидивирующая мочекаменная болезнь, особенно с началом в молодом возрасте — заподозрить
      цистинурию (наследственное нарушение транспорта аминокислот) при соответствующем анамнезе.
    criteria:
    - parameter: urine_protein
      threshold: 150
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — неспецифичный сопутствующий признак.
    differentials:
    - condition: ''
      text: Цистинурия — наследственная причина рецидивирующего нефролитиаза (цистиновые камни), обычно
        проявляется в молодом возрасте, часто с семейным анамнезом мочекаменной болезни.
    red_flags:
    - condition: ''
      text: Рецидивирующие камни в молодом возрасте — показание для анализа состава камня и качественного
        теста на цистин в моче.
    treatment_hints:
    - step: Анализ состава удалённого/отошедшего камня
      note: Прямое подтверждение при обнаружении цистиновых кристаллов.
    - step: Обильное потребление жидкости и ощелачивание мочи
      note: Основа профилактики рецидивов.
    references:
    - Общие рекомендации по мочекаменной болезни
  renal_amyloidosis:
    id: renal_amyloidosis
    label: Почечный амилоидоз (предположительно)
    category: Нефрология
    description: Значительная протеинурия нефротического уровня, особенно у пациента с хроническим воспалительным
      заболеванием или плазмоклеточной дискразией — характерно для почечного амилоидоза.
    criteria:
    - parameter: urine_protein
      threshold: 3500
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия нефротического уровня.
    differentials:
    - condition: ''
      text: AL-амилоидоз (вследствие плазмоклеточной дискразии — см. также `myeloma_kidney`), AA-амилоидоз
        (вторичный, на фоне длительного хронического воспаления — ревматоидный артрит, хронические инфекции,
        семейная средиземноморская лихорадка).
    red_flags:
    - condition: ''
      text: 'Сопутствующие признаки системного амилоидоза: макроглоссия, периорбитальные кровоизлияния,
        рестриктивная кардиомиопатия, периферическая нейропатия, гепатомегалия — усиливают подозрение
        и требуют системной оценки, не только почечной.'
    treatment_hints:
    - step: Биопсия почки с окраской конго красным
      note: Подтверждающий метод, характерное яблочно-зелёное свечение в поляризованном свете.
    - step: Электрофорез белков сыворотки и мочи с иммунофиксацией
      note: Скрининг на моноклональную гаммапатию при подозрении на AL-тип.
    references:
    - Общие рекомендации по системному амилоидозу
  renal_sarcoidosis:
    id: renal_sarcoidosis
    label: Почечное поражение при саркоидозе (предположительно)
    category: Нефрология
    description: Снижение функции почек, часто вместе с гиперкальциемией, у пациента с известным или предполагаемым
      саркоидозом — гранулематозное поражение может напрямую поражать почки или проявляться через гиперкальциемию
      (избыточная продукция активного витамина D гранулёмами).
    criteria:
    - parameter: creatinine
      threshold: 130
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л — повышен, характерный сопутствующий признак саркоидоза.
    differentials:
    - condition: ''
      text: Гранулематозный интерстициальный нефрит при саркоидозе, гиперкальциемическая нефропатия вследствие
        избыточной продукции 1,25-дигидроксивитамина D гранулёмами.
    red_flags:
    - condition: ''
      text: Сопутствующие внепочечные признаки саркоидоза (лёгочная лимфаденопатия, увеит, кожные изменения)
        усиливают подозрение — почечное поражение редко бывает изолированным первым проявлением.
    treatment_hints:
    - step: Ангиотензинпревращающий фермент сыворотки
      note: Неспецифичный, но часто повышенный маркер активности саркоидоза.
    - step: КТ грудной клетки
      note: Поиск характерной внутригрудной лимфаденопатии.
    references:
    - Общие рекомендации по саркоидозу
  myeloma_kidney:
    id: myeloma_kidney
    label: Миеломная нефропатия (предположительно)
    category: Нефрология
    description: Острое или подострое снижение функции почек у пациента с моноклональной гаммапатией/множественной
      миеломой — вследствие токсического действия свободных лёгких цепей иммуноглобулинов на почечные
      канальцы.
    criteria:
    - parameter: creatinine
      threshold: 150
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — повышен.
    differentials:
    - condition: ''
      text: Цилиндр-нефропатия (наиболее частый механизм при множественной миеломе), AL-амилоидоз (см.
        `renal_amyloidosis`), болезнь депонирования лёгких цепей — все на фоне плазмоклеточной дискразии.
    red_flags:
    - condition: ''
      text: У пациентов старшего возраста с необъяснимым острым повреждением почек, особенно с сопутствующей
        анемией, гиперкальциемией или болью в костях — целенаправленно исключить множественную миелому.
    treatment_hints:
    - step: Электрофорез белков сыворотки и мочи с иммунофиксацией
      note: Скрининг на моноклональный белок.
    - step: Свободные лёгкие цепи сыворотки (соотношение каппа/лямбда)
      note: Более чувствительный тест, чем электрофорез, особенно при болезни лёгких цепей без секреции
        интактного иммуноглобулина.
    references:
    - International Myeloma Working Group guidelines
  rapidly_progressive_glomerulonephritis:
    id: rapidly_progressive_glomerulonephritis
    label: Быстропрогрессирующий гломерулонефрит (предположительно)
    category: Нефрология
    description: 'Быстрое снижение функции почек (дни-недели) вместе с протеинурией — картина быстропрогрессирующего
      гломерулонефрита, нефрологическое неотложное состояние. Примечание: в этой базе критерии этого правила
      полностью идентичны `acute_rejection.yaml` (та же комбинация creatinine/egfr/urine_protein под разными
      именами для разных диагнозов) — см. список находок по данным.'
    criteria:
    - parameter: creatinine
      threshold: 200
      unit: мкмоль/л
      condition: '>='
      comment_template: Креатинин {value} мкмоль/л — значительно повышен.
    - parameter: egfr
      threshold: 30
      unit: мл/мин
      condition: <=
      comment_template: СКФ {value} мл/мин — значительно снижена.
    - parameter: urine_protein
      threshold: 300
      unit: мг/сут
      condition: '>='
      comment_template: Белок в моче {value} мг/сут — протеинурия.
    differentials:
    - condition: ''
      text: АНЦА-ассоциированный васкулит (см. `vasculitis` в ревматологии), анти-GBM болезнь (см. `goodpasture_syndrome`),
        волчаночный нефрит (см. `lupus_nephritis`), тяжёлая IgA-нефропатия — все требуют экстренной оценки,
        промедление ведёт к необратимой потере функции почек.
    red_flags:
    - condition: ''
      text: Нефрологическое неотложное состояние — требует экстренной биопсии почки и, как правило, немедленного
        начала иммуносупрессии (часто до получения результатов биопсии при высокой клинической вероятности)
        для предотвращения необратимой потери функции почек.
    treatment_hints:
    - step: Экстренная биопсия почки
      note: Определяет специфичную причину и тактику иммуносупрессии.
    - step: ANCA, анти-GBM, анти-дсДНК/комплемент
      note: Серологическая панель для быстрой дифференциации основных причин, не дожидаясь биопсии.
    references:
    - KDIGO Clinical Practice Guideline for glomerular diseases
  diabetic_nephropathy_urine_albumin:
    id: diabetic_nephropathy_urine_albumin
    label: Альбуминурия в контексте диабетической нефропатии
    category: Нефрология
    description: Повышенная альбуминурия. Диагноз диабетической нефропатии требует сочетания этого признака
      с подтверждённым сахарным диабетом (повышенная глюкоза/HbA1c) — сама по себе альбуминурия без диабета
      указывает на другую причину поражения почек, не диабетическую нефропатию.
    criteria:
    - parameter: urine_albumin
      threshold: 30
      unit: мг/сут
      condition: '>='
      comment_template: Альбумин в моче {value} мг/сут — микроальбуминурия/протеинурия.
    differentials:
    - condition: ''
      text: Диабетическая нефропатия — только при сопутствующем диабете (см. `diabetic_nephropathy_glucose`/`diabetic_nephropathy_hba1c`).
        Изолированно — см. гломерулярные и другие правила этой базы (`iga_nephropathy`, `hypertensive_nephropathy`
        и др.).
    red_flags:
    - condition: urine_albumin >= 300
      text: Явная протеинурия (не только микроальбуминурия) у пациента с диабетом — признак более выраженного
        поражения почек, приоритет для нефропротективной терапии.
    treatment_hints:
    - step: Подтвердить повторным измерением
      note: Разовое повышение может быть транзиторным (физическая нагрузка, инфекция, декомпенсация гликемии).
    - step: Ингибиторы РААС/ SGLT2 при подтверждении
      note: Стандарт нефропротекции у пациентов с диабетом и альбуминурией.
    references:
    - KDIGO Clinical Practice Guideline for diabetes management in CKD
  diabetic_nephropathy_egfr:
    id: diabetic_nephropathy_egfr
    label: Снижение СКФ в контексте диабетической нефропатии
    category: Нефрология
    description: Сниженная СКФ. Диагноз диабетической нефропатии требует сочетания этого признака с подтверждённым
      сахарным диабетом — изолированное снижение СКФ без диабета указывает на другую причину ХБП.
    criteria:
    - parameter: egfr
      threshold: 60
      unit: мл/мин
      condition: <=
      comment_template: СКФ {value} мл/мин — снижена.
    differentials:
    - condition: ''
      text: Диабетическая нефропатия — только при сопутствующем диабете. Изолированно — см. `ckd_stage3`/`ckd_stage4`/`ckd_stage5`
        и другие причины ХБП в этой базе.
    red_flags:
    - condition: egfr <= 30
      text: Значительное снижение СКФ у пациента с диабетом — приоритет для направления к нефрологу и
        планирования дальнейшей тактики.
    treatment_hints:
    - step: Оценить одновременно альбуминурию
      note: Комбинация СКФ и альбуминурии (KDIGO heat map) точнее стратифицирует риск, чем каждый показатель
        отдельно.
    references:
    - KDIGO Clinical Practice Guideline for diabetes management in CKD
  diabetic_nephropathy_glucose:
    id: diabetic_nephropathy_glucose
    label: Глюкоза в контексте диабетической нефропатии
    category: Нефрология
    description: Повышенная глюкоза у пациента с признаками поражения почек. Сама по себе повышенная глюкоза
      — см. `diabetes_mellitus_type_2`; диабетическая нефропатия дополнительно требует признака поражения
      почек (альбуминурия и/или снижение СКФ).
    criteria:
    - parameter: glucose
      threshold: 7.0
      unit: ммоль/л
      condition: '>='
      comment_template: Глюкоза {value} ммоль/л — повышена.
    differentials:
    - condition: ''
      text: Диабетическая нефропатия — только при сопутствующей альбуминурии/снижении СКФ (см. `diabetic_nephropathy_urine_albumin`,
        `diabetic_nephropathy_egfr`).
    red_flags:
    - condition: ''
      text: У пациента с диабетом длительностью более 5 лет ежегодный скрининг альбуминурии — стандарт
        наблюдения независимо от текущего значения глюкозы.
    treatment_hints:
    - step: Ежегодный скрининг альбуминурии при длительном диабете
      note: Раннее выявление до клинически значимого снижения СКФ.
    references:
    - KDIGO Clinical Practice Guideline for diabetes management in CKD
  diabetic_nephropathy_hba1c:
    id: diabetic_nephropathy_hba1c
    label: HbA1c в контексте диабетической нефропатии
    category: Нефрология
    description: Повышенный HbA1c у пациента с признаками поражения почек — отражает длительный неудовлетворительный
      гликемический контроль, фактор риска прогрессирования диабетической нефропатии.
    criteria:
    - parameter: hba1c
      threshold: 7.0
      unit: '%'
      condition: '>='
      comment_template: HbA1c {value}% — повышен.
    differentials:
    - condition: ''
      text: Диабетическая нефропатия — только при сопутствующей альбуминурии/снижении СКФ (см. `diabetic_nephropathy_urine_albumin`,
        `diabetic_nephropathy_egfr`).
    red_flags:
    - condition: hba1c >= 9
      text: Значительно неудовлетворительный контроль гликемии — существенный модифицируемый фактор риска
        прогрессирования нефропатии, приоритет для интенсификации сахароснижающей терапии.
    treatment_hints:
    - step: Оптимизация гликемического контроля
      note: Замедляет прогрессирование нефропатии наряду с нефропротективной терапией.
    references:
    - KDIGO Clinical Practice Guideline for diabetes management in CKD
  albumin_low_children:
    id: albumin_low_children
    label: Сниженный альбумин у детей
    category: Педиатрия
    description: Сниженный альбумин у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам.
    criteria:
    - parameter: albumin
      threshold: 35
      unit: г/л
      condition: <=
      comment_template: Альбумин {value} г/л — снижен.
    differentials:
    - condition: ''
      text: Недостаточное питание, синдромы мальабсорбции, нефротический синдром, энтеропатия с потерей
        белка, острая инфекция (отрицательный острофазовый белок).
    red_flags:
    - condition: ''
      text: В сочетании с отёками — оценить протеинурию (нефротический синдром — частая педиатрическая
        причина, см. также `minimal_change_disease` в нефрологии).
    treatment_hints:
    - step: Оценить нутритивный статус и наличие отёков
      note: Направление дальнейшего поиска.
    references:
    - Общие педиатрические рекомендации по интерпретации белкового обмена
  anemia_children:
    id: anemia_children
    label: Анемия у детей
    category: Педиатрия
    description: 'Сниженный гемоглобин у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам. Для гемоглобина возрастная зависимость выражена особенно сильно: у новорождённых
      физиологическая норма значительно выше взрослой, к 2-3 месяцам жизни следует физиологическое снижение
      («надир»), которое не является патологией — единый порог 110 г/л для любого возраста риск и переоценки,
      и недооценки анемии в зависимости от возраста ребёнка.'
    criteria:
    - parameter: hemoglobin
      threshold: 110
      unit: г/Л
      condition: <=
      comment_template: Гемоглобин {value} г/Л — снижен для использованного здесь единого порога.
    differentials:
    - condition: ''
      text: Железодефицитная анемия (наиболее частая причина в раннем детском возрасте, см. `iron_deficiency_children`),
        физиологический надир гемоглобина у младенцев 2-3 месяцев (не патология), гемолитические анемии,
        талассемии.
    red_flags:
    - condition: hemoglobin <= 70
      text: Выраженное снижение — оценить признаки декомпенсации (тахикардия, бледность, вялость), риск
        сердечно-сосудистой нагрузки.
    treatment_hints:
    - step: Учитывать точный возраст ребёнка при интерпретации
      note: Возрастные референсные таблицы гемоглобина существенно точнее единого порога.
    references:
    - WHO/AAP reference values for hemoglobin in children
  ferritin_elevated_children:
    id: ferritin_elevated_children
    label: Повышенный ферритин у детей
    category: Педиатрия
    description: Повышенный ферритин у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам. У новорождённых ферритин физиологически высок и постепенно снижается в течение
      первых месяцев жизни.
    criteria:
    - parameter: ferritin
      threshold: 400
      unit: мкг/л
      condition: '>='
      comment_template: Ферритин {value} мкг/л — повышен.
    differentials:
    - condition: ''
      text: Острофазовая реакция при воспалении/инфекции (ферритин — острофазовый белок, наиболее частая
        причина у детей), перегрузка железом (повторные гемотрансфузии), редко — синдром активации макрофагов/гемофагоцитарный
        лимфогистиоцитоз при крайне высоких значениях.
    red_flags:
    - condition: ferritin >= 2000
      text: Крайне высокий уровень у ребёнка с лихорадкой, цитопенией, гепатоспленомегалией — заподозрить
        гемофагоцитарный лимфогистиоцитоз/синдром активации макрофагов, требует экстренной гематологической
        оценки.
    treatment_hints:
    - step: Оценить признаки острой инфекции/воспаления в первую очередь
      note: Наиболее частая причина у детей.
    references:
    - Общие педиатрические рекомендации по интерпретации ферритина
  hypercalcemia_children:
    id: hypercalcemia_children
    label: Гиперкальциемия у детей
    category: Педиатрия
    description: Повышенный кальций у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам.
    criteria:
    - parameter: calcium_total
      threshold: 2.55
      unit: ммоль/л
      condition: '>='
      comment_template: Кальций {value} ммоль/л — повышен.
    differentials:
    - condition: ''
      text: Избыточное потребление витамина D, гиперпаратиреоз (редко у детей), иммобилизация, злокачественные
        новообразования (редко).
    red_flags:
    - condition: calcium_total >= 3.0
      text: Значительное повышение — оценить симптомы (рвота, запор, полиурия, вялость) и уточнить приём
        витаминных добавок.
    treatment_hints:
    - step: Уточнить приём витамина D и кальцийсодержащих добавок
      note: Частая устранимая причина у детей.
    references:
    - Общие педиатрические рекомендации по электролитным нарушениям
  hypocalcemia_children:
    id: hypocalcemia_children
    label: Гипокальциемия у детей
    category: Педиатрия
    description: Сниженный кальций у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам.
    criteria:
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: Дефицит витамина D/рахит (см. `rickets_risk`), гипопаратиреоз, у новорождённых — ранняя (первые
        72ч, часто у недоношенных/от матерей с диабетом) или поздняя неонатальная гипокальциемия.
    red_flags:
    - condition: ''
      text: Судороги, тетания, ларингоспазм у младенца — экстренное состояние, требует немедленной коррекции
        кальцием.
    treatment_hints:
    - step: Оценить витамин D и ПТГ
      note: Основные направления дифдиагноза.
    references:
    - Общие педиатрические рекомендации по электролитным нарушениям
  hypernatremia_children:
    id: hypernatremia_children
    label: Гипернатриемия у детей
    category: Педиатрия
    description: Повышенный натрий у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам.
    criteria:
    - parameter: sodium
      threshold: 145
      unit: ммоль/л
      condition: '>='
      comment_template: Натрий {value} ммоль/л — повышен.
    differentials:
    - condition: ''
      text: Обезвоживание (диарея, рвота, недостаточное потребление жидкости — частая причина у младенцев),
        несахарный диабет, избыточное поступление натрия.
    red_flags:
    - condition: sodium >= 155
      text: Выраженная гипернатриемия у ребёнка — риск неврологических осложнений, требует контролируемой,
        не слишком быстрой коррекции.
    treatment_hints:
    - step: Оценить степень обезвоживания клинически
      note: Наиболее частая причина у детей раннего возраста.
    references:
    - Общие педиатрические рекомендации по электролитным нарушениям
  hyponatremia_children:
    id: hyponatremia_children
    label: Гипонатриемия у детей
    category: Педиатрия
    description: Сниженный натрий у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам.
    criteria:
    - parameter: sodium
      threshold: 136
      unit: ммоль/л
      condition: <=
      comment_template: Натрий {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: Избыточное разведение (перекорм водой/разведённой смесью у младенцев), гастроэнтерит с потерей
        электролитов, синдром неадекватной секреции АДГ.
    red_flags:
    - condition: sodium <= 125
      text: Выраженная гипонатриемия — риск судорог у ребёнка, требует контролируемой коррекции с учётом
        риска осмотического демиелинизирующего синдрома при слишком быстрой коррекции.
    treatment_hints:
    - step: Уточнить характер питания/разведения смеси у младенцев
      note: Частая устранимая причина.
    references:
    - Общие педиатрические рекомендации по электролитным нарушениям
  hypokalemia_children:
    id: hypokalemia_children
    label: Гипокалиемия у детей
    category: Педиатрия
    description: Сниженный калий у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам.
    criteria:
    - parameter: potassium
      threshold: 3.5
      unit: ммоль/л
      condition: <=
      comment_template: Калий {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: Потери через ЖКТ (рвота, диарея — частая причина у детей), приём диуретиков, недостаточное
        потребление.
    red_flags:
    - condition: potassium <= 2.5
      text: Выраженная гипокалиемия — риск аритмий и мышечной слабости, требует ЭКГ-мониторинга.
    treatment_hints:
    - step: Оценить характер и длительность ЖКТ-потерь
      note: Наиболее частая педиатрическая причина.
    references:
    - Общие педиатрические рекомендации по электролитным нарушениям
  iron_deficiency_children_ferritin:
    id: iron_deficiency_children_ferritin
    label: Сниженный ферритин у детей (железодефицит)
    category: Педиатрия
    description: Сниженный ферритин у ребёнка — признак истощения запасов железа. Порог не стратифицирован
      по возрасту — использован единый взрослый референс. У детей, особенно младенцев, физиологические
      нормы могут существенно отличаться от взрослых; перед реальным клиническим использованием пороги
      этой специальности стоит откалибровать по возрастным группам.
    criteria:
    - parameter: ferritin
      threshold: 12
      unit: мкг/л
      condition: <=
      comment_template: Ферритин {value} мкг/л — снижен.
    differentials:
    - condition: ''
      text: Железодефицитная анемия — одна из наиболее частых причин анемии у детей раннего возраста,
        часто связана с диетой (избыток коровьего молока, недостаточный прикорм железосодержащими продуктами).
    red_flags:
    - condition: ''
      text: В сочетании со сниженным гемоглобином (см. `iron_deficiency_children_hemoglobin`) — подтверждает
        железодефицитную анемию, требует выяснения пищевого рациона.
    treatment_hints:
    - step: Уточнить пищевой рацион
      note: Избыточное потребление коровьего молока в раннем возрасте — частая причина дефицита железа.
    references:
    - AAP Clinical Report on iron deficiency in children
  iron_deficiency_children_hemoglobin:
    id: iron_deficiency_children_hemoglobin
    label: Сниженный гемоглобин у детей (железодефицит)
    category: Педиатрия
    description: Сниженный гемоглобин в контексте подозрения на железодефицит у ребёнка. Порог не стратифицирован
      по возрасту — использован единый взрослый референс. У детей, особенно младенцев, физиологические
      нормы могут существенно отличаться от взрослых; перед реальным клиническим использованием пороги
      этой специальности стоит откалибровать по возрастным группам. См. также `anemia_children` для более
      общей оценки анемии независимо от причины.
    criteria:
    - parameter: hemoglobin
      threshold: 110
      unit: г/Л
      condition: <=
      comment_template: Гемоглобин {value} г/Л — снижен.
    differentials:
    - condition: ''
      text: См. `iron_deficiency_children_ferritin` — вместе эти два признака составляют классическую
        картину железодефицитной анемии.
    red_flags:
    - condition: hemoglobin <= 70
      text: Выраженная анемия — см. `anemia_children`.
    treatment_hints:
    - step: Ферритин для подтверждения железодефицитного характера
      note: Отличает от других причин анемии у детей.
    references:
    - AAP Clinical Report on iron deficiency in children
  leukocytosis_children:
    id: leukocytosis_children
    label: Лейкоцитоз у детей
    category: Педиатрия
    description: 'Повышенные лейкоциты у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам. Для лейкоцитов возрастная зависимость выражена особенно сильно: у новорождённых
      физиологическая норма может достигать значительно более высоких значений, чем у детей старшего возраста
      и взрослых — единый порог 12×10⁹/л рискует расценить как лейкоцитоз совершенно нормальные для новорождённого
      показатели.'
    criteria:
    - parameter: wbc
      threshold: 12
      unit: ×10⁹/л
      condition: '>='
      comment_template: Лейкоциты {value} ×10⁹/л — повышены для использованного здесь единого порога.
    differentials:
    - condition: ''
      text: Бактериальная инфекция, физиологический лейкоцитоз новорождённых (не патология в первые дни
        жизни), реактивный лейкоцитоз при стрессе/лихорадке.
    red_flags:
    - condition: wbc >= 30
      text: Значительный лейкоцитоз — при отсутствии явной причины у новорождённого учитывать физиологические
        особенности возраста перед интерпретацией как патологии.
    treatment_hints:
    - step: Учитывать точный возраст при интерпретации
      note: Возрастные референсные таблицы лейкоцитов существенно точнее единого порога, особенно в неонатальном
        периоде.
    references:
    - Педиатрические референсные значения общего анализа крови
  lymphocytosis_children:
    id: lymphocytosis_children
    label: Лимфоцитоз у детей
    category: Педиатрия
    description: Повышенная доля лимфоцитов у ребёнка. Порог не стратифицирован по возрасту — использован
      единый взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам. У детей раннего возраста (примерно до 4-5 лет) наблюдается физиологический
      «лимфоцитарный перекрест» — лимфоциты преобладают над нейтрофилами в отличие от взрослых, поэтому
      доля 45% и выше может быть нормальным вариантом для этого возраста, а не патологическим лимфоцитозом.
    criteria:
    - parameter: lymphocytes_percent
      threshold: 45
      unit: '%'
      condition: '>='
      comment_template: Лимфоциты {value}% — повышены для использованного здесь единого порога.
    differentials:
    - condition: ''
      text: Физиологический лимфоцитарный перекрест у детей раннего возраста (не патология), вирусные
        инфекции (см. `viral_infection_suspect`, `infectious_mononucleosis` в инфекционных болезнях),
        коклюш.
    red_flags:
    - condition: lymphocytes_percent >= 70
      text: Выраженный лимфоцитоз — при отсутствии острой инфекционной клиники, особенно у детей старшего
        возраста, вне типичного возраста лимфоцитарного перекреста, стоит дополнительно оценить.
    treatment_hints:
    - step: Учитывать возраст ребёнка перед интерпретацией как патологии
      note: Лимфоцитарный перекрест — нормальная возрастная особенность, не диагноз.
    references:
    - Педиатрические референсные значения общего анализа крови
  rickets_risk_vitamin_d:
    id: rickets_risk_vitamin_d
    label: Витамин D в контексте риска рахита
    category: Педиатрия
    description: Сниженный витамин D у ребёнка — основной фактор риска рахита. Порог не стратифицирован
      по возрасту — использован единый взрослый референс. У детей, особенно младенцев, физиологические
      нормы могут существенно отличаться от взрослых; перед реальным клиническим использованием пороги
      этой специальности стоит откалибровать по возрастным группам. См. также `vitamin_d_deficiency_children`,
      который использует тот же порог как самостоятельный диагноз.
    criteria:
    - parameter: vitamin_d
      threshold: 20
      unit: нг/мл
      condition: <=
      comment_template: Витамин D {value} нг/мл — снижен.
    differentials:
    - condition: ''
      text: Недостаточная инсоляция, недостаточное потребление с пищей/смесью, синдромы мальабсорбции.
        Риск рахита выше в сочетании со сниженным кальцием (см. `rickets_risk_calcium_total`).
    red_flags:
    - condition: ''
      text: 'Клинически проверить признаки рахита: деформации костей (О-образные ноги), позднее закрытие
        родничка, рахитические чётки — при их наличии рентген для подтверждения.'
    treatment_hints:
    - step: Восполнение витамина D
      note: Профилактические дозы для всех детей раннего возраста в большинстве современных рекомендаций,
        лечебные — при подтверждённом дефиците.
    references:
    - AAP Clinical Report on vitamin D and rickets prevention
  rickets_risk_calcium_total:
    id: rickets_risk_calcium_total
    label: Кальций в контексте риска рахита
    category: Педиатрия
    description: Сниженный кальций у ребёнка в контексте риска рахита. Порог не стратифицирован по возрасту
      — использован единый взрослый референс. У детей, особенно младенцев, физиологические нормы могут
      существенно отличаться от взрослых; перед реальным клиническим использованием пороги этой специальности
      стоит откалибровать по возрастным группам.
    criteria:
    - parameter: calcium_total
      threshold: 2.15
      unit: ммоль/л
      condition: <=
      comment_template: Кальций {value} ммоль/л — снижен.
    differentials:
    - condition: ''
      text: См. `rickets_risk_vitamin_d` — сочетание обоих признаков усиливает подозрение на рахит.
    red_flags:
    - condition: ''
      text: См. `hypocalcemia_children` для оценки острых симптомов (судороги, тетания).
    treatment_hints:
    - step: Оценить вместе с витамином D
      note: См. `rickets_risk_vitamin_d`.
    references:
    - AAP Clinical Report on vitamin D and rickets prevention
  uti_children_urine_leukocytes:
    id: uti_children_urine_leukocytes
    label: Лейкоцитурия у детей (подозрение на ИМП)
    category: Педиатрия
    description: 'Лейкоциты в моче у ребёнка — признак вероятной инфекции мочевыводящих путей. Примечание:
      соседнее условие этого же файла (`uti_children_urine_nitrites`, порог `min: 0`) технически срабатывает
      при любом значении, включая полное отсутствие нитритов — см. список находок по данным, текст интерпретации
      для него не написан.'
    criteria:
    - parameter: urine_leukocytes
      threshold: 5
      unit: в п/зр
      condition: '>='
      comment_template: Лейкоциты в моче {value} в поле зрения — лейкоцитурия.
    differentials:
    - condition: ''
      text: Инфекция мочевыводящих путей — у детей раннего возраста часто проявляется неспецифично (лихорадка
        без явного очага), в отличие от взрослых с типичными дизурическими жалобами.
    red_flags:
    - condition: ''
      text: Лихорадка без явного очага у младенца — ИМП входит в стандартный дифдиагноз, требует анализа
        мочи и посева до начала антибиотикотерапии.
    treatment_hints:
    - step: Посев мочи (предпочтительно катетеризационный образец у младенцев)
      note: Загрязнение образца при сборе мочи у детей раннего возраста — частая причина ложноположительных
        результатов при сборе в мешок.
    references:
    - AAP Clinical Practice Guideline for UTI in febrile infants and young children
  vitamin_d_deficiency_children:
    id: vitamin_d_deficiency_children
    label: Дефицит витамина D у детей
    category: Педиатрия
    description: Сниженный витамин D у ребёнка. Порог не стратифицирован по возрасту — использован единый
      взрослый референс. У детей, особенно младенцев, физиологические нормы могут существенно отличаться
      от взрослых; перед реальным клиническим использованием пороги этой специальности стоит откалибровать
      по возрастным группам. Порог идентичен `rickets_risk_vitamin_d` в этом же разделе — рассматривайте
      эту запись как дефицит витамина D сам по себе, а `rickets_risk_vitamin_d` — в контексте риска рахита
      вместе с кальцием.
    criteria:
    - parameter: vitamin_d
      threshold: 20
      unit: нг/мл
      condition: <=
      comment_template: Витамин D {value} нг/мл — снижен.
    differentials:
    - condition: ''
      text: Недостаточная инсоляция, недостаточное потребление с пищей/смесью, синдромы мальабсорбции.
    red_flags:
    - condition: ''
      text: См. `rickets_risk_vitamin_d` при сопутствующем снижении кальция — риск клинического рахита.
    treatment_hints:
    - step: Восполнение витамина D по возрастной дозировке
      note: Профилактические дозы рекомендованы большинству детей раннего возраста.
    references:
    - AAP Clinical Report on vitamin D and rickets prevention
