      - parameter: alt
        threshold: 35
        unit: "Ед/л"
        condition: ">="
        comment_template: "АЛТ {value} Ед/л превышает норму для женщин (≥ 35)."
    differentials:
      - condition: "ast >= 32 AND ast/alt > 1.5"
        text: "Алкогольная болезнь печени."
      - condition: "ggt > 42 AND alt > 35"
        text: "Холестаз или алкогольное поражение."
      - condition: "bmi >= 30 AND alt_high_female"
        text: "Неалкогольная жировая болезнь печени (НАЖБП) – самая частая причина."
    red_flags:
      - condition: "alt > 150"
        text: "Острый гепатит – срочно исключить вирусные гепатиты, лекарственное поражение, ишемию печени."
    treatment_hints:
      - step: "Оценка этиологии"
        note: "Исключить вирусные гепатиты (HBV, HCV), алкоголь, лекарства, метаболический синдром."
      - step: "При НАЖБП"
        note: "Снижение веса, диета, физическая активность. Рассмотреть витамин Е."
      - step: "Динамический контроль"
        note: "Повтор АЛТ через 1–2 месяца после коррекции факторов."
    references:
      - "Рекомендации по неалкогольной жировой болезни печени (2023)"

  # ============================================================
  # Повышенная АСТ (мужчины/женщины)
  # ============================================================
  ast_high_male:
    id: ast_high_male
    label: "Повышенная АСТ (мужчины)"
    category: "Гепатология"
    description: "АСТ ≥ 40 Ед/л у мужчин – маркер повреждения клеток печени, сердца или мышц."
    criteria:
      - parameter: ast
        threshold: 40
        unit: "Ед/л"
        condition: ">="
        comment_template: "АСТ {value} Ед/л превышает норму для мужчин (≥ 40)."
    differentials:
      - condition: "ast/alt > 2 AND alt < 45"
        text: "Алкогольная болезнь печени (характерно повышение АСТ > АЛТ)."
      - condition: "ck_total > 200"
        text: "Повреждение мышц (травма, рабдомиолиз, миопатия)."
      - condition: "troponin_i > 40"
        text: "Повреждение миокарда (инфаркт, миокардит)."
    red_flags:
      - condition: "ast > 500"
        text: "Массивный цитолиз – срочно исключить острый гепатит, токсическое поражение, ишемию печени."
    treatment_hints:
      - step: "Определить источник"
        note: "Оценить ALT, CK, тропонин, клиническую картину."
      - step: "При поражении печени"
        note: "Этиотропное лечение в зависимости от причины."
      - step: "При мышечном поражении"
        note: "Исключить рабдомиолиз, отменить статины при подозрении."
    references:
      - "Клинические рекомендации по гепатитам (2023)"

  ast_high_female:
    id: ast_high_female
    label: "Повышенная АСТ (женщины)"
