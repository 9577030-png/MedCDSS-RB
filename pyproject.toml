[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MedCDSS-RB"
version = "0.1.0"
description = "Rule-based laboratory data interpretation system"
authors = [{name = "Sergei Smirnov", email = "9577030@gmail.com"}]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pytest>=7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "reportlab>=4.0.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.28.0",
    "pandas>=1.5.0",
    "redis>=5.0.0",
    "watchdog>=3.0.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
]

[tool.setuptools]
packages = [
    "domain",
    "domain.value_objects",
    "domain.entities",
    "domain.logic",
    "application",
    "application.ports",
    "application.services",
    "infrastructure",
    "infrastructure.adapters",
    "infrastructure.adapters.loaders",
    "infrastructure.adapters.parsers",
    "infrastructure.adapters.renderers",
    "infrastructure.adapters.storage",
    "infrastructure.bootstrap",
    "api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "integration: marks tests that depend on real YAML files (deselect with '-m \"not integration\"')",
]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]