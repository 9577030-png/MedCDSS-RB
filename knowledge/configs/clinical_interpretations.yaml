        threshold: 32
        unit: "Ед/л"
        condition: ">="
        comment_template: "АСТ {value} Ед/л превышает норму для женщин (≥ 32)."
    differentials:
      - condition: "ast/alt > 2 AND alt < 35"
        text: "Алкогольная болезнь печени (характерно повышение АСТ > АЛТ)."
      - condition: "ck_total > 200"
        text: "Повреждение мышц (травма, рабдомиолиз, миопатия)."
      - condition: "troponin_i > 40"
        text: "Повреждение миокарда (инфаркт, миокардит)."
    red_flags:
      - condition: "ast > 400"
        text: "Массивный цитолиз – срочно исключить острый гепатит, токсическое поражение, ишемию печени."
    treatment_hints:
      - step: "Определить источник"
        note: "Оценить ALT, CK, тропонин, клиническую картину."
      - step: "При поражении печени"
        note: "Этиотропное лечение в зависимости от причины."
      - step: "При мышечном поражении"
        note: "Исключить рабдомиолиз, отменить статины при подозрении."
    references:
      - "Клинические рекомендации по гепатитам (2023)"

  # ============================================================
  # Повышенная ГГТ (мужчины/женщины)
  # ============================================================
  ggt_high_male:
    id: ggt_high_male
    label: "Повышенная ГГТ (мужчины)"
    category: "Гепатология"
    description: "ГГТ ≥ 71 Ед/л у мужчин – маркер холестаза и алкогольной нагрузки."
    criteria:
      - parameter: ggt
        threshold: 71
        unit: "Ед/л"
        condition: ">="
        comment_template: "ГГТ {value} Ед/л превышает норму для мужчин (≥ 71)."
    differentials:
      - condition: "alt > 45 AND ast > 40"
        text: "Паренхиматозное поражение печени."
      - condition: "alkaline_phosphatase > 130"
        text: "Холестаз (внутри- или внепеченочный)."
      - condition: "ggt > 100 AND alcohol_abuse == true"
        text: "Алкогольная болезнь печени (ГГТ высокочувствителен к этанолу)."
    red_flags:
      - condition: "ggt > 200 AND bilirubin_total > 21"
        text: "Выраженный холестаз – риск билиарного цирроза. Провести УЗИ органов брюшной полости."
    treatment_hints:
      - step: "Уточнить причину"
        note: "Исключить алкоголь, лекарства, заболевания желчевыводящих путей."
      - step: "При алкогольном генезе"
        note: "Полный отказ от алкоголя, поддержка печени (фосфолипиды, витамины)."
      - step: "При холестазе"
        note: "Консультация гастроэнтеролога, УЗИ, возможно ЭРХПГ."
    references:
      - "Рекомендации по алкогольной болезни печени (2023)"

  ggt_high_female:
    id: ggt_high_female
    label: "Повышенная ГГТ (женщины)"
    category: "Гепатология"
    description: "ГГТ ≥ 42 Ед/л у женщин – маркер холестаза и алкогольной нагрузки."
    criteria:
      - parameter: ggt
        threshold: 42
        unit: "Ед/л"
        condition: ">="
        comment_template: "ГГТ {value} Ед/л превышает норму для женщин (≥ 42)."
    differentials:
      - condition: "alt > 35 AND ast > 32"
        text: "Паренхиматозное поражение печени."
      - condition: "alkaline_phosphatase > 130"
        text: "Холестаз (внутри- или внепеченочный)."
      - condition: "ggt > 80 AND alcohol_abuse == true"
        text: "Алкогольная болезнь печени (ГГТ высокочувствителен к этанолу)."
    red_flags:
      - condition: "ggt > 150 AND bilirubin_total > 21"
        text: "Выраженный холестаз – риск билиарного цирроза. Провести УЗИ органов брюшной полости."
    treatment_hints:
