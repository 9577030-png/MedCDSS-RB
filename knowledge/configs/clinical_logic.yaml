combinations:
- id: primary_hyperparathyroidism
  label: Первичный гиперпаратиреоз (предположительно)
  conditions:
  - hypercalcemia
  - vitamin_d_deficiency
  probability_factor: 0.8
  recommendation: Консультация эндокринолога, определение PTH, кальций суточной мочи, УЗИ паращитовидных
    желёз
  urgency: high
  doctor_specialty: Endocrinologist
  additional_tests:
  - PTH
  - Calcium 24h urine
  - Parathyroid ultrasound
- id: septic_syndrome
  label: Септический синдром
  conditions:
  - sepsis
  - systemic_inflammation
  probability_factor: 1.0
  recommendation: Госпитализация в ОРИТ, контроль гемодинамики, антибиотикотерапия, посев крови
  urgency: critical
  doctor_specialty: Intensive Care Specialist
  additional_tests:
  - Blood culture
  - Lactate
  - Blood gas analysis
- id: hepatorenal_syndrome
  label: Гепаторенальный синдром (предположительно)
  conditions:
  - acute_kidney_injury
  - acute_hepatitis
  probability_factor: 0.6
  recommendation: Оценка функции почек и печени, УЗИ органов брюшной полости, консультация гепатолога
    и нефролога
  urgency: high
  doctor_specialty: Hepatologist
  additional_tests:
  - Renal ultrasound
  - Liver ultrasound
  - Urine sodium
- id: metabolic_bone_disease
  label: Метаболическое заболевание костей (дефицит витамина D + гиперкальциемия)
  conditions:
  - vitamin_d_deficiency
  - hypercalcemia
  probability_factor: 0.7
  recommendation: Исследование костного метаболизма, DEXA-сканирование, консультация эндокринолога
  urgency: moderate
  doctor_specialty: Rheumatologist
  additional_tests:
  - DEXA scan
  - Bone turnover markers
- id: diabetes_mellitus_type_2
  label: Сахарный диабет 2 типа
  conditions:
  - diabetes_glucose
  - diabetes_hba1c
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Сахарный диабет 2 типа.'
  urgency: high
  doctor_specialty: Endocrinologist
  additional_tests:
  - Метформин 500 мг × 2 раза в день
  - Скрининг осложнений
  - Обучение самоконтролю
  - Контроль HbA1c
- id: acute_pancreatitis
  label: Острый панкреатит
  conditions:
  - acute_pancreatitis_amylase
  - acute_pancreatitis_lipase
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Острый панкреатит.'
  urgency: high
  doctor_specialty: Gastroenterologist
  additional_tests:
  - УЗИ брюшной полости в первую очередь
  - КТ с контрастом при тяжёлом течении или отсутствии улучшения через 48-72ч
- id: alcoholic_liver_disease
  label: Алкогольная болезнь печени
  conditions:
  - alcoholic_liver_disease_ggt
  - alcoholic_liver_disease_ast
  - alcoholic_liver_disease_alt
  - alcoholic_liver_disease_ethanol_blood
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Алкогольная болезнь печени.'
  urgency: high
  doctor_specialty: Gastroenterologist
  additional_tests:
  - Полное прекращение употребления алкоголя
  - УЗИ печени
- id: celiac_disease
  label: Целиакия (подозрение)
  conditions:
  - celiac_disease_tga_iga
  - celiac_disease_total_iga
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Целиакия (подозрение).'
  urgency: moderate
  doctor_specialty: Gastroenterologist
  additional_tests:
  - Строгая аглютеновая диета
  - Обследование у гастроэнтеролога
- id: cholelithiasis
  label: Желчнокаменная болезнь (возможный холедохолитиаз)
  conditions:
  - cholelithiasis_bilirubin_total
  - cholelithiasis_alkaline_phosphatase
  - cholelithiasis_ggt
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Желчнокаменная болезнь (возможный холедохолитиаз).'
  urgency: high
  doctor_specialty: Gastroenterologist
  additional_tests:
  - УЗИ брюшной полости — метод первой линии
  - МРХПГ при подозрении на холедохолитиаз
- id: crohns_disease
  label: Болезнь Крона
  conditions:
  - crohns_disease_fecal_calprotectin
  - crohns_disease_crp
  - crohns_disease_albumin
  - crohns_disease_ferritin
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Болезнь Крона.'
  urgency: high
  doctor_specialty: Gastroenterologist
  additional_tests:
  - Колоноскопия с биопсией — золотой стандарт
  - Исключить инфекционную причину перед иммуносупрессией
- id: inflammatory_bowel_disease
  label: Воспалительное заболевание кишечника (неуточнённое)
  conditions:
  - inflammatory_bowel_disease_calprotectin
  - inflammatory_bowel_disease_albumin
  - inflammatory_bowel_disease_ferritin
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Воспалительное заболевание кишечника (неуточнённое).'
  urgency: high
  doctor_specialty: Gastroenterologist
  additional_tests:
  - Колоноскопия с биопсией
  - Исключить инфекционную причину
- id: ulcerative_colitis
  label: Язвенный колит
  conditions:
  - ulcerative_colitis_fecal_calprotectin
  - ulcerative_colitis_crp
  - ulcerative_colitis_albumin
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Язвенный колит.'
  urgency: high
  doctor_specialty: Gastroenterologist
  additional_tests:
  - Колоноскопия с биопсией
  - При тяжёлой атаке — критерии Truelove-Witts и госпитализация
- id: anemia_chronic_disease
  label: Анемия хронического воспаления (подозрение)
  conditions:
  - anemia_chronic_disease_hemoglobin
  - anemia_chronic_disease_ferritin
  - anemia_chronic_disease_crp
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Анемия хронического воспаления (подозрение).'
  urgency: moderate
  doctor_specialty: Hematologist
  additional_tests:
  - Лечение основного заболевания
  - Железо в/в (при дефиците)
- id: hemolytic_anemia
  label: Гемолитическая анемия (лабораторные признаки гемолиза)
  conditions:
  - hemolytic_anemia_ldh
  - hemolytic_anemia_indirect_bilirubin
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Гемолитическая анемия (лабораторные признаки гемолиза).'
  urgency: high
  doctor_specialty: Hematologist
  additional_tests:
  - Прямая проба Кумбса
  - Мазок периферической крови
  - Гаптоглобин
- id: pancytopenia
  label: Панцитопения
  conditions:
  - pancytopenia_hemoglobin
  - pancytopenia_wbc
  - pancytopenia_platelets
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Панцитопения.'
  urgency: high
  doctor_specialty: Hematologist
  additional_tests:
  - Мазок периферической крови
  - Направление к гематологу для биопсии костного мозга
- id: acute_hepatitis
  label: Острый гепатит
  conditions:
  - acute_hepatitis_alt
  - acute_hepatitis_ast
  - acute_hepatitis_bilirubin_total
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Острый гепатит.'
  urgency: high
  doctor_specialty: Hepatologist
  additional_tests:
  - Серологическая панель вирусных гепатитов
  - Собрать анамнез лекарств и алкоголя
  - Коагулограмма (МНО)
- id: cholestasis
  label: Холестаз
  conditions:
  - cholestasis_alkaline_phosphatase
  - cholestasis_ggt
  - cholestasis_bilirubin_direct
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Холестаз.'
  urgency: high
  doctor_specialty: Hepatologist
  additional_tests:
  - УЗИ брюшной полости в первую очередь
  - При подозрении на обструкцию — МРХПГ
  - Антимитохондриальные антитела
- id: bacterial_infection_risk
  label: Признаки вероятной бактериальной инфекции
  conditions:
  - bacterial_infection_risk_crp
  - bacterial_infection_risk_wbc
  - bacterial_infection_risk_neutrophils_percent
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Признаки вероятной бактериальной инфекции.'
  urgency: high
  doctor_specialty: Infectious Disease Specialist
  additional_tests:
  - Искать очаг инфекции
  - Прокальцитонин
- id: hepatitis_b_active
  label: Активный гепатит B
  conditions:
  - hepatitis_b_active_hbsag
  - hepatitis_b_active_hbv_dna
  - hepatitis_b_active_alt
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Активный гепатит B.'
  urgency: high
  doctor_specialty: Infectious Disease Specialist
  additional_tests:
  - HBeAg/anti-HBe
  - Эластография (фиброскан)
  - Скрининг гепатоцеллюлярной карциномы
- id: hepatitis_c_active
  label: Активный гепатит C
  conditions:
  - hepatitis_c_active_anti_hcv
  - hepatitis_c_active_hcv_rna
  - hepatitis_c_active_alt
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Активный гепатит C.'
  urgency: high
  doctor_specialty: Infectious Disease Specialist
  additional_tests:
  - Эластография
  - Направление на противовирусную терапию
- id: infectious_mononucleosis
  label: Инфекционный мононуклеоз
  conditions:
  - infectious_mononucleosis_ebv_vca_igm
  - infectious_mononucleosis_lymphocytes_percent
  probability_factor: 1.0
  recommendation: 'См. клинические инсайты: Инфекционный мононуклеоз.'
  urgency: high
  doctor_specialty: Infectious Disease Specialist
  additional_tests:
  - Осмотр на спленомегалию перед разрешением физической активности
  - Избегать ампициллина/амоксициллина при подозрении на мононуклеоз
- id: lower_respiratory_infection
  label: Нижняя респираторная инфекция (подозрение)
