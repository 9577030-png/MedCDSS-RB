    differentials:
      - condition: "ferritin < 30"
        text: "Дефицит железа – подтверждается низким ферритином."
      - condition: "tibc > 72"
        text: "Повышение ОЖСС характерно для дефицита железа."
    red_flags:
      - condition: "serum_iron < 5 AND hemoglobin < 100"
        text: "Тяжёлый дефицит железа – требуется парентеральное введение."
    treatment_hints:
      - step: "Назначить препараты железа"
        note: "Доза элементарного железа 100–200 мг/сут."
      - step: "Поиск причины"
        note: "Обследовать ЖКТ, исключить кровопотерю."
    references:
      - "WHO guideline on iron deficiency (2023)"

  serum_iron_low_female:
    id: serum_iron_low_female
    label: "Сниженное железо сыворотки (женщины)"
    category: "Гематология"
    description: "Железо сыворотки < 9 мкмоль/л у женщин – маркер дефицита железа."
    criteria:
      - parameter: serum_iron
        threshold: 9
        unit: "мкмоль/л"
        condition: "<"
        comment_template: "Железо сыворотки {value} мкмоль/л ниже нормы для женщин (< 9)."
    differentials:
      - condition: "ferritin < 15"
        text: "Дефицит железа – подтверждается низким ферритином."
      - condition: "tibc > 72"
        text: "Повышение ОЖСС характерно для дефицита железа."
    red_flags:
      - condition: "serum_iron < 4 AND hemoglobin < 90"
        text: "Тяжёлый дефицит железа – требуется парентеральное введение."
    treatment_hints:
      - step: "Назначить препараты железа"
        note: "Доза элементарного железа 100–200 мг/сут."
      - step: "Поиск причины"
        note: "Гинекологический осмотр, обследование ЖКТ при отсутствии менструальных кровопотерь."
    references:
      - "WHO guideline on iron deficiency (2023)"

  serum_iron_high_male:
    id: serum_iron_high_male
    label: "Повышенное железо сыворотки (мужчины)"
    category: "Гематология"
    description: "Железо сыворотки ≥ 30 мкмоль/л у мужчин – маркер перегрузки железом."
    criteria:
      - parameter: serum_iron
        threshold: 30
        unit: "мкмоль/л"
        condition: ">="
        comment_template: "Железо сыворотки {value} мкмоль/л превышает норму для мужчин (≥ 30)."
    differentials:
      - condition: "ferritin > 400 AND transferrin_saturation > 45%"
        text: "Гемохроматоз – подтвердить HFE-мутациями."
      - condition: "hemoglobin > 170 OR hematocrit > 52%"
        text: "Эритремия (полицитемия) может приводить к повышению железа."
    red_flags:
      - condition: "serum_iron > 40 AND ferritin > 1000"
        text: "Тяжёлая перегрузка железом – риск органных осложнений."
    treatment_hints:
      - step: "Диагностика причины"
        note: "Насыщение трансферрина, ферритин, HFE-генотипирование."
      - step: "При гемохроматозе"
        note: "Флеботомия для снижения железа."
    references:
      - "EASL Clinical Practice Guidelines on haemochromatosis (2022)"

  serum_iron_high_female:
    id: serum_iron_high_female
    label: "Повышенное железо сыворотки (женщины)"
    category: "Гематология"
    description: "Железо сыворотки ≥ 27 мкмоль/л у женщин – маркер перегрузки железом."
    criteria:
      - parameter: serum_iron
        threshold: 27
        unit: "мкмоль/л"
        condition: ">="
        comment_template: "Железо сыворотки {value} мкмоль/л превышает норму для женщин (≥ 27)."
    differentials:
      - condition: "ferritin > 150 AND transferrin_saturation > 45%"
        text: "Гемохроматоз – подтвердить HFE-мутациями."
      - condition: "hemoglobin > 150 OR hematocrit > 46%"
        text: "Эритремия (полицитемия) может приводить к повышению железа."
    red_flags:
      - condition: "serum_iron > 35 AND ferritin > 800"
        text: "Тяжёлая перегрузка железом – риск органных осложнений."
    treatment_hints:
      - step: "Диагностика причины"
        note: "Насыщение трансферрина, ферритин, HFE-генотипирование."
      - step: "При гемохроматозе"
        note: "Флеботомия для снижения железа."
    references:
      - "EASL Clinical Practice Guidelines on haemochromatosis (2022)"

  # ============================================================
  # Сниженные/повышенные эритроциты (мужчины/женщины)
  # ============================================================
  rbc_low_male:
    id: rbc_low_male
    label: "Сниженные эритроциты (мужчины)"
    category: "Гематология"
    description: "Эритроциты < 4.3 × 10¹²/Л у мужчин."
    criteria:
      - parameter: rbc
        threshold: 4.3
        unit: "10^12/L"
        condition: "<"
        comment_template: "Эритроциты {value} × 10¹²/Л ниже нормы для мужчин (< 4.3)."
    differentials:
      - condition: "hemoglobin < 130 AND mcv < 80"
        text: "Микроцитарная анемия (дефицит железа, талассемия)."
      - condition: "hemoglobin < 130 AND mcv > 100"
        text: "Макроцитарная анемия (дефицит B12, фолатов)."
    treatment_hints:
      - step: "Уточнить этиологию"
        note: "Оценить гемоглобин, MCV, ферритин, B12, фолаты."
      - step: "Коррекция согласно причине"
        note: "Назначить препараты железа, B12 или фолатов при дефиците."
    references:
      - "WHO guideline on anaemia (2024)"

  rbc_low_female:
    id: rbc_low_female
    label: "Сниженные эритроциты (женщины)"
    category: "Гематология"
    description: "Эритроциты < 3.8 × 10¹²/Л у женщин."
    criteria:
      - parameter: rbc
        threshold: 3.8
        unit: "10^12/L"
        condition: "<"
        comment_template: "Эритроциты {value} × 10¹²/Л ниже нормы для женщин (< 3.8)."
    differentials:
      - condition: "hemoglobin < 120 AND mcv < 80"
        text: "Микроцитарная анемия (дефицит железа, талассемия)."
      - condition: "hemoglobin < 120 AND mcv > 100"
        text: "Макроцитарная анемия (дефицит B12, фолатов)."
    treatment_hints:
      - step: "Уточнить этиологию"
        note: "Оценить гемоглобин, MCV, ферритин, B12, фолаты."
      - step: "Коррекция согласно причине"
        note: "Назначить препараты железа, B12 или фолатов при дефиците."
    references:
      - "WHO guideline on anaemia (2024)"

  rbc_high_male:
    id: rbc_high_male
    label: "Повышенные эритроциты (мужчины)"
    category: "Гематология"
    description: "Эритроциты ≥ 5.7 × 10¹²/Л у мужчин."
    criteria:
      - parameter: rbc
        threshold: 5.7
        unit: "10^12/L"
        condition: ">="
        comment_template: "Эритроциты {value} × 10¹²/Л превышают норму для мужчин (≥ 5.7)."
    differentials:
      - condition: "hematocrit > 52%"
        text: "Полицитемия – исключить эритремию (истинная полицитемия) или вторичную (гипоксия, курение, опухоли)."
      - condition: "erythropoietin > 20"
        text: "Вторичная полицитемия (гипоксия, почечная опухоль)."
    red_flags:
      - condition: "rbc > 6.0 AND platelets > 400 AND thrombocytosis"
        text: "Миелопролиферативное заболевание – требуется консультация гематолога."
    treatment_hints:
      - step: "Диагностика причины"
        note: "Гематокрит, эритропоэтин, пульсоксиметрия, УЗИ почек."
      - step: "При эритремии"
        note: "Кровопускания, гидроксимочевина для снижения риска тромбозов."
    references:
      - "WHO classification of myeloproliferative neoplasms"

  rbc_high_female:
    id: rbc_high_female
    label: "Повышенные эритроциты (женщины)"
    category: "Гематология"
    description: "Эритроциты ≥ 5.2 × 10¹²/Л у женщин."
    criteria:
      - parameter: rbc
        threshold: 5.2
        unit: "10^12/L"
        condition: ">="
        comment_template: "Эритроциты {value} × 10¹²/Л превышают норму для женщин (≥ 5.2)."
    differentials:
      - condition: "hematocrit > 46%"
        text: "Полицитемия – исключить эритремию или вторичную полицитемию."
      - condition: "erythropoietin > 20"
        text: "Вторичная полицитемия (гипоксия, почечная опухоль)."
    red_flags:
      - condition: "rbc > 5.5 AND platelets > 400"
        text: "Миелопролиферативное заболевание – требуется консультация гематолога."
    treatment_hints:
      - step: "Диагностика причины"
        note: "Гематокрит, эритропоэтин, пульсоксиметрия, УЗИ почек."
      - step: "При эритремии"
        note: "Кровопускания, гидроксимочевина для снижения риска тромбозов."
    references:
      - "WHO classification of myeloproliferative neoplasms"

  # ============================================================
  # Сниженный/повышенный гематокрит (мужчины/женщины)
